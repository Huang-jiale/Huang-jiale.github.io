<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" role="img" aria-label="击球点示意图：母球上标出中杆、高杆、低杆、左塞、右塞五个点" width="620" height="240"><style>
svg{display:block;width:100%;height:auto}
.bg-paper {fill: #fffdf6;}
svg text {font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;}
svg text.t {font-size: 15px; fill: #221d16;}
svg text.lab {font-size: 13px; fill: #221d16;}
svg text.lab2 {font-size: 11.5px; fill: #5b5348;}
svg text.hd {font-size: 13px; font-weight: 700; fill: #9a3b2e;}
svg .ln {stroke: #6f6252; stroke-width: 1.6; fill: none;}
svg .ln2 {stroke: #b8a98f; stroke-width: 1.2; fill: none;}
svg .lnr {stroke: #9a3b2e; stroke-width: 2; fill: none;}
svg .box {fill: #f6f0e4; stroke: #9d8a68; stroke-width: 1.4;}
svg .box2 {fill: #ffffff; stroke: #9d8a68; stroke-width: 1.2;}
svg .ball {stroke: #ffffff; stroke-width: 1.5;}
</style>
    <rect class="bg-paper" width="620" height="240"/>
    <text class="hd" x="24" y="30">母球上的五个击球点</text>
    <circle cx="150" cy="130" r="68" fill="#ffffff" stroke="#6f6252" stroke-width="1.6"/>
    <path class="ln2" d="M150 66V194M86 130H214"/>
    <circle cx="150" cy="86" r="5.5" fill="#9a3b2e"/>
    <circle cx="150" cy="130" r="5.5" fill="#9a3b2e"/>
    <circle cx="150" cy="174" r="5.5" fill="#9a3b2e"/>
    <circle cx="106" cy="130" r="5.5" fill="#1f5f5b"/>
    <circle cx="194" cy="130" r="5.5" fill="#1f5f5b"/>
    <text class="lab" x="161" y="90">高杆</text>
    <text class="lab" x="161" y="134">中杆</text>
    <text class="lab" x="161" y="178">低杆</text>
    <text class="lab" x="70" y="114">左塞</text>
    <text class="lab" x="214" y="114">右塞</text>
    <text class="lab2" x="300" y="72">高杆：母球容易向前跟进</text>
    <text class="lab2" x="300" y="96">低杆：母球可能向后回拉</text>
    <text class="lab2" x="300" y="120">中杆：最常用的一击</text>
    <text class="lab2" x="300" y="144">左右加塞：改变分离方向</text>
    <text class="lab2" x="24" y="216">击点是相对母球中心的方向，越靠边越容易打偏</text>
  </svg>