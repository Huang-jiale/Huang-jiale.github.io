<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" role="img" aria-label="出杆路线示意图：三条带箭头的线分别表示母球接近、目标球进袋和母球停位" width="620" height="260"><style>
svg{display:block;width:100%;height:auto}
.bg-paper {fill: #fffdf6;}
