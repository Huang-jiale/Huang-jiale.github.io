<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="反例示意：自己的子挤在营地口，后面的子进不去" width="720" height="200"><style>
