<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="三种走法对照：走一步、单跳、连跳，落点都在空格上" width="720" height="250"><style>
svg{display:block;width:100%;height:auto}
.bg-paper {fill: #fffdf6;}
svg text {font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;}
svg text.t {font-size: 15px; fill: #221d16;}
svg text.lab {font-size: 13px; fill: #221d16;}
svg text.lab2 {font-size: 11.5px; fill: #5b5348;}
svg text.hd {font-size: 13px; font-weight: 700; fill: #9a3b2e;}
svg .ln {stroke: #6f6252; stroke-width: 1.6; fill: none;}
svg .ln2 {stroke: #b8a98f; stroke-width: 1.2; fill: none;}
svg .lnr {stroke: #9a3b2e; stroke-width: 2; fill: none;}
svg .box {fill: #f6f0e4; stroke: #9d8a68; stroke-width: 1.4;}
svg .box2 {fill: #ffffff; stroke: #9d8a68; stroke-width: 1.2;}
svg .ball {stroke: #ffffff; stroke-width: 1.5;}
</style>
    <rect class="bg-paper" width="720" height="250"/>
    <text class="hd" x="24" y="32">三种走法对照</text>
    <text class="t" x="24" y="96">① 走一步</text>
    <circle class="ball" cx="110" cy="90" r="9" fill="#9a3b2e"/>
    <circle class="box2" cx="146" cy="90" r="9"/>
    <path class="lnr" d="M121 90H128"/>
    <path class="lnr" d="M127 85L134 90L127 95"/>
    <text class="lab2" x="250" y="96">沿直线挪到紧挨着的空位</text>
    <text class="t" x="24" y="156">② 单跳</text>
    <circle class="ball" cx="110" cy="150" r="9" fill="#9a3b2e"/>
    <circle class="ball" cx="140" cy="150" r="9" fill="#1f5f5b"/>
    <circle class="box2" cx="170" cy="150" r="9"/>
    <path class="lnr" d="M108 168H162"/>
    <path class="lnr" d="M161 163L168 168L161 173"/>
    <text class="lab2" x="250" y="156">沿同一条直线越过连着的棋子，落在它后面的空格</text>
    <text class="t" x="24" y="216">③ 连跳</text>
    <circle class="ball" cx="104" cy="210" r="8" fill="#9a3b2e"/>
    <circle class="ball" cx="132" cy="210" r="8" fill="#1f5f5b"/>
    <circle class="box2" cx="160" cy="210" r="8"/>
    <circle class="ball" cx="188" cy="210" r="8" fill="#1f5f5b"/>
    <circle class="box2" cx="216" cy="210" r="8"/>
    <path class="lnr" d="M104 198C118 180 146 180 160 198"/>
    <path class="lnr" d="M160 198C174 180 202 180 216 198"/>
    <text class="lab2" x="250" y="216">一个回合里连着跳，中途每一程都得落在空位上</text>
  </svg>