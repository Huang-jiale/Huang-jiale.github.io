<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="条形图：万条筒各三十六张，风牌十六张，三元牌十二张，花牌八张，右侧给出合计口径" width="720" height="250"><style>
svg{display:block;width:100%;height:auto}
.bg-paper {fill: #fffdf6;}
.sq {fill: #f3e7cf; stroke: #b9975b; stroke-width: 1.5;}
svg text {font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;}
svg text.t {font-size: 15px; fill: #221d16;}
svg text.lab {font-size: 13px; fill: #221d16;}
svg text.lab2 {font-size: 11.5px; fill: #5b5348;}
svg text.hd {font-size: 13px; font-weight: 700; fill: #9a3b2e;}
svg .ln {stroke: #6f6252; stroke-width: 1.6; fill: none;}
svg .ln2 {stroke: #b8a98f; stroke-width: 1.2; fill: none;}
svg .lnr {stroke: #9a3b2e; stroke-width: 2; fill: none;}
svg .box {fill: #f6f0e4; stroke: #9d8a68; stroke-width: 1.4;}
svg .box2 {fill: #ffffff; stroke: #9d8a68; stroke-width: 1.2;}
svg .ball {stroke: #ffffff; stroke-width: 1.5;}
</style>
    <rect class="bg-paper" width="720" height="250"/>
    <text class="hd" x="24" y="26">一副牌的构成（常见 136 或 144 张）</text>
    <text class="lab" x="24" y="59">万子</text>
    <rect class="sq" x="120" y="44" width="126" height="20"/>
    <text class="lab2" x="252" y="59">36 张</text>
    <text class="lab" x="24" y="91">条子</text>
    <rect class="sq" x="120" y="76" width="126" height="20"/>
    <text class="lab2" x="252" y="91">36 张</text>
    <text class="lab" x="24" y="123">筒子</text>
    <rect class="sq" x="120" y="108" width="126" height="20"/>
    <text class="lab2" x="252" y="123">36 张</text>
    <text class="lab" x="24" y="155">风牌</text>
    <rect class="sq" x="120" y="140" width="56" height="20"/>
    <text class="lab2" x="182" y="155">16 张</text>
    <text class="lab" x="24" y="187">三元牌</text>
    <rect class="sq" x="120" y="172" width="42" height="20"/>
    <text class="lab2" x="168" y="187">12 张</text>
    <text class="lab" x="24" y="219">花牌</text>
    <rect class="sq" x="120" y="204" width="28" height="20"/>
    <text class="lab2" x="154" y="219">8 张</text>
    <rect class="box" x="380" y="44" width="310" height="180" rx="8"/>
    <text class="t" x="396" y="72">不含花牌 136 张</text>
    <text class="lab2" x="396" y="94">万条筒共 108 张，字牌 28 张</text>
    <text class="lab2" x="396" y="116">再加 8 张花牌，共 144 张</text>
    <text class="lab2" x="396" y="138">各地的牌数并不统一</text>
    <text class="lab2" x="396" y="160">有的玩法只用 108 张</text>
    <text class="lab2" x="396" y="182">也有 120 张的地方打法</text>
    <text class="lab2" x="396" y="204">闲家起手 13 张</text>
  </svg>