<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" role="img" aria-label="构成图：三张连号的方块组、三张相同的方块组、两张相同的方块组，右侧写四组面子加一对将" width="720" height="210"><style>
