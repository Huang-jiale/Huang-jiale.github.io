<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" role="img" aria-label="流程图：摸牌、判定、出牌、轮到下家四个方框依次用箭头连接" width="720" height="190"><style>
svg{display:block;width:100%;height:auto}
.bg-paper {fill: #fffdf6;}
svg text {font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;}
svg text.t {font-size: 15px; fill: #221d16;}
svg text.lab {font-size: 13px; fill: #221d16;}
svg text.lab2 {font-size: 11.5px; fill: #5b5348;}
svg text.hd {font-size: 13px; font-weight: 700; fill: #9a3b2e;}
svg .ln {stroke: #6f6252; stroke-width: 1.6; fill: none;}
svg .ln2 {stroke: #b8a98f; stroke-width: 1.2; fill: none;}
svg .lnr {stroke: #9a3b2e; stroke-width: 2; fill: none;}
svg .box {fill: #f6f0e4; stroke: #9d8a68; stroke-width: 1.4;}
svg .box2 {fill: #ffffff; stroke: #9d8a68; stroke-width: 1.2;}
svg .ball {stroke: #ffffff; stroke-width: 1.5;}
</style>
    <rect class="bg-paper" width="720" height="190"/>
    <text class="hd" x="24" y="28">一回合的四拍</text>
    <rect class="box" x="24" y="48" width="150" height="64" rx="8"/>
    <text class="t" x="48" y="76">摸牌</text>
    <text class="lab2" x="40" y="98">先看能不能和</text>
    <path class="lnr" d="M180 80H198"/>
    <path class="ln" d="M192 75L199 80L192 85"/>
    <rect class="box" x="204" y="48" width="150" height="64" rx="8"/>
    <text class="t" x="228" y="76">判定</text>
    <text class="lab2" x="220" y="98">能否和或杠</text>
    <path class="lnr" d="M360 80H378"/>
    <path class="ln" d="M372 75L379 80L372 85"/>
    <rect class="box" x="384" y="48" width="150" height="64" rx="8"/>
    <text class="t" x="408" y="76">出牌</text>
    <text class="lab2" x="400" y="98">打出一张牌</text>
    <path class="lnr" d="M540 80H558"/>
    <path class="ln" d="M552 75L559 80L552 85"/>
    <rect class="box" x="564" y="48" width="150" height="64" rx="8"/>
    <text class="t" x="588" y="76">轮到下家</text>
    <text class="lab2" x="580" y="98">循环往复</text>
    <text class="lab2" x="24" y="140">摸完再打，打出后牌面张数回到原样；杠之后还要再补摸一张。</text>
  </svg>