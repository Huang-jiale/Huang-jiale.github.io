<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 185" role="img" aria-label="四个方框用箭头连成一排，表示一局的前后阶段" width="720" height="185"><style>
svg{display:block;width:100%;height:auto}
.bg-paper {fill: #fffdf6;}
svg text {font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;}
svg text.t {font-size: 15px; fill: #221d16;}
svg text.lab {font-size: 13px; fill: #221d16;}
svg text.lab2 {font-size: 11.5px; fill: #5b5348;}
svg text.hd {font-size: 13px; font-weight: 700; fill: #9a3b2e;}
svg .ln {stroke: #6f6252; stroke-width: 1.6; fill: none;}
svg .ln2 {stroke: #b8a98f; stroke-width: 1.2; fill: none;}
svg .lnr {stroke: #9a3b2e; stroke-width: 2; fill: none;}
svg .box {fill: #f6f0e4; stroke: #9d8a68; stroke-width: 1.4;}
svg .box2 {fill: #ffffff; stroke: #9d8a68; stroke-width: 1.2;}
svg .ball {stroke: #ffffff; stroke-width: 1.5;}
</style>
    <rect class="bg-paper" width="720" height="185"/>
    <text class="hd" x="24" y="30">一局的四个阶段</text>
    <rect class="box" x="20" y="52" width="150" height="90" rx="10"/>
    <text class="t" x="36" y="78">① 开球</text>
    <text class="lab2" x="36" y="104">母球碰红球堆</text>
    <text class="lab2" x="36" y="126">力度宜适中</text>
    <path class="lnr" d="M174 94H204"/>
    <rect class="box" x="208" y="52" width="150" height="90" rx="10"/>
    <text class="t" x="220" y="78">② 红彩交替</text>
    <text class="lab2" x="220" y="104">进一红配一彩</text>
    <text class="lab2" x="220" y="126">彩球进袋会摆回</text>
    <path class="lnr" d="M362 94H392"/>
    <rect class="box" x="396" y="52" width="150" height="90" rx="10"/>
    <text class="t" x="408" y="78">③ 红球打完</text>
    <text class="lab2" x="408" y="104">目标只剩彩球</text>
    <text class="lab2" x="408" y="126">顺序不能乱</text>
    <path class="lnr" d="M550 94H580"/>
    <rect class="box" x="584" y="52" width="116" height="90" rx="10"/>
    <text class="t" x="594" y="78">④ 清彩</text>
    <text class="lab2" x="594" y="104">进的不再摆回</text>
    <text class="lab2" x="594" y="126">分够即决胜</text>
    <text class="lab2" x="24" y="165">先红后彩，红球打完再按分值从低到高清完</text>
  </svg>