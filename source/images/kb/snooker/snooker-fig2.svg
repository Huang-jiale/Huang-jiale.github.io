<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-label="六个色块按分值从低到高排成一行，上方写球色，下方写分值" width="720" height="180"><style>
svg{display:block;width:100%;height:auto}
.bg-paper {fill: #fffdf6;}
svg text {font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;}
svg text.t {font-size: 15px; fill: #221d16;}
svg text.lab {font-size: 13px; fill: #221d16;}
svg text.lab2 {font-size: 11.5px; fill: #5b5348;}
svg text.hd {font-size: 13px; font-weight: 700; fill: #9a3b2e;}
svg .ln {stroke: #6f6252; stroke-width: 1.6; fill: none;}
svg .ln2 {stroke: #b8a98f; stroke-width: 1.2; fill: none;}
svg .lnr {stroke: #9a3b2e; stroke-width: 2; fill: none;}
svg .box {fill: #f6f0e4; stroke: #9d8a68; stroke-width: 1.4;}
svg .box2 {fill: #ffffff; stroke: #9d8a68; stroke-width: 1.2;}
svg .ball {stroke: #ffffff; stroke-width: 1.5;}
</style>
    <rect class="bg-paper" width="720" height="180"/>
    <text class="hd" x="24" y="30">彩球分值一览（分值只标在这里）</text>
    <circle class="ball" cx="58" cy="92" r="17" fill="#e0b52a"/>
    <text class="lab" x="38" y="58">黄球</text>
    <text class="t" x="44" y="132">2 分</text>
    <circle class="ball" cx="164" cy="92" r="17" fill="#2f7a3f"/>
    <text class="lab" x="144" y="58">绿球</text>
    <text class="t" x="150" y="132">3 分</text>
    <circle class="ball" cx="270" cy="92" r="17" fill="#7a4a24"/>
    <text class="lab" x="250" y="58">棕球</text>
    <text class="t" x="256" y="132">4 分</text>
    <circle class="ball" cx="376" cy="92" r="17" fill="#2456a6"/>
    <text class="lab" x="356" y="58">蓝球</text>
    <text class="t" x="362" y="132">5 分</text>
    <circle class="ball" cx="482" cy="92" r="17" fill="#e491ab"/>
    <text class="lab" x="462" y="58">粉球</text>
    <text class="t" x="468" y="132">6 分</text>
    <circle class="ball" cx="588" cy="92" r="17" fill="#221d16"/>
    <text class="lab" x="568" y="58">黑球</text>
    <text class="t" x="574" y="132">7 分</text>
    <text class="lab2" x="24" y="162">红球固定 15 颗，每进一颗记 1 分</text>
  </svg>