<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="长方形代表台面，左端的线和半圆是开球区，中线上有四个置球点" width="720" height="250"><style>
svg{display:block;width:100%;height:auto}
.bg-paper {fill: #fffdf6;}
.st {stroke: #6f6252; stroke-width: 1.4; fill: none;}
svg text {font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;}
svg text.t {font-size: 15px; fill: #221d16;}
svg text.lab {font-size: 13px; fill: #221d16;}
svg text.lab2 {font-size: 11.5px; fill: #5b5348;}
svg text.hd {font-size: 13px; font-weight: 700; fill: #9a3b2e;}
svg .ln {stroke: #6f6252; stroke-width: 1.6; fill: none;}
svg .ln2 {stroke: #b8a98f; stroke-width: 1.2; fill: none;}
svg .lnr {stroke: #9a3b2e; stroke-width: 2; fill: none;}
svg .box {fill: #f6f0e4; stroke: #9d8a68; stroke-width: 1.4;}
svg .box2 {fill: #ffffff; stroke: #9d8a68; stroke-width: 1.2;}
svg .ball {stroke: #ffffff; stroke-width: 1.5;}
</style>
    <rect class="bg-paper" width="720" height="250"/>
    <text class="hd" x="24" y="30">台面示意（只标名称，不标尺寸）</text>
    <rect class="box" x="70" y="56" width="580" height="150" rx="14"/>
    <circle cx="70" cy="56" r="8" fill="#4a4034"/>
    <circle cx="360" cy="56" r="8" fill="#4a4034"/>
    <circle cx="650" cy="56" r="8" fill="#4a4034"/>
    <circle cx="70" cy="206" r="8" fill="#4a4034"/>
    <circle cx="360" cy="206" r="8" fill="#4a4034"/>
    <circle cx="650" cy="206" r="8" fill="#4a4034"/>
    <path class="st" d="M170 56V206"/>
    <path class="st" d="M170 206A75 75 0 0 1 170 56"/>
    <text class="lab" x="228" y="76">库边</text>
    <text class="lab2" x="372" y="76">袋口</text>
    <text class="lab2" x="112" y="106">D 区</text>
    <circle cx="118" cy="150" r="8" fill="#ffffff" stroke="#9d8a68" stroke-width="1.3"/>
