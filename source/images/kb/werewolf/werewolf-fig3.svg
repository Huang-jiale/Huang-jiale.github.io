    <rect class="box2" x="360" y="48" width="60" height="30" rx="6"/>
    <text class="lab" x="369" y="68">玩家丁</text>
    <rect class="box2" x="472" y="48" width="60" height="30" rx="6"/>
    <text class="lab" x="481" y="68">玩家戊</text>
    <rect class="box2" x="584" y="48" width="60" height="30" rx="6"/>
    <text class="lab" x="593" y="68">玩家己</text>
