<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 214" role="img" aria-label="阵营对照示意图：左栏好人阵营列出平民与四种神职，右栏狼人阵营列出狼人与可选的狼王" width="720" height="214"><style>
svg{display:block;width:100%;height:auto}
.bg-paper {fill: #fffdf6;}
svg text {font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;}
svg text.t {font-size: 15px; fill: #221d16;}
svg text.lab {font-size: 13px; fill: #221d16;}
svg text.lab2 {font-size: 11.5px; fill: #5b5348;}
svg text.hd {font-size: 13px; font-weight: 700; fill: #9a3b2e;}
svg .ln {stroke: #6f6252; stroke-width: 1.6; fill: none;}
svg .ln2 {stroke: #b8a98f; stroke-width: 1.2; fill: none;}
svg .lnr {stroke: #9a3b2e; stroke-width: 2; fill: none;}
svg .box {fill: #f6f0e4; stroke: #9d8a68; stroke-width: 1.4;}
svg .box2 {fill: #ffffff; stroke: #9d8a68; stroke-width: 1.2;}
svg .ball {stroke: #ffffff; stroke-width: 1.5;}
</style>
    <rect class="bg-paper" width="720" height="214"/>
    <text class="hd" x="24" y="28">两个阵营</text>
    <rect class="box" x="24" y="42" width="336" height="138" rx="8"/>
    <text class="t" x="44" y="64">好人阵营：平民加神职</text>
    <text class="lab" x="44" y="86">平民：无技能，靠发言与投票</text>
    <text class="lab" x="44" y="112">预言家：每晚查验一名玩家</text>
    <text class="lab" x="44" y="138">女巫：一瓶解药一瓶毒药</text>
    <text class="lab" x="44" y="164">猎人、守卫：多数玩法另有技能</text>
    <rect class="box" x="380" y="42" width="316" height="138" rx="8"/>
    <text class="t" x="400" y="64">狼人阵营</text>
    <text class="lab" x="400" y="86">狼人：夜里共同决定刀谁</text>
    <text class="lab" x="400" y="112">有的玩法加入狼王，出局可带人</text>
    <text class="lab" x="400" y="138">白天要装好人，不能明着互认</text>
    <text class="lab2" x="24" y="200">人数与身份配置各地不同，以开局前公布的为准</text>
  </svg>