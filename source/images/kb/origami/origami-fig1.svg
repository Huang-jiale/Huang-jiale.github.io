<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="示意图：左侧一张长方形纸，经箭头指示，右侧变成一个正方形" width="640" height="200"><style>
svg{display:block;width:100%;height:auto}
.bg-paper {fill: #fffdf6;}
.sq {fill: #f3e7cf; stroke: #b9975b; stroke-width: 1.5;}
.st {stroke: #6f6252; stroke-width: 1.4; fill: none;}
svg text {font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;}
svg text.t {font-size: 15px; fill: #221d16;}
svg text.lab {font-size: 13px; fill: #221d16;}
svg text.lab2 {font-size: 11.5px; fill: #5b5348;}
svg text.hd {font-size: 13px; font-weight: 700; fill: #9a3b2e;}
svg .ln {stroke: #6f6252; stroke-width: 1.6; fill: none;}
svg .ln2 {stroke: #b8a98f; stroke-width: 1.2; fill: none;}
svg .lnr {stroke: #9a3b2e; stroke-width: 2; fill: none;}
svg .box {fill: #f6f0e4; stroke: #9d8a68; stroke-width: 1.4;}
svg .box2 {fill: #ffffff; stroke: #9d8a68; stroke-width: 1.2;}
svg .ball {stroke: #ffffff; stroke-width: 1.5;}
</style>
    <rect class="bg-paper" width="640" height="200"/>
    <text class="hd" x="24" y="32">先把纸整理成正方形</text>
    <rect class="box" x="40" y="58" width="170" height="80" rx="6"/>
    <text class="t" x="52" y="158">长方形纸</text>
    <path class="lnr" d="M226 98H286"/>
    <path class="lnr" d="M276 92L290 98L276 104Z"/>
    <rect class="sq" x="320" y="58" width="80" height="80" rx="4"/>
    <line class="st" x1="320" y1="138" x2="400" y2="58" stroke-dasharray="6 4"/>
    <text class="t" x="335" y="158">正方形</text>
    <text class="lab2" x="24" y="186">沿对角把短边对齐长边，再折掉或裁掉多余的那一条</text>
  </svg>