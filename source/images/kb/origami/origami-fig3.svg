<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="对照图：左边正方形上是虚线、箭头向上翻，标注谷折；右边正方形上是点划线、箭头向下压，标注山折" width="640" height="220"><style>
svg{display:block;width:100%;height:auto}
.bg-paper {fill: #fffdf6;}
.sq {fill: #f3e7cf; stroke: #b9975b; stroke-width: 1.5;}
.st {stroke: #6f6252; stroke-width: 1.4; fill: none;}
svg text {font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;}
svg text.t {font-size: 15px; fill: #221d16;}
svg text.lab {font-size: 13px; fill: #221d16;}
svg text.lab2 {font-size: 11.5px; fill: #5b5348;}
svg text.hd {font-size: 13px; font-weight: 700; fill: #9a3b2e;}
svg .ln {stroke: #6f6252; stroke-width: 1.6; fill: none;}
svg .ln2 {stroke: #b8a98f; stroke-width: 1.2; fill: none;}
svg .lnr {stroke: #9a3b2e; stroke-width: 2; fill: none;}
svg .box {fill: #f6f0e4; stroke: #9d8a68; stroke-width: 1.4;}
svg .box2 {fill: #ffffff; stroke: #9d8a68; stroke-width: 1.2;}
svg .ball {stroke: #ffffff; stroke-width: 1.5;}
</style>
    <rect class="bg-paper" width="640" height="220"/>
    <text class="hd" x="24" y="30">谷折与山折：一张纸的两种基本折法</text>
    <rect class="sq" x="60" y="60" width="110" height="110" rx="3"/>
    <line class="st" x1="60" y1="115" x2="170" y2="115" stroke-dasharray="6 4"/>
    <path class="lnr" d="M115 156V74"/>
    <path class="lnr" d="M108 82L115 68L122 82Z"/>
    <rect class="sq" x="350" y="60" width="110" height="110" rx="3"/>
    <line class="st" x1="350" y1="115" x2="460" y2="115" stroke-dasharray="10 4 2 4"/>
    <path class="lnr" d="M405 74V156"/>
    <path class="lnr" d="M398 148L405 162L412 148Z"/>
    <text class="lab" x="55" y="184">谷折：向前折，折痕朝上</text>
    <text class="lab" x="345" y="184">山折：向后折，折痕朝下</text>
    <text class="lab2" x="24" y="209">谷折多画虚线，山折多画点划线</text>
  </svg>