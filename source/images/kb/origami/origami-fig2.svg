<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="图例：左侧依次画出虚线、点划线、箭头和翻转记号，右侧对应写出谷折线、山折线、箭头、翻转符号" width="640" height="240"><style>
svg{display:block;width:100%;height:auto}
.bg-paper {fill: #fffdf6;}
.st {stroke: #6f6252; stroke-width: 1.4; fill: none;}
svg text {font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;}
svg text.t {font-size: 15px; fill: #221d16;}
svg text.lab {font-size: 13px; fill: #221d16;}
svg text.lab2 {font-size: 11.5px; fill: #5b5348;}
svg text.hd {font-size: 13px; font-weight: 700; fill: #9a3b2e;}
svg .ln {stroke: #6f6252; stroke-width: 1.6; fill: none;}
svg .ln2 {stroke: #b8a98f; stroke-width: 1.2; fill: none;}
svg .lnr {stroke: #9a3b2e; stroke-width: 2; fill: none;}
svg .box {fill: #f6f0e4; stroke: #9d8a68; stroke-width: 1.4;}
svg .box2 {fill: #ffffff; stroke: #9d8a68; stroke-width: 1.2;}
svg .ball {stroke: #ffffff; stroke-width: 1.5;}
</style>
    <rect class="bg-paper" width="640" height="240"/>
    <text class="hd" x="24" y="30">看图先认四类线</text>
    <line class="st" x1="40" y1="62" x2="160" y2="62" stroke-dasharray="6 4"/>
    <text class="lab" x="190" y="66">谷折线：虚线，向前凹</text>
    <line class="st" x1="40" y1="104" x2="160" y2="104" stroke-dasharray="10 4 2 4"/>
    <text class="lab" x="190" y="108">山折线：点划线，向后凸</text>
    <path class="lnr" d="M40 150H150"/>
    <path class="lnr" d="M140 143L156 150L140 157Z"/>
    <text class="lab" x="190" y="154">箭头：折向，纸往哪边翻</text>
    <path class="lnr" d="M40 196C56 178 144 178 160 196"/>
    <path class="lnr" d="M150 190L164 199L152 202Z"/>
    <text class="lab" x="190" y="196">翻转符号：整张纸翻一面</text>
    <text class="lab2" x="24" y="228">有的图解还标只折一层或折全部层，两者差别很大</text>
  </svg>