<svg viewBox="0 0 760 350" role="img" aria-label="唯一矩形 Type 1 例题：第四角多挂一个候选数" xmlns="http://www.w3.org/2000/svg" width="760" height="350"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
<rect class="bg-paper" width="760" height="350"/>
<text class="labk" x="24" y="32">唯一矩形 Type 1：拆掉第四角</text>
<text class="lab2" x="112" y="62" text-anchor="middle">B</text><text class="lab2" x="176" y="62" text-anchor="middle">C</text>
<text class="lab2" x="16" y="96">第 4 行</text><text class="lab2" x="16" y="166">第 7 行</text>
<rect class="hl" x="80" y="70" width="64" height="64"/>
<rect class="st" x="80" y="70" width="64" height="64"/>
<text class="cand" x="90" y="96">6</text><text class="cand" x="112" y="96">9</text>
<rect class="hl" x="144" y="70" width="64" height="64"/>
<rect class="st" x="144" y="70" width="64" height="64"/>
<text class="cand" x="154" y="96">6</text><text class="cand" x="176" y="96">9</text>
<rect class="hl" x="80" y="140" width="64" height="64"/>
<rect class="st" x="80" y="140" width="64" height="64"/>
<text class="cand" x="90" y="166">6</text><text class="cand" x="112" y="166">9</text>
<rect class="hlb" x="144" y="140" width="64" height="64"/>
<rect class="st" x="144" y="140" width="64" height="64"/>
<text class="cand" x="152" y="166">4</text><text class="cand" x="170" y="166">6</text><text class="cand" x="188" y="166">9</text>
<line class="st-bad" x1="167" y1="158" x2="179" y2="170"/>
<line class="st-bad" x1="185" y1="158" x2="197" y2="170"/>
<line class="st" x1="76" y1="137" x2="212" y2="137"/>
<text class="lab2" x="216" y="96">第 4 宫</text>
<text class="lab2" x="216" y="166">第 7 宫</text>
<text class="labk" x="300" y="64">三个角都是 {6,9}</text>
<text class="lab" x="300" y="94">第四角 C7 = {4,6,9}</text>
<text class="lab" x="300" y="124">如果 C7 也填 6 或者 9</text>
<text class="lab" x="300" y="150">四角就塌成同一对数</text>
<text class="lab" x="300" y="176">对角互换，得到第二个解</text>
<text class="lab" x="300" y="206">唯一解的题不允许这一形</text>
<text class="lab" x="300" y="232">所以 C7 的 6、9 全部划掉</text>
<text class="lab" x="300" y="262">C7 只剩 4，当场落子</text>
<text class="lab" x="300" y="292">删的是第四角，不是那三个纯角</text>
</svg>