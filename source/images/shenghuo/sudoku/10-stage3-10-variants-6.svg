<svg viewBox="0 0 760 240" role="img" aria-label="奇偶数独局部示意，涂色格为奇数未涂色格为偶数" xmlns="http://www.w3.org/2000/svg" width="760" height="240"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
    <rect class="bg-paper" width="760" height="240"/>
    <text class="labk" x="20" y="26">奇偶数独局部（涂色=奇，未涂=偶）</text>
    <rect x="20" y="40" width="60" height="60" fill="#fde3cf"/><rect x="80" y="40" width="60" height="60" fill="#ffffff"/><rect x="140" y="40" width="60" height="60" fill="#fde3cf"/>
    <rect x="20" y="100" width="60" height="60" fill="#ffffff"/><rect x="80" y="100" width="60" height="60" fill="#fde3cf"/><rect x="140" y="100" width="60" height="60" fill="#ffffff"/>
    <rect x="20" y="160" width="60" height="60" fill="#fde3cf"/><rect x="80" y="160" width="60" height="60" fill="#ffffff"/><rect x="140" y="160" width="60" height="60" fill="#fde3cf"/>
    <text class="num" text-anchor="middle" x="50" y="78">5</text><text class="num" text-anchor="middle" x="110" y="78">4</text><text class="num" text-anchor="middle" x="170" y="78">9</text>
    <text class="num" text-anchor="middle" x="50" y="138">2</text><text class="num" text-anchor="middle" x="110" y="138">7</text><text class="num" text-anchor="middle" x="170" y="138">8</text>
    <text class="num" text-anchor="middle" x="50" y="198">3</text><text class="num" text-anchor="middle" x="110" y="198">6</text><text class="num" text-anchor="middle" x="170" y="198">1</text>
    <rect class="st" x="20" y="40" width="180" height="180" fill="none" stroke-width="2"/>
    <line class="grid" x1="80" y1="40" x2="80" y2="220"/><line class="grid" x1="140" y1="40" x2="140" y2="220"/><line class="grid" x1="20" y1="100" x2="200" y2="100"/><line class="grid" x1="20" y1="160" x2="200" y2="160"/>
    <text class="lab" x="230" y="60">检查一眼就能判：</text>
    <text class="lab2" x="230" y="86">淡橙格必须给奇数，</text>
    <text class="lab2" x="230" y="108">白格必须给偶数。</text>
    <text class="lab" x="230" y="140">它砍掉一半候选：</text>
    <text class="lab2" x="230" y="166">某格已排除到只剩 2/4，</text>
    <text class="lab2" x="230" y="188">若它是淡橙格，</text>
    <text class="lab2" x="230" y="210">奇偶直接判它无解→改。</text>
  </svg>