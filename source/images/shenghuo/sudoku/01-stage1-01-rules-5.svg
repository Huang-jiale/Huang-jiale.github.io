<svg viewBox="0 0 760 300" role="img" aria-label="宫4九格放大图，格内用小数字标出候选数，键盘式布局" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
  <rect class="bg-paper" width="760" height="300"/>
  <text class="labk" x="24" y="20">把宫 4 放大：左上=第四行第一列，右下=第六行第三列</text>
  <rect class="cell" x="24" y="52" width="192" height="192"/>
  <g class="gl"><line x1="88" y1="52" x2="88" y2="244"/><line x1="152" y1="52" x2="152" y2="244"/><line x1="24" y1="116" x2="216" y2="116"/><line x1="24" y1="180" x2="216" y2="180"/></g>
  <rect class="st" x="24" y="52" width="192" height="192"/>
  <text class="num" x="52" y="92">2</text><text class="num" x="52" y="156">9</text><text class="num" x="180" y="156">4</text><text class="num" x="180" y="220">5</text>
  <text class="cand" x="136" y="74">3</text><text class="cand" x="96" y="110">7</text>
  <text class="cand" x="160" y="74">1</text><text class="cand" x="200" y="74">3</text><text class="cand" x="160" y="110">7</text>
  <text class="cand" x="136" y="138">3</text><text class="cand" x="116" y="174">8</text>
  <text class="cand" x="32" y="202">1</text><text class="cand" x="72" y="202">3</text><text class="cand" x="72" y="220">6</text>
  <text class="cand" x="136" y="202">3</text><text class="cand" x="136" y="220">6</text>
  <text class="lab" x="240" y="70">大字 = 已知数（题目印好的）</text>
  <text class="lab" x="240" y="96">小字 = 候选数（自己推出来的）</text>
  <text class="lab2" x="240" y="124">小字按「键盘位置」摆放：</text>
  <text class="lab2" x="240" y="144">上排 1 2 3、中排 4 5 6、下排 7 8 9，</text>
  <text class="lab2" x="240" y="162">所以看到 7 就写在左下角，一眼能对上数字。</text>
  <text class="lab" x="240" y="192">本宫已有 2、9、4、5 → 缺 1、3、6、7、8，</text>
  <text class="lab2" x="240" y="212">五个空格分这五个数，谁都不能多。</text>
  <text class="lab2" x="240" y="240">注意中格只有两个候选数（3、8）：这种格叫「双值格」，</text>
  <text class="lab2" x="240" y="258">是后面数对、链这些技巧的主要材料。</text>
</svg>