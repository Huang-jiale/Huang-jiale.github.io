<svg viewBox="0 0 760 320" role="img" aria-label="四格六节点链，强关系摆在两列上，两端都是数7，删同行格" xmlns="http://www.w3.org/2000/svg" width="760" height="320"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
  <rect class="bg-paper" width="760" height="320"/>
  <text class="labk" x="28" y="24">两端都是 7：强关系摆在两列上</text>
  <rect class="hl" x="140" y="56" width="24" height="24"/>
  <text class="cand" x="140" y="94">{7,3}</text>
  <text class="labk" x="140" y="48">r2c5</text>
  <rect class="hlc" x="280" y="56" width="24" height="24"/>
  <text class="cand" x="280" y="94">{7,4}</text>
  <text class="labk" x="280" y="48">r2c7</text>
  <text class="lab2" x="268" y="112">删 7</text>
  <rect class="hl" x="420" y="56" width="24" height="24"/>
  <text class="cand" x="420" y="94">{7,2}</text>
  <text class="labk" x="420" y="48">r2c9</text>
  <text class="lab2" x="180" y="128">两端与删除格同在行 2</text>
  <line class="st" x1="152" y1="82" x2="152" y2="210"/>
  <text class="lab2" x="168" y="150">强 7·第5列</text>
  <rect class="cell" x="140" y="210" width="24" height="24"/>
  <text class="cand" x="140" y="248">{7,4}</text>
  <text class="labk" x="140" y="202">r6c5</text>
  <text class="lab2" x="150" y="266">拐弯7/4</text>
  <line class="st" x1="166" y1="222" x2="420" y2="222"/>
  <text class="lab2" x="255" y="246">强 4·第6行</text>
  <rect class="cell" x="420" y="210" width="24" height="24"/>
  <text class="cand" x="420" y="248">{4,7}</text>
  <text class="labk" x="420" y="202">r6c9</text>
  <text class="lab2" x="404" y="266">拐弯4/7</text>
  <line class="st" x1="432" y1="82" x2="432" y2="210"/>
  <text class="lab2" x="446" y="150">强 7·第9列</text>
  <text class="lab" x="540" y="120">两端 r2c5、r2c9</text>
  <text class="lab" x="540" y="142">都是 7，至少中一个</text>
  <text class="labk" x="540" y="164">删 r2c7 的 7</text>
  <text class="lab2" x="540" y="186">链两端都不删</text>
</svg>