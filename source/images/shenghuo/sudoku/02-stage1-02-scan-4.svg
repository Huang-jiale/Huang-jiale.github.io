  <text class="lab2" x="24" y="288">黄底 = 本课 11 步新填的格；小灰点仍是空格</text>
  <text class="lab" x="300" y="60">数一数各数字的落位：5 已经落了 9 个，</text>
  <text class="lab" x="300" y="80">在盘上收官；4 和 7 各 7 个，还差 2 个。</text>
  <text class="lab2" x="300" y="110">盘的形状变了：第 5 行只剩 2 格空，</text>
  <text class="lab2" x="300" y="128">宫 5 也只剩 2 格空，缺的都是 2 和 3。</text>
  <text class="lab2" x="300" y="158">「只剩 1 格空的单位」是金矿：它缺哪个数，</text>
  <text class="lab2" x="300" y="176">那格就必须填哪个数，连排除都不用做。</text>
  <text class="labk" x="300" y="208">可是此刻全盘没有一个这样的单位，</text>
