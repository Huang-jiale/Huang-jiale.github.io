<svg viewBox="0 0 760 300" role="img" aria-label="第3行显性三链数1、4、7，删掉第8格的候选1" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
    <rect class="bg-paper" width="760" height="300"/>
    <text class="labk" x="40" y="32">例4：显性三链数（1、4、7）</text>
    <text class="lab2" x="236" y="32">黄底三格合占三个数</text>
    <rect class="cell" x="40" y="60" width="66" height="66"/>
    <rect class="cell" x="116" y="60" width="66" height="66"/>
    <rect class="hl" x="116" y="60" width="66" height="66"/>
    <rect class="cell" x="192" y="60" width="66" height="66"/>
    <rect class="cell" x="268" y="60" width="66" height="66"/>
    <rect class="cell" x="344" y="60" width="66" height="66"/>
    <rect class="hl" x="344" y="60" width="66" height="66"/>
    <rect class="cell" x="420" y="60" width="66" height="66"/>
    <rect class="hl" x="420" y="60" width="66" height="66"/>
    <rect class="cell" x="496" y="60" width="66" height="66"/>
    <rect class="cell" x="572" y="60" width="66" height="66"/>
    <rect class="cell" x="648" y="60" width="66" height="66"/>
    <text class="num" x="73" y="104">2</text>
    <text class="num" x="149" y="104">.</text>
    <text class="num" x="225" y="104">6</text>
    <text class="num" x="301" y="104">8</text>
    <text class="num" x="377" y="104">.</text>
    <text class="num" x="453" y="104">.</text>
    <text class="num" x="529" y="104">9</text>
    <text class="num" x="605" y="104">.</text>
    <text class="num" x="681" y="104">3</text>
    <text class="cand" x="120" y="76">{1,4}</text>
    <text class="cand" x="344" y="76">{4,7}</text>
    <text class="cand" x="424" y="76">{1,4,7}</text>
    <text class="cand" x="576" y="76">{1,5}</text>
    <line class="st" x1="582" y1="72" x2="597" y2="72"/>
    <text class="lab" x="40" y="170">第 2、5、6 格的候选全在 1、4、7 之内，三格恰好被这三个数包圆。</text>
    <text class="lab" x="40" y="196">所以本行其它格不能再填 1、4、7：第 8 格 {1,5} 划掉 1（短横线处）。</text>
    <text class="lab" x="40" y="222">删完第 8 格只剩一个候选 5，所以 5 直接落进第 8 格——三链数照样造落点。</text>
    <text class="lab" x="40" y="250">反过来说：第 8 格占了 5，三格里哪个都不许再放 5，这也是删候选的依据。</text>
  </svg>