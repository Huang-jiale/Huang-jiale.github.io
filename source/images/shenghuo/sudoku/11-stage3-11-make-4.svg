<svg viewBox="0 0 760 260" role="img" aria-label="致命矩形：四角两数互换产生第二解" xmlns="http://www.w3.org/2000/svg" width="760" height="260"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
    <rect class="bg-paper" width="760" height="260"/>
    <defs><marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6 Z" fill="#666"/></marker></defs>
    <text class="labk" x="20" y="26">致命矩形：挖错一格 R4C2 就打开整个 4/7 交换</text>
    <text class="lab2" x="20" y="50">方案 A（题面唯一解，即 SOL）：</text>
    <rect x="20" y="60" width="60" height="60" fill="#ffffff"/><rect x="80" y="60" width="60" height="60" fill="#ffffff"/><rect x="20" y="120" width="60" height="60" fill="#ffffff"/><rect x="80" y="120" width="60" height="60" fill="#ffffff"/>
    <text class="num" text-anchor="middle" x="50" y="98">7</text><text class="num" text-anchor="middle" x="110" y="98">4</text><text class="num" text-anchor="middle" x="50" y="158">4</text><text class="num" text-anchor="middle" x="110" y="158">7</text>
    <rect class="st" x="20" y="60" width="120" height="120" fill="none" stroke-width="1.6"/>
    <text class="lab2" x="150" y="80">R4C2=7  R4C6=4</text>
    <text class="lab2" x="150" y="102">R5C2=4  R5C6=7</text>
    <text class="lab2" x="150" y="140">四角恰好两宫（box4/box5）</text>
    <text class="lab2" x="150" y="162">的两行两列交点</text>
    <path d="M240 120 H300" stroke="#666" stroke-width="1.5" marker-end="url(#ar3)"/>
    <text class="lab" x="252" y="112">整组互换</text>
    <text class="lab2" x="310" y="50">方案 B（挖掉 R4C2 后合法的第二解）：</text>
    <rect x="310" y="60" width="60" height="60" fill="#ffffff"/><rect x="370" y="60" width="60" height="60" fill="#ffffff"/><rect x="310" y="120" width="60" height="60" fill="#ffffff"/><rect x="370" y="120" width="60" height="60" fill="#ffffff"/>
    <text class="num" text-anchor="middle" x="340" y="98">4</text><text class="num" text-anchor="middle" x="400" y="98">7</text><text class="num" text-anchor="middle" x="340" y="158">7</text><text class="num" text-anchor="middle" x="400" y="158">4</text>
    <rect class="st" x="310" y="60" width="120" height="120" fill="none" stroke-width="1.6"/>
    <text class="lab2" x="440" y="80">R4C2=4  R4C6=7</text>
    <text class="lab2" x="440" y="102">R5C2=7  R5C6=4</text>
    <text class="lab2" x="440" y="140">同样是合法填法：</text>
    <text class="lab2" x="440" y="162">行/列/宫都不重</text>
    <text class="lab" x="20" y="216">这就是致命矩形：</text>
    <text class="lab2" x="20" y="238">只要四角全空，(a,b)↔(b,a) 的互换就是第二个解。R4C2=7 这一铲必须还原，题面重新拿回唯一性。</text>
  </svg>