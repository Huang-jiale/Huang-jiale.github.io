<svg viewBox="0 0 760 250" role="img" aria-label="唯一解检查器的三态输出流程" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
    <rect class="bg-paper" width="760" height="250"/>
    <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6 Z" fill="#666"/></marker></defs>
    <text class="labk" x="20" y="26">检查器三态：0 / 1 / ≥2</text>
    <rect x="20" y="50" width="160" height="40" rx="6" fill="#eef3fa" stroke="#4b6b8b"/>
    <text class="lab" x="100" y="75" text-anchor="middle">题面（挖好之后的）</text>
    <path d="M180 70 H220" stroke="#666" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="222" y="50" width="160" height="40" rx="6" fill="#e6f4ea" stroke="#2e7d32"/>
    <text class="lab" x="302" y="70" text-anchor="middle">回溯求解</text>
    <text class="lab2" x="302" y="86" text-anchor="middle">最多算到 2 解</text>
    <path d="M382 70 H422" stroke="#666" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="424" y="46" width="150" height="22" rx="4" fill="#e6f4ea" stroke="#2e7d32"/>
    <text class="lab2" x="499" y="62" text-anchor="middle">1 解 → 接受</text>
    <rect x="424" y="72" width="150" height="22" rx="4" fill="#fff3e0" stroke="#e08a2e"/>
    <text class="lab2" x="499" y="88" text-anchor="middle">≥2 解 → 回退</text>
    <rect x="424" y="98" width="150" height="22" rx="4" fill="#fce8e6" stroke="#c5221f"/>
    <text class="lab2" x="499" y="114" text-anchor="middle">0 解 → 废题</text>
    <text class="lab" x="600" y="62">→ 保留这铲挖痕</text>
    <text class="lab" x="600" y="88">→ 还原此格数字</text>
    <text class="lab" x="600" y="114">→ 整盘回炉重造</text>
    <text class="lab2" x="20" y="150">实现要点：数到 2 立刻 return，不追求穷尽；</text>
    <text class="lab2" x="20" y="172">按候选最少的格先分叉，能大幅剪枝。</text>
    <text class="lab2" x="20" y="208">出题循环里检查器会被跑上千次——</text>
    <text class="lab2" x="20" y="230">它慢，整个流程就慢；它对，题目就靠得住。</text>
  </svg>