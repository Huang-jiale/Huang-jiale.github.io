<svg viewBox="0 0 760 300" role="img" aria-label="宫清点示例：数字3在本宫只剩两格可去，与数对形成对照" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
    <rect class="bg-paper" width="760" height="300"/>
    <text class="labk" x="40" y="32">例6：按数字清点的示范（左上宫里的 3）</text>
    <rect class="cell" x="60" y="60" width="66" height="66"/>
    <rect class="cell" x="132" y="60" width="66" height="66"/>
    <rect class="cell" x="204" y="60" width="66" height="66"/>
    <rect class="cell" x="60" y="132" width="66" height="66"/>
    <rect class="hlc" x="60" y="132" width="66" height="66"/>
    <rect class="cell" x="132" y="132" width="66" height="66"/>
    <rect class="hlc" x="132" y="132" width="66" height="66"/>
    <rect class="cell" x="204" y="132" width="66" height="66"/>
    <rect class="cell" x="60" y="204" width="66" height="66"/>
    <rect class="cell" x="132" y="204" width="66" height="66"/>
    <rect class="cell" x="204" y="204" width="66" height="66"/>
    <text class="num" x="93" y="104">1</text>
    <text class="num" x="165" y="104">4</text>
    <text class="num" x="237" y="104">7</text>
    <text class="num" x="93" y="176">.</text>
    <text class="num" x="165" y="176">.</text>
    <text class="num" x="237" y="176">.</text>
    <text class="num" x="93" y="248">.</text>
    <text class="num" x="165" y="248">9</text>
    <text class="num" x="237" y="248">.</text>
    <text class="cand" x="64" y="148">{2,3}</text>
    <text class="cand" x="136" y="148">{3,5}</text>
    <text class="cand" x="208" y="147">{6,8}</text>
    <text class="cand" x="64" y="220">{2,8}</text>
    <text class="cand" x="208" y="220">{5,6}</text>
    <text class="lab" x="320" y="92">清点数字 3：第 2 行第 3 格没有 3，</text>
    <text class="lab" x="320" y="118">第三行两格也没有 3。</text>
    <text class="lab" x="320" y="146">全宫只剩红格两处能放 3。</text>
    <text class="lab" x="320" y="174">若清点出的可去格恰好都是两格，</text>
    <text class="lab" x="320" y="200">再查另一数字是否也只去这两格，</text>
    <text class="lab" x="320" y="226">两数同址，隐性数对即成立。</text>
    <text class="lab2" x="320" y="254">本图 3 只锁定两格，还没构成数对，继续清点别的数字。</text>
  </svg>