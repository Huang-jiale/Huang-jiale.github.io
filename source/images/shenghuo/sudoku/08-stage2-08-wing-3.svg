.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
<rect class="bg-paper" width="760" height="440"/>
<text class="labk" x="24" y="32">XY-Wing 例题：候选数片段</text>
<text class="lab2" x="92" y="62" text-anchor="middle">A</text><text class="lab2" x="156" y="62" text-anchor="middle">B</text><text class="lab2" x="220" y="62" text-anchor="middle">C</text>
<text class="lab2" x="16" y="96">第 1 行</text><text class="lab2" x="16" y="160">第 2 行</text><text class="lab2" x="16" y="224">第 3 行</text><text class="lab2" x="16" y="356">第 8 行</text>
<rect class="st-blue" x="58" y="68" width="196" height="196"/>
<rect class="st-blue" x="58" y="328" width="196" height="68"/>
<rect class="hl" x="60" y="70" width="64" height="64"/>
<rect class="st" x="60" y="70" width="64" height="64"/>
<text class="cand" x="70" y="96">7</text><text class="cand" x="92" y="96">9</text>
<rect class="st" x="124" y="70" width="64" height="64"/>
<text class="cand" x="134" y="96">2</text><text class="cand" x="156" y="96">5</text>
<rect class="hlb" x="188" y="70" width="64" height="64"/>
<rect class="st" x="188" y="70" width="64" height="64"/>
<text class="cand" x="196" y="96">4</text><text class="cand" x="214" y="96">6</text><text class="cand" x="232" y="96">9</text>
<line class="st-bad" x1="229" y1="88" x2="241" y2="100"/>
<rect class="hlb" x="188" y="134" width="64" height="64"/>
<rect class="st" x="188" y="134" width="64" height="64"/>
<text class="cand" x="198" y="160">1</text><text class="cand" x="220" y="160">9</text>
<line class="st-bad" x1="217" y1="152" x2="229" y2="164"/>
<rect class="hlc" x="188" y="198" width="64" height="64"/>
<rect class="st" x="188" y="198" width="64" height="64"/>
<text class="cand" x="198" y="224">2</text><text class="cand" x="220" y="224">7</text>
<rect class="hlb" x="60" y="330" width="64" height="64"/>
<rect class="st" x="60" y="330" width="64" height="64"/>
<text class="cand" x="70" y="356">5</text><text class="cand" x="92" y="356">9</text>
<line class="st-bad" x1="89" y1="348" x2="101" y2="360"/>
<rect class="st" x="124" y="330" width="64" height="64"/>
<text class="cand" x="134" y="356">1</text><text class="cand" x="156" y="356">4</text>
<rect class="hl" x="188" y="330" width="64" height="64"/>
<rect class="st" x="188" y="330" width="64" height="64"/>
<text class="cand" x="198" y="356">2</text><text class="cand" x="220" y="356">9</text>
<line class="arrow" x1="188" y1="220" x2="128" y2="136"/>
<line class="arrow" x1="220" y1="262" x2="220" y2="328"/>
<text class="lab2" x="132" y="182">同宫</text>
<text class="lab2" x="228" y="300">同列</text>
<text class="lab2" x="60" y="282">上面三格在第 1 宫</text>
<text class="lab2" x="258" y="360">第 7 宫</text>
<text class="labk" x="300" y="64">例：轴心 C3 = {2,7}</text>
<text class="lab" x="300" y="92">钳 A1 = {7,9}，与轴心同宫</text>
<text class="lab" x="300" y="118">钳 C8 = {2,9}，与轴心同列</text>
<text class="lab" x="300" y="144">公共数 Z 是 9，两把钳都挂着它</text>
<text class="lab" x="300" y="176">分支一：C3 填 2，则 C8 只剩 9</text>
<text class="lab" x="300" y="202">分支二：C3 填 7，则 A1 只剩 9</text>
<text class="lab" x="300" y="234">两条路都把 9 放到 A1 或 C8 上</text>
<text class="lab" x="300" y="260">所以同时看见两钳的格不能填 9</text>
<text class="lab" x="300" y="292">删 9：C1、C2（同宫 A1、同列 C8）</text>
<text class="lab" x="300" y="318">删 9：A7、A8、A9（同列 A1、同宫 C8）</text>
<text class="lab" x="300" y="350">删完：C2 变 {1}，A8 变 {5}</text>
<text class="lab" x="300" y="376">红格是轴心，黄格是钳，蓝格是被删格</text>
</svg>