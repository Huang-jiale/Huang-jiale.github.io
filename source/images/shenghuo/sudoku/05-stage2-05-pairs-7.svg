<text class="lab" x="300" y="72">1行1列 {1,2,4}　1行2列 {1,4,5,7}</text>
<text class="lab" x="300" y="98">2行1列 {2,4}　2行3列 {2,4}　黄底两格</text>
<text class="lab" x="300" y="124">3行1列 {1,2,4,9}　3行2列 {1,4,5,7,9}</text>
<text class="lab2" x="300" y="152">黄底两格都只剩 2 和 4：显性数对成立</text>
<text class="lab" x="300" y="180">删宫内别处：1行1列去2去4 → 只剩 1</text>
<text class="lab" x="300" y="206">3行1列去2去4 → 剩 1、9；1行2列与3行2列各去4</text>
<text class="lab" x="300" y="232">1行1列落 1 之后，3行1列的 1 也没了 → 落 9</text>
<text class="lab2" x="300" y="262">这两格又同在行方向，第 2 行宫外还要再删 5 处</text>
