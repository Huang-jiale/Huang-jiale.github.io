<svg viewBox="0 0 760 170" role="img" aria-label="找鱼的四个步骤流程" xmlns="http://www.w3.org/2000/svg" width="760" height="170"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
    <rect class="bg-paper" width="760" height="170"/>
    <text class="labk" x="24" y="30">找鱼的固定四步</text>
    <rect class="cell" x="24" y="52" width="160" height="86"/>
    <text class="labk" x="40" y="82">① 选一个数字</text>
    <text class="lab2" x="40" y="106">从 1 扫到 9，</text>
    <text class="lab2" x="40" y="124">一次只看一个</text>
    <rect class="cell" x="208" y="52" width="160" height="86"/>
    <text class="labk" x="224" y="82">② 点出落点</text>
    <text class="lab2" x="224" y="106">把还能填它的格</text>
    <text class="lab2" x="224" y="124">子逐行标一遍</text>
    <rect class="cell" x="392" y="52" width="160" height="86"/>
    <text class="labk" x="408" y="82">③ 找相同基线</text>
    <text class="lab2" x="408" y="106">两行的落点列集</text>
    <text class="lab2" x="408" y="124">合相同＝矩形现</text>
    <rect class="cell" x="576" y="52" width="160" height="86"/>
    <text class="labk" x="592" y="82">④ 删覆盖线</text>
    <text class="lab2" x="592" y="106">沿另一方向把 d</text>
    <text class="lab2" x="592" y="124">从别的格子抹掉</text>
    <line class="arrow" x1="186" y1="95" x2="206" y2="95"/>
    <line class="arrow" x1="370" y1="95" x2="390" y2="95"/>
    <line class="arrow" x1="554" y1="95" x2="574" y2="95"/>
  </svg>