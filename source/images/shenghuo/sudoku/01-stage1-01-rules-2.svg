<svg viewBox="0 0 760 250" role="img" aria-label="一行九格的合法与非法对照：错误版本里出现两个5" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
  <rect class="bg-paper" width="760" height="250"/>
  <text class="labk" x="24" y="22">检查一行：有没有重复？</text>
  <text class="lab2" x="24" y="52">✓ 第 1 行：1–9 各一次</text>
  <rect class="cell" x="24" y="60" width="324" height="36"/>
  <g class="gl"><line x1="60" y1="60" x2="60" y2="96"/><line x1="96" y1="60" x2="96" y2="96"/><line x1="132" y1="60" x2="132" y2="96"/><line x1="168" y1="60" x2="168" y2="96"/><line x1="204" y1="60" x2="204" y2="96"/><line x1="240" y1="60" x2="240" y2="96"/><line x1="276" y1="60" x2="276" y2="96"/><line x1="312" y1="60" x2="312" y2="96"/></g>
  <rect class="st" x="24" y="60" width="324" height="36"/>
  <text class="num" x="44" y="85">4</text><text class="num" x="80" y="85">2</text><text class="num" x="116" y="85">8</text>
  <text class="num" x="152" y="85">3</text><text class="num" x="188" y="85">1</text><text class="num" x="224" y="85">7</text>
  <text class="num" x="260" y="85">6</text><text class="num" x="296" y="85">9</text><text class="num" x="332" y="85">5</text>
  <text class="lab2" x="24" y="132">✗ 把第 7 格手滑写成 5：同一行立刻出现两个 5</text>
  <rect class="cell" x="24" y="140" width="324" height="36"/>
  <rect class="hlc" x="240" y="140" width="36" height="36"/>
  <rect class="hlc" x="312" y="140" width="36" height="36"/>
  <g class="gl"><line x1="60" y1="140" x2="60" y2="176"/><line x1="96" y1="140" x2="96" y2="176"/><line x1="132" y1="140" x2="132" y2="176"/><line x1="168" y1="140" x2="168" y2="176"/><line x1="204" y1="140" x2="204" y2="176"/><line x1="240" y1="140" x2="240" y2="176"/><line x1="276" y1="140" x2="276" y2="176"/><line x1="312" y1="140" x2="312" y2="176"/></g>
  <rect class="st" x="24" y="140" width="324" height="36"/>
  <text class="num" x="44" y="165">4</text><text class="num" x="80" y="165">2</text><text class="num" x="116" y="165">8</text>
  <text class="num" x="152" y="165">3</text><text class="num" x="188" y="165">1</text><text class="num" x="224" y="165">7</text>
  <text class="num" x="260" y="165">5</text><text class="num" x="296" y="165">9</text><text class="num" x="332" y="165">5</text>
  <text class="lab" x="372" y="85">9 个数字、9 个格 →</text>
  <text class="lab" x="372" y="104">只要不重复，就一定 1–9 齐全。</text>
  <text class="lab" x="372" y="160">重复一个 5，就等于同时丢了 5 之外的</text>
  <text class="lab" x="372" y="179">某个数（这里丢的是 6）→ 后面必然填不下。</text>
  <text class="lab2" x="24" y="212">自查动作：每填一个数，眼睛立刻沿它所在的行、列、宫各扫一遍，确认没有第二个它。</text>
  <text class="lab2" x="24" y="232">这个动作每天做几十次，前 10 题会觉得烦，10 题以后就变成本能了。</text>
</svg>