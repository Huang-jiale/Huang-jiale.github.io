<svg viewBox="0 0 760 300" role="img" aria-label="局部盘第1到6行，宫4被高亮，第4行和第6行的8把宫4里的四格堵住，只剩第五行第二列" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
  <rect class="bg-paper" width="760" height="300"/>
  <text class="labk" x="24" y="20">第 1 次出手：盯住数字 8，问宫 4（黄色 3×3）</text>
  <text class="lab2" x="266" y="156">R4</text><text class="lab2" x="266" y="182">R5</text><text class="lab2" x="266" y="208">R6</text>
  <rect class="cell" x="24" y="60" width="234" height="156"/>
  <rect class="hl" x="24" y="138" width="78" height="78"/>
  <rect class="hlc" x="180" y="138" width="26" height="26"/>
  <rect class="hlc" x="154" y="190" width="26" height="26"/>
  <rect class="hlb" x="50" y="164" width="26" height="26"/>
  <g class="gl">
    <line x1="50" y1="60" x2="50" y2="216"/><line x1="76" y1="60" x2="76" y2="216"/>
    <line x1="128" y1="60" x2="128" y2="216"/><line x1="154" y1="60" x2="154" y2="216"/>
    <line x1="206" y1="60" x2="206" y2="216"/><line x1="232" y1="60" x2="232" y2="216"/>
    <line x1="24" y1="86" x2="258" y2="86"/><line x1="24" y1="112" x2="258" y2="112"/>
    <line x1="24" y1="138" x2="258" y2="138"/><line x1="24" y1="164" x2="258" y2="164"/>
    <line x1="24" y1="190" x2="258" y2="190"/>
  </g>
  <g class="gl-h"><line x1="102" y1="60" x2="102" y2="216"/><line x1="180" y1="60" x2="180" y2="216"/><line x1="24" y1="138" x2="258" y2="138"/></g>
  <rect class="st" x="24" y="60" width="234" height="156"/>
  <text class="num" x="33" y="78">4</text><text class="num" x="163" y="78">7</text><text class="num" x="241" y="78">5</text>
  <text class="num" x="189" y="104">1</text><text class="num" x="215" y="104">7</text>
  <text class="num" x="33" y="130">5</text><text class="num" x="111" y="130">9</text><text class="num" x="137" y="130">8</text><text class="num" x="163" y="130">6</text><text class="num" x="241" y="130">4</text>
  <text class="num" x="33" y="156">2</text><text class="num" x="137" y="156">9</text><text class="num" x="189" y="156">8</text><text class="num" x="215" y="156">6</text>
  <text class="num" x="33" y="182">9</text><text class="num" x="85" y="182">4</text><text class="num" x="137" y="182">6</text><text class="num" x="163" y="182">1</text><text class="num" x="189" y="182">7</text>
  <text class="num" x="85" y="208">5</text><text class="num" x="111" y="208">7</text><text class="num" x="163" y="208">8</text><text class="num" x="241" y="208">9</text>
  <line class="st-red" x1="193" y1="151" x2="120" y2="175"/>
  <line class="st-red" x1="167" y1="203" x2="120" y2="175"/>
  <circle class="dot" cx="63" cy="177" r="4.5"/>
  <text class="lab" x="300" y="70">宫 4 已有的数：2（左上）、9（左中）、</text>
  <text class="lab" x="300" y="90">4（中右）、5（右下）→ 8 还没进这个宫。</text>
  <text class="lab2" x="300" y="118">红底的两格是宫 4 外面的两个 8：</text>
  <text class="lab2" x="300" y="136">第 4 行那个在 R4C7，第 6 行那个在 R6C6，</text>
  <text class="lab2" x="300" y="156">它们各占住一行，把宫 4 的对应行封死。</text>
  <text class="lab" x="300" y="186">两条红线把 R4C2、R4C3、R6C1、R6C2</text>
  <text class="lab" x="300" y="206">四格全部堵死 → 宫 4 里 8 只剩蓝格一格。</text>
  <text class="labk" x="300" y="238">结论：R5C2 = 8。写下去，不用犹豫。</text>
  <text class="lab2" x="300" y="262">这就是「宫内三向」的标准形态：宫内缺它，</text>
  <text class="lab2" x="300" y="280">外面两行（或两列）各有一个它，把它夹成唯一。</text>
</svg>