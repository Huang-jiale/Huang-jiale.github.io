<svg viewBox="0 0 760 236" role="img" aria-label="反例图：宫 5 的两格候选都是 2 和 3，两种问法都给不出结论，不该填" xmlns="http://www.w3.org/2000/svg" width="760" height="236"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
  <rect class="bg-paper" width="760" height="236"/>
  <text class="labk" x="24" y="22">反例：剩两个候选不是结论（宫 5，第 13 步之后）</text>
  <rect class="cell" x="24" y="40" width="120" height="120"/>
  <g class="gl"><line x1="64" y1="40" x2="64" y2="160"/><line x1="104" y1="40" x2="104" y2="160"/><line x1="24" y1="80" x2="144" y2="80"/><line x1="24" y1="120" x2="144" y2="120"/></g>
  <rect class="st" x="24" y="40" width="120" height="120"/>
  <text class="num" x="44" y="66" text-anchor="middle">5</text><text class="num" x="84" y="66" text-anchor="middle">9</text><text class="num" x="124" y="66" text-anchor="middle">4</text>
  <text class="num" x="84" y="106" text-anchor="middle">6</text><text class="num" x="124" y="106" text-anchor="middle">1</text>
  <text class="num" x="44" y="146" text-anchor="middle">7</text><text class="num" x="124" y="146" text-anchor="middle">8</text>
  <text class="cand" x="30" y="95">2</text><text class="cand" x="43" y="95">3</text>
  <text class="cand" x="83" y="135">2</text><text class="cand" x="96" y="135">3</text>
  <text class="lab2" x="24" y="208">空格 2 个，候选各 2 个，两格内容完全一样。</text>
  <text class="lab" x="24" y="228">问宫 5 的 2 → 只剩这两格；问 3 → 也只剩这两格。</text>
  <text class="lab" x="176" y="60">格视角：R5C4 允许 2、3 → 不作结论；</text>
  <text class="lab" x="176" y="80">R6C5 允许 2、3 → 同样不作结论。</text>
  <text class="lab2" x="176" y="112">数视角：宫 5 的 2 可站 R5C4、R6C5（两格）；</text>
  <text class="lab2" x="176" y="132">宫 5 的 3 可站同样这两格（两格）。</text>
  <text class="labk" x="176" y="162">四种问法全部落空 → 这一宫现在没戏，走开。</text>
  <text class="lab2" x="176" y="186">它们在例题 A 里要等别的数字先落位才被拆开。</text>
</svg>