<svg viewBox="0 0 760 200" role="img" aria-label="对照图：左边宫4的8只剩一格可填属于唯一，右边宫9的7还剩两格可去属于待定" xmlns="http://www.w3.org/2000/svg" width="760" height="200"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
  <rect class="bg-paper" width="760" height="200"/>
  <text class="labk" x="24" y="22">「剩 1 格」才填，「剩 2 格以上」只记不填</text>
  <text class="lab2" x="24" y="52">✓ 宫 4（第 1 步之前）：8 只剩 1 格</text>
  <rect class="cell" x="24" y="60" width="120" height="120"/>
  <g class="gl"><line x1="64" y1="60" x2="64" y2="180"/><line x1="104" y1="60" x2="104" y2="180"/><line x1="24" y1="100" x2="144" y2="100"/><line x1="24" y1="140" x2="144" y2="140"/></g>
  <rect class="st" x="24" y="60" width="120" height="120"/>
  <rect class="hlc" x="64" y="60" width="40" height="40"/><rect class="hlc" x="104" y="60" width="40" height="40"/>
  <rect class="hlc" x="24" y="140" width="40" height="40"/><rect class="hlc" x="64" y="140" width="40" height="40"/>
  <rect class="hlb" x="64" y="100" width="40" height="40"/>
  <text class="num" x="34" y="88">2</text><text class="num" x="34" y="128">9</text><text class="num" x="114" y="128">4</text><text class="num" x="114" y="168">5</text>
  <text class="num" x="74" y="128">8</text>
  <text class="lab2" x="172" y="80">红底四格被外面两个 8 堵死，</text>
  <text class="lab2" x="172" y="98">中格（蓝底）唯一 → 填 8。</text>
  <text class="lab" x="172" y="140">这是可以写下去的「唯一」。</text>
  <text class="lab2" x="420" y="52">✗ 宫 9（开局）：7 还剩 2 格可去</text>
  <rect class="cell" x="420" y="60" width="120" height="120"/>
  <g class="gl"><line x1="460" y1="60" x2="460" y2="180"/><line x1="500" y1="60" x2="500" y2="180"/><line x1="420" y1="100" x2="540" y2="100"/><line x1="420" y1="140" x2="540" y2="140"/></g>
  <rect class="st" x="420" y="60" width="120" height="120"/>
  <text class="cand" x="514" y="126">7</text><text class="cand" x="514" y="166">7</text>
  <text class="lab2" x="556" y="80">两格都还没被堵住，</text>
  <text class="lab2" x="556" y="98">宫内一个已知数也没有，</text>
  <text class="lab" x="556" y="126">此时正确动作是：跳过。</text>
  <text class="lab2" x="556" y="148">第 9 步填了 R8C5=7，</text>
  <text class="lab2" x="556" y="166">第 8 行被封 → 唯一剩 R9C9。</text>
  <text class="lab2" x="24" y="196">两张小图都只画了宫的 3×3 九格，</text>
  <text class="lab2" x="420" y="196">格内小数 = 「这个数还能来这格」的记号。</text>
</svg>