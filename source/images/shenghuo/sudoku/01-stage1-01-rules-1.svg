<svg viewBox="0 0 760 300" role="img" aria-label="数独盘面结构：高亮第4行、第7列与宫5，并标出宫1到宫9的编号" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
  <rect class="bg-paper" width="760" height="300"/>
  <text class="labk" x="24" y="16">同一个盘，三种看法：行、列、宫</text>
  <text class="lab2" x="37" y="31" text-anchor="middle">C1</text>
<text class="lab2" x="63" y="31" text-anchor="middle">C2</text>
<text class="lab2" x="89" y="31" text-anchor="middle">C3</text>
<text class="lab2" x="115" y="31" text-anchor="middle">C4</text>
<text class="lab2" x="141" y="31" text-anchor="middle">C5</text>
<text class="lab2" x="167" y="31" text-anchor="middle">C6</text>
<text class="lab2" x="193" y="31" text-anchor="middle">C7</text>
<text class="lab2" x="219" y="31" text-anchor="middle">C8</text>
<text class="lab2" x="245" y="31" text-anchor="middle">C9</text>
  <rect class="cell" x="24" y="34" width="234" height="234"/>
  <rect class="hl" x="24" y="112" width="234" height="26"/>
  <rect class="hlc" x="180" y="34" width="26" height="234"/>
  <rect class="hlb" x="102" y="112" width="78" height="78"/>
  <g class="gl">
    <line x1="50" y1="34" x2="50" y2="268"/><line x1="76" y1="34" x2="76" y2="268"/>
    <line x1="128" y1="34" x2="128" y2="268"/><line x1="154" y1="34" x2="154" y2="268"/>
    <line x1="206" y1="34" x2="206" y2="268"/><line x1="232" y1="34" x2="232" y2="268"/>
    <line x1="24" y1="60" x2="258" y2="60"/><line x1="24" y1="86" x2="258" y2="86"/>
    <line x1="24" y1="138" x2="258" y2="138"/><line x1="24" y1="164" x2="258" y2="164"/>
    <line x1="24" y1="216" x2="258" y2="216"/><line x1="24" y1="242" x2="258" y2="242"/>
  </g>
  <g class="gl-h">
    <line x1="102" y1="34" x2="102" y2="268"/><line x1="180" y1="34" x2="180" y2="268"/>
    <line x1="24" y1="112" x2="258" y2="112"/><line x1="24" y1="190" x2="258" y2="190"/>
  </g>
  <rect class="st" x="24" y="34" width="234" height="234"/>
  <text class="labk" x="63" y="73" text-anchor="middle">宫1</text>
  <text class="labk" x="141" y="73" text-anchor="middle">宫2</text>
  <text class="labk" x="219" y="73" text-anchor="middle">宫3</text>
  <text class="labk" x="63" y="151" text-anchor="middle">宫4</text>
  <text class="labk" x="141" y="151" text-anchor="middle">宫5</text>
  <text class="labk" x="219" y="151" text-anchor="middle">宫6</text>
  <text class="labk" x="63" y="229" text-anchor="middle">宫7</text>
  <text class="labk" x="141" y="229" text-anchor="middle">宫8</text>
  <text class="labk" x="219" y="229" text-anchor="middle">宫9</text>
  <text class="lab2" x="264" y="51">R1</text>
<text class="lab2" x="264" y="77">R2</text>
<text class="lab2" x="264" y="103">R3</text>
<text class="lab2" x="264" y="129">R4</text>
<text class="lab2" x="264" y="155">R5</text>
<text class="lab2" x="264" y="181">R6</text>
<text class="lab2" x="264" y="207">R7</text>
<text class="lab2" x="264" y="233">R8</text>
<text class="lab2" x="264" y="259">R9</text>      <text class="lab" x="324" y="55">黄色 = 第 4 行（9 格）</text>
  <text class="lab" x="324" y="78">红色 = 第 7 列（9 格）</text>
  <text class="lab" x="324" y="101">蓝色 = 宫 5（3×3 = 9 格）</text>
  <circle class="dot" cx="193" cy="125" r="4.5"/>
  <text class="lab" x="324" y="145">红点那格 = R4C7：</text>
  <text class="lab2" x="324" y="166">它同时在第 4 行、第 7 列、宫 6 里。</text>
  <text class="lab2" x="324" y="188">每个格都同时属于「一行 + 一列 + 一宫」，</text>
  <text class="lab2" x="324" y="206">所以填一个数要同时过三道检查，一道都不能漏。</text>
  <text class="lab2" x="324" y="240">粗线只用来分宫：每 3 行 3 列一个宫，</text>
  <text class="lab2" x="324" y="258">看到粗线围住的 9 格，就要想到它也是一个单位。</text>
</svg>