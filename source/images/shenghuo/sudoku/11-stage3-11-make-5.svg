<svg viewBox="0 0 760 430" role="img" aria-label="180度中心对称挖洞示意，一对称点用高亮显示" xmlns="http://www.w3.org/2000/svg" width="760" height="430"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
    <rect class="bg-paper" width="760" height="430"/>
    <text class="labk" x="30" y="25">180° 中心对称：R2C1 与 R8C9 是同进同退的一对</text>
    <rect x="30" y="40" width="360" height="360" fill="#ffffff" stroke="none"/>
    <line class="grid" x1="70" y1="40" x2="70" y2="400"/><line class="grid" x1="110" y1="40" x2="110" y2="400"/><line class="grid" x1="150" y1="40" x2="150" y2="400"/><line class="grid" x1="190" y1="40" x2="190" y2="400"/><line class="grid" x1="230" y1="40" x2="230" y2="400"/><line class="grid" x1="270" y1="40" x2="270" y2="400"/><line class="grid" x1="310" y1="40" x2="310" y2="400"/><line class="grid" x1="350" y1="40" x2="350" y2="400"/><line class="grid" x1="30" y1="80" x2="390" y2="80"/><line class="grid" x1="30" y1="120" x2="390" y2="120"/><line class="grid" x1="30" y1="160" x2="390" y2="160"/><line class="grid" x1="30" y1="200" x2="390" y2="200"/><line class="grid" x1="30" y1="240" x2="390" y2="240"/><line class="grid" x1="30" y1="280" x2="390" y2="280"/><line class="grid" x1="30" y1="320" x2="390" y2="320"/><line class="grid" x1="30" y1="360" x2="390" y2="360"/>
    <line class="grid-h" x1="150" y1="40" x2="150" y2="400" stroke-width="2"/><line class="grid-h" x1="270" y1="40" x2="270" y2="400" stroke-width="2"/><line class="grid-h" x1="30" y1="160" x2="390" y2="160" stroke-width="2"/><line class="grid-h" x1="30" y1="280" x2="390" y2="280" stroke-width="2"/>
    <rect x="30" y="80" width="40" height="40" fill="#e8f0fe" stroke="#1565c0" stroke-width="2.5"/>
    <rect x="350" y="360" width="40" height="40" fill="#e8f0fe" stroke="#1565c0" stroke-width="2.5"/>
    <circle cx="210" cy="220" r="4" fill="#c5221f"/>
    <path d="M50 100 Q 210 220 370 380" fill="none" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="5 4"/>
    <rect class="st" x="30" y="40" width="360" height="360" fill="none" stroke-width="2"/>
    <text class="lab" x="410" y="60">读图要点：</text>
    <text class="lab2" x="410" y="88">蓝框 = 一对待保留的已知数</text>
    <text class="lab2" x="410" y="110">红点 = 中心（第 5 行第 5 列）</text>
    <text class="lab2" x="410" y="132">虚线 = 两格连线，穿中心</text>
    <text class="lab2" x="410" y="170">R2C1 和 R8C9 是 180° 的一对。</text>
    <text class="lab2" x="410" y="192">要么两格都留数字，要么两格</text>
    <text class="lab2" x="410" y="214">一起挖空——不能只留一个，</text>
    <text class="lab2" x="410" y="236">否则题面就失去对称美。</text>
    <text class="lab2" x="410" y="272">对称本身不改变合法性，</text>
    <text class="lab2" x="410" y="294">唯一解检查器一铲一铲照样跑。</text>
  </svg>