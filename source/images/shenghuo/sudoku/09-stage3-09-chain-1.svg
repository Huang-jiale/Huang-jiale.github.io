<svg viewBox="0 0 760 300" role="img" aria-label="对比图：上面是强关系两个必居其一，下面是弱关系两个不能同时在" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
  <rect class="bg-paper" width="760" height="300"/>
  <text class="labk" x="28" y="30">上：强关系（某数在一条行里只剩两格）</text>
  <text class="lab2" x="28" y="48">A、B 至少一真</text>
  <rect class="hl" x="60" y="60" width="24" height="24"/>
  <text class="labk" x="60" y="102">A</text>
  <rect class="cell" x="124" y="60" width="24" height="24"/>
  <rect class="cell" x="188" y="60" width="24" height="24"/>
  <rect class="cell" x="252" y="60" width="24" height="24"/>
  <rect class="hl" x="316" y="60" width="24" height="24"/>
  <text class="labk" x="316" y="102">B</text>
  <line class="arrow" x1="86" y1="72" x2="314" y2="72"/>
  <text class="lab2" x="176" y="54">强：不是 A 就是 B</text>
  <text class="labk" x="28" y="168">下：弱关系（同格里的两个候选数）</text>
  <text class="lab2" x="28" y="186">X、Y 不能同在，但可能都不在</text>
  <rect class="hlc" x="60" y="206" width="24" height="24"/>
  <text class="labk" x="60" y="248">X</text>
  <line class="st-thin" x1="86" y1="218" x2="152" y2="218"/>
  <rect class="hlc" x="154" y="206" width="24" height="24"/>
  <text class="labk" x="154" y="248">Y</text>
  <text class="lab2" x="240" y="222">弱：是 X 就否 Y，反之不成立</text>
  <text class="lab2" x="240" y="244">强＝至少一真；弱＝至多一真</text>
</svg>