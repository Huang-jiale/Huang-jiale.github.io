<svg viewBox="0 0 760 250" role="img" aria-label="宫3×3的合法与非法对照：错误版本里出现两个4" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
  <rect class="bg-paper" width="760" height="250"/>
  <text class="labk" x="24" y="22">检查一个宫：粗线框里的 9 格同样不许重复</text>
  <text class="lab2" x="24" y="52">✓ 宫 1 填满：1–9 各一次</text>
  <rect class="cell" x="24" y="60" width="156" height="156"/>
  <g class="gl"><line x1="76" y1="60" x2="76" y2="216"/><line x1="128" y1="60" x2="128" y2="216"/><line x1="24" y1="112" x2="180" y2="112"/><line x1="24" y1="164" x2="180" y2="164"/></g>
  <rect class="st" x="24" y="60" width="156" height="156"/>
  <text class="num" x="44" y="92">4</text><text class="num" x="96" y="92">2</text><text class="num" x="148" y="92">8</text>
  <text class="num" x="44" y="144">6</text><text class="num" x="96" y="144">9</text><text class="num" x="148" y="144">3</text>
  <text class="num" x="44" y="196">5</text><text class="num" x="96" y="196">7</text><text class="num" x="148" y="196">1</text>
  <text class="lab2" x="230" y="52">✗ 中间那格把 9 写成 4：宫内两个 4</text>
  <rect class="cell" x="230" y="60" width="156" height="156"/>
  <rect class="hlc" x="282" y="112" width="52" height="52"/>
  <g class="gl"><line x1="282" y1="60" x2="282" y2="216"/><line x1="334" y1="60" x2="334" y2="216"/><line x1="230" y1="112" x2="386" y2="112"/><line x1="230" y1="164" x2="386" y2="164"/></g>
  <rect class="st" x="230" y="60" width="156" height="156"/>
  <text class="num" x="250" y="92">4</text><text class="num" x="302" y="92">2</text><text class="num" x="354" y="92">8</text>
  <text class="num" x="250" y="144">6</text><text class="num" x="302" y="144">4</text><text class="num" x="354" y="144">3</text>
  <text class="num" x="250" y="196">5</text><text class="num" x="302" y="196">7</text><text class="num" x="354" y="196">1</text>
  <text class="lab" x="412" y="92">新手最常犯的三种重复：</text>
  <text class="lab2" x="412" y="114">① 只看行、忘了宫（宫是最容易被忽略的单位）；</text>
  <text class="lab2" x="412" y="134">② 只看眼前这一块，没看整列；</text>
  <text class="lab2" x="412" y="154">③ 填得太快，没有回头复查。</text>
  <text class="lab" x="412" y="186">左上图就是本题第 1 宫的最终填法，</text>
  <text class="lab2" x="412" y="206">它是合法的一个宫：1–9 各出现一次。</text>
  <text class="lab2" x="24" y="238">结论：行、列、宫三个方向的检查等级完全相同，哪个漏了都会把整题带崩。</text>
</svg>