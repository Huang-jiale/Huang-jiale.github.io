<svg viewBox="0 0 760 330" role="img" aria-label="四格六节点简单交错链，强弱交替，两端都是数5" xmlns="http://www.w3.org/2000/svg" width="760" height="330"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
  <rect class="bg-paper" width="760" height="330"/>
  <text class="labk" x="28" y="24">四格链：强弱强弱，两端都是数 5</text>
  <rect class="hl" x="120" y="56" width="24" height="24"/>
  <text class="cand" x="120" y="94">{5,2}</text>
  <text class="labk" x="120" y="48">r1c2</text>
  <text class="lab2" x="120" y="112">端</text>
  <rect class="cell" x="430" y="56" width="24" height="24"/>
  <text class="cand" x="430" y="94">{5,7}</text>
  <text class="labk" x="430" y="48">r1c6</text>
  <line class="st" x1="146" y1="68" x2="430" y2="68"/>
  <text class="lab2" x="255" y="60">强 5·第1行</text>
  <text class="lab2" x="400" y="112">拐弯5/7</text>
  <line class="st" x1="442" y1="82" x2="442" y2="250"/>
  <text class="lab2" x="456" y="170">强 7·第6列</text>
  <rect class="cell" x="430" y="250" width="24" height="24"/>
  <text class="cand" x="430" y="288">{5,7}</text>
  <text class="labk" x="430" y="242">r7c6</text>
  <text class="lab2" x="470" y="262">拐弯7/5</text>
  <line class="st" x1="146" y1="262" x2="430" y2="262"/>
  <text class="lab2" x="255" y="246">强 5·第7行</text>
  <rect class="hl" x="120" y="250" width="24" height="24"/>
  <text class="cand" x="120" y="288">{5,8}</text>
  <text class="labk" x="120" y="242">r7c2</text>
  <text class="lab2" x="120" y="306">端</text>
  <rect class="hlc" x="120" y="150" width="24" height="24"/>
  <text class="cand" x="120" y="188">{5,3}</text>
  <text class="labk" x="120" y="142">r3c2 删5</text>
  <text class="lab2" x="156" y="175">同在第2列</text>
  <text class="lab" x="560" y="120">两端 r1c2、r7c2</text>
  <text class="lab" x="560" y="142">都是 5，至少中一个</text>
  <text class="labk" x="560" y="164">删 r3c2 的 5</text>
  <text class="lab2" x="560" y="186">链两端本身不删</text>
  <text class="lab2" x="560" y="208">粗实线＝强，格内拐弯＝弱</text>
</svg>