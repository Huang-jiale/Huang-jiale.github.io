<svg viewBox="0 0 760 230" role="img" aria-label="用计数器复查：数字7已有七个、数字8已有四个、数字3还是零个" xmlns="http://www.w3.org/2000/svg" width="760" height="230"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
  <rect class="bg-paper" width="760" height="230"/>
  <text class="labk" x="24" y="22">复查计数器：每个数字都要凑满 9 个</text>
  <text class="lab" x="24" y="56">数字 7：</text>
  <g class="st">
    <circle cx="150" cy="51" r="11"/><circle cx="180" cy="51" r="11"/><circle cx="210" cy="51" r="11"/><circle cx="240" cy="51" r="11"/><circle cx="270" cy="51" r="11"/>
    <circle cx="300" cy="51" r="11"/><circle cx="330" cy="51" r="11"/>
  </g>
  <g class="st-thin"><circle cx="360" cy="51" r="11"/><circle cx="390" cy="51" r="11"/></g>
  <text class="num" x="145" y="56">7</text><text class="num" x="175" y="56">7</text><text class="num" x="205" y="56">7</text><text class="num" x="235" y="56">7</text><text class="num" x="265" y="56">7</text><text class="num" x="295" y="56">7</text><text class="num" x="325" y="56">7</text>
  <text class="lab" x="430" y="56">7 已经落在下面这 7 格，虚线圈是还没定的 2 个：</text>
  <text class="lab2" x="430" y="78">R1C6、R2C8、R5C7、R6C4、R7C1、R8C5、R9C9</text>
  <text class="lab" x="24" y="100">数字 8：</text>
  <g class="st">
    <circle cx="150" cy="95" r="11"/><circle cx="180" cy="95" r="11"/><circle cx="210" cy="95" r="11"/><circle cx="240" cy="95" r="11"/>
  </g>
  <g class="st-thin"><circle cx="270" cy="95" r="11"/><circle cx="300" cy="95" r="11"/><circle cx="330" cy="95" r="11"/><circle cx="360" cy="95" r="11"/><circle cx="390" cy="95" r="11"/></g>
  <text class="num" x="145" y="100">8</text><text class="num" x="175" y="100">8</text><text class="num" x="205" y="100">8</text><text class="num" x="235" y="100">8</text>
  <text class="lab2" x="430" y="100">已定位 4 个（3 个是题面给的，第 4 个即 R5C2</text>
  <text class="lab2" x="430" y="120">是本课第 1 步扫出来的）；虚线圈是还差的 5 个。</text>
  <text class="lab" x="24" y="150">对照数字 3：此刻 0 个 —— 稀缺不等于填不出来，只是排除线还没交叉到。</text>
  <text class="lab" x="24" y="178">两种异常，都用计数器抓：</text>
  <text class="lab2" x="24" y="200">① 一个数字数出 10 个 → 一定填重了，立刻回查是哪两格、它们同属哪个单位；</text>
  <text class="lab2" x="24" y="222">② 只剩 1 格没填，但行、列、宫都不许它进 → 早几步就填错了，别在这格纠结。</text>
</svg>