<svg viewBox="0 0 760 220" role="img" aria-label="鱼形技巧家族对照" xmlns="http://www.w3.org/2000/svg" width="760" height="220"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
    <rect class="bg-paper" width="760" height="220"/>
    <text class="labk" x="30" y="30">鱼家族：基线数 = 覆盖线数 = 阶</text>
    <rect class="cell" x="40" y="52" width="200" height="140"/>
    <rect class="hl" x="40" y="52" width="200" height="60"/>
    <text class="labk" x="60" y="86">X-Wing（2 阶）</text>
    <text class="lab2" x="60" y="104">2 基线 · 删 2 覆盖线</text>
    <text class="lab" x="60" y="150">最常见，几乎每道中难题都有</text>
    <text class="lab2" x="60" y="172">例：本课数字 1</text>
    <rect class="cell" x="270" y="52" width="200" height="140"/>
    <rect class="hl" x="270" y="52" width="200" height="90"/>
    <text class="labk" x="290" y="86">Swordfish（3 阶）</text>
    <text class="lab2" x="290" y="104">3 基线 · 删 3 覆盖线</text>
    <text class="lab" x="290" y="150">三阶鱼，删数面更大</text>
    <text class="lab2" x="290" y="172">例：本课数字 2</text>
    <rect class="cell" x="500" y="52" width="220" height="140"/>
    <rect class="hl" x="500" y="52" width="220" height="120"/>
    <text class="labk" x="520" y="86">Jellyfish（4 阶）</text>
    <text class="lab2" x="520" y="104">4 基线 · 删 4 覆盖线</text>
    <text class="lab" x="520" y="150">四阶水母，盘面很难再塞进手算</text>
    <text class="lab2" x="520" y="172">思路完全同前两阶</text>
  </svg>