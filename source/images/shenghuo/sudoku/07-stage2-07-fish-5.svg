<svg viewBox="0 0 760 240" role="img" aria-label="列基 X-Wing 示意：数字只落在两列的同两行" xmlns="http://www.w3.org/2000/svg" width="760" height="240"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
    <rect class="bg-paper" width="760" height="240"/>
    <text class="labk" x="30" y="32">对称读法：基线换成列，删数方向就换成行</text>
    <rect class="cell" x="60" y="52" width="52" height="52"/>
    <rect class="hl" x="60" y="104" width="52" height="52"/>
    <rect class="cell" x="60" y="156" width="52" height="52"/>
    <rect class="hl" x="112" y="104" width="52" height="52"/>
    <rect class="cell" x="164" y="52" width="52" height="52"/>
    <rect class="cell" x="164" y="156" width="52" height="52"/>
    <text class="num" x="79" y="138" style="fill:#c0392b">d</text>
    <text class="num" x="131" y="138" style="fill:#c0392b">d</text>
    <line class="st-red" x1="180" y1="70" x2="220" y2="70"/>
    <line class="st-red" x1="180" y1="178" x2="220" y2="178"/>
    <text class="lab2" x="228" y="74">这一行的其它 d，删</text>
    <text class="lab2" x="228" y="182">这一行的其它 d，删</text>
    <text class="lab" x="360" y="112">条件：某两列里，d 都只落在同一对行（黄色两格所在的两行）。</text>
    <text class="lab" x="360" y="140">结论：这两行里、除四角外的 d 一律划掉。</text>
    <text class="lab2" x="360" y="170">判断技巧：先扫行看有没有鱼，没有就把盘"竖过来"扫列，两者是同一件事。</text>
  </svg>