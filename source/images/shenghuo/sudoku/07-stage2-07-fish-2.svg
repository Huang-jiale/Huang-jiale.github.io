<svg viewBox="0 0 760 250" role="img" aria-label="假鱼警示：多出一个落点矩形就不成立" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
    <rect class="bg-paper" width="760" height="250"/>
    <text class="labk" x="30" y="30">真伪一线之隔：多一个落点，鱼就没了</text>
    <rect class="cell" x="120" y="56" width="52" height="52"/>
    <rect class="hl" x="172" y="56" width="52" height="52"/>
    <rect class="cell" x="224" y="56" width="52" height="52"/>
    <rect class="cell" x="276" y="56" width="52" height="52"/>
    <rect class="hl" x="328" y="56" width="52" height="52"/>
    <rect class="cell" x="120" y="108" width="52" height="52"/>
    <rect class="hl" x="172" y="108" width="52" height="52"/>
    <rect class="cell" x="224" y="108" width="52" height="52"/>
    <rect class="cell" x="276" y="108" width="52" height="52"/>
    <rect class="hl" x="328" y="108" width="52" height="52"/>
    <text class="cand" x="196" y="87">7</text>
    <text class="cand" x="352" y="87">7</text>
    <text class="cand" x="248" y="87" fill="#c0392b">7</text>
    <text class="cand" x="196" y="139">7</text>
    <text class="cand" x="352" y="139">7</text>
    <text class="lab2" x="60" y="90">基行1</text>
    <text class="lab2" x="60" y="142">基行2</text>
    <line class="st-bad" x1="240" y1="64" x2="270" y2="100"/>
    <text class="lab" x="410" y="86">基行1 里，数字 7 除了 B、H 两列，</text>
    <text class="lab" x="410" y="108">D 列又冒出一个（红叉）——</text>
    <text class="lab" x="410" y="130">两行的落点列集合不再相同。</text>
    <text class="labk" x="410" y="168">这不是鱼，一个都不能删！</text>
    <text class="lab2" x="410" y="196">动手前，务必确认每行除两角外再无该数字。</text>
  </svg>