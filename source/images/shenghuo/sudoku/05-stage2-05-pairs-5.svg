    <text class="cand" x="424" y="64">{2,5,8}</text>
    <text class="lab2" x="40" y="140">两格都含 2、5，但第 2 格还挂着 7、第 6 格还挂着 8。</text>
    <text class="lab2" x="430" y="140">7 和 8 随时可能落进这两格，位置没被占死。</text>
    <rect class="cell" x="40" y="158" width="66" height="66"/>
