    <text class="cand" x="120" y="174">{2,5}</text>
    <text class="cand" x="424" y="174">{2,5}</text>
    <text class="lab" x="40" y="254">候选表被压到只剩 {2,5}、{2,5}，数对才算成形，才可以动删的手。</text>
    <text class="lab2" x="40" y="278">判断只看一点：这两格里除了 2 和 5，还有没有别的数字活着？</text>
  </svg>