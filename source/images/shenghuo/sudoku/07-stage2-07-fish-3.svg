<svg viewBox="0 0 760 250" role="img" aria-label="X-Wing 概念示意：数字只落在两行的同两列，构成矩形" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
    <rect class="bg-paper" width="760" height="250"/>
    <text class="labk" x="30" y="34">X-Wing 的本质：一个数字在"两行"里都只剩"同两列"</text>
    <text class="lab2" x="30" y="56">基行 R5、R6 里，数字 d 的位置被牢牢钉在 B、H 两列上</text>
    <rect class="cell" x="250" y="78" width="60" height="60"/>
    <rect class="hl" x="310" y="78" width="60" height="60"/>
    <rect class="cell" x="370" y="78" width="60" height="60"/>
    <rect class="cell" x="430" y="78" width="60" height="60"/>
    <rect class="cell" x="490" y="78" width="60" height="60"/>
    <rect class="hl" x="550" y="78" width="60" height="60"/>
    <rect class="hl" x="310" y="138" width="60" height="60"/>
    <rect class="cell" x="250" y="138" width="60" height="60"/>
    <rect class="cell" x="370" y="138" width="60" height="60"/>
    <rect class="cell" x="430" y="138" width="60" height="60"/>
    <rect class="cell" x="490" y="138" width="60" height="60"/>
    <rect class="hl" x="550" y="138" width="60" height="60"/>
    <text class="num" x="333" y="115" style="fill:#c0392b">d</text>
    <text class="num" x="573" y="115" style="fill:#c0392b">d</text>
    <text class="num" x="333" y="175" style="fill:#c0392b">d</text>
    <text class="num" x="573" y="175" style="fill:#c0392b">d</text>
    <text class="lab2" x="30" y="112">R5</text>
    <text class="lab2" x="30" y="172">R6</text>
    <line class="st-thin" x1="340" y1="198" x2="340" y2="230"/>
    <line class="st-thin" x1="580" y1="198" x2="580" y2="230"/>
    <text class="lab" x="250" y="245">这两列里，除矩形四角外的所有 d 都要删掉</text>
  </svg>