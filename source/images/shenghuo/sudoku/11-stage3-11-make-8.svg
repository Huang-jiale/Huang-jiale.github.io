<svg viewBox="0 0 760 280" role="img" aria-label="完整挖洞循环：挑格→挖→跑检查器→留或回退→下一对" xmlns="http://www.w3.org/2000/svg" width="760" height="280"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
    <rect class="bg-paper" width="760" height="280"/>
    <defs><marker id="ar4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6 Z" fill="#666"/></marker></defs>
    <text class="labk" x="20" y="26">挖洞主循环（对称版）</text>
    <rect x="20" y="46" width="150" height="36" rx="6" fill="#eef3fa" stroke="#4b6b8b"/>
    <text class="lab" x="95" y="68" text-anchor="middle">起：完整终盘 SOL</text>
    <path d="M170 64 H210" stroke="#666" stroke-width="1.5" marker-end="url(#ar4)"/>
    <rect x="212" y="46" width="150" height="36" rx="6" fill="#fef7e0" stroke="#e08a2e"/>
    <text class="lab" x="287" y="60" text-anchor="middle">挑一对 180°</text>
    <text class="lab2" x="287" y="76" text-anchor="middle">对称未挖格</text>
    <path d="M362 64 H402" stroke="#666" stroke-width="1.5" marker-end="url(#ar4)"/>
    <rect x="404" y="46" width="150" height="36" rx="6" fill="#e6f4ea" stroke="#2e7d32"/>
    <text class="lab" x="479" y="60" text-anchor="middle">同时挖掉两格</text>
    <text class="lab2" x="479" y="76" text-anchor="middle">得到候选盘</text>
    <path d="M554 64 H594" stroke="#666" stroke-width="1.5" marker-end="url(#ar4)"/>
    <rect x="596" y="46" width="150" height="36" rx="6" fill="#f3e8fd" stroke="#7b3fb0"/>
    <text class="lab" x="671" y="68" text-anchor="middle">跑唯一解检查器</text>
    <path d="M671 82 V126" stroke="#666" stroke-width="1.5" marker-end="url(#ar4)"/>
    <rect x="500" y="130" width="246" height="36" rx="6" fill="#e6f4ea" stroke="#2e7d32"/>
    <text class="lab2" x="623" y="146" text-anchor="middle">若 = 1：接受这铲，进入下一对</text>
    <text class="lab2" x="623" y="162" text-anchor="middle">若 ≥ 2 或 0：还原这两格</text>
    <path d="M623 166 V210" stroke="#666" stroke-width="1.5" marker-end="url(#ar4)"/>
    <rect x="420" y="214" width="326" height="36" rx="6" fill="#eef3fa" stroke="#4b6b8b"/>
    <text class="lab2" x="583" y="230" text-anchor="middle">终止：所有未挖对都已尝试</text>
    <text class="lab2" x="583" y="246" text-anchor="middle">（或线索数已达目标线）</text>
    <text class="lab2" x="20" y="120">要点：</text>
    <text class="lab2" x="20" y="140">每一对都走"挑→挖→查→收/回"四步；</text>
    <text class="lab2" x="20" y="158">回退时两格一起还原，</text>
    <text class="lab2" x="20" y="176">这样对称永远不被破坏。</text>
  </svg>