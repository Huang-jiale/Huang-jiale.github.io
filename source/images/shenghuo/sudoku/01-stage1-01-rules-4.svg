  <text class="lab2" x="24" y="288">小灰点 = 空格占位符（印刷体里就是空白）</text>
  <text class="lab" x="324" y="60">先只做三件事，别急着填数：</text>
  <text class="lab2" x="324" y="84">① 数一数已知数：第 1 行有 4、7、5 三个，</text>
  <text class="lab2" x="324" y="102">第 5 行有 9、4、6、1、7 五个 → 行越满越好下手。</text>
  <text class="lab2" x="324" y="126">② 找最满的宫：宫 4（左中）已有 2、9、4、5，</text>
  <text class="lab2" x="324" y="144">宫 5（正中）已有 9、6、7、8、1 → 这两宫是突破口。</text>
  <text class="lab2" x="324" y="168">③ 红格 R5C2 是本章的示范格：</text>
  <text class="lab2" x="324" y="186">它在第 5 行、第 2 列、宫 4 的交汇处，</text>
  <text class="lab2" x="324" y="204">下一节就用它来说「候选数」。</text>
  <text class="lab2" x="324" y="236">读题面的正确顺序：先看哪一行/列/宫最满，</text>
  <text class="lab2" x="324" y="254">再看数字 1 到 9 谁出现得最多——而不是从左上角第一格开始想。</text>
