<svg viewBox="0 0 760 160" role="img" aria-label="45法则示意：一行九格之和为45" xmlns="http://www.w3.org/2000/svg" width="760" height="160"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
    <rect class="bg-paper" width="760" height="160"/>
    <text class="labk" x="20" y="26">45 法则：任何一整行都是 1–9，和 = 45</text>
    <rect x="20" y="40" width="52" height="52" fill="#ffffff"/><rect x="72" y="40" width="52" height="52" fill="#ffffff"/><rect x="124" y="40" width="52" height="52" fill="#ffffff"/><rect x="176" y="40" width="52" height="52" fill="#ffffff"/><rect x="228" y="40" width="52" height="52" fill="#ffffff"/><rect x="280" y="40" width="52" height="52" fill="#ffffff"/><rect x="332" y="40" width="52" height="52" fill="#ffffff"/><rect x="384" y="40" width="52" height="52" fill="#ffffff"/><rect x="436" y="40" width="52" height="52" fill="#ffffff"/>
    <text class="num" text-anchor="middle" x="46" y="76">7</text><text class="num" text-anchor="middle" x="98" y="76">8</text><text class="num" text-anchor="middle" x="150" y="76">4</text><text class="num" text-anchor="middle" x="202" y="76">1</text><text class="num" text-anchor="middle" x="254" y="76">6</text><text class="num" text-anchor="middle" x="306" y="76">5</text><text class="num" text-anchor="middle" x="358" y="76">9</text><text class="num" text-anchor="middle" x="410" y="76">3</text><text class="num" text-anchor="middle" x="462" y="76">2</text>
    <rect class="st" x="20" y="40" width="468" height="52" fill="none" stroke-width="1.5"/>
    <text class="lab" x="500" y="70">7+8+4+1+6+5+9+3+2</text>
    <text class="lab2" x="500" y="92">= 45（1 到 9 求和公式）</text>
    <text class="lab2" x="20" y="128">用法：数一行内所有笼提示之和，缺的差额落在跨行的笼口上，就能定那一格。</text>
  </svg>