<svg viewBox="0 0 760 205" role="img" aria-label="对照图：左半边一格内九个候选数被划掉八个只剩三，右半边第三行的数字一只剩一格可站" xmlns="http://www.w3.org/2000/svg" width="760" height="205"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
  <rect class="bg-paper" width="760" height="205"/>
  <text class="labk" x="24" y="22">两种唯一的标准长相（左边看一格，右边看一行）</text>
  <text class="lab" x="24" y="46">格视角：R4C2 还能填谁？</text>
  <rect class="cell" x="24" y="56" width="72" height="72"/>
  <rect class="hlb" x="24" y="56" width="72" height="72"/>
  <rect class="st" x="24" y="56" width="72" height="72"/>
  <text class="cand" x="36" y="82">1</text><text class="cand" x="58" y="82">2</text><text class="cand" x="80" y="82">3</text>
  <text class="cand" x="36" y="104">4</text><text class="cand" x="58" y="104">5</text><text class="cand" x="80" y="104">6</text>
  <text class="cand" x="36" y="126">7</text><text class="cand" x="58" y="126">8</text><text class="cand" x="80" y="126">9</text>
  <line class="st-red" x1="33" y1="79" x2="43" y2="85"/><line class="st-red" x1="55" y1="79" x2="65" y2="85"/>
  <line class="st-red" x1="33" y1="101" x2="43" y2="107"/><line class="st-red" x1="55" y1="101" x2="65" y2="107"/><line class="st-red" x1="77" y1="101" x2="87" y2="107"/>
  <line class="st-red" x1="33" y1="123" x2="43" y2="129"/><line class="st-red" x1="55" y1="123" x2="65" y2="129"/><line class="st-red" x1="77" y1="123" x2="87" y2="129"/>
  <text class="lab2" x="112" y="80">8 个被划掉：</text>
  <text class="lab2" x="112" y="98">同行、同列、同宫里</text>
  <text class="lab2" x="112" y="116">它们都已经出现过。</text>
  <text class="labk" x="112" y="146">→ 唯一候选数：R4C2 = 3</text>
  <text class="lab" x="300" y="46">数视角：数字 1 能在第 3 行的哪一格？</text>
  <rect class="cell" x="300" y="56" width="360" height="40"/>
  <rect class="hlb" x="380" y="56" width="40" height="40"/>
  <g class="gl">
    <line x1="340" y1="56" x2="340" y2="96"/><line x1="380" y1="56" x2="380" y2="96"/><line x1="420" y1="56" x2="420" y2="96"/>
    <line x1="460" y1="56" x2="460" y2="96"/><line x1="500" y1="56" x2="500" y2="96"/><line x1="540" y1="56" x2="540" y2="96"/><line x1="580" y1="56" x2="580" y2="96"/>
    <line x1="620" y1="56" x2="620" y2="96"/>
  </g>
  <rect class="st" x="300" y="56" width="360" height="40"/>
  <text class="num" x="320" y="82" text-anchor="middle">5</text><text class="num" x="440" y="82" text-anchor="middle">9</text>
  <text class="num" x="480" y="82" text-anchor="middle">8</text><text class="num" x="520" y="82" text-anchor="middle">6</text>
  <text class="num" x="640" y="82" text-anchor="middle">4</text><text class="num" x="400" y="82" text-anchor="middle">1</text>
  <circle class="dot" cx="360" cy="76" r="4.5"/><circle class="dot" cx="560" cy="76" r="4.5"/><circle class="dot" cx="600" cy="76" r="4.5"/>
  <text class="lab2" x="300" y="122">空格只有 4 个（红点 = 1 进不去，蓝格 = 唯一）</text>
  <text class="labk" x="300" y="146">→ 隐性唯一数：R3C3 = 1</text>
  <text class="lab2" x="300" y="172">R3C3 自己还允许 2、3、7 —— 这不妨碍 1 必须落在这里。</text>
  <text class="lab2" x="24" y="192">左边那格是第 04 节要推的 R4C2，先看结论长相。</text>
</svg>