<svg viewBox="0 0 760 400" role="img" aria-label="W-Wing 例题：两个同数双值格被列上的强链拴住" xmlns="http://www.w3.org/2000/svg" width="760" height="400"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
<rect class="bg-paper" width="760" height="400"/>
<text class="labk" x="24" y="32">W-Wing 例题：同数对 + 一条强链</text>
<rect class="hl" x="80" y="80" width="64" height="64"/>
<rect class="st" x="80" y="80" width="64" height="64"/>
<text class="cand" x="90" y="110">4</text><text class="cand" x="112" y="110">7</text>
<text class="lab2" x="112" y="164" text-anchor="middle">B2</text>
<rect class="st" x="240" y="80" width="64" height="64"/>
<text class="cand" x="250" y="110">4</text><text class="cand" x="272" y="110">9</text>
<text class="lab2" x="272" y="164" text-anchor="middle">D2</text>
<rect class="hlb" x="400" y="80" width="64" height="64"/>
<rect class="st" x="400" y="80" width="64" height="64"/>
<text class="cand" x="410" y="110">1</text><text class="cand" x="432" y="110">7</text>
<line class="st-bad" x1="429" y1="102" x2="441" y2="114"/>
<text class="lab2" x="432" y="164" text-anchor="middle">H2</text>
<rect class="hlb" x="80" y="260" width="64" height="64"/>
<rect class="st" x="80" y="260" width="64" height="64"/>
<text class="cand" x="90" y="290">3</text><text class="cand" x="112" y="290">7</text>
<line class="st-bad" x1="109" y1="282" x2="121" y2="294"/>
<text class="lab2" x="112" y="344" text-anchor="middle">B6</text>
<rect class="st" x="240" y="260" width="64" height="64"/>
<text class="cand" x="250" y="290">1</text><text class="cand" x="272" y="290">4</text>
<text class="lab2" x="272" y="344" text-anchor="middle">D6</text>
<rect class="hl" x="400" y="260" width="64" height="64"/>
<rect class="st" x="400" y="260" width="64" height="64"/>
<text class="cand" x="410" y="290">4</text><text class="cand" x="432" y="290">7</text>
<text class="lab2" x="432" y="344" text-anchor="middle">H6</text>
<line class="st-thin" x1="144" y1="112" x2="240" y2="112"/>
<line class="st-thin" x1="304" y1="292" x2="400" y2="292"/>
<line class="st-thin" x1="112" y1="144" x2="112" y2="260"/>
<line class="st-thin" x1="432" y1="144" x2="432" y2="260"/>
<line class="arrow" x1="272" y1="144" x2="272" y2="260"/>
<text class="lab2" x="168" y="98">同第 2 行</text>
<text class="lab2" x="330" y="278">同第 6 行</text>
<text class="lab2" x="118" y="200">同列</text>
<text class="lab2" x="438" y="200">同列</text>
<text class="lab2" x="282" y="204">列 D 里 4 只剩两格：强链</text>
<text class="labk" x="510" y="64">W-Wing 三件套</text>
<text class="lab" x="510" y="96">支点 B2 = {4,7}</text>
<text class="lab" x="510" y="122">支点 H6 = {4,7}</text>
<text class="lab" x="510" y="148">两支点互不相见</text>
<text class="lab" x="510" y="180">强链：列 D 的 4 只在 D2、D6</text>
<text class="lab" x="510" y="206">删的是另一个数 7</text>
<text class="lab" x="510" y="238">若 H2 填 7，则 B2 = 4</text>
<text class="lab" x="510" y="264">于是 D2 不能是 4，D6 = 4</text>
<text class="lab" x="510" y="290">于是 H6 不能是 4，只能 7</text>
<text class="lab" x="510" y="316">H2 与 H6 同列，两个 7 撞车</text>
<text class="lab" x="510" y="348">所以蓝格里的 7 划掉</text>
</svg>