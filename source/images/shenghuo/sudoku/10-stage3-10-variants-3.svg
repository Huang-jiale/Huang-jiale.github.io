    <text class="lab" x="410" y="60">读图要点：</text>
    <text class="lab2" x="410" y="88">· 同色 9 格 = 一个宫，</text>
    <text class="lab2" x="410" y="110">  每个宫仍要 1–9 各一。</text>
    <text class="lab2" x="410" y="140">· 粗黑线是宫的边界，</text>
    <text class="lab2" x="410" y="162">  它把标准 3×3 方块</text>
    <text class="lab2" x="410" y="184">  彻底打乱成歪形状。</text>
    <text class="lab2" x="410" y="214">· 本图只画"形状"，</text>
    <text class="lab2" x="410" y="236">  不是带解的题面。</text>
    <text class="lab2" x="410" y="270">推理上的代价：每次做</text>
    <text class="lab2" x="410" y="292">宫内排除，都要先重认</text>
    <text class="lab2" x="410" y="314">这块地到底含哪 9 个格。</text>
