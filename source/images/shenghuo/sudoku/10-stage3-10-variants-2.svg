    <text class="num" text-anchor="middle" x="50" y="105">.</text><text class="num" text-anchor="middle" x="90" y="105">4</text><text class="num" text-anchor="middle" x="130" y="105">.</text><text class="num" text-anchor="middle" x="170" y="105">.</text><text class="num" text-anchor="middle" x="210" y="105">3</text><text class="num" text-anchor="middle" x="250" y="105">.</text><text class="num" text-anchor="middle" x="290" y="105">.</text><text class="num" text-anchor="middle" x="330" y="105">.</text><text class="num" text-anchor="middle" x="370" y="105">5</text>
