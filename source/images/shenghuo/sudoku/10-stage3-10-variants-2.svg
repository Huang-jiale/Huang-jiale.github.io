    <text class="num" text-anchor="middle" x="50" y="185">.</text><text class="num" text-anchor="middle" x="90" y="185">.</text><text class="num" text-anchor="middle" x="130" y="185">.</text><text class="num" text-anchor="middle" x="170" y="185">.</text><text class="num" text-anchor="middle" x="210" y="185">6</text><text class="num" text-anchor="middle" x="250" y="185">.</text><text class="num" text-anchor="middle" x="290" y="185">.</text><text class="num" text-anchor="middle" x="330" y="185">8</text><text class="num" text-anchor="middle" x="370" y="185">.</text>
    <text class="num" text-anchor="middle" x="50" y="225">.</text><text class="num" text-anchor="middle" x="90" y="225">9</text><text class="num" text-anchor="middle" x="130" y="225">.</text><text class="num" text-anchor="middle" x="170" y="225">.</text><text class="num" text-anchor="middle" x="210" y="225">.</text><text class="num" text-anchor="middle" x="250" y="225">.</text><text class="num" text-anchor="middle" x="290" y="225">4</text><text class="num" text-anchor="middle" x="330" y="225">6</text><text class="num" text-anchor="middle" x="370" y="225">.</text>
    <text class="num" text-anchor="middle" x="50" y="265">2</text><text class="num" text-anchor="middle" x="90" y="265">.</text><text class="num" text-anchor="middle" x="130" y="265">.</text><text class="num" text-anchor="middle" x="170" y="265">.</text><text class="num" text-anchor="middle" x="210" y="265">.</text><text class="num" text-anchor="middle" x="250" y="265">.</text><text class="num" text-anchor="middle" x="290" y="265">.</text><text class="num" text-anchor="middle" x="330" y="265">.</text><text class="num" text-anchor="middle" x="370" y="265">.</text>
    <text class="num" text-anchor="middle" x="50" y="305">.</text><text class="num" text-anchor="middle" x="90" y="305">.</text><text class="num" text-anchor="middle" x="130" y="305">.</text><text class="num" text-anchor="middle" x="170" y="305">5</text><text class="num" text-anchor="middle" x="210" y="305">.</text><text class="num" text-anchor="middle" x="250" y="305">.</text><text class="num" text-anchor="middle" x="290" y="305">.</text><text class="num" text-anchor="middle" x="330" y="305">.</text><text class="num" text-anchor="middle" x="370" y="305">.</text>
    <text class="num" text-anchor="middle" x="50" y="345">7</text><text class="num" text-anchor="middle" x="90" y="345">.</text><text class="num" text-anchor="middle" x="130" y="345">.</text><text class="num" text-anchor="middle" x="170" y="345">.</text><text class="num" text-anchor="middle" x="210" y="345">1</text><text class="num" text-anchor="middle" x="250" y="345">8</text><text class="num" text-anchor="middle" x="290" y="345">.</text><text class="num" text-anchor="middle" x="330" y="345">5</text><text class="num" text-anchor="middle" x="370" y="345">2</text>
    <text class="num" text-anchor="middle" x="50" y="385">3</text><text class="num" text-anchor="middle" x="90" y="385">.</text><text class="num" text-anchor="middle" x="130" y="385">.</text><text class="num" text-anchor="middle" x="170" y="385">.</text><text class="num" text-anchor="middle" x="210" y="385">.</text><text class="num" text-anchor="middle" x="250" y="385">.</text><text class="num" text-anchor="middle" x="290" y="385">.</text><text class="num" text-anchor="middle" x="330" y="385">.</text><text class="num" text-anchor="middle" x="370" y="385">1</text>
    <text class="lab" x="410" y="60">对角线怎么帮你排除：</text>
    <text class="lab2" x="410" y="90">· 某格在主对角线上，</text>
    <text class="lab2" x="410" y="110">  它就不能再和该对角</text>
    <text class="lab2" x="410" y="130">  线上已有的数字重复。</text>
    <text class="lab2" x="410" y="164">· 一个数在宫内只剩两格，</text>
    <text class="lab2" x="410" y="184">  若其中一格落在对角线，</text>
    <text class="lab2" x="410" y="204">  对角线上的同数会踢掉它。</text>
    <text class="lab2" x="410" y="240">把对角线当成"额外的</text>
    <text class="lab2" x="410" y="260">第十、第十一条线"来扫。</text>
  </svg>