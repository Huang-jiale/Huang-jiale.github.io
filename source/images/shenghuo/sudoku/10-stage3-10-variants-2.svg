 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
    <rect class="bg-paper" width="760" height="430"/>
    <text class="labk" x="30" y="25">对角线数独 · 淡黄高亮即两条主对角线</text>
    <rect x="30" y="40" width="360" height="360" fill="#ffffff" stroke="none"/>
    <rect x="30" y="40" width="40" height="40" fill="#fdf0d0"/><rect x="30" y="360" width="40" height="40" fill="#fdf0d0"/><rect x="70" y="80" width="40" height="40" fill="#fdf0d0"/><rect x="70" y="320" width="40" height="40" fill="#fdf0d0"/><rect x="110" y="120" width="40" height="40" fill="#fdf0d0"/><rect x="110" y="280" width="40" height="40" fill="#fdf0d0"/><rect x="150" y="160" width="40" height="40" fill="#fdf0d0"/><rect x="150" y="240" width="40" height="40" fill="#fdf0d0"/><rect x="190" y="200" width="40" height="40" fill="#fdf0d0"/><rect x="230" y="240" width="40" height="40" fill="#fdf0d0"/><rect x="230" y="160" width="40" height="40" fill="#fdf0d0"/><rect x="270" y="280" width="40" height="40" fill="#fdf0d0"/><rect x="270" y="120" width="40" height="40" fill="#fdf0d0"/><rect x="310" y="320" width="40" height="40" fill="#fdf0d0"/><rect x="310" y="80" width="40" height="40" fill="#fdf0d0"/><rect x="350" y="360" width="40" height="40" fill="#fdf0d0"/><rect x="350" y="40" width="40" height="40" fill="#fdf0d0"/>
