<svg viewBox="0 0 760 300" role="img" aria-label="第7行显性数对2和5，删掉第1格和第6格的相关候选数" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
    <rect class="bg-paper" width="760" height="300"/>
    <text class="labk" x="40" y="32">例2：第 7 行里的显性数对</text>
    <text class="lab2" x="236" y="32">黄底两格 = 数对</text>
    <rect class="cell" x="40" y="60" width="66" height="66"/>
    <rect class="cell" x="116" y="60" width="66" height="66"/>
    <rect class="cell" x="192" y="60" width="66" height="66"/>
    <rect class="cell" x="268" y="60" width="66" height="66"/>
    <rect class="hl" x="268" y="60" width="66" height="66"/>
    <rect class="cell" x="344" y="60" width="66" height="66"/>
    <rect class="cell" x="420" y="60" width="66" height="66"/>
    <rect class="cell" x="496" y="60" width="66" height="66"/>
    <rect class="hl" x="496" y="60" width="66" height="66"/>
    <rect class="cell" x="572" y="60" width="66" height="66"/>
    <rect class="cell" x="648" y="60" width="66" height="66"/>
    <text class="num" x="73" y="104">.</text>
    <text class="num" x="149" y="104">.</text>
    <text class="num" x="225" y="104">4</text>
    <text class="num" x="301" y="104">.</text>
    <text class="num" x="377" y="104">.</text>
    <text class="num" x="453" y="104">.</text>
    <text class="num" x="529" y="104">.</text>
    <text class="num" x="605" y="104">.</text>
    <text class="num" x="681" y="104">7</text>
    <text class="cand" x="44" y="77">{1,2,5}</text>
    <text class="cand" x="120" y="77">{3,6}</text>
    <text class="cand" x="272" y="77">{2,5}</text>
    <text class="cand" x="344" y="77">{3,6}</text>
    <text class="cand" x="424" y="77">{5,8}</text>
    <text class="cand" x="500" y="77">{2,5}</text>
    <text class="cand" x="576" y="77">{1,9}</text>
    <line class="st" x1="68" y1="73" x2="83" y2="73"/>
    <line class="st" x1="86" y1="73" x2="101" y2="73"/>
    <line class="st" x1="430" y1="73" x2="445" y2="73"/>
    <text class="lab" x="40" y="170">因为第 4 格与第 7 格都只剩 {2,5}，2 和 5 只能在这两格里二选一。</text>
    <text class="lab" x="40" y="196">所以第 1 格划掉 2 和 5、第 6 格划掉 5（短横线处），其它格同理清扫。</text>
    <text class="lab" x="40" y="222">删完第 1 格只剩一个候选 1，第 6 格只剩一个候选 8，两格当场落数。</text>
    <text class="lab" x="40" y="248">连锁还没完：1 已落进第 1 格，所以第 8 格的候选 1 也消失，只剩 9。</text>
    <text class="lab2" x="40" y="274">一条数对，最后推出了三个格的数。</text>
  </svg>