<svg viewBox="0 0 760 300" role="img" aria-label="第一列竖条图：四个空格中只有第六行第一列能放一，其余三格被第二行的一和第八行的一堵住" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
  <rect class="bg-paper" width="760" height="300"/>
  <text class="labk" x="24" y="20">第 1 列竖起来看：1 只剩一格（蓝底）</text>
  <rect class="cell" x="24" y="34" width="26" height="234"/>
  <rect class="hlc" x="24" y="60" width="26" height="26"/>
  <rect class="hlc" x="24" y="216" width="26" height="26"/>
  <rect class="hlc" x="24" y="242" width="26" height="26"/>
  <rect class="hlb" x="24" y="164" width="26" height="26"/>
  <g class="gl"><line x1="24" y1="60" x2="50" y2="60"/><line x1="24" y1="86" x2="50" y2="86"/><line x1="24" y1="138" x2="50" y2="138"/><line x1="24" y1="164" x2="50" y2="164"/><line x1="24" y1="216" x2="50" y2="216"/><line x1="24" y1="242" x2="50" y2="242"/></g>
  <g class="gl-h"><line x1="24" y1="112" x2="50" y2="112"/><line x1="24" y1="190" x2="50" y2="190"/></g>
  <rect class="st" x="24" y="34" width="26" height="234"/>
  <text class="num" x="37" y="52" text-anchor="middle">4</text>
  <text class="num" x="37" y="78" text-anchor="middle">.</text>
  <text class="num" x="37" y="104" text-anchor="middle">5</text>
  <text class="num" x="37" y="130" text-anchor="middle">2</text>
  <text class="num" x="37" y="156" text-anchor="middle">9</text>
  <text class="num" x="37" y="182" text-anchor="middle">1</text>
  <text class="num" x="37" y="208" text-anchor="middle">7</text>
  <text class="num" x="37" y="234" text-anchor="middle">.</text>
  <text class="num" x="37" y="260" text-anchor="middle">.</text>
  <text class="lab2" x="16" y="73" text-anchor="end">R2</text><text class="lab2" x="16" y="233" text-anchor="end">R8</text><text class="lab2" x="16" y="259" text-anchor="end">R9</text>
  <text class="lab" x="80" y="70">R2C1 出局：第 2 行的 1 在 R2C7。</text>
  <text class="lab" x="80" y="224">R8C1 出局：第 8 行的 1 在 R8C2。</text>
  <text class="lab" x="80" y="250">R9C1 出局：宫 7 的 1 也在 R8C2。</text>
  <text class="labk" x="80" y="182">R6C1 = 1 ｜ 第 1 列里 1 的唯一落脚点</text>
  <text class="lab2" x="80" y="120">这一列还缺的 3、6、8 分别有 4 格、2 格、3 格可去，</text>
  <text class="lab2" x="80" y="140">所以本列此刻只有 1 给出结论：数视角一次只问一个数。</text>
  <text class="lab2" x="80" y="266">同一格还捎带解决了宫 4：R3C3 填 1 之后，宫 4 的 1 也只能站 R6C1。</text>
  <text class="lab2" x="80" y="286">竖排看图的要点：把一列单独抄出来，比在盘上斜着数容易得多。</text>
</svg>