<svg viewBox="0 0 760 150" role="img" aria-label="不等号数独局部，相邻格之间的方向符号" xmlns="http://www.w3.org/2000/svg" width="760" height="150"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
    <rect class="bg-paper" width="760" height="150"/>
    <text class="labk" x="20" y="26">不等号（尖角指向较小的一侧）</text>
    <rect x="20" y="45" width="60" height="60" fill="#ffffff"/><rect x="140" y="45" width="60" height="60" fill="#ffffff"/><rect x="260" y="45" width="60" height="60" fill="#ffffff"/><rect x="380" y="45" width="60" height="60" fill="#ffffff"/>
    <text class="num" text-anchor="middle" x="50" y="83">3</text><text class="num" text-anchor="middle" x="170" y="83">6</text><text class="num" text-anchor="middle" x="290" y="83">9</text><text class="num" text-anchor="middle" x="410" y="83">2</text>
    <text x="110" y="83" text-anchor="middle" class="lab" style="font-size:22px">&lt;</text>
    <text x="230" y="83" text-anchor="middle" class="lab" style="font-size:22px">&lt;</text>
    <text x="350" y="83" text-anchor="middle" class="lab" style="font-size:22px">&gt;</text>
    <text class="lab" x="460" y="72">读法：3 &lt; 6 &lt; 9 &gt; 2。</text>
    <text class="lab2" x="460" y="96">符号只管相邻两格大小，</text>
    <text class="lab2" x="460" y="118">不替代行列宫规则。</text>
  </svg>