<svg viewBox="0 0 760 210" role="img" aria-label="扫描流程图：选定数字后依次检查宫、行、列三个方向，只剩一个位置就填" xmlns="http://www.w3.org/2000/svg" width="760" height="210"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
  <rect class="bg-paper" width="760" height="210"/>
  <text class="labk" x="24" y="22">一轮扫描的固定动作（记住这个顺序，别今天换明天换）</text>
  <rect class="hl" x="24" y="46" width="130" height="40"/>
  <text class="lab" x="89" y="71" text-anchor="middle">① 选定一个数字</text>
  <line class="arrow" x1="154" y1="66" x2="184" y2="66"/>
  <polygon class="arrow" points="184,61 196,66 184,71"/>
  <rect class="hlb" x="198" y="46" width="150" height="40"/>
  <text class="lab" x="273" y="64" text-anchor="middle">② 逐宫问：这个宫里，</text>
  <text class="lab" x="273" y="80" text-anchor="middle">它还能站在哪几格？</text>
  <line class="arrow" x1="348" y1="66" x2="378" y2="66"/>
  <polygon class="arrow" points="378,61 390,66 378,71"/>
  <rect class="f-g1" x="392" y="46" width="158" height="40"/>
  <text class="lab" x="471" y="64" text-anchor="middle">③ 用同行的数、同列的数</text>
  <text class="lab" x="471" y="80" text-anchor="middle">去堵宫内剩下的格</text>
  <line class="arrow" x1="550" y1="66" x2="580" y2="66"/>
  <polygon class="arrow" points="580,61 592,66 580,71"/>
  <rect class="hl" x="596" y="46" width="140" height="40"/>
  <text class="labk" x="666" y="64" text-anchor="middle">剩 1 格 → 填！</text>
  <text class="lab2" x="666" y="80" text-anchor="middle">剩 ≥2 格 → 记下，换下一个宫</text>
  <text class="lab2" x="24" y="118">9 个宫问完，再把 9 行、9 列各问一遍（同一数字）；然后换下一个数字，从 2 问到 9。</text>
  <text class="lab2" x="24" y="140">一轮问完 = 9 个数字 × 27 个单位（9 宫 + 9 行 + 9 列）= 243 次提问，全程只数落脚点，不推链条。</text>
  <text class="lab" x="24" y="170"><tspan>填进一个新数，就等于在全盘新增了 3 个「堵路者」：它所在的行、列、宫各多一个数。</tspan></text>
  <text class="labk" x="24" y="192">所以填完任何一格，都要回头重扫一遍——旧题面里「还剩两个位置」的宫，现在可能就只剩一个了。</text>
</svg>