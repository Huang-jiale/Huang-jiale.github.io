<svg viewBox="0 0 760 260" role="img" aria-label="局部盘里两个互不同宫不同行列的空格候选都是3或7，构成双解废题" xmlns="http://www.w3.org/2000/svg" width="760" height="260"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .grid{stroke:#c9c4ba;stroke-width:1;fill:none}
 .grid-h{stroke:#1c1c1c;stroke-width:2;fill:none}
 .cell{fill:#fff}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:8.6px;fill:#6f6f6f}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .mid{font-size:17px;fill:#1c1c1c}</style>
  <rect class="bg-paper" width="760" height="260"/>
  <text class="labk" x="24" y="22">反面教材：只剩两个空格，候选数一模一样 → 两个解</text>
  <rect class="f-g1" x="24" y="52" width="240" height="144"/>
  <g class="gl"><line x1="72" y1="52" x2="72" y2="196"/><line x1="120" y1="52" x2="120" y2="196"/><line x1="168" y1="52" x2="168" y2="196"/><line x1="216" y1="52" x2="216" y2="196"/><line x1="24" y1="100" x2="264" y2="100"/><line x1="24" y1="148" x2="264" y2="148"/></g>
  <rect class="cell" x="24" y="52" width="48" height="48"/>
  <rect class="cell" x="168" y="148" width="48" height="48"/>
  <rect class="st" x="24" y="52" width="240" height="144"/>
  <text class="cand" x="56" y="74">3</text><text class="cand" x="36" y="92">7</text>
  <text class="cand" x="200" y="170">3</text><text class="cand" x="180" y="188">7</text>
  <text class="lab2" x="24" y="216">灰格 = 其余 79 格都已填好；只放大这两格附近。</text>
  <text class="lab2" x="24" y="234">白格是剩下两个空格：一个在 R1C1（宫1），</text>
<text class="lab2" x="24" y="252">另一个在 R3C4（宫2）。</text>
  <text class="lab" x="324" y="60">这两格不同行、不同列、不同宫，</text>
  <text class="lab" x="324" y="80">互相管不着，却都只能填 3 或 7。</text>
  <text class="lab2" x="324" y="108">于是有两种填法：① 前者 3 后者 7；② 前者 7 后者 3。</text>
  <text class="lab2" x="324" y="126">两种填完，全盘每行每列每宫都仍然合规 →</text>
  <text class="labk" x="324" y="152">这题就有两个解，是废题。</text>
  <text class="lab2" x="324" y="180">正规出题软件会在「挖掉某个已知数导致多解」时</text>
  <text class="lab2" x="324" y="198">立刻停手，把那个已知数留下，把唯一性堵回去。</text>
  <text class="lab" x="324" y="228">给你的实用结论：做到最后两格如果候选数完全相同，</text>
  <text class="lab" x="324" y="246">别硬填——回头查前面是不是填错了一格。</text>
</svg>