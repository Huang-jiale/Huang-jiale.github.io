<text class="lab2" x="424" y="196">马腿被别住</text>
<text class="lab" x="14" y="692">四个红点是空跳点，朝下的两个被宫心里的黑士别住马腿：吃不到士，也照不着将。</text>
<text class="lab" x="14" y="714">结论：单马永远将不死光杆老将；象同理，田心一有子就飞不过去（塞象眼）。</text>
