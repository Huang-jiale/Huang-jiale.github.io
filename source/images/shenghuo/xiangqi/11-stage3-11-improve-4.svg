<text class="lab2" x="334" y="452">车六进三吃炮</text>
<text class="lab2" x="150" y="150">马3进4 吃回</text>
<text class="lab" x="14" y="666">黑炮正被红车照住：中间两格全空，直着就吃得到。</text>
<text class="lab" x="14" y="690">可这颗炮有黑马护着——马走「日」字正好踩到炮这一格，马腿那一格是空的。</text>
<text class="lab" x="14" y="712">车换炮红方净亏（车比炮贵，见第 4 课价值表），这就是贪子失先。</text>
