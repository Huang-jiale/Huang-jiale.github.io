<svg viewBox="0 0 760 300" role="img" aria-label="每周训练时间条形图：杀法练习 60 分钟、慢棋 40 分钟、复盘 25 分钟、残局题 30 分钟，合计 155 分钟" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
.cell-g{fill:#f2efe8}
.sq{fill:#f7f0df}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
 .pc-r{fill:#fff8f0;stroke:#c0392b;stroke-width:1.8}
.pc-b{fill:#f7f7f7;stroke:#1c1c1c;stroke-width:1.8}
 .pc-tr{font-size:15px;fill:#c0392b;font-weight:700}
.pc-tb{font-size:15px;fill:#1c1c1c;font-weight:700}
 .star{fill:#1c1c1c}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}
 .big{font-size:22px;fill:#1c1c1c}</style>
<rect class="bg-paper" width="760" height="300"/>
<text class="labk" x="380" y="28" text-anchor="middle" style="font-size:16px">每周 155 分钟怎么分</text>
<line x1="170" y1="58" x2="170" y2="212" stroke="#1c1c1c" stroke-width="1.2"/>
<text class="lab" x="14" y="80">杀法练习 3 次</text><rect x="170" y="66" width="120" height="18" fill="#d8ecd9" stroke="#2f7d42" stroke-width="1.2"/><text class="lab2" x="298" y="80">60 分钟</text>
<text class="lab" x="14" y="120">慢棋 1 盘</text><rect x="170" y="106" width="80" height="18" fill="#dde8f4" stroke="#0f6ab5" stroke-width="1.2"/><text class="lab2" x="258" y="120">40 分钟</text>
<text class="lab" x="14" y="160">复盘 1 次</text><rect x="170" y="146" width="50" height="18" fill="#f7d5d5" stroke="#c0392b" stroke-width="1.2"/><text class="lab2" x="228" y="160">25 分钟</text>
<text class="lab" x="14" y="200">残局题 2 次</text><rect x="170" y="186" width="60" height="18" fill="#ffe9a8" stroke="#b58b00" stroke-width="1.2"/><text class="lab2" x="238" y="200">30 分钟</text>
<text class="labk" x="170" y="236">合计 60 + 40 + 25 + 30 = 155 分钟</text>
<text class="lab2" x="14" y="266">条形按 1 分钟等于 2 像素画；单次坐下最长只有慢棋那一盘，其余每次都不超过 25 分钟。</text>
</svg>