<text class="lab2" x="14" y="660">图下是红方路数（从红方右手起一…九），图上是黑方路数（从黑方右手起 1…9）。</text>
<text class="lab" x="14" y="690">轮到黑走。黑车占住这条竖线，中间没有子挡；红马走进来正好落在车口里，红方另一颗子护不住它。</text>
<text class="lab" x="14" y="712">问题不在计划好不好，而在落点本身被直吃——第 04 节的第二类错因。</text>
