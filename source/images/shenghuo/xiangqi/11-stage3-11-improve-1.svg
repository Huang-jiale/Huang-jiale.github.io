<svg viewBox="0 0 760 300" role="img" aria-label="复盘五步流程图：记录棋谱、标出三步、自己想、再对照、归类错因，下面标出每步时间预算" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
.cell-g{fill:#f2efe8}
.sq{fill:#f7f0df}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
 .pc-r{fill:#fff8f0;stroke:#c0392b;stroke-width:1.8}
.pc-b{fill:#f7f7f7;stroke:#1c1c1c;stroke-width:1.8}
 .pc-tr{font-size:15px;fill:#c0392b;font-weight:700}
.pc-tb{font-size:15px;fill:#1c1c1c;font-weight:700}
 .star{fill:#1c1c1c}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}
 .big{font-size:22px;fill:#1c1c1c}</style>
<rect class="bg-paper" width="760" height="300"/>
<text class="labk" x="380" y="28" text-anchor="middle" style="font-size:16px">五步走完，一步都不省</text>
<rect class="st" x="32" y="60" width="120" height="68" rx="8" fill="#f7f4ee"/><text class="labk" x="92" y="88" text-anchor="middle">①记录棋谱</text><text class="lab2" x="92" y="108" text-anchor="middle">顺手记用时</text>
<rect class="st" x="178" y="60" width="120" height="68" rx="8" fill="#f7f4ee"/><text class="labk" x="238" y="88" text-anchor="middle">②标三步</text><text class="lab2" x="238" y="108" text-anchor="middle">最没把握的</text>
<rect class="st" x="324" y="60" width="120" height="68" rx="8" fill="#f7f4ee"/><text class="labk" x="384" y="88" text-anchor="middle">③自己想</text><text class="lab2" x="384" y="108" text-anchor="middle">先不看引擎</text>
<rect class="st" x="470" y="60" width="120" height="68" rx="8" fill="#f7f4ee"/><text class="labk" x="530" y="88" text-anchor="middle">④再对照</text><text class="lab2" x="530" y="108" text-anchor="middle">引擎或棋友</text>
<rect class="st" x="616" y="60" width="120" height="68" rx="8" fill="#f7f4ee"/><text class="labk" x="676" y="88" text-anchor="middle">⑤归错因</text><text class="lab2" x="676" y="108" text-anchor="middle">写两行进本子</text>
<path class="arrow" d="M152 94H176"/><path class="arrow" d="M165 89.5L176 94L165 98.5"/>
<path class="arrow" d="M298 94H322"/><path class="arrow" d="M311 89.5L322 94L311 98.5"/>
<path class="arrow" d="M444 94H468"/><path class="arrow" d="M457 89.5L468 94L457 98.5"/>
<path class="arrow" d="M590 94H614"/><path class="arrow" d="M603 89.5L614 94L603 98.5"/>
<text class="lab2" x="92" y="152" text-anchor="middle">对局中</text>
<text class="lab2" x="238" y="152" text-anchor="middle">2 分钟</text>
<text class="lab2" x="384" y="152" text-anchor="middle">8 分钟</text>
<text class="lab2" x="530" y="152" text-anchor="middle">3 分钟</text>
<text class="lab2" x="676" y="152" text-anchor="middle">2 分钟</text>
<text class="lab" x="14" y="190">四步合计 15 分钟；前面另加约 10 分钟无声回放，一次复盘控制在 25 分钟内。</text>
<text class="lab" x="14" y="214">顺序不能调换：第 ③ 步没做完就去看引擎，这一盘的复盘价值基本归零。</text>
<rect class="st" x="32" y="236" width="704" height="42" rx="6" fill="#fbf7ea"/>
<text class="labk" x="52" y="262">复盘的产出不是「我知道哪步错了」，而是「下次遇到这个形状，我先看哪一格」。</text>
</svg>