 .pc-r{fill:#fff8f0;stroke:#c0392b;stroke-width:1.8}
.pc-b{fill:#f7f7f7;stroke:#1c1c1c;stroke-width:1.8}
 .pc-tr{font-size:15px;fill:#c0392b;font-weight:700}
.pc-tb{font-size:15px;fill:#1c1c1c;font-weight:700}
 .star{fill:#1c1c1c}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}
 .big{font-size:22px;fill:#1c1c1c}</style>
  <rect class="bg-paper" width="760" height="240"/>
  <text x="18" y="26" class="labk">同一条纵线，两个名字：换算只有一句话</text>
  <path class="st" d="M60 74V166M140 74V166M220 74V166M300 74V166M380 74V166M460 74V166M540 74V166M620 74V166M700 74V166"/>
  <text x="60" y="62" class="num" text-anchor="middle">1</text><text x="140" y="62" class="num" text-anchor="middle">2</text><text x="220" y="62" class="num" text-anchor="middle">3</text><text x="300" y="62" class="num" text-anchor="middle">4</text><text x="380" y="62" class="num" text-anchor="middle">5</text><text x="460" y="62" class="num" text-anchor="middle">6</text><text x="540" y="62" class="num" text-anchor="middle">7</text><text x="620" y="62" class="num" text-anchor="middle">8</text><text x="700" y="62" class="num" text-anchor="middle">9</text>
  <text x="60" y="192" class="num" text-anchor="middle">九</text><text x="140" y="192" class="num" text-anchor="middle">八</text><text x="220" y="192" class="num" text-anchor="middle">七</text><text x="300" y="192" class="num" text-anchor="middle">六</text><text x="380" y="192" class="num" text-anchor="middle">五</text><text x="460" y="192" class="num" text-anchor="middle">四</text><text x="540" y="192" class="num" text-anchor="middle">三</text><text x="620" y="192" class="num" text-anchor="middle">二</text><text x="700" y="192" class="num" text-anchor="middle">一</text>
  <text x="18" y="62" class="lab2">黑方</text>
  <text x="18" y="192" class="lab2">红方</text>
  <text x="380" y="128" class="lab" text-anchor="middle">红五 ⇄ 黑5（同一条）</text>
  <text x="18" y="224" class="lab">口诀：红路数 ＋ 黑路数 ＝ 10，只有中路五＝5 不变。</text>
