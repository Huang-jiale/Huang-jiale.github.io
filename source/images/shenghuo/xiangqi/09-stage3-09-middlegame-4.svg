<svg viewBox="0 0 760 330" role="img" aria-label="算度顺序流程框图：将军、吃子、威胁三类候选与三句自问" xmlns="http://www.w3.org/2000/svg" width="760" height="330"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
.cell-g{fill:#f2efe8}
.sq{fill:#f7f0df}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
 .pc-r{fill:#fff8f0;stroke:#c0392b;stroke-width:1.8}
.pc-b{fill:#f7f7f7;stroke:#1c1c1c;stroke-width:1.8}
 .pc-tr{font-size:15px;fill:#c0392b;font-weight:700}
.pc-tb{font-size:15px;fill:#1c1c1c;font-weight:700}
 .star{fill:#1c1c1c}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}
 .big{font-size:22px;fill:#1c1c1c}</style>
<rect class="bg-paper" width="760" height="330"/>
<text class="labk" x="16" y="26">算度顺序：候选着法只列三个，每个都先问对方</text>
<rect x="16" y="40" width="226" height="78" rx="6" fill="#eef7ee" stroke="#2f7d42" stroke-width="1.4"/>
<text class="labk" x="129" y="62" text-anchor="middle">优先 1：将军</text>
<text class="lab2" x="129" y="84" text-anchor="middle">把所有将军扫一遍</text>
<text class="lab2" x="129" y="104" text-anchor="middle">一步顶三步</text>
<rect x="260" y="40" width="226" height="78" rx="6" fill="#f7f6f2" stroke="#8f8f8f" stroke-width="1.4"/>
<text class="labk" x="373" y="62" text-anchor="middle">优先 2：吃子</text>
<text class="lab2" x="373" y="84" text-anchor="middle">能吃吗？换完剩什么？</text>
<text class="lab2" x="373" y="104" text-anchor="middle">别漏对方的回吃</text>
<rect x="504" y="40" width="226" height="78" rx="6" fill="#f7f6f2" stroke="#8f8f8f" stroke-width="1.4"/>
<text class="labk" x="617" y="62" text-anchor="middle">优先 3：威胁</text>
<text class="lab2" x="617" y="84" text-anchor="middle">下一步我要哪一格？</text>
<text class="lab2" x="617" y="104" text-anchor="middle">他非应不可吗？</text>
<text class="labk" x="16" y="146">对每一个候选，按这个顺序问三句：</text>
<text class="lab2" x="26" y="170">① 对方最强的应着是什么？（不许假设他看不见）</text>
<text class="lab2" x="26" y="194">② 换完之后盘上剩下什么？（谁多子、谁的线通、谁的王有洞）</text>
<text class="lab2" x="26" y="218">③ 我这一步是不是他非应不可的一子？（先手在谁手里）</text>
<rect x="16" y="238" width="728" height="56" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 4"/>
<text class="lab2" x="30" y="260">反例：只看自己一步 —— 我进车吃卒，他一定退；结果对方一步照将反抽。</text>
<text class="lab2" x="30" y="282">算度的价值不在步数多，在于把对方的最强应着算进去。</text>
</svg>