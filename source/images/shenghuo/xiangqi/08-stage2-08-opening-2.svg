<svg viewBox="0 0 760 300" role="img" aria-label="开局出子的参考顺序" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
.cell-g{fill:#f2efe8}
.sq{fill:#f7f0df}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
 .pc-r{fill:#fff8f0;stroke:#c0392b;stroke-width:1.8}
.pc-b{fill:#f7f7f7;stroke:#1c1c1c;stroke-width:1.8}
 .pc-tr{font-size:15px;fill:#c0392b;font-weight:700}
.pc-tb{font-size:15px;fill:#1c1c1c;font-weight:700}
 .star{fill:#1c1c1c}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}
 .big{font-size:22px;fill:#1c1c1c}</style>
<rect class="bg-paper" width="760" height="300"/>
<text class="labk" x="40" y="36">开局出子的参考顺序（一个具体例子）</text>
<rect class="cell-g" x="40" y="60" width="150" height="112" rx="8"/>
<rect class="gl" x="40" y="60" width="150" height="112" rx="8"/>
<text class="labk" x="115" y="88" text-anchor="middle">①架中炮</text>
<text class="lab2" x="115" y="114" text-anchor="middle">炮二平五</text>
<text class="lab2" x="115" y="136" text-anchor="middle">抢中路</text>
<rect class="cell-g" x="210" y="60" width="150" height="112" rx="8"/>
<rect class="gl" x="210" y="60" width="150" height="112" rx="8"/>
<text class="labk" x="285" y="88" text-anchor="middle">②跳正马</text>
<text class="lab2" x="285" y="114" text-anchor="middle">马二进三</text>
<text class="lab2" x="285" y="136" text-anchor="middle">护中兵</text>
<rect class="cell-g" x="380" y="60" width="150" height="112" rx="8"/>
<rect class="gl" x="380" y="60" width="150" height="112" rx="8"/>
<text class="labk" x="455" y="88" text-anchor="middle">③出直车</text>
<text class="lab2" x="455" y="114" text-anchor="middle">车一平二</text>
<text class="lab2" x="455" y="136" text-anchor="middle">占二路</text>
<rect class="cell-g" x="550" y="60" width="150" height="112" rx="8"/>
<rect class="gl" x="550" y="60" width="150" height="112" rx="8"/>
<text class="labk" x="625" y="88" text-anchor="middle">④补另一翼</text>
<text class="lab2" x="625" y="114" text-anchor="middle">马八进七</text>
<text class="lab2" x="625" y="136" text-anchor="middle">两翼都有子</text>
<path class="arrow-r" d="M190 116H204"/><polygon class="dot" points="202,110 212,116 202,122"/>
<path class="arrow-r" d="M360 116H374"/><polygon class="dot" points="372,110 382,116 372,122"/>
<path class="arrow-r" d="M530 116H544"/><polygon class="dot" points="542,110 552,116 542,122"/>
<text class="labk" x="40" y="206">反过来，这几件事在开局里多半是亏的</text>
<text class="lab" x="40" y="234">同一颗子走第二遍、开局就动士象、两只车蹲在角落里不动。</text>
<text class="lab" x="40" y="260">先把强子走完再管兵卒，先补稳中路再图进攻。</text>
</svg>