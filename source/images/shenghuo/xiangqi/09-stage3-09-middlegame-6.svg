<text class="labk" x="16" y="18">轮到红走 · 黑方过河卒（空心圈）看着没根，先找出保它的那颗子</text>
<text class="lab" x="16" y="700">贪子：车四平七 吃卒 → 黑 马5进3 一步吃回红车，一车只换一个卒。</text>
<text class="lab" x="16" y="722">不贪：车四平五 占中，红车管住两条线，那颗卒仍是一打一看。</text>
<text class="lab" x="16" y="744">判据：吃子前先数两件事 —— 打它的有几颗，保它的有几颗。</text>
<text class="lab" x="16" y="766">数完再决定：一打无保才叫吃子，一打一保叫做交换。</text>
