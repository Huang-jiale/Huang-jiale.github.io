<svg viewBox="0 0 760 250" role="img" aria-label="记谱四段式解剖图：炮二平五拆成子名、路线、动作、落点四块" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
.cell-g{fill:#f2efe8}
.sq{fill:#f7f0df}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
 .pc-r{fill:#fff8f0;stroke:#c0392b;stroke-width:1.8}
.pc-b{fill:#f7f7f7;stroke:#1c1c1c;stroke-width:1.8}
 .pc-tr{font-size:15px;fill:#c0392b;font-weight:700}
.pc-tb{font-size:15px;fill:#1c1c1c;font-weight:700}
 .star{fill:#1c1c1c}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}
 .big{font-size:22px;fill:#1c1c1c}</style>
  <rect class="bg-paper" width="760" height="250"/>
  <text x="24" y="26" class="labk">一句谱着拆成四块：子名 ＋ 路线 ＋ 动作 ＋ 落点</text>
  <rect class="f-g1" x="40" y="56" width="150" height="60" stroke="#8f8f8f"/>
  <rect class="f-g1" x="220" y="56" width="150" height="60" stroke="#8f8f8f"/>
  <rect class="f-g1" x="390" y="56" width="150" height="60" stroke="#8f8f8f"/>
  <rect class="f-g1" x="560" y="56" width="150" height="60" stroke="#8f8f8f"/>
  <text x="115" y="98" class="big" text-anchor="middle">炮</text>
  <text x="295" y="98" class="big" text-anchor="middle">二</text>
  <text x="465" y="98" class="big" text-anchor="middle">平</text>
  <text x="635" y="98" class="big" text-anchor="middle">五</text>
  <text x="205" y="94" class="labk">＋</text><text x="380" y="94" class="labk">＋</text><text x="550" y="94" class="labk">＋</text>
  <text x="115" y="145" class="lab" text-anchor="middle">① 子名：走哪个子</text>
  <text x="295" y="145" class="lab" text-anchor="middle">② 路线：第几条纵线</text>
  <text x="465" y="145" class="lab" text-anchor="middle">③ 动作：进、退、平</text>
  <text x="635" y="145" class="lab" text-anchor="middle">④ 落点：走到哪条线</text>
  <text x="40" y="192" class="lab">读作：二路上那只炮，横着走到第五路上（红方用汉字）。</text>
  <text x="40" y="220" class="lab">黑方完全同样的结构，只是数字换成阿拉伯数字，如卒7进1。</text>
</svg>