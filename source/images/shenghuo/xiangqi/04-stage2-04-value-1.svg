<svg viewBox="0 0 760 330" role="img" aria-label="子力参考值条形图：未过河兵、过河兵、士、象、马、炮、车按同一比例画出条形长度" xmlns="http://www.w3.org/2000/svg" width="760" height="330"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
.cell-g{fill:#f2efe8}
.sq{fill:#f7f0df}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
 .pc-r{fill:#fff8f0;stroke:#c0392b;stroke-width:1.8}
.pc-b{fill:#f7f7f7;stroke:#1c1c1c;stroke-width:1.8}
 .pc-tr{font-size:15px;fill:#c0392b;font-weight:700}
.pc-tb{font-size:15px;fill:#1c1c1c;font-weight:700}
 .star{fill:#1c1c1c}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}
 .big{font-size:22px;fill:#1c1c1c}</style>
  <rect class="bg-paper" width="760" height="330"/>
  <text x="18" y="24" class="labk">子力粗略参考值（条形按同一比例：1 分 = 30 像素）</text>
  <path class="st" d="M170 36V274"/>
  <text x="18" y="62" class="lab">未过河兵（卒）</text>
  <rect class="f-g1" x="170" y="44" width="30" height="26" stroke="#8f8f8f"/>
  <text x="210" y="62" class="lab2">约 1</text>
  <text x="18" y="96" class="lab">过河兵（卒）</text>
  <rect class="f-g2" x="170" y="78" width="60" height="26" stroke="#8f8f8f"/>
  <text x="240" y="96" class="lab2">约 2</text>
  <text x="18" y="130" class="lab">士 ／ 仕</text>
  <rect class="f-g2" x="170" y="112" width="60" height="26" stroke="#8f8f8f"/>
  <text x="240" y="130" class="lab2">约 2</text>
  <text x="18" y="164" class="lab">象 ／ 相</text>
  <rect class="f-g2" x="170" y="146" width="75" height="26" stroke="#8f8f8f"/>
  <text x="255" y="164" class="lab2">约 2~3</text>
  <text x="18" y="198" class="lab">马</text>
  <rect class="f-g3" x="170" y="180" width="120" height="26" stroke="#8f8f8f"/>
  <text x="300" y="198" class="lab2">约 4</text>
  <text x="18" y="232" class="lab">炮</text>
  <rect class="f-g3" x="170" y="214" width="135" height="26" stroke="#8f8f8f"/>
  <text x="315" y="232" class="lab2">约 4~4.5</text>
  <text x="18" y="266" class="lab">车</text>
  <rect class="f-g4" x="170" y="248" width="270" height="26" stroke="#8f8f8f"/>
  <text x="450" y="266" class="lab2">约 9</text>
  <text x="556" y="76" class="lab2">常见近似等式：</text>
  <text x="556" y="98" class="lab2">一车 ≈ 双马 ≈ 双炮</text>
  <text x="556" y="120" class="lab2">　　≈ 一马一炮</text>
  <text x="556" y="164" class="lab2">数字只回答"大致等价"，</text>
  <text x="556" y="186" class="lab2">"该不该换"要看后面</text>
  <text x="556" y="208" class="lab2">几节讲的位置、先手、</text>
  <text x="556" y="230" class="lab2">士象完整度。</text>
  <text x="18" y="312" class="lab2">这套比例没有任何官方出处，是棋手口口相传的经验估值；本课的用法是：先用它排除明显吃亏的交换，再靠具体局面拍板。</text>
</svg>