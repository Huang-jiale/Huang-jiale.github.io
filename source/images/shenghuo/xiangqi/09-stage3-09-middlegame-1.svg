<svg viewBox="0 0 760 230" role="img" aria-label="一局棋的三个阶段横向框图：布局、中局、残局各自的任务" xmlns="http://www.w3.org/2000/svg" width="760" height="230"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
.cell-g{fill:#f2efe8}
.sq{fill:#f7f0df}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
 .pc-r{fill:#fff8f0;stroke:#c0392b;stroke-width:1.8}
.pc-b{fill:#f7f7f7;stroke:#1c1c1c;stroke-width:1.8}
 .pc-tr{font-size:15px;fill:#c0392b;font-weight:700}
.pc-tb{font-size:15px;fill:#1c1c1c;font-weight:700}
 .star{fill:#1c1c1c}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}
 .big{font-size:22px;fill:#1c1c1c}</style>
<rect class="bg-paper" width="760" height="230"/>
<text class="labk" x="16" y="26">一局棋的三段：中局是从「背谱」切换到「自己算」的那一段</text>
<rect x="16" y="44" width="226" height="92" rx="6" fill="#eef7ee" stroke="#2f7d42" stroke-width="1.4"/>
<text class="labk" x="129" y="68" text-anchor="middle">布局 · 前 10 上下</text>
<text class="lab2" x="129" y="94" text-anchor="middle">有成法可背</text>
<text class="lab2" x="129" y="116" text-anchor="middle">子力摆到该在的位置</text>
<path class="st-thin" d="M244 90L244 90M244 95.5L258 90L244 84.5"/>
<rect x="260" y="44" width="226" height="92" rx="6" fill="#fdf6e6" stroke="#c8791f" stroke-width="1.4"/>
<text class="labk" x="373" y="68" text-anchor="middle">中局 · 无谱可依</text>
<text class="lab2" x="373" y="94" text-anchor="middle">全靠判断与算度</text>
<text class="lab2" x="373" y="116" text-anchor="middle">一个计划 + 三步算度</text>
<path class="st-thin" d="M488 90L488 90M488 95.5L502 90L488 84.5"/>
<rect x="504" y="44" width="226" height="92" rx="6" fill="#f6f9ff" stroke="#0f6ab5" stroke-width="1.4"/>
<text class="labk" x="617" y="68" text-anchor="middle">残局 · 子力已少</text>
<text class="lab2" x="617" y="94" text-anchor="middle">定式与精确性</text>
<text class="lab2" x="617" y="116" text-anchor="middle">胜/和的结论能查表</text>
<rect x="16" y="152" width="728" height="30" rx="6" fill="#ffffff" stroke="#8f8f8f" stroke-width="1.4" stroke-dasharray="6 4"/>
<text class="lab2" x="26" y="172">分界不靠步数，靠盘上的现象：子力展开完了、开始互相咬住 —— 中局就开始了。</text>
<text class="lab2" x="16" y="206">本课只练这一段：怎么定计划，怎么排算度顺序。</text>
</svg>