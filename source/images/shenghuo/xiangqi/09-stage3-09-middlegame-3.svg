<text class="lab" x="16" y="700">三路车：前面四格全空（小圈），车三进五 一步照将 —— 这就是通线。</text>
<text class="lab" x="16" y="722">七路车：被自己的兵顶死，向前一步都走不了，只能横向挪。</text>
<text class="lab" x="16" y="744">同是 9 分的车：能做事的按 9 分算，堵住的那辆先按一半估。</text>
<text class="lab" x="16" y="766">查路线只问两句：我的大子前面有没有空地？对方的空地在它手里还是在我手里？</text>
