<svg viewBox="0 0 760 300" role="img" aria-label="四步检查顺序流程框图：安全、子力、路线、将位" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
.cell-g{fill:#f2efe8}
.sq{fill:#f7f0df}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
 .pc-r{fill:#fff8f0;stroke:#c0392b;stroke-width:1.8}
.pc-b{fill:#f7f7f7;stroke:#1c1c1c;stroke-width:1.8}
 .pc-tr{font-size:15px;fill:#c0392b;font-weight:700}
.pc-tb{font-size:15px;fill:#1c1c1c;font-weight:700}
 .star{fill:#1c1c1c}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}
 .big{font-size:22px;fill:#1c1c1c}</style>
<rect class="bg-paper" width="760" height="300"/>
<text class="labk" x="16" y="26">拿到一个局面，四步查下去：顺序固定，不许凭兴趣</text>
<rect x="16" y="40" width="166" height="96" rx="6" fill="#f6f9ff" stroke="#0f6ab5" stroke-width="1.4"/>
<text class="labk" x="99" y="64" text-anchor="middle">第 1 步 安全</text>
<text class="lab2" x="99" y="90" text-anchor="middle">谁在吃谁？</text>
<text class="lab2" x="99" y="112" text-anchor="middle">有子悬着吗？</text>
<path class="st-thin" d="M184 88L184 88M184 93.5L198 88L184 82.5"/>
<rect x="200" y="40" width="166" height="96" rx="6" fill="#f6f9ff" stroke="#0f6ab5" stroke-width="1.4"/>
<text class="labk" x="283" y="64" text-anchor="middle">第 2 步 子力</text>
<text class="lab2" x="283" y="90" text-anchor="middle">一颗一颗数</text>
<text class="lab2" x="283" y="112" text-anchor="middle">谁多一颗子？</text>
<path class="st-thin" d="M368 88L368 88M368 93.5L382 88L368 82.5"/>
<rect x="384" y="40" width="166" height="96" rx="6" fill="#f6f9ff" stroke="#0f6ab5" stroke-width="1.4"/>
<text class="labk" x="467" y="64" text-anchor="middle">第 3 步 路线</text>
<text class="lab2" x="467" y="90" text-anchor="middle">谁的车有通线？</text>
<text class="lab2" x="467" y="112" text-anchor="middle">谁的马有跳点？</text>
<path class="st-thin" d="M552 88L552 88M552 93.5L566 88L552 82.5"/>
<rect x="568" y="40" width="166" height="96" rx="6" fill="#f6f9ff" stroke="#0f6ab5" stroke-width="1.4"/>
<text class="labk" x="651" y="64" text-anchor="middle">第 4 步 将位</text>
<text class="lab2" x="651" y="90" text-anchor="middle">将帅照面了吗？</text>
<text class="lab2" x="651" y="112" text-anchor="middle">九宫缺不缺守子？</text>
<rect x="16" y="152" width="728" height="34" rx="6" fill="#fbf1e9" stroke="#c8791f" stroke-width="1.4"/>
<text class="lab2" x="30" y="174">四步的答案拼成一句话：安全吗 · 谁多子 · 谁的线通 · 谁的王有洞 —— 这句话就是你的计划</text>
<text class="lab2" x="16" y="212">倒过来查是最常见的输法：先想自己的进攻，后看自家哪颗子没人守。</text>
<text class="lab2" x="16" y="236">练习节奏：前 20 局每步都默念这四句；练熟以后扫一遍不超过 20 秒。</text>
<text class="lab2" x="16" y="260">这四步之内不许算变化，只许「看」—— 看是免费的，算很贵。</text>
</svg>