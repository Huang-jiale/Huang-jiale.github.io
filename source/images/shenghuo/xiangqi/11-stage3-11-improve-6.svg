<svg viewBox="0 0 760 400" role="img" aria-label="练习材料难度阶梯：一步杀、两步杀、三步杀、残局题四级台阶，每级标注题量与升级条件" xmlns="http://www.w3.org/2000/svg" width="760" height="400"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
.cell-g{fill:#f2efe8}
.sq{fill:#f7f0df}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
 .pc-r{fill:#fff8f0;stroke:#c0392b;stroke-width:1.8}
.pc-b{fill:#f7f7f7;stroke:#1c1c1c;stroke-width:1.8}
 .pc-tr{font-size:15px;fill:#c0392b;font-weight:700}
.pc-tb{font-size:15px;fill:#1c1c1c;font-weight:700}
 .star{fill:#1c1c1c}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}
 .big{font-size:22px;fill:#1c1c1c}</style>
<rect class="bg-paper" width="760" height="400"/>
<text class="labk" x="380" y="28" text-anchor="middle" style="font-size:16px">从一步杀到三步杀：一次只加一层难度</text>
<rect class="st" x="30" y="250" width="165" height="60" rx="6" fill="#f7f4ee"/>
<rect class="st" x="210" y="200" width="165" height="110" rx="6" fill="#f7f4ee"/>
<rect class="st" x="390" y="150" width="165" height="160" rx="6" fill="#f7f4ee"/>
<rect class="st" x="570" y="100" width="165" height="210" rx="6" fill="#f7f4ee"/>
<text class="labk" x="112" y="278" text-anchor="middle">一步杀</text><text class="lab2" x="112" y="296" text-anchor="middle">一次 20 题</text>
<text class="labk" x="292" y="228" text-anchor="middle">两步杀</text><text class="lab2" x="292" y="246" text-anchor="middle">一次 10 题</text>
<text class="labk" x="472" y="178" text-anchor="middle">三步杀</text><text class="lab2" x="472" y="196" text-anchor="middle">一周 3 题</text>
<text class="labk" x="652" y="128" text-anchor="middle">残局题</text><text class="lab2" x="652" y="146" text-anchor="middle">一周 10 题</text>
<path class="arrow" d="M112 336H652"/><path class="arrow" d="M639 331L652 336L639 341"/>
<text class="lab" x="14" y="364">升阶条件：本阶正确率达到八成，再上下一阶；低于六成退回上一阶刷两天。</text>
<text class="lab" x="14" y="386">台阶只表难度，不表时间：一步杀每天都做，三步杀一周只碰三次。</text>
</svg>