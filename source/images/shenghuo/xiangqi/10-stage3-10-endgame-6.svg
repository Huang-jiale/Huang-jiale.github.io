<text class="lab" x="14" y="692">黑方士象齐全、将居宫顶正中，红车找不到可吃的薄弱点，也造不出杀。</text>
<text class="lab" x="14" y="714">红帅虽占五路，被中间那颗黑士挡住，恰好不犯照面——这就是「单车难破士象全」。</text>
