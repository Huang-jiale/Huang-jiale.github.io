<text class="lab" x="16" y="700">候选 A 车四平七 吃卒：黑 车8平4 顺手吃掉红马，红方净亏一颗马。</text>
<text class="lab" x="16" y="722">候选 B 马六退四：马逃开了，黑方不受将军，跟着把车走开，红方一无所得。</text>
<text class="lab" x="16" y="744">候选 C 马六进四：照将 + 咬车一步办完，黑方只能动将，红方白吃一车。</text>
<text class="lab" x="16" y="766">黑方应将只有两条：将5平4 与 将5进1 —— 垫与吃都做不到，红 马四退二 吃车。</text>
