<svg viewBox="0 0 760 240" role="img" aria-label="成杀判定流程图：我方叫将之后，对方有上将躲开、垫子挡、吃掉攻击子、拆掉炮架四种解法，四种全失败才叫成杀" xmlns="http://www.w3.org/2000/svg" width="760" height="240"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
.cell-g{fill:#f2efe8}
.sq{fill:#f7f0df}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
 .pc-r{fill:#fff8f0;stroke:#c0392b;stroke-width:1.8}
.pc-b{fill:#f7f7f7;stroke:#1c1c1c;stroke-width:1.8}
 .pc-tr{font-size:15px;fill:#c0392b;font-weight:700}
.pc-tb{font-size:15px;fill:#1c1c1c;font-weight:700}
 .star{fill:#1c1c1c}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}
 .big{font-size:22px;fill:#1c1c1c}</style>
  <rect class="bg-paper" width="760" height="240"/>
  <rect class="st" x="24" y="40" width="150" height="48" rx="6"/>
  <text x="99" y="70" class="labk" text-anchor="middle">我方叫将</text>
  <text x="99" y="108" class="lab2" text-anchor="middle">这一步是将军</text>
  <path class="arrow" d="M174 64H204"/><path class="arrow" d="M204 64l-10 5M204 64l-10 -5"/>
  <rect class="st" x="210" y="20" width="330" height="186" rx="8"/>
  <text x="375" y="40" class="lab2" text-anchor="middle">对方四种解法，逐条判掉</text>
  <text x="228" y="76" class="lab">① 走将：把老将移到安全格</text>
  <text x="228" y="110" class="lab">② 垫子：在攻击线上塞一个子</text>
  <text x="228" y="144" class="lab">③ 吃子：干掉正在叫将的那个子</text>
  <text x="228" y="178" class="lab">④ 拆架：把炮架挪开（只对付炮）</text>
  <path class="arrow" d="M540 112H570"/><path class="arrow" d="M570 112l-10 5M570 112l-10 -5"/>
  <rect class="st-ok" x="576" y="66" width="160" height="96" rx="8"/>
  <text x="656" y="104" class="labk" text-anchor="middle">四条全失败</text>
  <text x="656" y="136" class="labk" text-anchor="middle">＝ 成杀</text>
  <text x="375" y="228" class="lab2" text-anchor="middle">只要有一条能活，这步棋就不是杀；先把这一条堵掉，再叫将</text>
</svg>