<svg viewBox="0 0 760 300" role="img" aria-label="判负与判和的判定流程图：先查是否被将，再查是否有合规走法，最后查是否重复局面" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .gl-h{stroke:#1c1c1c;stroke-width:2;fill:none}
.cell-g{fill:#f2efe8}
.sq{fill:#f7f0df}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
 .pc-r{fill:#fff8f0;stroke:#c0392b;stroke-width:1.8}
.pc-b{fill:#f7f7f7;stroke:#1c1c1c;stroke-width:1.8}
 .pc-tr{font-size:15px;fill:#c0392b;font-weight:700}
.pc-tb{font-size:15px;fill:#1c1c1c;font-weight:700}
 .star{fill:#1c1c1c}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}
 .big{font-size:22px;fill:#1c1c1c}</style>
  <rect class="bg-paper" width="760" height="300"/>
  <text x="18" y="24" class="labk">这一步走完，棋局结束没有？按顺序问四句话</text>
  <rect class="f-g1" x="18" y="44" width="230" height="52" stroke="#8f8f8f"/>
  <rect class="f-g1" x="266" y="44" width="230" height="52" stroke="#8f8f8f"/>
  <rect class="f-g1" x="514" y="44" width="228" height="52" stroke="#8f8f8f"/>
  <text x="133" y="66" class="lab" text-anchor="middle">① 对方的王被将军了吗？</text>
  <text x="133" y="86" class="lab2" text-anchor="middle">没有 → 跳到 ③</text>
  <text x="381" y="66" class="lab" text-anchor="middle">② 他还能应将吗？</text>
  <text x="381" y="86" class="lab2" text-anchor="middle">能 → 继续；不能 → 将死，他负</text>
  <text x="628" y="66" class="lab" text-anchor="middle">③ 他有合规的一步吗？</text>
  <text x="628" y="86" class="lab2" text-anchor="middle">没有 → 困毙，他负</text>
  <path class="st" d="M248 70H266M496 70H514"/>
  <rect class="f-g1" x="18" y="126" width="340" height="52" stroke="#8f8f8f"/>
  <rect class="f-g1" x="382" y="126" width="360" height="52" stroke="#8f8f8f"/>
  <text x="188" y="148" class="lab" text-anchor="middle">④ 有没有人在长将、长捉？</text>
  <text x="188" y="168" class="lab2" text-anchor="middle">有且不变 → 通常判该方负</text>
  <text x="562" y="148" class="lab" text-anchor="middle">⑤ 双方都无力将死／同意和？</text>
  <text x="562" y="168" class="lab2" text-anchor="middle">是 → 和棋</text>
  <text x="18" y="212" class="lab">注意顺序：先"是否被将"，再"有无合规走法"。两个都没有时，被将是将死、没被将是困毙，两种都判负。</text>
  <text x="18" y="238" class="lab2">另外，走完一步先自查照面：两个王同线且中间全空，说明你这一步违规，必须重走。</text>
  <text x="18" y="264" class="lab2">比赛里的裁决以当场裁判和规程为准，本课只给可自查的通用口径。</text>
</svg>