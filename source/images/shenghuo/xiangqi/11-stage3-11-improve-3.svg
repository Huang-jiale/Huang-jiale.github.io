<svg viewBox="0 0 760 730" role="img" aria-label="复盘片段一的改进版：红马退回原来的位置，改走中兵前进一步，黑车控制的竖线上没有红子" xmlns="http://www.w3.org/2000/svg" width="760" height="730"><style> svg{display:block;width:100%;height:auto}
