<text class="lab2" x="150" y="424">兵五进一：先补一手</text>
<text class="lab2" x="460" y="306">这格在车口里</text>
<text class="lab" x="14" y="690">马留在三路原地，红方一颗子也不亏；先走一步不丢子的中兵，把「要不要进马」推到看清黑方动向之后再定。</text>
<text class="lab" x="14" y="712">复盘时把这两行并排写在本子上：走错的那行画叉，能走的那行画圈。</text>
