<text class="labk" x="16" y="18">轮到红走 · 红车红马两子打着同一匹黑马，黑方只有一颗过河卒在保</text>
<text class="lab" x="16" y="700">正解 马二进四 吃马 → 黑 卒7平6 吃马 → 车五平四 吃卒：红方净多一颗过河卒。</text>
<text class="lab" x="16" y="722">错着 车五平四 先吃 → 卒7平6 吃车 → 马二进四 吃卒：一车换马卒，亏三分。</text>
<text class="lab" x="16" y="744">判据：同一个目标，先派便宜的子去吃，贵的那颗留在后面收口。</text>
<text class="lab" x="16" y="766">另一判：吃之前先数守子 —— 守子只有一颗，才值得动手；黑车远在边路帮不上。</text>
