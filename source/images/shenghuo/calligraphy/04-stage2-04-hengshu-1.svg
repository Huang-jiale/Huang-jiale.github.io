<svg viewBox="0 0 760 260" role="img" aria-label="横画分解为起笔逆入、行笔中锋、收笔顿笔回锋三段" xmlns="http://www.w3.org/2000/svg" width="760" height="260"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
    <rect class="bg-paper" width="760" height="260"/>
    <text class="labk" x="380" y="34" text-anchor="middle">横画的 起 — 行 — 收</text>
    <line class="arrow" x1="150" y1="92" x2="600" y2="92"/>
    <path class="arrow" d="M600,92 L588,86 L588,98 Z"/>
    <text class="lab2" x="300" y="82">行笔方向（自左向右，中锋）</text>
    <line class="stroke-in" x1="118" y1="122" x2="616" y2="118" stroke-width="15"/>
    <circle class="dot" cx="128" cy="121" r="6"/>
    <circle class="dot" cx="372" cy="120" r="6"/>
    <circle class="dot" cx="612" cy="118" r="6"/>
    <text class="lab" x="108" y="176">① 起笔</text>
    <text class="lab" x="344" y="176">② 行笔</text>
    <text class="lab" x="584" y="176">③ 收笔</text>
    <text class="lab2" x="100" y="200">逆入 · 藏锋</text>
    <text class="lab2" x="338" y="200">中锋 · 平行</text>
    <text class="lab2" x="576" y="200">顿笔 · 回锋</text>
    <text class="lab2" x="120" y="236">向左轻顶再折回，藏住笔尖</text>
    <text class="lab2" x="400" y="236">末端先下顿再回带，墨不外甩</text>
  </svg>