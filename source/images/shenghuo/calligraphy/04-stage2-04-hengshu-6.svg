<svg viewBox="0 0 360 280" role="img" aria-label="垂露竖：逆入下行，末端顿笔回锋收成圆珠" xmlns="http://www.w3.org/2000/svg" width="360" height="280"><style> svg{display:block;width:100%;height:auto}
