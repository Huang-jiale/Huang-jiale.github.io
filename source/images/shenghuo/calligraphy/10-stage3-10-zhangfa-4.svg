 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
    <rect class="bg-paper" width="360" height="300"/>
    <text class="labk" x="20" y="26">错：各自为政，气是折的</text>
    <rect class="guide" x="128" y="46" width="44" height="40" stroke-width="1.5"/>
    <rect class="guide" x="193" y="110" width="44" height="40" stroke-width="1.5"/>
    <rect class="guide" x="138" y="174" width="44" height="40" stroke-width="1.5"/>
    <rect class="guide" x="203" y="238" width="44" height="40" stroke-width="1.5"/>
    <path d="M150 42 L215 106 L160 170 L225 234" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 5"/>
    <text class="lab2" x="28" y="200">字距忽大忽小</text>
    <text class="lab2" x="28" y="216">＝气口堵死</text>
    <text class="lab2" x="250" y="98">红折线说明</text>
