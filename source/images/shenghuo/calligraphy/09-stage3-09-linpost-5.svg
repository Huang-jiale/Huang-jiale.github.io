<svg viewBox="0 0 760 300" role="img" aria-label="临帖时桌面俯视图：帖在左前方、练习纸在右前方，视线先回帖再落笔" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="300"/>
  <text x="18" y="26" class="labk">临的桌面（俯视）：位置每次一样，眼睛比手快一笔</text>
  <rect x="40" y="48" width="380" height="200" class="f-white" stroke="#8a8a8a"/>
  <rect x="70" y="72" width="110" height="150" class="f-g4" stroke="#8a8a8a"/>
  <text x="125" y="170" class="kai" style="font-size:56px" text-anchor="middle">永</text>
  <text x="125" y="66" class="lab2" text-anchor="middle">帖（左前方）</text>
  <rect x="220" y="82" width="170" height="150" class="f-white" stroke="#8a8a8a"/>
  <rect x="252" y="112" width="90" height="90" class="st"/>
  <line x1="297" y1="112" x2="297" y2="202" class="guide"/>
  <line x1="252" y1="157" x2="342" y2="157" class="guide"/>
  <line x1="252" y1="112" x2="342" y2="202" class="guide"/>
  <line x1="342" y1="112" x2="252" y2="202" class="guide"/>
  <text x="305" y="66" class="lab2">练习纸（右前方）</text>
  <path class="arrow" d="M212 232 L150 156 M158 158 L150 156 L156 166"/>
  <path class="arrow" d="M248 232 L296 210 M288 210 L296 210 L292 218"/>
  <text x="440" y="76" class="lab">① 帖左前、纸右前，位置每次一样</text>
  <text x="440" y="100" class="lab">② 先眼看帖定第一笔，再落笔写一笔</text>
  <text x="440" y="124" class="lab">③ 写完这一笔立刻回看帖，不停笔</text>
  <text x="440" y="148" class="lab">④ 一个字连写 3 遍，第 3 遍通常最好</text>
  <text x="440" y="172" class="lab">⑤ 3 遍之后不许"顺手再写第 4 个"</text>
  <text x="440" y="200" class="lab2">每一笔看 3—5 秒；整字的 60 秒读帖在这一步之前做完。</text>
  <text x="40" y="264" class="lab2">为什么"一笔一停"有效：手停住那一刻，眼睛才有机会把信息送进来；手不停，眼睛只是在陪着手。</text>
  <text x="40" y="288" class="lab2">不许写第 4 个：第 4 个开始就是惯性在写，错误会被加倍巩固，这是临帖最常见的自伤动作。</text>
</svg>