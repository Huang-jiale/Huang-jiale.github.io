<svg viewBox="0 0 760 210" role="img" aria-label="长锋中锋短锋三种笔形对线条控制的影响" xmlns="http://www.w3.org/2000/svg" width="760" height="210"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="210"/>
  <text x="18" y="24" class="labk">同一支笔的锋长不同，能写的字径与难度就不同</text>
  <g>
    <rect x="60" y="40" width="14" height="34" class="f-g4"/>
    <path d="M60 74 L74 74 L71 130 Q67 148 67 156 Q63 140 60 124 Z" class="f-g1" stroke="#8a8a8a"/>
    <text x="90" y="86" class="lab">长锋</text>
    <text x="90" y="108" class="lab2">粗细跨度大、易倒</text>
    <text x="90" y="126" class="lab2">适合行草与熟练者</text>
  </g>
  <g>
    <rect x="260" y="40" width="14" height="34" class="f-g4"/>
    <path d="M260 74 L274 74 L271 112 Q267 128 267 134 Q263 120 260 108 Z" class="f-g1" stroke="#8a8a8a"/>
    <text x="290" y="86" class="lab">中锋（锋长适中）</text>
    <text x="290" y="108" class="lab2">按得下也收得回</text>
    <text x="290" y="126" class="lab2">初学最常选的一档</text>
  </g>
  <g>
    <rect x="470" y="40" width="14" height="34" class="f-g4"/>
    <path d="M470 74 L484 74 L482 92 Q477 102 477 106 Q472 96 470 88 Z" class="f-g1" stroke="#8a8a8a"/>
    <text x="500" y="86" class="lab">短锋</text>
    <text x="500" y="108" class="lab2">稳，但粗细变化小</text>
    <text x="500" y="126" class="lab2">适合小字、抄经类</text>
  </g>
  <text x="18" y="176" class="lab">同一个横，三种笔写出来的截面（示意）：</text>
  <path d="M170 190 q60 -14 130 0 q-4 12 -70 12 q-56 0 -60 -12 Z" class="f-g2"/>
  <path d="M340 190 q34 -8 70 0 q-2 8 -36 8 q-32 0 -34 -8 Z" class="f-g3"/>
  <path d="M440 190 q18 -5 36 0 q-1 5 -18 5 q-16 0 -18 -5 Z" class="f-g4"/>
  <text x="520" y="194" class="lab2">← 锋越短，能写出的粗细范围越窄</text>
</svg>