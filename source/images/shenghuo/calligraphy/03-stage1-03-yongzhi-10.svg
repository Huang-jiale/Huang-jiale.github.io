<svg viewBox="0 0 760 240" role="img" aria-label="永字八笔连写的空中气脉示意" xmlns="http://www.w3.org/2000/svg" width="760" height="240"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
    <rect class="bg-paper" width="760" height="240"/>
    <text class="labk" x="40" y="28">笔断意连：虚线是空中走的路线</text>
    <rect x="60" y="48" width="150" height="150" fill="none" stroke="#c9c4ba" stroke-width="1.6"/>
    <line class="guide" x1="135" y1="48" x2="135" y2="198"/>
    <line class="guide" x1="60" y1="123" x2="210" y2="123"/>
    <text class="kai" x="135" y="170" text-anchor="middle" font-size="120" fill="#1c1c1c">永</text>
    <path class="st-thin" d="M230 120 C300 60 360 70 430 60"/>
    <path class="st-thin" d="M430 60 C470 90 470 150 430 180"/>
    <text class="lab2" x="250" y="46">上一笔收，即下一笔起</text>
    <text class="lab" x="330" y="128">中锋</text>
    <text class="lab" x="330" y="152">是贯穿八笔</text>
    <text class="lab" x="330" y="176">始终的主心骨</text>
    <text class="lab2" x="470" y="128">提按</text>
    <text class="lab2" x="470" y="152">让八笔</text>
    <text class="lab2" x="470" y="176">各有形</text>
  </svg>