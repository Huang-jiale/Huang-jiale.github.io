<svg viewBox="0 0 760 300" role="img" aria-label="落款的位置规矩：款字小一号、起笔低于正文、与印隔一字" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
    <rect class="bg-paper" width="760" height="300"/>
    <text class="labk" x="40" y="26">落款的三条位置铁律</text>
    <rect class="st" x="120" y="44" width="180" height="226" fill="none"/>
    <rect x="266" y="62" width="14" height="14" fill="#22211f"/>
    <rect x="266" y="82" width="14" height="14" fill="#22211f"/>
    <rect x="266" y="102" width="14" height="14" fill="#22211f"/>
    <rect x="266" y="122" width="14" height="14" fill="#22211f"/>
    <rect x="242" y="62" width="14" height="14" fill="#22211f"/>
    <rect x="242" y="82" width="14" height="14" fill="#22211f"/>
    <rect x="242" y="102" width="14" height="14" fill="#22211f"/>
    <rect x="218" y="62" width="14" height="14" fill="#22211f"/>
    <rect x="218" y="82" width="14" height="14" fill="#22211f"/>
    <rect x="218" y="102" width="14" height="14" fill="#22211f"/>
    <rect x="194" y="62" width="14" height="14" fill="#22211f"/>
    <rect x="194" y="82" width="14" height="14" fill="#22211f"/>
    <rect x="170" y="62" width="14" height="14" fill="#22211f"/>
    <rect x="170" y="82" width="14" height="14" fill="#22211f"/>
    <rect x="152" y="112" width="10" height="10" fill="#22211f"/>
    <rect x="152" y="126" width="10" height="10" fill="#22211f"/>
    <rect x="152" y="140" width="10" height="10" fill="#22211f"/>
    <rect x="152" y="154" width="10" height="10" fill="#22211f"/>
    <rect x="152" y="168" width="10" height="10" fill="#22211f"/>
    <rect x="149" y="190" width="16" height="16" fill="#c0392b"/>
    <line class="st-red" x1="168" y1="104" x2="240" y2="104" stroke-dasharray="4 4"/>
    <text class="lab2" x="36" y="120">款首低于正文末字</text>
    <text class="labk" x="380" y="60">铁律清单</text>
    <text class="lab" x="380" y="94">① 款字比正文小一号（约七成），</text>
    <text class="lab2" x="412" y="114">绝不允许反客为主；</text>
    <text class="lab" x="380" y="144">② 款的起笔要低于正文最后一字，</text>
    <text class="lab2" x="412" y="164">红线示意——平齐即「没大没小」；</text>
    <text class="lab" x="380" y="194">③ 款与印之间隔约一个字位，</text>
    <text class="lab2" x="412" y="214">印不压字、不悬空在纸边；</text>
    <text class="lab" x="380" y="244">④ 正文若已写到底，款可另起一</text>
    <text class="lab2" x="412" y="264">短列，称「藏款」，宁挤不溢出。</text>
  </svg>