 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
    <rect class="bg-paper" width="760" height="300"/>
    <defs><marker id="yz1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0f6ab5"/></marker></defs>
    <text class="labk" x="40" y="32">"永"字含八法</text>
    <rect x="60" y="55" width="180" height="180" fill="none" stroke="#c9c4ba" stroke-width="1.6"/>
    <line class="guide" x1="150" y1="55" x2="150" y2="235"/>
    <line class="guide" x1="60" y1="145" x2="240" y2="145"/>
    <line class="guide" x1="60" y1="55" x2="240" y2="235"/>
    <line class="guide" x1="240" y1="55" x2="60" y2="235"/>
    <text class="kai" x="150" y="215" text-anchor="middle" font-size="150" fill="#1c1c1c">永</text>
    <text class="lab" x="300" y="72">侧 — 点</text>
    <text class="lab" x="300" y="102">勒 — 横</text>
    <text class="lab" x="300" y="132">努 — 竖</text>
    <text class="lab" x="300" y="162">趯 — 钩</text>
    <text class="lab" x="520" y="72">策 — 提</text>
    <text class="lab" x="520" y="102">掠 — 长撇</text>
    <text class="lab" x="520" y="132">啄 — 短撇</text>
    <text class="lab" x="520" y="162">磔 — 捺</text>
    <text class="lab2" x="300" y="205">对照上表反复念，把</text>
