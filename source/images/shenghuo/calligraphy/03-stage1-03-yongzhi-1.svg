<svg viewBox="0 0 760 300" role="img" aria-label="永字范字与八法名称对应一览" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
