<svg viewBox="0 0 760 300" role="img" aria-label="米字格、田字格、回宫格三种练习格的对比与用法" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="300"/>
  <text x="18" y="26" class="labk">三种格：先米字读位置，再回宫管宽窄，最后脱格</text>
  <rect x="40" y="48" width="150" height="150" class="st"/>
  <line x1="115" y1="48" x2="115" y2="198" class="guide"/>
  <line x1="40" y1="123" x2="190" y2="123" class="guide"/>
  <line x1="40" y1="48" x2="190" y2="198" class="guide"/>
  <line x1="190" y1="48" x2="40" y2="198" class="guide"/>
  <text x="115" y="180" class="kai" style="font-size:100px" text-anchor="middle">中</text>
  <rect x="305" y="48" width="150" height="150" class="st"/>
  <line x1="380" y1="48" x2="380" y2="198" class="guide"/>
  <line x1="305" y1="123" x2="455" y2="123" class="guide"/>
  <text x="380" y="180" class="kai" style="font-size:100px" text-anchor="middle">中</text>
  <rect x="570" y="48" width="150" height="150" class="st"/>
  <line x1="645" y1="48" x2="645" y2="198" class="guide"/>
  <line x1="570" y1="123" x2="720" y2="123" class="guide"/>
  <rect x="600" y="78" width="90" height="90" class="guide"/>
  <text x="645" y="180" class="kai" style="font-size:100px" text-anchor="middle">中</text>
  <text x="115" y="222" class="lab" text-anchor="middle">米字格：管位置</text>
  <text x="380" y="222" class="lab" text-anchor="middle">田字格：管居中</text>
  <text x="645" y="222" class="lab" text-anchor="middle">回宫格：管宽窄</text>
  <text x="115" y="244" class="lab2" text-anchor="middle">起收都能报坐标，读帖首选</text>
  <text x="380" y="244" class="lab2" text-anchor="middle">斜笔方向读不出，后期再用</text>
  <text x="645" y="244" class="lab2" text-anchor="middle">内框外不许伸，先收中宫</text>
  <text x="18" y="282" class="lab2">脱格练法（第 8 周起）：无格纸下面垫一张米字格纸，靠透过来的线定位，写完抽掉垫纸仍站得住才算过关。</text>
</svg>