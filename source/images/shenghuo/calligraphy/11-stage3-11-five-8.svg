<svg viewBox="0 0 760 260" role="img" aria-label="草书三级对比：章草字字独立带波磔、今草上下呼应、大草连绵到底" xmlns="http://www.w3.org/2000/svg" width="760" height="260"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="260"/>
  <text x="18" y="26" class="labk">草的三档：越往下，单字越少、线越长、认读越难</text>
  <rect x="24" y="50" width="212" height="140" class="f-white" stroke="#8a8a8a"/>
  <text x="38" y="74" class="labk">章草：字字独立</text>
  <path d="M50 100 H120" class="st" style="stroke-width:7;stroke-linecap:round"/>
  <path d="M50 128 H120" class="st" style="stroke-width:7;stroke-linecap:round"/>
  <path d="M50 156 H116" class="st" style="stroke-width:7;stroke-linecap:round"/>
  <path d="M114 148 L132 154 L116 162 Z" class="f-g1"/>
  <text x="150" y="116" class="lab2">仍有波磔</text>
  <rect x="268" y="50" width="212" height="140" class="f-white" stroke="#8a8a8a"/>
  <text x="282" y="74" class="labk">今草：上下呼应</text>
  <path d="M296 96 q34 -12 46 6 q10 18 -12 24 q-22 8 -6 22 q14 12 42 2" class="st" style="stroke-width:6;stroke-linecap:round"/>
  <text x="404" y="116" class="lab2">波磔去掉</text>
  <rect x="512" y="50" width="212" height="140" class="f-white" stroke="#8a8a8a"/>
  <text x="526" y="74" class="labk">大草：连绵到底</text>
  <path d="M540 168 q-6 -40 22 -56 q30 -18 46 6 q14 24 -8 40 q-22 16 -6 34 q16 16 48 0" class="st" style="stroke-width:5;stroke-linecap:round"/>
  <text x="606" y="212" class="lab2">一行常像一条线</text>
  <text x="24" y="222" class="lab">共同三条规则：一笔可顶原字几笔；省下的部分靠固定写法记住，不能自造；越快越要留得住锋。</text>
  <text x="24" y="250" class="lab2">分档记法：带脚且不连＝章草；不带脚但字字呼应＝今草；整行盘成一条线＝大草。图中曲线只是走势示意，不是任何具体的草字。</text>
</svg>