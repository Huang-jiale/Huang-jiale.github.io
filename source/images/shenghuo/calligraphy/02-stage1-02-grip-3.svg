<svg viewBox="0 0 760 230" role="img" aria-label="执笔高低与字径关系三种握位的控制范围" xmlns="http://www.w3.org/2000/svg" width="760" height="230"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="230"/>
  <text x="18" y="24" class="labk">握位越高，动作幅度越大、精度越低；握位越低反之</text>
  <g>
    <rect x="70" y="52" width="10" height="120" rx="5" class="f-g3"/>
    <circle cx="75" cy="122" r="7" class="joint"/>
    <text x="92" y="126" class="lab">低握（小楷／寸楷）</text>
    <text x="92" y="146" class="lab2">精度最高，靠指与腕</text>
    <path class="arrow" d="M75 178 q-30 -4 -44 12 M31 190 L26 198 M31 190 L38 192"/>
  </g>
  <g>
    <rect x="300" y="52" width="10" height="120" rx="5" class="f-g3"/>
    <circle cx="305" cy="94" r="7" class="joint"/>
    <text x="322" y="98" class="lab">中握（3—5cm 见方，入门常用）</text>
    <text x="322" y="118" class="lab2">指、腕分工，能按能提</text>
    <path class="arrow" d="M305 178 q-46 -6 -70 16 M235 194 L228 200 M235 194 L243 195"/>
  </g>
  <g>
    <rect x="560" y="52" width="10" height="120" rx="5" class="f-g3"/>
    <circle cx="565" cy="66" r="7" class="joint"/>
    <text x="582" y="70" class="lab">高握（大字、行草）</text>
    <text x="582" y="90" class="lab2">靠肘与肩，指只微调</text>
    <path class="arrow" d="M565 178 q-70 -10 -104 22 M461 200 L452 206 M461 200 L470 202"/>
  </g>
  <text x="18" y="216" class="lab2">红点＝手指捏的位置；下方弧长＝这支笔在这个握位下能稳定控制的笔画半径（示意，不是精确尺寸）</text>
</svg>