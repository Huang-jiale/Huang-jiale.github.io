<svg viewBox="0 0 760 250" role="img" aria-label="方折竖折的起转收分解" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
    <rect class="bg-paper" width="760" height="250"/>
    <text class="labk" x="40" y="26">方折 · 竖折（"山"的左下角）</text>
    <rect x="70" y="45" width="160" height="160" fill="none" stroke="#c9c4ba" stroke-width="1.6"/>
    <line class="guide" x1="150" y1="45" x2="150" y2="205"/>
    <line class="guide" x1="70" y1="125" x2="230" y2="125"/>
    <line class="guide" x1="70" y1="45" x2="230" y2="205"/>
    <line class="guide" x1="230" y1="45" x2="70" y2="205"/>
    <text class="kai" x="150" y="188" text-anchor="middle" font-size="130" fill="#e2e2e2">山</text>
    <path class="stroke-in" d="M118 84 L132 84 C130 120 130 148 132 168 C158 170 186 168 206 166 L206 180 C176 184 138 184 122 182 C120 152 120 116 118 84 Z"/>
    <text class="lab" x="280" y="66">起：竖从中部下行，锋在正中</text>
    <text class="lab" x="280" y="106">转：底部驻笔一顿，向右重新铺毫</text>
    <text class="lab" x="280" y="146">收：向右写横，再走一段中锋</text>
    <text class="lab2" x="280" y="190">忌：顿完顺势一拖，横段发软</text>
  </svg>