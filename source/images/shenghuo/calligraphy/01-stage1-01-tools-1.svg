<svg viewBox="0 0 760 250" role="img" aria-label="毛笔的解剖：笔帽笔项笔头与笔尖三段" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="250"/>
  <text x="18" y="24" class="labk">一支毛笔的结构：只有下半段"笔头"会参与写字</text>
  <rect x="60" y="34" width="70" height="42" rx="6" class="f-g2"/>
  <text x="140" y="60" class="lab">笔帽（保护笔尖用，泡笔后要套回）</text>
  <rect x="70" y="76" width="50" height="52" class="f-g3"/>
  <text x="140" y="108" class="lab">笔项：缠线或漆固的部分，管住毛束不炸开</text>
  <path d="M70 128 L120 128 L112 176 Q95 208 92 224 Q89 208 78 176 Z" class="f-g1" stroke="#8a8a8a"/>
  <line x1="76" y1="150" x2="114" y2="150" class="st-thin"/>
  <text x="140" y="156" class="lab">笔头三段：笔肚（蓄墨）、笔副（铺毫变粗）、笔尖（出锋）</text>
  <text x="140" y="180" class="lab2">按下时先笔肚沉墨、笔副铺开；提笔时只剩笔尖在纸上走</text>
  <text x="140" y="204" class="lab2">"锋"＝笔项底端到笔尖的长度；写出来的线条粗细变化全在这一段</text>
  <path class="arrow" d="M470 150 L548 150 M540 143 L548 150 L540 157"/>
  <path d="M560 128 q14 -8 26 0 q10 30 -6 62 q-8 20 -14 30 q-6 -12 -10 -30 q-12 -32 4 -62 Z" class="f-g1" stroke="#8a8a8a"/>
  <text x="600" y="140" class="lab">轻按</text>
  <text x="600" y="176" class="lab">重按</text>
  <path d="M556 190 q18 8 40 0 q-6 22 -20 30 q-14 -8 -20 -30 Z" class="f-g2" stroke="#8a8a8a"/>
  <text x="18" y="238" class="lab2">结论：新手要练的不是"手不抖"，而是"知道按到几分、什么时候提"，这必须靠一支听话的笔。</text>
</svg>