<svg viewBox="0 0 760 280" role="img" aria-label="书写坐姿侧视正误对比：头正身直臂开足安" xmlns="http://www.w3.org/2000/svg" width="760" height="280"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="280"/>
  <text x="18" y="24" class="labk">左✓右✗：坐姿的差异全部体现在"笔尖能不能被眼睛直接看到、肘能不能自由动"</text>
  <rect x="30" y="150" width="200" height="12" class="f-g2"/>
  <rect x="46" y="140" width="90" height="10" class="f-g1" stroke="#8a8a8a"/>
  <rect x="60" y="162" width="140" height="100" class="f-none" stroke="#bbb"/>
  <path class="body-line" d="M150 140 L150 92"/>
  <circle cx="150" cy="76" r="14" class="head"/>
  <path class="body-line" d="M150 100 L112 134"/>
  <path class="body-line" d="M150 140 L178 176 L178 250"/>
  <path class="body-line" d="M178 250 L206 250"/>
  <rect x="120" y="122" width="8" height="34" rx="4" class="f-g3" transform="rotate(-16 124 139)"/>
  <path class="arrow" d="M156 76 L188 76 M180 70 L188 76 L180 82"/>
  <text x="196" y="80" class="lab2">眼向下看笔尖</text>
  <text x="40" y="196" class="lab">✓ 头正、身直</text>
  <text x="40" y="216" class="lab2">臂开：前臂搭桌沿</text>
  <text x="40" y="234" class="lab2">足安：两脚平踏</text>
  <rect x="400" y="150" width="200" height="12" class="f-g2"/>
  <rect x="416" y="140" width="90" height="10" class="f-g1" stroke="#8a8a8a"/>
  <path class="body-line" d="M520 140 q-8 -34 18 -50"/>
  <circle cx="548" cy="80" r="14" class="head"/>
  <path class="body-line" d="M538 96 L470 128"/>
  <path class="body-line" d="M520 140 L552 172 L520 236 L552 240"/>
  <text x="404" y="196" class="lab">✗ 低头耸肩、肘外架</text>
  <text x="404" y="216" class="lab2">后果一：肩颈十分钟就酸</text>
  <text x="404" y="234" class="lab2">后果二：肘不能前后送，长竖写不完</text>
  <text x="404" y="252" class="lab2">后果三：视线被手挡住，只能凭感觉描</text>
  <text x="18" y="272" class="lab2">椅子高度：坐骨稳定、膝略低于髋、上臂自然下垂时前臂刚好能平放桌面——这是最常见的合适比例。</text>
</svg>