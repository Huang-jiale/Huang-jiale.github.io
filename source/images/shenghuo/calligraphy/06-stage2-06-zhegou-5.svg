 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
    <rect class="bg-paper" width="760" height="260"/>
    <defs><marker id="zg2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0f6ab5"/></marker></defs>
    <text class="labk" x="40" y="28">竖钩 · 先按实，再踢出</text>
    <rect x="70" y="45" width="160" height="170" fill="none" stroke="#c9c4ba" stroke-width="1.6"/>
    <line class="guide" x1="150" y1="45" x2="150" y2="215"/>
    <line class="guide" x1="70" y1="130" x2="230" y2="130"/>
    <line class="guide" x1="70" y1="45" x2="230" y2="215"/>
    <line class="guide" x1="230" y1="45" x2="70" y2="215"/>
    <text class="kai" x="150" y="198" text-anchor="middle" font-size="132" fill="#e2e2e2">小</text>
    <path class="stroke-in" d="M166 70 L178 70 C180 120 180 160 176 194 C170 206 152 210 138 202 C150 204 164 200 166 186 C168 152 168 112 166 70 Z"/>
    <path class="arrow" d="M182 80 L182 194 L146 204" marker-end="url(#zg2)"/>
    <text class="lab" x="280" y="70">起：竖的中锋下行，走到尽头</text>
    <text class="lab" x="280" y="110">转：向左下顿实，把锋蓄住</text>
    <text class="lab" x="280" y="150">收：向左上踢出，笔尖弹出</text>
    <text class="lab2" x="280" y="194">忌：不顿就一带，钩软塌</text>
  </svg>