<svg viewBox="0 0 760 260" role="img" aria-label="字距小于行距的版面示意与两种缝的对比" xmlns="http://www.w3.org/2000/svg" width="760" height="260"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
    <rect class="bg-paper" width="760" height="260"/>
    <text class="labk" x="40" y="26">竖看密、横看疏：两种缝别写反</text>
    <rect x="60" y="48" width="46" height="44" fill="#22211f"/>
    <rect x="60" y="106" width="46" height="44" fill="#22211f"/>
    <rect x="60" y="164" width="46" height="44" fill="#22211f"/>
    <rect x="176" y="48" width="46" height="44" fill="#22211f"/>
    <rect x="176" y="106" width="46" height="44" fill="#22211f"/>
    <rect x="176" y="164" width="46" height="44" fill="#22211f"/>
    <rect x="292" y="48" width="46" height="44" fill="#22211f"/>
    <rect x="292" y="106" width="46" height="44" fill="#22211f"/>
    <line class="st-red" x1="114" y1="120" x2="176" y2="120" stroke-dasharray="5 4"/>
    <text class="lab2" x="118" y="138">行距大（约1.2份）</text>
    <line class="st-blue" x1="82" y1="92" x2="82" y2="106"/>
    <text class="lab2" x="40" y="240">字距小（约0.8份）：蓝短线是字距，红虚线是行距</text>
    <text class="labk" x="420" y="60">三条排布细则</text>
    <text class="lab" x="420" y="94">① 每列首字在同一条横线上起，</text>
    <text class="lab2" x="452" y="114">末字高低参差——收得齐=印刷；</text>
    <text class="lab" x="420" y="144">② 奇数列写满，偶数列故意少一</text>
    <text class="lab2" x="452" y="164">字，末行留得越短，款越好落；</text>
    <text class="lab" x="420" y="194">③ 通篇字径一致最安全，</text>
    <text class="lab2" x="452" y="214">忽大忽小留给下一年再玩。</text>
  </svg>