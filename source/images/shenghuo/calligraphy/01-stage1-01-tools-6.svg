<svg viewBox="0 0 760 272" role="img" aria-label="田字格米字格回宫格三种练习格对比，米字格最常用" xmlns="http://www.w3.org/2000/svg" width="760" height="272"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="272"/>
  <text x="18" y="24" class="labk">三种练习格：线越多，你能读到的位置信息越多，但干扰也越大</text>
  <g>
    <rect x="40" y="46" width="150" height="150" class="cell" stroke="#7a7a7a"/>
    <line x1="115" y1="46" x2="115" y2="196" class="guide"/>
    <line x1="40" y1="121" x2="190" y2="121" class="guide"/>
    <text x="76" y="132" class="kai" style="font-size:44px;fill:#222">十</text>
    <text x="40" y="220" class="lab">田字格</text>
    <text x="40" y="238" class="lab2">只判横竖居中</text>
  </g>
  <g>
    <rect x="300" y="46" width="150" height="150" class="cell" stroke="#7a7a7a"/>
    <line x1="375" y1="46" x2="375" y2="196" class="guide"/>
    <line x1="300" y1="121" x2="450" y2="121" class="guide"/>
    <line x1="300" y1="46" x2="450" y2="196" class="guide"/>
    <line x1="450" y1="46" x2="300" y2="196" class="guide"/>
    <text x="336" y="132" class="kai" style="font-size:44px;fill:#222">大</text>
    <text x="300" y="220" class="lab">米字格（最常用）</text>
    <text x="300" y="238" class="lab2">斜线直接给撇捺角度</text>
  </g>
  <g>
    <rect x="560" y="46" width="150" height="150" class="cell" stroke="#7a7a7a"/>
    <rect x="605" y="91" width="60" height="60" class="f-none" stroke="#c0392b" stroke-dasharray="5 4"/>
    <line x1="635" y1="46" x2="635" y2="196" class="guide"/>
    <line x1="560" y1="121" x2="710" y2="121" class="guide"/>
    <text x="596" y="132" class="kai" style="font-size:44px;fill:#222">中</text>
    <text x="560" y="220" class="lab">回宫格</text>
    <text x="560" y="238" class="lab2">红框＝中宫，查是否收拢</text>
  </g>
  <path class="arrow" d="M196 121 L250 121 M242 115 L250 121 L242 127"/>
  <path class="arrow" d="M456 121 L510 121 M502 115 L510 121 L502 127"/>
  <text x="18" y="262" class="lab2">建议顺序：米字格练笔画 → 格线更少的纸练单字 → 无格纸写作品；三种格的"中线"都只用来判居中，不要拿它当字的边界。</text>
</svg>