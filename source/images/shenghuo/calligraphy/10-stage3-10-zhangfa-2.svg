<svg viewBox="0 0 760 250" role="img" aria-label="一蘸墨从湿到枯的循环与墨阶浓淡条" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
    <rect class="bg-paper" width="760" height="250"/>
    <text class="labk" x="40" y="26">墨阶：一碟墨倒出五档</text>
    <rect x="40" y="42" width="120" height="34" fill="#22211f"/>
    <rect x="160" y="42" width="120" height="34" fill="#22211f" opacity="0.7"/>
    <rect x="280" y="42" width="120" height="34" fill="#22211f" opacity="0.45"/>
    <rect x="400" y="42" width="120" height="34" fill="#22211f" opacity="0.22"/>
    <rect x="520" y="42" width="120" height="34" fill="#22211f" opacity="0.08"/>
    <text class="lab2" x="56" y="94">饱墨（涨）</text>
    <text class="lab2" x="182" y="94">浓</text>
    <text class="lab2" x="300" y="94">中</text>
    <text class="lab2" x="412" y="94">淡</text>
    <text class="lab2" x="524" y="94">将枯→飞白</text>
    <text class="labk" x="40" y="132">一蘸墨的寿命曲线：写完四到六字，回到起点</text>
    <path d="M40 210 C130 142 250 142 340 210" fill="none" stroke="#22211f" stroke-width="2.4"/>
    <path d="M420 210 C510 142 630 142 720 210" fill="none" stroke="#22211f" stroke-width="2.4"/>
    <circle class="dot" cx="40" cy="210" r="4"/>
    <circle class="dot" cx="340" cy="210" r="4"/>
    <circle class="dot" cx="420" cy="210" r="4"/>
    <circle class="dot" cx="720" cy="210" r="4"/>
    <text class="lab2" x="150" y="168">湿→干：一笔比一笔轻灵</text>
    <text class="lab2" x="530" y="168">枯后强写=病；蘸墨再战=节奏</text>
    <text class="lab2" x="40" y="242">蘸墨口令：笔杆竖、墨侵毫三分之二，碟边掭两转，锋齐再落纸。</text>
  </svg>