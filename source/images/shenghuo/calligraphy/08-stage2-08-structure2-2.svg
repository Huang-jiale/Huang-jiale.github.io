    <line class="body-line" x1="118" y1="142" x2="138" y2="176" stroke-width="6"/>
    <rect x="192" y="118" width="86" height="10" fill="#22211f"/>
    <rect x="230" y="76" width="9" height="160" fill="#22211f"/>
    <line class="body-line" x1="234" y1="128" x2="200" y2="222"/>
