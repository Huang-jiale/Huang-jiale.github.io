 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
    <rect class="bg-paper" width="360" height="300"/>
    <text class="labk" x="20" y="26">对：左缩右伸，捺让成点</text>
    <rect class="st" x="50" y="45" width="260" height="220" fill="none"/>
    <line class="guide" x1="180" y1="45" x2="180" y2="265"/>
    <line class="guide" x1="50" y1="155" x2="310" y2="155"/>
    <rect x="76" y="118" width="76" height="10" fill="#22211f"/>
