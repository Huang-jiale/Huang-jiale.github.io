<svg viewBox="0 0 360 250" role="img" aria-label="中锋与侧锋的笔尖位置与线条截面对比" xmlns="http://www.w3.org/2000/svg" width="360" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="360" height="250"/>
  <text x="18" y="24" class="labk">笔尖在哪，线条就长成什么样</text>
  <path d="M40 66 q60 -12 120 0 q60 12 160 -2" stroke="#222" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path class="arrow" d="M170 40 L170 56 M164 48 L170 56 L176 48"/>
  <circle cx="170" cy="70" r="4" class="dot"/>
  <text x="188" y="42" class="lab2">笔尖走在线条正中</text>
  <text x="18" y="112" class="lab">中锋：两侧墨色对称</text>
  <path d="M40 176 q60 -12 120 0 q60 12 160 -2" stroke="#222" stroke-width="14" fill="none" stroke-linecap="butt"/>
  <circle cx="150" cy="172" r="4" class="dot"/>
  <path class="arrow" d="M150 140 L150 160 M144 152 L150 160 L156 152"/>
  <text x="168" y="146" class="lab2">笔尖偏到上侧</text>
  <path d="M96 168 q40 -8 84 -2 l0 8 q-44 -6 -84 2 Z" class="f-none" stroke="#9a9a9a" stroke-dasharray="3 3"/>
  <text x="18" y="216" class="lab">侧锋：一边光、一边毛</text>
  <text x="18" y="238" class="lab2">这不是错，但不能一直这样写</text>
</svg>