<svg viewBox="0 0 760 280" role="img" aria-label="三步自检流程与木字中宫示意" xmlns="http://www.w3.org/2000/svg" width="760" height="280"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
    <rect class="bg-paper" width="760" height="280"/>
    <text class="labk" x="40" y="30">三步自检：每个字写完都走一遍</text>
    <rect class="st" x="40" y="52" width="200" height="66" fill="none" rx="8"/>
    <text class="num" x="58" y="82">① 盖帖默写</text>
    <text class="lab2" x="58" y="106">凭记忆写一个，不许偷看</text>
    <line class="arrow" x1="248" y1="85" x2="272" y2="85"/>
    <rect class="st" x="280" y="52" width="200" height="66" fill="none" rx="8"/>
    <text class="num" x="298" y="82">② 三线检查</text>
    <text class="lab2" x="298" y="106">重心线 / 等距 / 最长笔</text>
    <line class="arrow" x1="488" y1="85" x2="512" y2="85"/>
    <rect class="st" x="520" y="52" width="200" height="66" fill="none" rx="8"/>
    <text class="num" x="538" y="82">③ 圈一处改</text>
    <text class="lab2" x="538" y="106">只修最差那一笔，再写一遍</text>
    <rect class="st" x="60" y="146" width="140" height="118" fill="none"/>
    <rect class="st-thin" x="105" y="176" width="50" height="58" stroke-dasharray="4 3"/>
    <rect x="82" y="184" width="96" height="10" fill="#22211f"/>
    <polygon points="124,160 136,160 134,252 130,260 126,252" fill="#22211f"/>
    <line class="body-line" x1="130" y1="194" x2="96" y2="252"/>
    <line class="body-line" x1="130" y1="194" x2="166" y2="252"/>
    <text class="lab2" x="46" y="278">木：虚线框=中宫</text>
    <text class="lab" x="250" y="176">读法：主要笔画（横竖交叉）收在虚线小框里，</text>
    <text class="lab" x="250" y="200">四笔笔意都从这个框出发伸向格角。</text>
    <text class="lab2" x="250" y="230">散：中宫太大，笔画各奔东西；</text>
    <text class="lab2" x="250" y="252">拘：主笔不敢伸出中宫，字缩成枣核。</text>
  </svg>