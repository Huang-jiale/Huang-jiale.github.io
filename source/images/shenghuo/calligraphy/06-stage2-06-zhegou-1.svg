<svg viewBox="0 0 760 260" role="img" aria-label="折笔换面：提按调锋三拍分解示意" xmlns="http://www.w3.org/2000/svg" width="760" height="260"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
    <rect class="bg-paper" width="760" height="260"/>
    <defs><marker id="zg1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0f6ab5"/></marker></defs>
    <text class="labk" x="40" y="28">折的核心：拐点处提—按—换向</text>
    <rect x="70" y="45" width="180" height="180" fill="none" stroke="#c9c4ba" stroke-width="1.6"/>
    <line class="guide" x1="160" y1="45" x2="160" y2="225"/>
    <line class="guide" x1="70" y1="135" x2="250" y2="135"/>
    <line class="guide" x1="70" y1="45" x2="250" y2="225"/>
    <line class="guide" x1="250" y1="45" x2="70" y2="225"/>
    <path class="stroke-in" d="M92 92 C96 86 210 84 222 88 L224 116 C226 156 224 188 220 210 L202 210 C206 184 206 150 204 108 C172 108 118 108 96 108 Z"/>
    <path class="arrow" d="M100 98 L212 96 L210 200" marker-end="url(#zg1)"/>
    <circle class="dot" cx="150" cy="96" r="8"/><text class="f-white" x="146" y="101" font-size="12">1</text>
    <circle class="dot" cx="214" cy="106" r="8"/><text class="f-white" x="210" y="111" font-size="12">2</text>
    <circle class="dot" cx="210" cy="162" r="8"/><text class="f-white" x="206" y="167" font-size="12">3</text>
    <text class="lab" x="300" y="66">①行笔：横走到拐点前，锋在中</text>
    <text class="lab" x="300" y="106">②转（关键）：先提、再右下顿，</text>
    <text class="lab2" x="316" y="126">把笔尖拨回正中（换面）</text>
    <text class="lab" x="300" y="160">③收（接势）：转向下行，写下一段</text>
    <text class="lab2" x="300" y="200">口诀：提得干净，才按得出角</text>
  </svg>