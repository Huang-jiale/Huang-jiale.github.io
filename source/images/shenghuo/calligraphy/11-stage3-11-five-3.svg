<svg viewBox="0 0 760 250" role="img" aria-label="五体的字形轮廓倾向：篆纵长、隶扁方、楷方正、行略倾、草连成轨迹" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="250"/>
  <text x="18" y="26" class="labk">外轮廓倾向：长、扁、方、斜、连（统计印象，不是规定）</text>
  <rect x="50" y="56" width="72" height="124" class="guide"/>
  <path d="M62 74 H110 M86 74 V166 M62 166 H110" class="st" style="stroke-width:3"/>
  <rect x="192" y="92" width="128" height="60" class="guide"/>
  <path d="M204 104 H308 M204 140 H308 M258 100 V146" class="st" style="stroke-width:3"/>
  <rect x="372" y="74" width="96" height="96" class="guide"/>
  <text x="420" y="158" class="kai" style="font-size:72px" text-anchor="middle">正</text>
  <path d="M536 106 H590 M562 100 V158" class="st" style="stroke-width:4;stroke-linecap:round"/>
  <path d="M648 96 q28 -14 40 6 q10 22 -12 26 q-26 6 -14 24 q10 14 44 4" class="st" style="stroke-width:5;stroke-linecap:round"/>
  <text x="86" y="200" class="lab" text-anchor="middle">篆：纵长</text>
  <text x="256" y="200" class="lab" text-anchor="middle">隶：扁方</text>
  <text x="420" y="200" class="lab" text-anchor="middle">楷：方正</text>
  <text x="561" y="200" class="lab" text-anchor="middle">行：略倾</text>
  <text x="682" y="200" class="lab" text-anchor="middle">草：连成线</text>
  <text x="86" y="222" class="lab2" text-anchor="middle">上放下收</text>
  <text x="256" y="222" class="lab2" text-anchor="middle">左右伸展</text>
  <text x="420" y="222" class="lab2" text-anchor="middle">大小均匀</text>
  <text x="561" y="222" class="lab2" text-anchor="middle">势是动的</text>
  <text x="682" y="222" class="lab2" text-anchor="middle">轮廓不定</text>
  <text x="18" y="244" class="lab2">眯起眼睛只看黑块的外框：长条是篆、横块是隶、方块是楷、歪的方块是行、一条轨迹是草。只有楷这一格是真字形，其余四格只画倾向。</text>
</svg>