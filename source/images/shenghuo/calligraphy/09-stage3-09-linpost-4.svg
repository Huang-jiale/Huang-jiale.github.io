<svg viewBox="0 0 760 300" role="img" aria-label="摹的装置侧视剖面：帖在下、硫酸纸在上、笔尖沿范字中线走" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="300"/>
  <text x="18" y="26" class="labk">摹的装置：帖在下、半透明纸在上，笔尖看得见底下的字</text>
  <line x1="40" y1="160" x2="420" y2="160" class="st"/>
  <rect x="100" y="142" width="270" height="14" class="f-g3" stroke="#8a8a8a"/>
  <rect x="92" y="126" width="286" height="8" class="f-g1" stroke="#8a8a8a"/>
  <line x1="252" y1="50" x2="218" y2="122" class="body-line"/>
  <circle cx="216" cy="126" r="4" class="dot"/>
  <path class="st-thin" d="M378 130 L428 110"/>
  <path class="st-thin" d="M370 148 L428 142"/>
  <text x="432" y="108" class="lab2">硫酸纸／透明垫板（看得见帖上的格与字）</text>
  <text x="432" y="142" class="lab2">字帖（垫在下面，四角固定）</text>
  <text x="432" y="172" class="lab2">桌面（下垫毛毡或旧报纸）</text>
  <text x="40" y="200" class="lab">① 对齐格线：重合成一条细线才算对。</text>
  <text x="40" y="224" class="lab">② 沿中线走：一笔一遍，不描不填。</text>
  <text x="40" y="248" class="lab">③ 量要小：摹 3 遍就停，立刻掀纸临 2 遍。</text>
  <text x="40" y="278" class="lab2">摹解决"手不知道怎么走"，不解决"眼睛没看清"，所以必须和临配对使用。</text>
</svg>