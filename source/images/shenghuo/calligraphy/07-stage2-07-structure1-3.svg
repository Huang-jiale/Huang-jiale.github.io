<svg viewBox="0 0 760 270" role="img" aria-label="口字重心：上下横中点对齐，左右竖内收" xmlns="http://www.w3.org/2000/svg" width="760" height="270"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
    <rect class="bg-paper" width="760" height="270"/>
    <rect class="st" x="40" y="28" width="214" height="214" fill="none"/>
    <line class="guide" x1="147" y1="28" x2="147" y2="242"/>
    <line class="guide" x1="40" y1="135" x2="254" y2="135"/>
    <polygon points="99,78 205,78 198,93 106,93" fill="#22211f"/>
    <polygon points="108,196 196,196 189,211 115,211" fill="#22211f"/>
    <polygon points="99,78 113,78 118,211 104,211" fill="#22211f"/>
    <polygon points="191,78 205,78 198,211 184,211" fill="#22211f"/>
    <line class="st-red" x1="152" y1="66" x2="152" y2="226" stroke-dasharray="6 5"/>
    <text class="lab2" x="126" y="252">上横中点</text>
    <text class="lab2" x="34" y="20">本课记法：口作倒梯</text>
    <text class="labk" x="300" y="24">「口」的三条规矩</text>
    <text class="lab" x="300" y="60">① 左右两竖微微内收，上宽下窄，</text>
    <text class="lab" x="336" y="82">像倒扣的梯形的两条腰；</text>
    <text class="lab" x="300" y="112">② 上横、下横的中点都落在红色</text>
    <text class="lab" x="336" y="134">重心线上——错开字就歪；</text>
    <text class="lab" x="300" y="164">③ 竖中线把口分成左右两半，</text>
    <text class="lab" x="336" y="186">写的时候左右笔画对望着落。</text>
    <text class="lab2" x="300" y="222">「日」「目」「田」都按这三条检查。</text>
  </svg>