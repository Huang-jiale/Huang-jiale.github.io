<svg viewBox="0 0 360 220" role="img" aria-label="平捺：走向更平，一波三折夸张，捺脚拖得长，托住上方部件" xmlns="http://www.w3.org/2000/svg" width="360" height="220"><style> svg{display:block;width:100%;height:auto}
