<svg viewBox="0 0 760 260" role="img" aria-label="背的三个动作：帖上原字、合帖默写、叠合找偏差" xmlns="http://www.w3.org/2000/svg" width="760" height="260"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="260"/>
  <text x="18" y="24" class="labk">背：合上帖默写，把"没读到的地方"暴露出来</text>
  <rect x="40" y="50" width="100" height="100" class="st"/>
  <line x1="90" y1="50" x2="90" y2="150" class="guide"/>
  <line x1="40" y1="100" x2="140" y2="100" class="guide"/>
  <text x="90" y="128" class="kai" style="font-size:60px" fill="#9a9a9a" text-anchor="middle">中</text>
  <rect x="190" y="50" width="100" height="100" class="st"/>
  <line x1="240" y1="50" x2="240" y2="150" class="guide"/>
  <line x1="190" y1="100" x2="290" y2="100" class="guide"/>
  <rect class="stroke-in" x="222" y="72" width="6" height="46"/>
  <rect class="stroke-in" x="228" y="72" width="30" height="5"/>
  <rect class="stroke-in" x="253" y="72" width="5" height="46"/>
  <rect class="stroke-in" x="228" y="113" width="30" height="5"/>
  <rect class="stroke-in" x="234" y="60" width="7" height="74"/>
  <rect x="340" y="50" width="100" height="100" class="st"/>
  <line x1="390" y1="50" x2="390" y2="150" class="guide"/>
  <line x1="340" y1="100" x2="440" y2="100" class="guide"/>
  <text x="390" y="128" class="kai" style="font-size:60px" fill="#c9c4ba" text-anchor="middle">中</text>
  <rect class="stroke-in" x="370" y="70" width="6" height="46"/>
  <rect class="stroke-in" x="376" y="70" width="30" height="5"/>
  <rect class="stroke-in" x="401" y="70" width="5" height="46"/>
  <rect class="stroke-in" x="376" y="111" width="30" height="5"/>
  <rect class="stroke-in" x="382" y="58" width="7" height="74"/>
  <circle cx="386" cy="95" r="30" class="st-bad"/>
  <text x="90" y="176" class="lab2" text-anchor="middle">帖上原字</text>
  <text x="240" y="176" class="lab2" text-anchor="middle">合帖默写（红）</text>
  <text x="390" y="176" class="lab2" text-anchor="middle">叠合看偏差</text>
  <text x="470" y="64" class="lab">① 默写 2 遍：不看帖，凭刚才读到的位置写</text>
  <text x="470" y="88" class="lab">② 找断点：哪一笔让你发呆，就是没读</text>
  <text x="470" y="112" class="lab">③ 空书补救：先悬空比划三遍再翻帖</text>
  <text x="470" y="136" class="lab">④ 断点记到纸边，交给"核"处理</text>
  <text x="470" y="166" class="lab2">红字的问题一眼可见：竖没压中线、整体偏右；</text>
  <text x="470" y="186" class="lab2">"口"写高了，重心不稳。这就是明天的读帖任务。</text>
  <text x="18" y="220" class="lab2">背不出结构时，先在格子里只画一条重心线，再沿这条线补主笔，最后补剩下几笔：三笔成字，比一次写整字更容易成功。</text>
  <text x="18" y="246" class="lab2">背的价值：把"我大概记住了"变成一句可检查的话——"竖压中线记住了，口的高低没记住"。</text>
</svg>