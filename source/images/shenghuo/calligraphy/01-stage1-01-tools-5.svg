<svg viewBox="0 0 760 230" role="img" aria-label="三滴墨在生宣半生熟熟宣上的扩散对比" xmlns="http://www.w3.org/2000/svg" width="760" height="230"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="230"/>
  <text x="18" y="24" class="labk">一滴同样大小的墨，落在三种纸上：扩散半径就是"吸水性"</text>
  <circle cx="130" cy="110" r="66" class="f-g3" opacity=".55"/>
  <circle cx="130" cy="110" r="40" class="f-g2" opacity=".7"/>
  <circle cx="130" cy="110" r="14" fill="#222"/>
  <text x="70" y="200" class="lab">生宣：一圈一圈散开</text>
  <text x="70" y="218" class="lab2">笔画边缘有绒毛 → 新手误判为"我手抖"</text>
  <circle cx="380" cy="110" r="34" class="f-g3" opacity=".5"/>
  <circle cx="380" cy="110" r="15" fill="#222"/>
  <text x="320" y="200" class="lab">半生熟：微洇一圈</text>
  <text x="320" y="218" class="lab2">起收笔的形状看得清 → 适合临帖</text>
  <circle cx="620" cy="110" r="15" fill="#222"/>
  <circle cx="620" cy="110" r="15" class="f-none" stroke="#8a8a8a"/>
  <text x="560" y="200" class="lab">熟宣：几乎不散</text>
  <text x="560" y="218" class="lab2">墨浮在表面，笔画显薄、显滑</text>
  <path class="arrow" d="M196 110 L250 110 M242 104 L250 110 L242 116"/>
  <path class="arrow" d="M446 110 L500 110 M492 104 L500 110 L492 116"/>
  <text x="196" y="96" class="lab2">吸水性递减 →</text>
</svg>