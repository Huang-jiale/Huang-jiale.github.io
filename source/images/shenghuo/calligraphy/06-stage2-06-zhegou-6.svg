    <text class="lab" x="280" y="66">起：横向右行，到右端</text>
    <text class="lab" x="280" y="106">转：一顿，短促而实</text>
    <text class="lab" x="280" y="146">收：向左下踢出，出锋更陡</text>
    <text class="lab2" x="280" y="190">忌：末端画成圆弧没踢脚</text>
  </svg>