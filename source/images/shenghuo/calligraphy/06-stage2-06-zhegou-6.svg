    <rect class="bg-paper" width="760" height="250"/>
    <defs><marker id="zg3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0f6ab5"/></marker></defs>
    <text class="labk" x="40" y="26">横钩 · 顿一下就向左下踢</text>
    <rect x="70" y="45" width="160" height="160" fill="none" stroke="#c9c4ba" stroke-width="1.6"/>
    <line class="guide" x1="150" y1="45" x2="150" y2="205"/>
