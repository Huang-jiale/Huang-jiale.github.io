    <line class="guide" x1="70" y1="45" x2="230" y2="205"/>
    <line class="guide" x1="230" y1="45" x2="70" y2="205"/>
    <path class="stroke-in" d="M96 92 C104 86 200 84 214 92 C216 108 202 124 176 132 C186 122 196 116 196 106 C166 104 116 104 96 104 Z"/>
