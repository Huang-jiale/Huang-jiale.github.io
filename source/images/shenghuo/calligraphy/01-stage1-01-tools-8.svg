<svg viewBox="0 0 760 210" role="img" aria-label="选帖四步决策流程图" xmlns="http://www.w3.org/2000/svg" width="760" height="210"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="210"/>
  <text x="18" y="24" class="labk">四步挑定第一本帖（10 分钟内能做完，别纠结）</text>
  <rect x="20" y="52" width="150" height="54" class="f-white" stroke="#8a8a8a"/>
  <text x="34" y="76" class="lab">① 先定书体</text>
  <text x="34" y="96" class="lab2">楷／隶 优先，行草后置</text>
  <path class="arrow" d="M172 79 L206 79 M198 73 L206 79 L198 85"/>
  <rect x="208" y="52" width="150" height="54" class="f-white" stroke="#8a8a8a"/>
  <text x="222" y="76" class="lab">② 挑清晰的印本</text>
  <text x="222" y="96" class="lab2">单字放大页边缘要锐利</text>
  <path class="arrow" d="M360 79 L394 79 M386 73 L394 79 L386 85"/>
  <rect x="396" y="52" width="150" height="54" class="f-white" stroke="#8a8a8a"/>
  <text x="410" y="76" class="lab">③ 挑"合口味"那本</text>
  <text x="410" y="96" class="lab2">两本之间选更喜欢的</text>
  <path class="arrow" d="M548 79 L582 79 M574 73 L582 79 L574 85"/>
  <rect x="584" y="52" width="156" height="54" class="f-white" stroke="#c0392b"/>
  <text x="598" y="76" class="lab">④ 定死不换</text>
  <text x="598" y="96" class="lab2">至少读完 30 天再评价</text>
  <text x="20" y="146" class="lab">反面清单（常见的浪费钱方式）：一次买五本、今天颜明天欧；买"速成描红"却没有单笔讲解；只买字帖不买格子纸。</text>
  <text x="20" y="172" class="lab">换帖的信号（至少要满足一条）：一本帖里的 20 个字能背写且形准；或者连续两周完全不想写、且原因确认是"字形不喜欢"。</text>
  <text x="20" y="198" class="lab2">提醒：选帖只解决"临什么"，不解决"怎么写"。前 6 课先把执笔与八种基本笔画练到手有反应，再进入临帖效率才高。</text>
</svg>