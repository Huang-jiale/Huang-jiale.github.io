<svg viewBox="0 0 360 250" role="img" aria-label="运腕与运指分工的弧线示意图" xmlns="http://www.w3.org/2000/svg" width="360" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="360" height="250"/>
  <text x="18" y="24" class="labk">同一支笔，两种发力</text>
  <circle cx="60" cy="150" r="6" class="joint"/>
  <path class="arrow-r" d="M60 150 q60 -70 180 -34"/>
  <path class="arrow" d="M200 68 L240 78 M232 70 L240 78 L238 86"/>
  <text x="18" y="96" class="lab">腕为圆心 → 长弧线</text>
  <text x="18" y="116" class="lab2">送笔到位置，方向稳</text>
  <text x="18" y="176" class="lab">指做微调 → 提按</text>
  <path class="arrow" d="M286 140 L286 170 M280 162 L286 170 L292 162"/>
  <text x="296" y="158" class="lab2">粗细</text>
  <path d="M40 210 q40 -10 80 0 q40 10 80 0 q30 -6 60 0" class="st-ok" stroke-width="4"/>
  <text x="18" y="240" class="lab2">✓ 腕送方向＋指给粗细：这条线有呼吸</text>
</svg>