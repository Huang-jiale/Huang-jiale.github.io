<svg viewBox="0 0 760 280" role="img" aria-label="日的横画等距与山的竖画等距对照" xmlns="http://www.w3.org/2000/svg" width="760" height="280"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
    <rect class="bg-paper" width="760" height="280"/>
    <text class="labk" x="40" y="26">横等距：以「日」为例</text>
    <rect class="st" x="60" y="40" width="210" height="210" fill="none"/>
    <line class="guide" x1="165" y1="40" x2="165" y2="250"/>
    <line class="guide" x1="60" y1="145" x2="270" y2="145"/>
    <rect x="110" y="70" width="110" height="13" fill="#22211f"/>
    <rect x="110" y="143" width="110" height="13" fill="#22211f"/>
    <rect x="110" y="216" width="110" height="13" fill="#22211f"/>
    <rect x="110" y="70" width="13" height="159" fill="#22211f"/>
    <rect x="207" y="70" width="13" height="159" fill="#22211f"/>
    <line class="st-red" x1="96" y1="83" x2="96" y2="143"/>
    <text class="lab2" x="52" y="118">① 50</text>
    <line class="st-red" x1="96" y1="156" x2="96" y2="216"/>
    <text class="lab2" x="52" y="191">② 50</text>
    <text class="lab2" x="112" y="272">①≈②，中横宁高勿低</text>
    <text class="labk" x="420" y="26">竖等距：以「山」为例</text>
    <rect class="st" x="440" y="40" width="210" height="210" fill="none"/>
    <line class="guide" x1="545" y1="40" x2="545" y2="250"/>
    <line class="guide" x1="440" y1="145" x2="650" y2="145"/>
    <rect x="475" y="120" width="13" height="98" fill="#22211f"/>
    <rect x="539" y="64" width="13" height="154" fill="#22211f"/>
    <rect x="603" y="120" width="13" height="98" fill="#22211f"/>
    <rect x="475" y="218" width="141" height="13" fill="#22211f"/>
    <line class="st-red" x1="488" y1="106" x2="539" y2="106"/>
    <text class="lab2" x="493" y="98">① 51</text>
    <line class="st-red" x1="552" y1="106" x2="603" y2="106"/>
    <text class="lab2" x="557" y="98">② 51</text>
    <circle class="dot" cx="545" cy="70" r="3"/>
    <text class="lab2" x="575" y="60">中竖最长，当家</text>
    <text class="lab2" x="440" y="272">「川」同理：三竖身段不同、间距相同</text>
  </svg>