<svg viewBox="0 0 760 200" role="img" aria-label="新手案头布置侧视与俯视示意" xmlns="http://www.w3.org/2000/svg" width="760" height="200"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="200"/>
  <text x="18" y="24" class="labk">案头布置：只检查五件事</text>
  <rect x="40" y="120" width="300" height="14" class="f-g2"/>
  <text x="40" y="112" class="lab2">桌面（能放下一张对折的四尺纸）</text>
  <rect x="60" y="104" width="150" height="16" class="f-g1" stroke="#8a8a8a"/>
  <text x="60" y="96" class="lab">纸（正身稍偏左）</text>
  <rect x="240" y="96" width="10" height="24" class="f-g4"/>
  <text x="220" y="88" class="lab2">笔架／笔山</text>
  <circle cx="285" cy="104" r="14" class="f-none" stroke="#8a8a8a"/>
  <text x="266" y="140" class="lab2">水盂</text>
  <rect x="60" y="140" width="270" height="10" class="f-g3"/>
  <text x="60" y="166" class="lab">毛毡或几层报纸垫在纸下：吸余墨、防滑</text>
  <text x="400" y="60" class="lab">① 灯在左前方，手影不压住笔尖</text>
  <text x="400" y="84" class="lab">② 椅面让前臂能平搭桌沿，肩不端</text>
  <text x="400" y="108" class="lab">③ 墨碟小、浅，别让笔插到底</text>
  <text x="400" y="132" class="lab">④ 废纸一张，永远放在右侧试墨</text>
  <text x="400" y="156" class="lab">⑤ 手机放到看不见的位置（一小时起）</text>
  <text x="18" y="188" class="lab2">砚台可以后置：先用墨汁把"写字"这件事跑通，再决定要不要玩磨墨。</text>
</svg>