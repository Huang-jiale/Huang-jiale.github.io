<svg viewBox="0 0 760 250" role="img" aria-label="左右、上下、包围三种部件关系概念图" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
    <rect class="bg-paper" width="760" height="250"/>
    <text class="labk" x="40" y="28">组合字的三种关系</text>
    <text class="lab" x="40" y="64">左右：一窄一宽，等高或左低右高</text>
    <rect x="60" y="90" width="44" height="90" fill="#22211f"/>
    <rect x="112" y="80" width="86" height="100" fill="#22211f"/>
    <line class="arrow" x1="104" y1="135" x2="112" y2="135"/>
    <text class="lab2" x="60" y="208">窄让宽</text>
    <text class="lab" x="280" y="64">上下：一收一放，中线穿珠</text>
    <rect x="300" y="84" width="120" height="26" fill="#22211f"/>
    <rect x="330" y="122" width="60" height="62" fill="#22211f"/>
    <line class="st-red" x1="360" y1="76" x2="360" y2="192" stroke-dasharray="5 4"/>
    <text class="lab2" x="300" y="208">上收下放</text>
    <text class="lab" x="520" y="64">包围：外墙方正，内件居中</text>
    <rect class="st" x="540" y="84" width="110" height="106" fill="none" stroke-width="9"/>
    <rect x="572" y="112" width="46" height="50" fill="#22211f"/>
    <text class="lab2" x="540" y="208">里不顶墙</text>
    <text class="lab2" x="40" y="232">三种关系的共同点：谁也不许把对方的地盘占了。</text>
  </svg>