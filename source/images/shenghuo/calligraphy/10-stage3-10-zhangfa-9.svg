<svg viewBox="0 0 760 320" role="img" aria-label="斗方、条幅、横幅、册页、对联五种幅式的形状示意" xmlns="http://www.w3.org/2000/svg" width="760" height="320"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
    <rect class="bg-paper" width="760" height="320"/>
    <text class="labk" x="40" y="26">五种幅式的形状与读序（竖线=读列方向）</text>
    <rect class="st" x="52" y="56" width="96" height="216" fill="none"/>
    <line class="st-thin" x1="100" y1="72" x2="100" y2="256"/>
    <text class="labk" x="60" y="298">条幅</text>
    <text class="lab2" x="46" y="316">竖长，自右向左多列</text>
    <rect class="st" x="196" y="116" width="128" height="118" fill="none"/>
    <line class="st-thin" x1="228" y1="132" x2="228" y2="218"/>
    <line class="st-thin" x1="264" y1="132" x2="264" y2="218"/>
    <text class="labk" x="224" y="298">斗方</text>
    <text class="lab2" x="196" y="316">近方，列少而从容</text>
    <rect class="st" x="386" y="150" width="220" height="86" fill="none"/>
    <line class="st-thin" x1="404" y1="192" x2="588" y2="192"/>
    <text class="labk" x="466" y="298">横幅</text>
    <text class="lab2" x="386" y="316">横长；旧自右向左，新式左起</text>
    <rect class="st" x="644" y="60" width="56" height="64" fill="none"/>
    <rect class="st" x="656" y="72" width="56" height="64" fill="none"/>
    <rect class="st" x="644" y="150" width="56" height="64" fill="none"/>
    <rect class="st" x="656" y="162" width="56" height="64" fill="none"/>
    <text class="labk" x="634" y="298">册页</text>
    <text class="lab2" x="634" y="316">小页成册，把玩尺寸</text>
    <rect class="st" x="560" y="48" width="26" height="80" fill="none"/>
    <rect class="st" x="600" y="48" width="26" height="80" fill="none"/>
    <text class="labk" x="556" y="146">对联</text>
    <text class="lab2" x="552" y="164">两条竖幅，字数字句相对</text>
  </svg>