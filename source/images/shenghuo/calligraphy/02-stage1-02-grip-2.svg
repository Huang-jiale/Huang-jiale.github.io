<svg viewBox="0 0 760 240" role="img" aria-label="掌虚与拳握两种执笔的正误对比与掌心空隙" xmlns="http://www.w3.org/2000/svg" width="760" height="240"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="240"/>
  <text x="18" y="24" class="labk">同一段线条，两种执笔写出来：掌虚能提按，拳握只会平拖</text>
  <g>
    <text x="40" y="58" class="lab">✓ 掌虚：掌心容卵</text>
    <ellipse cx="86" cy="112" rx="34" ry="26" class="f-none" stroke="#2f7d42" stroke-dasharray="5 4"/>
    <text x="70" y="118" class="lab2">空</text>
    <rect x="126" y="70" width="10" height="86" rx="5" class="f-g3" transform="rotate(8 131 113)"/>
    <path d="M40 170 q22 -16 44 -2 q22 14 44 -2 q20 -14 40 2" class="st-ok" stroke-width="4"/>
    <text x="40" y="196" class="lab2">按→提→按，粗细自然变化</text>
    <text x="40" y="216" class="lab2">（这一段就是后面横与竖的地基）</text>
  </g>
  <g>
    <text x="330" y="58" class="lab">✗ 拳握：掌心贴死</text>
    <circle cx="378" cy="112" r="30" class="f-g1"/>
    <rect x="368" y="72" width="12" height="80" rx="6" class="f-g4"/>
    <path d="M330 170 L470 168" class="st-bad" stroke-width="5"/>
    <text x="330" y="196" class="lab2">整条一样粗，像火柴棍</text>
    <text x="330" y="216" class="lab2">手指被拳头锁住，提不起来</text>
  </g>
  <g>
    <text x="530" y="58" class="lab">✗ 勾腕：手腕向内钩</text>
    <path class="body-line" d="M640 70 q0 40 -26 54 q-24 12 -34 34"/>
    <circle cx="640" cy="64" r="10" class="head"/>
    <path class="st-bad" d="M590 162 q26 -10 60 -6"/>
    <text x="530" y="196" class="lab2">腕一钩，笔尖就被压向一侧</text>
    <text x="530" y="216" class="lab2">改法：小臂外旋一点，让腕背朝上</text>
  </g>
  <path class="arrow" d="M250 112 L300 112 M292 106 L300 112 L292 118"/>
  <text x="236" y="100" class="lab2">对比</text>
</svg>