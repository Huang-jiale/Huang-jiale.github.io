<svg viewBox="0 0 760 320" role="img" aria-label="五指执笔法：擫押钩格抵五字分工与用力方向示意" xmlns="http://www.w3.org/2000/svg" width="760" height="320"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="320"/>
  <text x="18" y="24" class="labk">右手执笔，从外侧看：五个字对应五处着力（箭头＝用力方向）</text>
  <rect x="318" y="44" width="13" height="196" rx="6" class="f-g3" stroke="#8a8a8a"/>
  <text x="300" y="38" class="lab2">笔杆（略前倾）</text>
  <path d="M324 240 q2 26 -4 44" class="st" stroke-width="4" stroke-linecap="round"/>
  <circle cx="320" cy="290" r="4" class="dot"/>
  <text x="336" y="296" class="lab2">笔尖在下方，是唯一"干活"的部分</text>
  <path class="body-line" d="M276 132 L318 122"/>
  <path class="body-line" d="M374 116 L331 124"/>
  <path class="body-line" d="M372 154 q-14 8 -41 8"/>
  <path class="body-line" d="M370 188 L332 186"/>
  <path class="body-line" d="M364 212 L334 208"/>
  <path class="arrow" d="M250 112 L272 126 M262 118 L272 126 L266 132"/>
  <path class="arrow" d="M398 96 L378 112 M378 102 L378 112 L388 108"/>
  <text x="40" y="112" class="lab">① 擫（大指）：指腹由内向外按</text>
  <text x="40" y="140" class="lab">② 押（食指）：第一节由外向内压</text>
  <text x="40" y="168" class="lab">③ 钩（中指）：指节钩住笔杆内侧</text>
  <text x="40" y="196" class="lab">④ 格（无名指）：指甲肉处向外顶</text>
  <text x="40" y="224" class="lab">⑤ 抵（小指）：垫在无名指下助力</text>
  <text x="40" y="252" class="lab2">①④⑤ 把笔往外推，②③ 把笔往里拉，五力相抵＝笔稳</text>
  <text x="40" y="276" class="lab2">掌心要空（图中大指与食指之间留出的缝）</text>
  <text x="440" y="150" class="lab">大指与食指成"环"而不"捏"</text>
  <text x="440" y="176" class="lab2">检查法：别人捏住笔杆轻抽，</text>
  <text x="440" y="196" class="lab2">抽不动＝稳；一动就整手跟着紧＝死</text>
  <text x="440" y="230" class="lab">三个"不许"：</text>
  <text x="440" y="252" class="lab2">不许小指翘起、不许中指僵直、</text>
  <text x="440" y="272" class="lab2">不许把指甲按白（说明太用力）</text>
  <path class="arrow" d="M300 250 L330 250 M322 244 L330 250 L322 256"/>
</svg>