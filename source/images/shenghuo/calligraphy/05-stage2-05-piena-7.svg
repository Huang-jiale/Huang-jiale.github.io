.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
      <rect class="bg-paper" width="360" height="220"/>
      <text class="labk" x="180" y="28" text-anchor="middle">反捺：顿收不弹</text>
      <line class="st-blue" x1="96" y1="60" x2="222" y2="150" stroke-width="12"/>
      <circle class="st-blue" cx="226" cy="153" r="9"/>
      <line class="arrow" x1="242" y1="150" x2="222" y2="132"/>
      <text class="lab2" x="70" y="90">顺势向右下行</text>
