<svg viewBox="0 0 760 220" role="img" aria-label="从秦到宋元的书体通行时间轴与两条入门路线" xmlns="http://www.w3.org/2000/svg" width="760" height="220"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="220"/>
  <text x="18" y="26" class="labk">时间轴：只排"哪个朝代通行写什么"，不排高下</text>
  <path class="st" d="M40 78 H720"/>
  <circle cx="112" cy="78" r="4" class="dot"/>
  <circle cx="252" cy="78" r="4" class="dot"/>
  <circle cx="392" cy="78" r="4" class="dot"/>
  <circle cx="532" cy="78" r="4" class="dot"/>
  <circle cx="652" cy="78" r="4" class="dot"/>
  <text x="112" y="66" class="labk" text-anchor="middle">秦</text>
  <text x="252" y="66" class="labk" text-anchor="middle">汉</text>
  <text x="392" y="66" class="labk" text-anchor="middle">魏晋南北朝</text>
  <text x="532" y="66" class="labk" text-anchor="middle">唐</text>
  <text x="652" y="66" class="labk" text-anchor="middle">宋元</text>
  <text x="112" y="102" class="lab2" text-anchor="middle">小篆为正体</text>
  <text x="252" y="102" class="lab2" text-anchor="middle">隶书通行</text>
  <text x="392" y="102" class="lab2" text-anchor="middle">楷行草并起</text>
  <text x="532" y="102" class="lab2" text-anchor="middle">楷法成熟、大草极盛</text>
  <text x="652" y="102" class="lab2" text-anchor="middle">行草与楷并行</text>
  <text x="18" y="140" class="lab">这条线只解决一件事：篆隶在前、楷行草在后，是先后，不是高低。</text>
  <rect x="24" y="156" width="350" height="36" class="f-g2"/>
  <text x="38" y="180" class="lab">甲：楷 → 行 → 再选隶或草</text>
  <rect x="390" y="156" width="338" height="36" class="f-g3"/>
  <text x="404" y="180" class="lab">乙：隶 → 楷（补动作）→ 行 → 草</text>
</svg>