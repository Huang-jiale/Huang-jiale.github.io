<svg viewBox="0 0 760 240" role="img" aria-label="常见病笔对照：柴担、折腰、鼠尾、鹤膝四种坏的横竖与正确写法并排" xmlns="http://www.w3.org/2000/svg" width="760" height="240"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
    <rect class="bg-paper" width="760" height="240"/>
    <text class="labk" x="380" y="28" text-anchor="middle">病笔对照（红为错，黑为对）</text>
    <text class="lab2" x="60" y="66">柴担：中细两头顶</text>
    <path class="st-bad" d="M60,86 L100,82 L300,90 L340,86 L340,96 L300,94 L100,100 L60,96 Z" fill="none"/>
    <text class="lab2" x="60" y="130">折腰：中段下塌</text>
    <path class="st-bad" d="M60,148 L340,148" fill="none"/>
    <path class="st-bad" d="M180,148 L220,168 L260,148" fill="none"/>
    <text class="lab2" x="60" y="200">鼠尾：收笔甩虚尖</text>
    <line class="st-bad" x1="60" y1="214" x2="260" y2="214"/>
    <path class="st-bad" d="M260,214 C300,212 330,208 350,202" fill="none"/>
    <line class="guide" x1="420" y1="44" x2="420" y2="228"/>
    <text class="lab2" x="470" y="66">正确横：粗细有呼吸</text>
    <line class="st-ok" x1="470" y1="88" x2="720" y2="86" stroke-width="12"/>
    <text class="lab2" x="470" y="130">正确竖：挺拔不抖</text>
    <line class="st-ok" x1="520" y1="146" x2="520" y2="226" stroke-width="12"/>
    <text class="lab2" x="600" y="130">垂露末端圆</text>
    <line class="st-ok" x1="660" y1="146" x2="660" y2="214" stroke-width="12"/>
    <circle class="st-ok" cx="660" cy="218" r="8"/>
  </svg>