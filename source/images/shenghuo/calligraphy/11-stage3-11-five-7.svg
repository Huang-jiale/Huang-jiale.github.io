<svg viewBox="0 0 760 240" role="img" aria-label="行书的牵丝映带与楷行草速度谱" xmlns="http://www.w3.org/2000/svg" width="760" height="240"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="240"/>
  <text x="18" y="26" class="labk">行书的两件东西：牵丝（留在纸上）与映带（走在纸外）</text>
  <rect x="40" y="48" width="200" height="140" class="guide"/>
  <path d="M70 84 H150" class="st" style="stroke-width:8;stroke-linecap:round"/>
  <path d="M110 84 V170" class="st" style="stroke-width:9;stroke-linecap:round"/>
  <path class="st-thin" d="M72 90 q20 26 38 44"/>
  <path class="st-thin" d="M112 172 q30 12 60 -6"/>
  <path d="M160 100 q18 -6 26 12 q6 22 -6 40" class="st" style="stroke-width:7;stroke-linecap:round"/>
  <text x="52" y="208" class="lab2">细线＝牵丝；粗线＝笔画</text>
  <text x="270" y="72" class="lab">① 牵丝要有，不能太多</text>
  <text x="270" y="96" class="lab">② 多数连接走在纸外</text>
  <text x="270" y="120" class="lab">③ 上一笔收即下一笔起</text>
  <text x="270" y="144" class="lab">④ 字仍一个是一个</text>
  <text x="452" y="70" class="labk">速度谱（同一个人写三段）</text>
  <rect x="452" y="82" width="90" height="24" class="f-g4"/>
  <rect x="552" y="82" width="90" height="24" class="f-g3"/>
  <rect x="652" y="82" width="90" height="24" class="f-g1"/>
  <text x="497" y="100" class="num" text-anchor="middle">楷</text>
  <text x="597" y="100" class="num" text-anchor="middle">行</text>
  <text x="697" y="100" class="num" text-anchor="middle">草</text>
  <text x="452" y="130" class="lab2">动作：全做 → 一半 → 只留走势</text>
  <text x="452" y="154" class="lab2">认读：易 → 易 → 常认不出</text>
  <text x="452" y="178" class="lab2">用途：正体 → 日常 → 创作</text>
  <text x="18" y="232" class="lab2">提醒：牵丝是"顺出来的"，不是"描出来的"。刻意画细线是最常见的假行书；把动作做完整，细线自己会出现。</text>
</svg>