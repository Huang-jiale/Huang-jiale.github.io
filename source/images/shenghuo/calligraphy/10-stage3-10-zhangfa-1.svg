    <rect x="264" y="134" width="16" height="16" fill="#22211f"/>
    <rect x="264" y="158" width="16" height="16" fill="#22211f"/>
    <rect x="240" y="62" width="16" height="16" fill="#22211f"/>
    <rect x="240" y="86" width="16" height="16" fill="#22211f"/>
    <rect x="240" y="110" width="16" height="16" fill="#22211f"/>
    <rect x="240" y="134" width="16" height="16" fill="#22211f"/>
    <rect x="216" y="62" width="16" height="16" fill="#22211f"/>
    <rect x="216" y="86" width="16" height="16" fill="#22211f"/>
    <rect x="216" y="110" width="16" height="16" fill="#22211f"/>
    <rect x="216" y="134" width="16" height="16" fill="#22211f"/>
    <rect x="192" y="62" width="16" height="16" fill="#22211f"/>
