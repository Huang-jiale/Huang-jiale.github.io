    <rect x="192" y="110" width="16" height="16" fill="#22211f"/>
    <rect x="168" y="62" width="16" height="16" fill="#22211f"/>
    <rect x="168" y="86" width="16" height="16" fill="#22211f"/>
    <rect x="168" y="110" width="16" height="16" fill="#22211f"/>
    <rect x="146" y="128" width="11" height="11" fill="#22211f"/>
    <rect x="146" y="143" width="11" height="11" fill="#22211f"/>
    <rect x="146" y="158" width="11" height="11" fill="#22211f"/>
    <rect x="146" y="173" width="11" height="11" fill="#22211f"/>
    <rect x="143" y="196" width="18" height="18" fill="#c0392b"/>
    <rect x="266" y="44" width="12" height="12" fill="#c0392b"/>
    <text class="labk" x="380" y="60">四件套，各司其职</text>
    <text class="lab" x="380" y="92">① 正文：字数内容自定，末行宜短，</text>
    <text class="lab2" x="412" y="112">留出写款的地方（灰方块=字）</text>
    <text class="lab" x="380" y="142">② 款：比正文小一号的深色小方块，</text>
    <text class="lab2" x="412" y="162">写在末行左下，地位是「配角」</text>
    <text class="lab" x="380" y="192">③ 印：红块两方——右上=引首章，</text>
    <text class="lab2" x="412" y="212">款下=姓名印；一方就够新手用</text>
    <text class="lab" x="380" y="242">④ 白：四周留边、行间留缝，</text>
    <text class="lab2" x="412" y="262">满纸黑字=窒息，白也是构件</text>
    <text class="lab2" x="120" y="310">本课记法：正文是主角，款是谢幕词，印是红图章，白是呼吸。</text>
  </svg>