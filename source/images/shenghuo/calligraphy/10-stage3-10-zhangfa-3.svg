 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
    <rect class="bg-paper" width="360" height="300"/>
    <text class="labk" x="20" y="26">对：重心串线，气不断</text>
    <rect class="guide" x="158" y="46" width="44" height="40" stroke-width="1.5"/>
    <rect class="guide" x="152" y="110" width="44" height="40" stroke-width="1.5"/>
    <rect class="guide" x="163" y="174" width="44" height="40" stroke-width="1.5"/>
    <rect class="guide" x="155" y="238" width="44" height="40" stroke-width="1.5"/>
    <path d="M180 44 C176 70 172 90 174 106 M174 152 C178 160 186 166 185 174 M185 216 C180 224 176 230 177 238" fill="none" stroke="#0f6ab5" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text class="lab2" x="228" y="98">蓝虚线=行气线</text>
    <text class="lab2" x="228" y="200">摆幅仅几像素，</text>
    <text class="lab2" x="228" y="218">歪而不倒，像行拳</text>
    <text class="lab2" x="28" y="200">上字收笔</text>
    <text class="lab2" x="28" y="216">指向下字起笔</text>
  </svg>