<svg viewBox="0 0 760 280" role="img" aria-label="大字主笔是捺：撇收敛捺展开" xmlns="http://www.w3.org/2000/svg" width="760" height="280"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
    <rect class="bg-paper" width="760" height="280"/>
    <rect class="st" x="40" y="30" width="220" height="220" fill="none"/>
    <line class="guide" x1="150" y1="30" x2="150" y2="250"/>
    <line class="guide" x1="40" y1="140" x2="260" y2="140"/>
    <rect x="92" y="80" width="116" height="12" fill="#22211f"/>
    <line class="body-line" x1="150" y1="86" x2="92" y2="232"/>
    <line class="stroke-in" x1="150" y1="86" x2="240" y2="232" stroke-width="8"/>
    <path class="arrow" d="M 205 160 Q 235 195 242 228" fill="none"/>
    <text class="lab2" x="246" y="216">按下去，再送出</text>
    <text class="lab2" x="40" y="272">红色=主笔（捺）；黑色撇收到位即可</text>
    <text class="labk" x="320" y="26">「大」的搭法</text>
    <text class="lab" x="320" y="60">① 横不宜过宽，写在格子上半部；</text>
    <text class="lab" x="320" y="88">② 撇从横的中点偏左起笔，向左下</text>
    <text class="lab" x="356" y="110">走，弧而不弯；</text>
    <text class="lab" x="320" y="138">③ 撇捺交点是全字重心，放在竖</text>
    <text class="lab" x="356" y="160">中线附近、横画下方；</text>
    <text class="lab" x="320" y="188">④ 捺一路加力，捺脚最低点略低于</text>
    <text class="lab" x="356" y="210">撇尖，字就站稳了。</text>
    <text class="lab2" x="320" y="248">「人」「火」同理：撇让捺，一收一放。</text>
  </svg>