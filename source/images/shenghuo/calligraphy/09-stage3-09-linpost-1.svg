<svg viewBox="0 0 760 310" role="img" aria-label="米字格的解剖：外框、横竖中线、两条对角线，以及每条线的用途" xmlns="http://www.w3.org/2000/svg" width="760" height="310"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="310"/>
  <text x="18" y="26" class="labk">一个米字格＝外框＋横竖两条中线＋两条对角线</text>
  <rect x="48" y="48" width="180" height="180" class="st"/>
  <line x1="138" y1="48" x2="138" y2="228" class="guide"/>
  <line x1="48" y1="138" x2="228" y2="138" class="guide"/>
  <line x1="48" y1="48" x2="228" y2="228" class="guide"/>
  <line x1="228" y1="48" x2="48" y2="228" class="guide"/>
  <text x="138" y="200" class="kai" style="font-size:120px" text-anchor="middle">永</text>
  <text x="144" y="64" class="lab2">①</text>
  <text x="56" y="132" class="lab2">②</text>
  <text x="232" y="240" class="lab2">③</text>
  <text x="270" y="70" class="lab">① 竖中线＝重心线：主笔的竖、竖钩压在线上</text>
  <text x="270" y="94" class="lab">② 横中线＝上下分界：上部压它上面</text>
  <text x="270" y="118" class="lab">③ 对角线＝撇、捺、点的方向参照</text>
  <text x="270" y="142" class="lab">④ 四条边＝外轮廓：范字只写八分满</text>
  <text x="270" y="172" class="lab2">读数三问：起笔在哪个三角区？中间越过哪条线？收笔停在哪个区？</text>
  <text x="270" y="196" class="lab2">三问答不上来就不许蘸墨——那时你看的不是帖，是自己的想象。</text>
  <text x="270" y="220" class="lab2">格径＝字径：写 3—4 厘米见方的字，就用同尺寸的米字格纸。</text>
  <text x="48" y="252" class="lab2">格宽（含四周留白）</text>
  <text x="18" y="286" class="lab2">同一格还要读"空"：笔画把格面切成几块空，空的形状对不对，字就对不对。</text>
</svg>