    <path class="stroke-in" d="M118 68 C142 78 158 106 162 138 C166 168 178 188 208 190 C182 200 152 190 146 154 C140 118 130 88 108 74 Z"/>
    <text class="lab" x="280" y="66">起：按原方向行笔，不急</text>
    <text class="lab" x="280" y="106">转：微提，让锋在画里转身（暗过）</text>
    <text class="lab" x="280" y="146">收：新方向匀力续出去</text>
