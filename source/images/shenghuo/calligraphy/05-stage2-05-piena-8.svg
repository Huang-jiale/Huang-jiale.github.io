<svg viewBox="0 0 760 220" role="img" aria-label="米字格范字：人、大、木，示范撇捺左右撑开与先撇后捺" xmlns="http://www.w3.org/2000/svg" width="760" height="220"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
    <rect class="bg-paper" width="760" height="220"/>
    <text class="labk" x="380" y="26" text-anchor="middle">米字格：人 · 大 · 木</text>
    <g>
      <rect class="st" x="40" y="40" width="160" height="160" fill="none"/>
      <line class="guide" x1="120" y1="40" x2="120" y2="200"/>
      <line class="guide" x1="40" y1="120" x2="200" y2="120"/>
      <line class="guide" x1="40" y1="40" x2="200" y2="200"/>
      <line class="guide" x1="200" y1="40" x2="40" y2="200"/>
      <text class="kai" x="120" y="150" font-size="110" text-anchor="middle">人</text>
    </g>
    <g>
      <rect class="st" x="300" y="40" width="160" height="160" fill="none"/>
      <line class="guide" x1="380" y1="40" x2="380" y2="200"/>
      <line class="guide" x1="300" y1="120" x2="460" y2="120"/>
      <line class="guide" x1="300" y1="40" x2="460" y2="200"/>
      <line class="guide" x1="460" y1="40" x2="300" y2="200"/>
      <text class="kai" x="380" y="150" font-size="110" text-anchor="middle">大</text>
    </g>
    <g>
      <rect class="st" x="560" y="40" width="160" height="160" fill="none"/>
      <line class="guide" x1="640" y1="40" x2="640" y2="200"/>
      <line class="guide" x1="560" y1="120" x2="720" y2="120"/>
      <line class="guide" x1="560" y1="40" x2="720" y2="200"/>
      <line class="guide" x1="720" y1="40" x2="560" y2="200"/>
      <text class="kai" x="640" y="150" font-size="110" text-anchor="middle">木</text>
    </g>
  </svg>