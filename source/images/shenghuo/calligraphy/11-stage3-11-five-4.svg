<svg viewBox="0 0 760 230" role="img" aria-label="篆书的线条与结构特征：上下密下部放开、左右对称、转折圆" xmlns="http://www.w3.org/2000/svg" width="760" height="230"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="230"/>
  <text x="18" y="26" class="labk">篆：一根匀线 ＋ 左右对称 ＋ 上密下疏</text>
  <rect x="40" y="48" width="200" height="150" class="guide"/>
  <rect x="130" y="62" width="20" height="20" class="stroke-in"/>
  <rect x="130" y="92" width="20" height="20" class="stroke-in"/>
  <rect x="130" y="122" width="20" height="20" class="stroke-in"/>
  <path class="st-thin" d="M140 48 V198"/>
  <text x="40" y="218" class="lab2">横线挤在上半，下半留长脚</text>
  <text x="270" y="70" class="lab">① 一条线的粗细几乎不变</text>
  <text x="270" y="94" class="lab">② 转弯用圆弧，不用方折</text>
  <text x="270" y="118" class="lab">③ 左右基本对称，像照镜子</text>
  <text x="270" y="142" class="lab">④ 字形取纵长，上放下收</text>
  <text x="270" y="172" class="lab2">练法：先画 100 条等粗长线，再写字。写不匀就是速度不匀。</text>
  <text x="18" y="194" class="lab">篆靠匀速而非提按，一路中锋缓行，不用侧锋——对比第 04 课里中锋的讲法。</text>
  <text x="480" y="218" class="lab2">粗细一段粗一段细，是楷的毛病串进来了</text>
</svg>