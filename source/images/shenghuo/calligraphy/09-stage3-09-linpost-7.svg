<svg viewBox="0 0 760 330" role="img" aria-label="核的叠影比对法：帖字、自写、叠合后圈出三处偏差" xmlns="http://www.w3.org/2000/svg" width="760" height="330"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
 .num{font-size:15px;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="330"/>
  <text x="18" y="26" class="labk">核：把写的字叠回帖上，一次只圈三处，每处说出是哪一类偏差</text>
  <rect x="36" y="56" width="140" height="140" class="st"/>
  <line x1="106" y1="56" x2="106" y2="196" class="guide"/>
  <line x1="36" y1="126" x2="176" y2="126" class="guide"/>
  <line x1="36" y1="56" x2="176" y2="196" class="guide"/>
  <line x1="176" y1="56" x2="36" y2="196" class="guide"/>
  <text x="106" y="172" class="kai" style="font-size:84px" fill="#9a9a9a" text-anchor="middle">中</text>
  <rect x="196" y="56" width="140" height="140" class="st"/>
  <line x1="266" y1="56" x2="266" y2="196" class="guide"/>
  <line x1="196" y1="126" x2="336" y2="126" class="guide"/>
  <rect class="stroke-in" x="244" y="82" width="6" height="60"/>
  <rect class="stroke-in" x="250" y="82" width="40" height="6"/>
  <rect class="stroke-in" x="284" y="82" width="6" height="60"/>
  <rect class="stroke-in" x="250" y="136" width="40" height="6"/>
  <rect class="stroke-in" x="258" y="68" width="8" height="92"/>
  <rect x="360" y="56" width="140" height="140" class="st"/>
  <line x1="430" y1="56" x2="430" y2="196" class="guide"/>
  <line x1="360" y1="126" x2="500" y2="126" class="guide"/>
  <text x="430" y="172" class="kai" style="font-size:84px" fill="#c9c4ba" text-anchor="middle">中</text>
  <rect class="stroke-in" x="408" y="82" width="6" height="60"/>
  <rect class="stroke-in" x="414" y="82" width="40" height="6"/>
  <rect class="stroke-in" x="448" y="82" width="6" height="60"/>
  <rect class="stroke-in" x="414" y="136" width="40" height="6"/>
  <rect class="stroke-in" x="422" y="68" width="8" height="92"/>
  <circle cx="426" cy="112" r="26" class="st-bad"/>
  <circle cx="428" cy="176" r="20" class="st-bad"/>
  <circle cx="472" cy="110" r="17" class="st-bad"/>
  <text x="106" y="220" class="lab2" text-anchor="middle">帖上的字</text>
  <text x="266" y="220" class="lab2" text-anchor="middle">你写的（红）</text>
  <text x="430" y="220" class="lab2" text-anchor="middle">叠合：只圈 3 处</text>
  <text x="520" y="72" class="labk">偏差只有这四类</text>
  <text x="520" y="98" class="lab">① 位置：整体偏右</text>
  <text x="520" y="122" class="lab">② 长短：口写宽</text>
  <text x="520" y="146" class="lab">③ 角度：横不平</text>
  <text x="520" y="170" class="lab">④ 粗细：该按没按</text>
  <text x="520" y="200" class="lab2">纸边备注写法（照抄格式）：</text>
  <text x="520" y="222" class="lab2">竖偏右 3mm；口偏宽；</text>
  <text x="520" y="242" class="lab2">横不平 → 下遍只改这一处。</text>
  <text x="36" y="268" class="lab">改法（关键）：圈完不重写整个字，只重写"出问题那一笔"所在的下一个字——一次只改一处。</text>
  <text x="36" y="292" class="lab2">改完立刻再叠回去：这一处不再犯才算过；还犯就换个说法（把位置念出声再写，或用笔尖在帖上点一下）。</text>
  <text x="36" y="316" class="lab2">三种核法：① 透明垫板叠（最快）；② 两张纸对窗光叠；③ 手机把字拍在帖页旁边对比（能看出毫米差）。</text>
</svg>