<svg viewBox="0 0 760 360" role="img" aria-label="15×15 棋盘的坐标记法：横 a 到 o、竖 1 到 15，天元为 H8" xmlns="http://www.w3.org/2000/svg" width="760" height="360"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:9.5px;fill:#777}
 .stone-b{fill:#1c1c1c}
.stone-w{fill:#fff;stroke:#1c1c1c;stroke-width:1.2}
 .pc-r{fill:#fff8f0;stroke:#c0392b;stroke-width:1.8}
 .star{fill:#1c1c1c}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}</style>
<rect class="bg-paper" width="760" height="360"/>
<line class="gl" x1="16" y1="16" x2="16" y2="296"/><line class="gl" x1="36" y1="16" x2="36" y2="296"/><line class="gl" x1="56" y1="16" x2="56" y2="296"/><line class="gl" x1="76" y1="16" x2="76" y2="296"/><line class="gl" x1="96" y1="16" x2="96" y2="296"/>
<line class="gl" x1="116" y1="16" x2="116" y2="296"/><line class="gl" x1="136" y1="16" x2="136" y2="296"/><line class="gl" x1="156" y1="16" x2="156" y2="296"/><line class="gl" x1="176" y1="16" x2="176" y2="296"/><line class="gl" x1="196" y1="16" x2="196" y2="296"/>
<line class="gl" x1="216" y1="16" x2="216" y2="296"/><line class="gl" x1="236" y1="16" x2="236" y2="296"/><line class="gl" x1="256" y1="16" x2="256" y2="296"/><line class="gl" x1="276" y1="16" x2="276" y2="296"/><line class="gl" x1="296" y1="16" x2="296" y2="296"/>
<line class="gl" x1="16" y1="16" x2="296" y2="16"/><line class="gl" x1="16" y1="36" x2="296" y2="36"/><line class="gl" x1="16" y1="56" x2="296" y2="56"/><line class="gl" x1="16" y1="76" x2="296" y2="76"/><line class="gl" x1="16" y1="96" x2="296" y2="96"/>
<line class="gl" x1="16" y1="116" x2="296" y2="116"/><line class="gl" x1="16" y1="136" x2="296" y2="136"/><line class="gl" x1="16" y1="156" x2="296" y2="156"/><line class="gl" x1="16" y1="176" x2="296" y2="176"/><line class="gl" x1="16" y1="196" x2="296" y2="196"/>
<line class="gl" x1="16" y1="216" x2="296" y2="216"/><line class="gl" x1="16" y1="236" x2="296" y2="236"/><line class="gl" x1="16" y1="256" x2="296" y2="256"/><line class="gl" x1="16" y1="276" x2="296" y2="276"/><line class="gl" x1="16" y1="296" x2="296" y2="296"/>
<text x="16" y="10" class="cand" text-anchor="middle">a</text><text x="36" y="10" class="cand" text-anchor="middle">b</text><text x="56" y="10" class="cand" text-anchor="middle">c</text><text x="76" y="10" class="cand" text-anchor="middle">d</text><text x="96" y="10" class="cand" text-anchor="middle">e</text>
<text x="116" y="10" class="cand" text-anchor="middle">f</text><text x="136" y="10" class="cand" text-anchor="middle">g</text><text x="156" y="10" class="cand" text-anchor="middle">h</text><text x="176" y="10" class="cand" text-anchor="middle">i</text><text x="196" y="10" class="cand" text-anchor="middle">j</text>
<text x="216" y="10" class="cand" text-anchor="middle">k</text><text x="236" y="10" class="cand" text-anchor="middle">l</text><text x="256" y="10" class="cand" text-anchor="middle">m</text><text x="276" y="10" class="cand" text-anchor="middle">n</text><text x="296" y="10" class="cand" text-anchor="middle">o</text>
<text x="6" y="19" class="cand" text-anchor="middle">1</text><text x="6" y="39" class="cand" text-anchor="middle">2</text><text x="6" y="59" class="cand" text-anchor="middle">3</text><text x="6" y="79" class="cand" text-anchor="middle">4</text><text x="6" y="99" class="cand" text-anchor="middle">5</text>
<text x="6" y="119" class="cand" text-anchor="middle">6</text><text x="6" y="139" class="cand" text-anchor="middle">7</text><text x="6" y="159" class="cand" text-anchor="middle">8</text><text x="6" y="179" class="cand" text-anchor="middle">9</text><text x="6" y="199" class="cand" text-anchor="middle">10</text>
<text x="6" y="219" class="cand" text-anchor="middle">11</text><text x="6" y="239" class="cand" text-anchor="middle">12</text><text x="6" y="259" class="cand" text-anchor="middle">13</text><text x="6" y="279" class="cand" text-anchor="middle">14</text><text x="6" y="299" class="cand" text-anchor="middle">15</text>
<circle class="stone-b" cx="156" cy="156" r="9"/><text x="156" y="161" class="num-g" text-anchor="middle">1</text>
<circle class="stone-w" cx="176" cy="156" r="9"/><text x="176" y="161" class="num" text-anchor="middle">2</text>
<circle class="stone-b" cx="176" cy="136" r="9"/><text x="176" y="141" class="num-g" text-anchor="middle">3</text>
<text x="156" y="184" class="lab2" text-anchor="middle">H8 天元</text>
<text x="324" y="52" class="labk">读法：先字母（列），再数字（行）</text>
<text x="324" y="80" class="lab">黑 1 = H8（天元，中心那一格）</text>
<text x="324" y="104" class="lab">白 2 = I8（天元右边紧邻一格）</text>
<text x="324" y="128" class="lab">黑 3 = I7（在 I8 的正上方一格）</text>
<text x="324" y="166" class="lab2">三个坐标写全，一局棋的开头就能被别人</text>
<text x="324" y="184" class="lab2">原样复现；缺一个字母，谱就废了。</text>
<text x="324" y="222" class="lab2">建议记法：一手一行，序号＋坐标，</text>
<text x="324" y="240" class="lab2">如"1 H8 / 2 I8 / 3 I7 ……"，</text>
<text x="324" y="258" class="lab2">黑方走禁手相关的一行加个问号备查。</text>
<text x="324" y="296" class="lab2">注意：不同棋院对数字行的起算方向可能不同，</text>
<text x="324" y="314" class="lab2">赛前照当次记谱纸抄一份即可。</text>
</svg>