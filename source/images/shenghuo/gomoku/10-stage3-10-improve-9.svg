<svg viewBox="0 0 760 300" role="img" aria-label="停滞期自我检查仪表盘：准确率、漏先手次数、识别速度、复盘完成率、时间失控次数、同一错误重复次数六项" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
