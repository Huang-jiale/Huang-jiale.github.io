<svg viewBox="0 0 760 330" role="img" aria-label="五类高频失误的症状原因与纠正动作对照图" xmlns="http://www.w3.org/2000/svg" width="760" height="330"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:9.5px;fill:#777}
 .stone-b{fill:#1c1c1c}
.stone-w{fill:#fff;stroke:#1c1c1c;stroke-width:1.2}
 .pc-r{fill:#fff8f0;stroke:#c0392b;stroke-width:1.8}
 .star{fill:#1c1c1c}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}</style>
<rect class="bg-paper" width="760" height="330"/>
<text x="18" y="26" class="labk">五类失误：症状 → 真正原因 → 固定的纠正动作</text>
<line x1="18" y1="46" x2="742" y2="46" class="st-thin"/>
<text x="18" y="70" class="labk">① 漏冲四</text>
<text x="140" y="70" class="lab">没看到对方的四（尤其斜线）</text>
<text x="440" y="70" class="lab2">→ 每手先扫四条线：横、竖、两条斜</text>
<text x="18" y="104" class="labk">② 误判禁手</text>
<text x="140" y="104" class="lab">把眠三当活三，或忘了黑棋才有禁手</text>
<text x="440" y="104" class="lab2">→ 判前逐条确认两头的空格</text>
<text x="18" y="138" class="labk">③ 贪攻不防</text>
<text x="140" y="138" class="lab">只顾自己的计划，一级威胁视而不见</text>
<text x="440" y="138" class="lab2">→ 先分级，再谈进攻</text>
<text x="18" y="172" class="labk">④ 只防不攻</text>
<text x="140" y="172" class="lab">每手都替对方堵，先手永久交出</text>
<text x="440" y="172" class="lab2">→ 每三步问一次"能否轮到我"</text>
<text x="18" y="206" class="labk">⑤ 时间错配</text>
<text x="140" y="206" class="lab">开局长考、读秒裸奔</text>
<text x="440" y="206" class="lab2">→ 包时给中盘，读秒只走直观手</text>
<line x1="18" y1="226" x2="742" y2="226" class="st-thin"/>
<text x="18" y="252" class="labk">三条通用检查程序（比背十局谱有用）</text>
<text x="18" y="278" class="lab">第一步：对方这一手成了什么级别？</text>
<text x="270" y="278" class="lab">第二步：这一格里我有没有绝对先手？</text>
<text x="540" y="278" class="lab">第三步：落子前四条线各扫一遍。</text>
<text x="18" y="304" class="lab2">说明：本文所有"禁手"都只针对黑棋（三三、四四、长连是黑棋禁手，白棋无禁手）。</text>
</svg>