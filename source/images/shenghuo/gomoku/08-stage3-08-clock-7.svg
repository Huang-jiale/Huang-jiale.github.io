<text x="324" y="52" class="labk">黑棋这一手：不是赢，是当场输</text>
<text x="324" y="80" class="lab">第 156 列那一子落下后，横线上从第 56 列</text>
<text x="324" y="100" class="lab">到第 156 列一共 6 颗黑子连成一片 → 长连</text>
<text x="324" y="138" class="lab2">连珠规则里黑棋必须"恰好五颗"才算胜，</text>
<text x="324" y="156" class="lab2">连到第六颗是禁手（长连），当场判负。</text>
<text x="324" y="194" class="lab2">红圈这颗就是"多出来的一子"：它前面</text>
<text x="324" y="212" class="lab2">五颗已经连住，所以这一手既不是五连</text>
<text x="324" y="230" class="lab2">取胜，也不能当成"再往旁边挪一格"。</text>
<text x="324" y="268" class="lab2">实用提醒：黑棋遇到"多一路就成六"的场合，</text>
<text x="324" y="286" class="lab2">要么改走别处，要么先用冲四换节奏。</text>
<text x="324" y="324" class="lab2">白棋无禁手，白棋六连仍然算赢（见上图）。</text>
</svg>