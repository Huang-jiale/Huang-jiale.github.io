<text x="324" y="52" class="labk">后果长什么样：这局已经结束了</text>
<text x="324" y="80" class="lab">黑棋横着五颗连成一条线（上下两条</text>
<text x="324" y="100" class="lab">红夹线标出）→ 连五成立，黑胜。</text>
<text x="324" y="138" class="lab2">白棋上方横着两颗、右边竖着两颗，各是</text>
<text x="324" y="156" class="lab2">一个活二，但"活二"在"五连"面前</text>
<text x="324" y="174" class="lab2">没有任何发言权。</text>
<text x="324" y="212" class="lab2">这就是漏一手的代价：前面十手做得</text>
<text x="324" y="230" class="lab2">再漂亮，也换不回这一格。</text>
<text x="324" y="268" class="lab2">复盘时把这一格回到上一张图，问自己：</text>
<text x="324" y="286" class="lab2">上一手我为什么没扫这条线？</text>
<text x="324" y="324" class="lab2">黑 6 颗、白 5 颗＝黑棋刚落下第 11 手。</text>
</svg>