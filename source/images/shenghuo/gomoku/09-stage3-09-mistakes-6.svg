<text x="324" y="52" class="labk">四四禁手：一子做出两个四</text>
<text x="324" y="80" class="lab">横线：第 76、96、116 列三颗＋红圈这一颗</text>
<text x="324" y="100" class="lab">＝四颗，右端已被白棋占住 → 冲四。</text>
<text x="324" y="138" class="lab">竖线：第 156、176、196 行三颗＋红圈这一颗</text>
<text x="324" y="158" class="lab">＝四颗，下端已被白棋占住 → 又一个冲四。</text>
<text x="324" y="196" class="lab2">两个四＝四四禁手，黑棋落下即判负。</text>
<text x="324" y="234" class="lab2">最容易混的是"四三"：一子做出一个四、</text>
<text x="324" y="252" class="lab2">一个三，那不但不是禁手，反而是最典型的</text>
<text x="324" y="270" class="lab2">取胜手段（第 04 课的四三胜）。</text>
<text x="324" y="308" class="lab2">还有一条优先级：如果这一子直接成五，</text>
<text x="324" y="326" class="lab2">那就是胜，禁手判定让位于连五。</text>
</svg>