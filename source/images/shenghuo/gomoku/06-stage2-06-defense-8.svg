<text x="76" y="316" class="labk" text-anchor="middle">甲：防＋成形</text>
<text x="156" y="316" class="labk" text-anchor="middle">乙：只防</text>
<text x="324" y="58" class="labk">两头都防得住，但甲更好</text>
<text x="324" y="86" class="lab">白棋左上已经有一子在斜角位置，</text>
<text x="324" y="106" class="lab">落在甲点正好与它连成斜活二。</text>
<text x="324" y="142" class="lab">乙点只完成防守，白棋形状不变，</text>
<text x="324" y="162" class="lab">下一手还得重新找先手。</text>
<text x="324" y="200" class="lab2">选防点的加分项，按这三条排优先级：</text>
<text x="324" y="220" class="lab2">① 占住对方多线的交叉点；</text>
<text x="324" y="240" class="lab2">② 自己旧子连成活二或眠三；</text>
<text x="324" y="260" class="lab2">③ 顺手堵掉对方将来延伸的边。</text>
<text x="324" y="298" class="lab2">三条全中＝这手防点值两子。</text>
</svg>