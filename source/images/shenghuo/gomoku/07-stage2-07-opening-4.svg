<svg viewBox="0 0 760 360" role="img" aria-label="五手两打判例：黑方在第5手给出甲乙两个候选点，白方删其一" xmlns="http://www.w3.org/2000/svg" width="760" height="360"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .f-g1{fill:#f2f2f2}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.num-g{font-size:15px;fill:#9a9a9a}
.cand{font-size:9.5px;fill:#777}
 .stone-b{fill:#1c1c1c}
.stone-w{fill:#fff;stroke:#1c1c1c;stroke-width:1.2}
 .pc-r{fill:#fff8f0;stroke:#c0392b;stroke-width:1.8}
 .star{fill:#1c1c1c}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}</style>
<rect class="bg-paper" width="760" height="360"/>
<line class="gl" x1="16" y1="16" x2="16" y2="296"/><line class="gl" x1="36" y1="16" x2="36" y2="296"/><line class="gl" x1="56" y1="16" x2="56" y2="296"/><line class="gl" x1="76" y1="16" x2="76" y2="296"/><line class="gl" x1="96" y1="16" x2="96" y2="296"/>
<line class="gl" x1="116" y1="16" x2="116" y2="296"/><line class="gl" x1="136" y1="16" x2="136" y2="296"/><line class="gl" x1="156" y1="16" x2="156" y2="296"/><line class="gl" x1="176" y1="16" x2="176" y2="296"/><line class="gl" x1="196" y1="16" x2="196" y2="296"/>
<line class="gl" x1="216" y1="16" x2="216" y2="296"/><line class="gl" x1="236" y1="16" x2="236" y2="296"/><line class="gl" x1="256" y1="16" x2="256" y2="296"/><line class="gl" x1="276" y1="16" x2="276" y2="296"/><line class="gl" x1="296" y1="16" x2="296" y2="296"/>
<line class="gl" x1="16" y1="16" x2="296" y2="16"/><line class="gl" x1="16" y1="36" x2="296" y2="36"/><line class="gl" x1="16" y1="56" x2="296" y2="56"/><line class="gl" x1="16" y1="76" x2="296" y2="76"/><line class="gl" x1="16" y1="96" x2="296" y2="96"/>
<line class="gl" x1="16" y1="116" x2="296" y2="116"/><line class="gl" x1="16" y1="136" x2="296" y2="136"/><line class="gl" x1="16" y1="156" x2="296" y2="156"/><line class="gl" x1="16" y1="176" x2="296" y2="176"/><line class="gl" x1="16" y1="196" x2="296" y2="196"/>
<line class="gl" x1="16" y1="216" x2="296" y2="216"/><line class="gl" x1="16" y1="236" x2="296" y2="236"/><line class="gl" x1="16" y1="256" x2="296" y2="256"/><line class="gl" x1="16" y1="276" x2="296" y2="276"/><line class="gl" x1="16" y1="296" x2="296" y2="296"/>
<circle class="stone-b" cx="156" cy="156" r="9"/><text x="156" y="161" class="num-g" text-anchor="middle">1</text>
<circle class="stone-w" cx="176" cy="156" r="9"/><text x="176" y="161" class="num" text-anchor="middle">2</text>
<circle class="stone-b" cx="176" cy="136" r="9"/><text x="176" y="141" class="num-g" text-anchor="middle">3</text>
<circle class="stone-w" cx="196" cy="176" r="9"/><text x="196" y="181" class="num" text-anchor="middle">4</text>
<circle class="stone-b" cx="196" cy="116" r="9"/><circle cx="196" cy="116" r="13" fill="none" stroke="#c8102e" stroke-width="2" stroke-dasharray="4 3"/><text x="214" y="110" class="labk">甲</text>
<circle class="stone-b" cx="156" cy="136" r="9"/><circle cx="156" cy="136" r="13" fill="none" stroke="#2563a8" stroke-width="2" stroke-dasharray="4 3"/><text x="130" y="128" class="labk">乙</text>
<circle class="dot" cx="116" cy="196" r="4"/><text x="88" y="222" class="lab2">与甲对称＝等价点</text>
<text x="324" y="52" class="labk">第 5 手：黑给两点，白删一点</text>
<text x="324" y="80" class="lab">甲：落在斜线上，黑 1、3、5 三子成活三。</text>
<text x="324" y="104" class="lab">乙：与 3 号横着相邻、与 1 号竖着相邻，</text>
<text x="324" y="124" class="lab">一子做出两个活二，属于"含蓄型"。</text>
<text x="324" y="162" class="lab2">红圈与蓝圈两颗黑子都只是候选，</text>
<text x="324" y="180" class="lab2">白方挑走一个后，另一个要被拿起，</text>
<text x="324" y="198" class="lab2">所以本图实战的只有前 4 手。</text>
<text x="324" y="236" class="lab2">红点那格与甲关于天元中心对称：</text>
<text x="324" y="254" class="lab2">把甲和它一起交给白方＝违规，</text>
<text x="324" y="272" class="lab2">因为白方选哪个，形状都一样。</text>
<text x="324" y="310" class="lab2">两打的功课：先给自己两个都能下的点，</text>
<text x="324" y="328" class="lab2">再检查它们不对称为妙。</text>
</svg>