<svg viewBox="0 0 760 300" role="img" aria-label="一周训练安排横道图：七天分别排计算题、棋感卡、两盘慢棋、一盘强手局、复盘日与休息日" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
