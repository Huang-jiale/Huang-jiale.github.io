<line class="gl" x1="16" y1="116" x2="296" y2="116"/><line class="gl" x1="16" y1="136" x2="296" y2="136"/><line class="gl" x1="16" y1="156" x2="296" y2="156"/><line class="gl" x1="16" y1="176" x2="296" y2="176"/><line class="gl" x1="16" y1="196" x2="296" y2="196"/>
<line class="gl" x1="16" y1="216" x2="296" y2="216"/><line class="gl" x1="16" y1="236" x2="296" y2="236"/><line class="gl" x1="16" y1="256" x2="296" y2="256"/><line class="gl" x1="16" y1="276" x2="296" y2="276"/><line class="gl" x1="16" y1="296" x2="296" y2="296"/>
<circle class="star" cx="156" cy="156" r="2"/>
<circle class="hl" cx="176" cy="156" r="9"/>
<circle class="stone-b" cx="96" cy="156" r="9"/><circle class="stone-b" cx="116" cy="156" r="9"/><circle class="stone-b" cx="136" cy="156" r="9"/><circle class="stone-b" cx="156" cy="156" r="9"/>
<circle class="stone-b" cx="56" cy="236" r="9"/><circle class="stone-b" cx="76" cy="236" r="9"/><circle class="stone-b" cx="96" cy="236" r="9"/>
<circle class="stone-w" cx="76" cy="156" r="9"/><circle class="stone-w" cx="216" cy="156" r="9"/><circle class="stone-w" cx="116" cy="56" r="9"/>
<circle class="stone-w" cx="196" cy="96" r="9"/><circle class="stone-w" cx="236" cy="236" r="9"/><circle class="stone-w" cx="256" cy="236" r="9"/>
<line class="st-thin" x1="176" y1="156" x2="176" y2="306"/>
<text x="176" y="322" class="labk" text-anchor="middle">唯一要点</text>
<text x="324" y="60" class="labk">黑棋 4 颗连成一线</text>
<text x="324" y="84" class="lab">左端被第 76 列的白子堵死，</text>
<text x="324" y="108" class="lab">右端空着 → 这是"眠四"</text>
<text x="324" y="146" class="lab">白棋这一手必须落在被标出的</text>
<text x="324" y="166" class="lab">那一头，否则黑棋补上就是五连。</text>
<text x="324" y="204" class="lab2">别被下方那三颗黑子骗了：它们两头都空，</text>
<text x="324" y="222" class="lab2">是"活三"（二级威胁）。但眠四是"必应"，</text>
<text x="324" y="240" class="lab2">级别更高，所以白棋先处理右边。</text>
<text x="324" y="280" class="lab2">反过来提醒：轮到对方时如果他既不堵眠四</text>
<text x="324" y="298" class="lab2">也不做四，几乎一定是漏算，要立刻复核。</text>
</svg>