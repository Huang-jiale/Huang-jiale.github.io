<svg viewBox="0 0 760 360" role="img" aria-label="漏冲四判例：黑棋斜线四连只有一头空，白棋必须堵在另一头" xmlns="http://www.w3.org/2000/svg" width="760" height="360"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
