<line class="st-thin" x1="96" y1="176" x2="156" y2="116"/>
<circle cx="176" cy="96" r="13" fill="none" stroke="#c8102e" stroke-width="2" stroke-dasharray="4 3"/>
<circle class="stone-b" cx="96" cy="176" r="9"/><circle class="stone-b" cx="116" cy="156" r="9"/><circle class="stone-b" cx="136" cy="136" r="9"/><circle class="stone-b" cx="156" cy="116" r="9"/>
<circle class="stone-w" cx="76" cy="196" r="9"/><circle class="stone-w" cx="196" cy="216" r="9"/><circle class="stone-w" cx="216" cy="216" r="9"/><circle class="stone-w" cx="236" cy="96" r="9"/>
<circle class="stone-b" cx="256" cy="256" r="9"/>
<text x="324" y="52" class="labk">白棋这一手必须落在红圈那一格</text>
<text x="324" y="80" class="lab">四颗黑子沿右上方向连成斜线（虚线）；</text>
<text x="324" y="100" class="lab">左下一头已被白棋堵住（第 76 列），</text>
<text x="324" y="120" class="lab">右上这一头还空着 → 标准的斜线眠四。</text>
<text x="324" y="158" class="lab2">黑棋下一手补上红圈那一格就是斜五连，</text>
<text x="324" y="176" class="lab2">横竖斜任何一种连法都算赢。</text>
<text x="324" y="214" class="lab2">典型的漏法：白棋看见下方自己那两颗</text>
<text x="324" y="232" class="lab2">活二很诱人，顺手去补，被黑棋一手结束。</text>
<text x="324" y="270" class="lab2">纠正动作：每手先按"横→竖→右上斜→</text>
<text x="324" y="288" class="lab2">右下斜"扫四遍，专找 4 颗连住的线。</text>
<text x="324" y="326" class="lab2">顺序铁律：一级威胁优先于自己的任何计划。</text>
</svg>