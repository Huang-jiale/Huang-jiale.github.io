<svg viewBox="0 0 760 360" role="img" aria-label="以攻代守局面：白棋一步同时做成冲四并堵住黑棋斜向活三" xmlns="http://www.w3.org/2000/svg" width="760" height="360"><style> svg{display:block;width:100%;height:auto}
