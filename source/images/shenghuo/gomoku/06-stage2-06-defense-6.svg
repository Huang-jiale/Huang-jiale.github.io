<text x="256" y="322" class="labk" text-anchor="middle">白棋先冲这里</text>
<text x="324" y="58" class="labk">黑棋斜三颗＝活三（二级威胁）</text>
<text x="324" y="82" class="lab">白棋下方三颗：左端被黑子挡住，</text>
<text x="324" y="102" class="lab">只有右端可长 → 存在一个冲四点。</text>
<text x="324" y="140" class="lab">白棋走黄格：一手同时做成冲四、</text>
<text x="324" y="160" class="lab">又把黑棋活三的一头顺手堵死。</text>
<text x="324" y="198" class="lab2">黑棋这时只能去应红格那一格（绝对先手），</text>
<text x="324" y="216" class="lab2">斜线上的活三已经被白棋堵成一头的眠三。</text>
<text x="324" y="252" class="lab2">反例：若白棋没有这条冲四就直接去堵，</text>
<text x="324" y="270" class="lab2">黑棋就会在别处抢先手做杀。</text>
<text x="324" y="308" class="lab2">前提别忘：黑棋有禁手，白棋没有。</text>
</svg>