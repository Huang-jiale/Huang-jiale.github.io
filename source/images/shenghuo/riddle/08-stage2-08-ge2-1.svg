<svg viewBox="0 0 760 214" role="img" aria-label="白头、粉颈、粉底三种谐音位置的对照" xmlns="http://www.w3.org/2000/svg" width="760" height="214"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="214"/>
  <text class="labk" x="20" y="24">谐音族三兄弟：动的都是"字"，区别只在第几个</text>
  <text class="lab" x="20" y="62">「白头格」</text>
  <rect class="hlc" x="150" y="44" width="40" height="40" stroke="#1c1c1c"/>
  <rect class="cell" x="196" y="44" width="40" height="40" stroke="#9a9a9a"/>
  <rect class="cell" x="242" y="44" width="40" height="40" stroke="#9a9a9a"/>
  <rect class="cell" x="288" y="44" width="40" height="40" stroke="#9a9a9a"/>
  <text class="num" x="170" y="70" text-anchor="middle">音</text>
  <text class="num" x="216" y="70" text-anchor="middle">换</text>
  <text class="num" x="262" y="70" text-anchor="middle">第</text>
  <text class="num" x="308" y="70" text-anchor="middle">2</text>
  <text class="lab2" x="346" y="70">首字换同音别字，余下原样念</text>
  <text class="lab" x="20" y="112">「粉颈格」</text>
  <rect class="cell" x="150" y="94" width="40" height="40" stroke="#9a9a9a"/>
  <rect class="hlc" x="196" y="94" width="40" height="40" stroke="#1c1c1c"/>
  <rect class="cell" x="242" y="94" width="40" height="40" stroke="#9a9a9a"/>
  <rect class="cell" x="288" y="94" width="40" height="40" stroke="#9a9a9a"/>
  <text class="num" x="170" y="120" text-anchor="middle">音</text>
  <text class="num" x="216" y="120" text-anchor="middle">换</text>
  <text class="num" x="262" y="120" text-anchor="middle">第</text>
  <text class="num" x="308" y="120" text-anchor="middle">3</text>
  <text class="lab2" x="346" y="120">第二个字换同音，头一字不动</text>
  <text class="lab" x="20" y="162">「粉底格」</text>
  <rect class="cell" x="150" y="144" width="40" height="40" stroke="#9a9a9a"/>
  <rect class="cell" x="196" y="144" width="40" height="40" stroke="#9a9a9a"/>
  <rect class="cell" x="242" y="144" width="40" height="40" stroke="#9a9a9a"/>
  <rect class="hlc" x="288" y="144" width="40" height="40" stroke="#1c1c1c"/>
  <text class="num" x="170" y="170" text-anchor="middle">音</text>
  <text class="num" x="216" y="170" text-anchor="middle">换</text>
  <text class="num" x="262" y="170" text-anchor="middle">最</text>
  <text class="num" x="308" y="170" text-anchor="middle">4</text>
  <text class="lab2" x="346" y="170">末一字换同音，前面原样念</text>
  <text class="lab2" x="20" y="198">红底＝动手的位置；底至少两字，字数不合就整条作废。</text>
</svg>