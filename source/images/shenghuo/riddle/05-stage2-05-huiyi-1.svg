<svg viewBox="0 0 760 250" role="img" aria-label="会意法三条路线正扣、反扣、用典的总览图" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="26" class="labk">会意法三条路线：同一件"换说法"的事，从三个方向换</text>

  <rect x="20" y="46" width="230" height="150" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="135" y="70" class="labk" text-anchor="middle">① 正扣（顺着说）</text>
  <text x="135" y="96" class="lab2" text-anchor="middle">谜面与谜底同义相对</text>
  <text x="135" y="118" class="lab2" text-anchor="middle">靠近义词、同义短语相代</text>
  <text x="135" y="140" class="lab2" text-anchor="middle">例：不劳而获＝坐享其成</text>
  <text x="135" y="168" class="lab" text-anchor="middle">最平，也最好验证</text>

  <rect x="266" y="46" width="230" height="150" class="hlc" stroke="#c0392b" stroke-width="1.3"/>
  <text x="381" y="70" class="labk" text-anchor="middle">② 反扣（反着说）</text>
  <text x="381" y="96" class="lab2" text-anchor="middle">从反面落笔，正面对上</text>
  <text x="381" y="118" class="lab2" text-anchor="middle">靠否定词：不、无、非、未</text>
  <text x="381" y="140" class="lab2" text-anchor="middle">例：不左不右＝中</text>
  <text x="381" y="168" class="lab" text-anchor="middle">最省字，也最容易被忽略</text>

  <rect x="512" y="46" width="228" height="150" class="hl" stroke="#2f7d42" stroke-width="1.3"/>
  <text x="626" y="70" class="labk" text-anchor="middle">③ 用典（借一件事说）</text>
  <text x="626" y="96" class="lab2" text-anchor="middle">面或底指向一个故事</text>
  <text x="626" y="118" class="lab2" text-anchor="middle">典故要人人查得到</text>
  <text x="626" y="140" class="lab2" text-anchor="middle">例：桃园结义＝拜兄弟</text>
  <text x="626" y="168" class="lab" text-anchor="middle">最耐读，也最容易出僻典</text>

  <text x="18" y="226" class="lab">三条路都还离不开"换挡"：正扣换的是词义，反扣换的是方向，用典换的是所指。字形一个都不动。</text>
</svg>