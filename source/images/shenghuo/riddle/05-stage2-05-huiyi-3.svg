<svg viewBox="0 0 760 250" role="img" aria-label="落花时节又逢君三段对扣成谢别会三字的示意图" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="26" class="labk">"落花时节又逢君 → 谢别会"：三段对三段，顺序不许乱</text>

  <rect x="30" y="46" width="200" height="44" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="130" y="74" class="kai" text-anchor="middle" style="font-size:22px">落 花</text>
  <line x1="130" y1="92" x2="130" y2="118" class="arrow"/><path d="M125 112 l5 8 5 -8" class="arrow"/>
  <text x="130" y="140" class="lab2" text-anchor="middle">花谢了＝凋落</text>
  <rect x="90" y="150" width="80" height="52" class="hl" stroke="#2f7d42" stroke-width="1.5"/>
  <text x="130" y="188" class="kai stroke-in" text-anchor="middle" style="font-size:34px">谢</text>

  <rect x="280" y="46" width="200" height="44" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="380" y="74" class="kai" text-anchor="middle" style="font-size:22px">时 节</text>
  <line x1="380" y1="92" x2="380" y2="118" class="arrow"/><path d="M375 112 l5 8 5 -8" class="arrow"/>
  <text x="380" y="140" class="lab2" text-anchor="middle">正是分别的那时候</text>
  <rect x="340" y="150" width="80" height="52" class="hl" stroke="#2f7d42" stroke-width="1.5"/>
  <text x="380" y="188" class="kai stroke-in" text-anchor="middle" style="font-size:34px">别</text>

  <rect x="530" y="46" width="200" height="44" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="630" y="74" class="kai" text-anchor="middle" style="font-size:22px">又逢君</text>
  <line x1="630" y1="92" x2="630" y2="118" class="arrow"/><path d="M625 112 l5 8 5 -8" class="arrow"/>
  <text x="630" y="140" class="lab2" text-anchor="middle">逢＝会面，"会"取此义</text>
  <rect x="590" y="150" width="80" height="52" class="hl" stroke="#2f7d42" stroke-width="1.5"/>
  <text x="630" y="188" class="kai stroke-in" text-anchor="middle" style="font-size:34px">会</text>

  <text x="18" y="230" class="lab">连起来读一遍就服气：花谢的时候跟你告别又相会——谜底"谢别会"三字一字顶一段，谁也不多谁也不少。</text>
</svg>