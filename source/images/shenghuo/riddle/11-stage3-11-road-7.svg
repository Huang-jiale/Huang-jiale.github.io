 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="360" height="230"/>
  <text class="labk" x="14" y="22">✗ 不设这一族时</text>
  <text class="lab2" x="14" y="48">题面：方针</text>
  <text class="lab2" x="14" y="68">谜目：打三字（物理名词）</text>
  <text class="lab2" x="14" y="98">① 底若写"角线"，</text>
  <text class="lab2" x="14" y="116">　不是现成的词 ✗</text>
  <text class="lab2" x="14" y="146">② 底若写"对角线"，</text>
  <text class="lab2" x="14" y="164">　多出的"对"没人交代 ✗</text>
  <text class="lab2" x="14" y="196">照直猜，两条都不合规矩；</text>
  <text class="lab2" x="14" y="214">缺的正"底要多添一字"这条。</text>
</svg>