<svg viewBox="0 0 360 230" role="img" aria-label="不设这一族时的困难" xmlns="http://www.w3.org/2000/svg" width="360" height="230"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
