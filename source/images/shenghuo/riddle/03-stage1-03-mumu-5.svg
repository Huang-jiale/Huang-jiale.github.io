<svg viewBox="0 0 760 260" role="img" aria-label="三字谜目下歪风拆成不正派、独眼龙读成少目合成省字" xmlns="http://www.w3.org/2000/svg" width="760" height="260"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="260" class="bg-paper"/>
  <text x="18" y="26" class="labk">谜目限"三字＋常用语"与限"一字"时，走的是两条不同的路</text>

  <text x="30" y="58" class="labk">打三字（常用语）：歪风 → 不正派</text>
  <rect x="30" y="70" width="150" height="44" class="cell" stroke="#1c1c1c" stroke-width="1.2"/>
  <text x="105" y="88" class="lab2" text-anchor="middle">歪＝不＋正</text>
  <text x="105" y="108" class="lab2" text-anchor="middle">拆读，得"不正"</text>
  <rect x="196" y="70" width="150" height="44" class="cell" stroke="#1c1c1c" stroke-width="1.2"/>
  <text x="271" y="88" class="lab2" text-anchor="middle">风＝风气、流派</text>
  <text x="271" y="108" class="lab2" text-anchor="middle">近义相替，得"派"</text>
  <line x1="352" y1="92" x2="392" y2="92" class="arrow"/><path d="M386 87 l8 5 -8 5" class="arrow"/>
  <g>
    <rect x="400" y="70" width="46" height="46" class="hl" stroke="#2f7d42" stroke-width="1.4"/>
    <rect x="448" y="70" width="46" height="46" class="hl" stroke="#2f7d42" stroke-width="1.4"/>
    <rect x="496" y="70" width="46" height="46" class="hl" stroke="#2f7d42" stroke-width="1.4"/>
    <text x="423" y="103" class="kai" text-anchor="middle" style="font-size:28px">不</text>
    <text x="471" y="103" class="kai" text-anchor="middle" style="font-size:28px">正</text>
    <text x="519" y="103" class="kai stroke-in" text-anchor="middle" style="font-size:28px">派</text>
  </g>
  <text x="400" y="140" class="lab2">三字刚好填满三处，多一字少一字都算错</text>
  <text x="400" y="162" class="lab2">前两个字来自拆字，第三个来自换词</text>

  <line x1="18" y1="182" x2="742" y2="182" class="st-thin"/>
  <text x="30" y="212" class="labk">打一字：独眼龙 → 省（少目）</text>
  <rect x="330" y="192" width="60" height="44" class="hlb" stroke="#0f6ab5" stroke-width="1.2"/>
  <text x="360" y="222" class="kai" text-anchor="middle" style="font-size:26px">少</text>
  <text x="404" y="222" class="lab2">＋</text>
  <rect x="424" y="192" width="60" height="44" class="hlb" stroke="#0f6ab5" stroke-width="1.2"/>
  <text x="454" y="222" class="kai" text-anchor="middle" style="font-size:26px">目</text>
  <line x1="490" y1="214" x2="530" y2="214" class="arrow"/><path d="M524 209 l8 5 -8 5" class="arrow"/>
  <rect x="538" y="188" width="56" height="56" class="hl" stroke="#2f7d42" stroke-width="1.6"/>
  <text x="566" y="228" class="kai stroke-in" text-anchor="middle" style="font-size:34px">省</text>
  <text x="610" y="212" class="lab2">独眼＝少一只眼睛</text>
  <text x="610" y="234" class="lab2">目就是眼睛，少在目上＝省</text>
</svg>