<svg viewBox="0 0 760 230" role="img" aria-label="两山相叠成出字、立与单人旁相拼成位字" xmlns="http://www.w3.org/2000/svg" width="760" height="230"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="230" class="bg-paper"/>
  <text x="18" y="26" class="labk">两条"合"：零件相同，摆法不同，答案就不同</text>

  <text x="100" y="56" class="lab2" text-anchor="middle">山（在上）</text>
  <rect x="50" y="62" width="100" height="52" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="100" y="100" class="kai" text-anchor="middle" style="font-size:32px">山</text>
  <text x="100" y="130" class="lab2" text-anchor="middle">＋</text>
  <rect x="50" y="136" width="100" height="52" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="100" y="174" class="kai" text-anchor="middle" style="font-size:32px">山</text>
  <text x="100" y="204" class="lab2" text-anchor="middle">上下相叠</text>
  <line x1="156" y1="120" x2="204" y2="120" class="arrow"/><path d="M198 115 l8 5 -8 5" class="arrow"/>
  <rect x="212" y="88" width="66" height="66" class="hl" stroke="#2f7d42" stroke-width="1.6"/>
  <text x="245" y="136" class="kai stroke-in" text-anchor="middle" style="font-size:40px">出</text>
  <text x="245" y="182" class="labk" text-anchor="middle">＝ 出</text>

  <line x1="320" y1="44" x2="320" y2="212" class="st-thin"/>

  <text x="400" y="56" class="lab2" text-anchor="middle">亻（单人旁）</text>
  <rect x="356" y="62" width="88" height="66" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="400" y="110" class="kai" text-anchor="middle" style="font-size:38px">亻</text>
  <text x="458" y="104" class="lab2">＋</text>
  <text x="510" y="56" class="lab2" text-anchor="middle">立</text>
  <rect x="470" y="62" width="88" height="66" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="514" y="110" class="kai" text-anchor="middle" style="font-size:38px">立</text>
  <line x1="566" y1="95" x2="606" y2="95" class="arrow"/><path d="M600 90 l8 5 -8 5" class="arrow"/>
  <rect x="614" y="62" width="66" height="66" class="hl" stroke="#2f7d42" stroke-width="1.6"/>
  <text x="647" y="110" class="kai stroke-in" text-anchor="middle" style="font-size:38px">位</text>
  <text x="614" y="152" class="labk">＝ 位</text>
  <text x="356" y="164" class="lab">"旁"＝左右并排；"还有""相叠"＝上下并排。</text>
  <text x="356" y="190" class="lab2">方位词决定摆法，摆错了就是另一个字，甚至不成字。</text>
</svg>