<svg viewBox="0 0 360 196" role="img" aria-label="两字底与三字底的分界对照" xmlns="http://www.w3.org/2000/svg" width="360" height="196"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="360" height="196"/>
  <text class="labk" x="14" y="22">分界只有一条：字数</text>
  <rect class="cell-g" x="14" y="38" width="40" height="40" stroke="#1c1c1c"/>
  <rect class="cell-g" x="56" y="38" width="40" height="40" stroke="#1c1c1c"/>
  <text class="num" x="34" y="66" text-anchor="middle">甲</text>
  <text class="num" x="76" y="66" text-anchor="middle">乙</text>
  <text class="lab2" x="106" y="62">2 字 →「秋千格」</text>
  <rect class="cell-g" x="14" y="90" width="40" height="40" stroke="#1c1c1c"/>
  <rect class="cell-g" x="56" y="90" width="40" height="40" stroke="#1c1c1c"/>
  <rect class="cell-g" x="98" y="90" width="40" height="40" stroke="#1c1c1c"/>
  <text class="num" x="34" y="118" text-anchor="middle">甲</text>
  <text class="num" x="76" y="118" text-anchor="middle">乙</text>
  <text class="num" x="118" y="118" text-anchor="middle">丙</text>
  <text class="lab2" x="150" y="110">3 字及以上</text>
  <text class="lab2" x="150" y="128">→「卷帘格」</text>
  <text class="lab2" x="14" y="166">同一个动作（倒读），</text>
  <text class="lab2" x="14" y="184">底长决定挂哪一条。</text>
</svg>