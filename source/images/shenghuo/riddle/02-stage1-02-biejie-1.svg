<svg viewBox="0 0 760 240" role="img" aria-label="别解像换挡：同一个词的两条意思岔路" xmlns="http://www.w3.org/2000/svg" width="760" height="240"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="240" class="bg-paper"/>
  <text x="18" y="26" class="labk">同一个词的两条路：平时走左边，灯谜走右边</text>

  <rect x="250" y="46" width="260" height="46" class="cell" stroke="#1c1c1c" stroke-width="1.4"/>
  <text x="380" y="76" class="labk" text-anchor="middle">谜面上出现一个词</text>

  <line x1="330" y1="92" x2="150" y2="136" class="st-thin"/>
  <line x1="430" y1="92" x2="610" y2="136" class="st-red"/>
  <text x="230" y="118" class="lab2">平时说话走这条</text>
  <text x="484" y="118" class="lab2" fill="#c0392b">灯谜走这条（别解）</text>

  <rect x="30" y="140" width="320" height="72" class="cell-g" stroke="#9a9a9a"/>
  <text x="190" y="164" class="labk" text-anchor="middle">常用义（本义、比喻义）</text>
  <text x="190" y="188" class="lab2" text-anchor="middle">铁公鸡＝一毛不拔的吝啬人</text>
  <text x="190" y="208" class="lab2" text-anchor="middle">走这条路得到的是翻译，不是谜</text>

  <rect x="420" y="140" width="320" height="72" class="hl" stroke="#2f7d42" stroke-width="1.4"/>
  <text x="580" y="164" class="labk" text-anchor="middle">另一层意思（临时身份）</text>
  <text x="580" y="188" class="lab2" text-anchor="middle">铁公鸡＝铁做的鸡，一根毛也拔不下</text>
  <text x="580" y="208" class="lab2" text-anchor="middle">换挡之后，答案才落在成语上</text>
</svg>