<svg viewBox="0 0 760 250" role="img" aria-label="谜目把候选范围逐层收窄的示意图" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="26" class="labk">谜目的作用：把"全世界的答案"收窄成"一小撮候选"</text>
  <rect x="20" y="46" width="230" height="150" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="135" y="70" class="labk" text-anchor="middle">没有谜目</text>
  <text x="135" y="98" class="lab2" text-anchor="middle">候选＝所有字＋所有词</text>
  <text x="135" y="120" class="lab2" text-anchor="middle">＋所有成语＋所有东西</text>
  <text x="135" y="150" class="lab2" text-anchor="middle">没人猜得到，只能瞎蒙</text>
  <line x1="252" y1="121" x2="292" y2="121" class="arrow"/><path d="M286 116 l8 5 -8 5" class="arrow"/>

  <rect x="296" y="46" width="200" height="150" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="396" y="70" class="labk" text-anchor="middle">打一字</text>
  <text x="396" y="100" class="lab2" text-anchor="middle">类别＝汉字</text>
  <text x="396" y="124" class="lab2" text-anchor="middle">长度＝1</text>
  <text x="396" y="156" class="lab2" text-anchor="middle">范围一收，拆字谜立刻有方向</text>
  <line x1="498" y1="121" x2="538" y2="121" class="arrow"/><path d="M532 116 l8 5 -8 5" class="arrow"/>

  <rect x="542" y="46" width="198" height="150" class="hl" stroke="#2f7d42" stroke-width="1.3"/>
  <text x="641" y="70" class="labk" text-anchor="middle">打二字（日常用品）</text>
  <text x="641" y="100" class="lab2" text-anchor="middle">类别＝两个字的名词</text>
  <text x="641" y="124" class="lab2" text-anchor="middle">领域＝家里用得着的东西</text>
  <text x="641" y="156" class="lab2" text-anchor="middle">候选缩到几十个，能推理了</text>
  <text x="18" y="226" class="lab">结论：谜目不是"好心提示"，它是题目的边界条件；跳过谜目去猜，等于不看定义域就解题。</text>
</svg>