<svg viewBox="0 0 760 250" role="img" aria-label="府字按口诀四句逐步装配的步骤图" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="26" class="labk">口诀谜＝装配流水线：四句话给出三个部件，装成一个字</text>

  <text x="30" y="54" class="lab2">第一、二句：一点一横长，一撇到南洋</text>
  <rect x="30" y="62" width="120" height="60" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <circle cx="66" cy="82" r="3.5" class="dot"/>
  <line x1="52" y1="94" x2="104" y2="94" class="st"/>
  <path d="M56 108 q10 -22 26 -26" class="st"/>
  <text x="90" y="140" class="lab2" text-anchor="middle">点＋横＋撇＝广</text>
  <text x="160" y="100" class="lab2">＋</text>
  <rect x="180" y="62" width="60" height="60" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="210" y="106" class="kai" text-anchor="middle" style="font-size:36px">广</text>

  <text x="30" y="176" class="lab2">第三句：南洋有个人</text>
  <rect x="270" y="146" width="60" height="60" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="300" y="190" class="kai" text-anchor="middle" style="font-size:36px">亻</text>
  <text x="338" y="184" class="lab2">＋</text>
  <text x="360" y="138" class="lab2">第四句：只有一寸长</text>
  <rect x="376" y="146" width="60" height="60" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="406" y="190" class="kai" text-anchor="middle" style="font-size:36px">寸</text>
  <line x1="444" y1="176" x2="486" y2="176" class="arrow"/><path d="M480 171 l8 5 -8 5" class="arrow"/>

  <rect x="494" y="140" width="72" height="72" class="hl" stroke="#2f7d42" stroke-width="1.6"/>
  <text x="530" y="192" class="kai stroke-in" text-anchor="middle" style="font-size:42px">府</text>
  <text x="580" y="168" class="labk">＝ 府</text>
  <text x="580" y="192" class="lab2">广字头里装"亻＋寸"</text>
  <text x="580" y="214" class="lab2">亻与寸并排＝付，府＝广＋付</text>

  <text x="30" y="234" class="lab">核对方法：把"府"字拆开倒着走一遍——广、亻、寸，三块与口诀的三处指令一一对上，多一处少一处都算错。</text>
</svg>