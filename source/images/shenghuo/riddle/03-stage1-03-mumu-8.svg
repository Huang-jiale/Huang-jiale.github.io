<svg viewBox="0 0 760 220" role="img" aria-label="谜面过松导致两个答案同时成立的示意图" xmlns="http://www.w3.org/2000/svg" width="760" height="220"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="220" class="bg-paper"/>
  <text x="18" y="26" class="labk">病灶图：题面只给两个字，答案却有两条路可走</text>
  <rect x="40" y="52" width="120" height="50" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="100" y="84" class="kai" text-anchor="middle" style="font-size:30px">十一</text>
  <text x="100" y="122" class="lab2" text-anchor="middle">谜目：打一字</text>
  <line x1="166" y1="70" x2="228" y2="52" class="arrow"/><path d="M222 49 l8 4 -8 6" class="arrow"/>
  <line x1="166" y1="84" x2="228" y2="104" class="arrow"/><path d="M222 100 l8 5 -8 5" class="arrow"/>
  <rect x="236" y="30" width="70" height="46" class="hlc" stroke="#c0392b" stroke-width="1.4"/>
  <text x="271" y="64" class="kai" text-anchor="middle" style="font-size:30px">土</text>
  <rect x="236" y="88" width="70" height="46" class="hlc" stroke="#c0392b" stroke-width="1.4"/>
  <text x="271" y="122" class="kai" text-anchor="middle" style="font-size:30px">士</text>
  <text x="330" y="52" class="lab2">一横在下 → 土</text>
  <text x="330" y="110" class="lab2">一横在上 → 士</text>
  <text x="330" y="140" class="lab">两条推法都合规 ⇒ 范围太宽，不是读者笨</text>
  <rect x="330" y="152" width="410" height="48" class="cell-g" stroke="#9a9a9a"/>
  <text x="346" y="174" class="lab2">修补一：把题面收紧，让某个部件只属于其中一个答案。</text>
  <text x="346" y="194" class="lab2">修补二：在谜目里加一句限定（类别／词性），把另一条路堵死。</text>
</svg>