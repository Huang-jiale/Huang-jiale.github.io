  <rect class="bg-paper" width="360" height="214"/>
  <text class="labk" x="14" y="22">✗ 半成品：三个毛病齐发</text>
  <text class="lab2" x="14" y="46">题面：明月几时有，</text>
  <text class="lab2" x="14" y="64">　　　问天欲归去</text>
  <text class="lab2" x="14" y="86">底：白天赏月好</text>
  <text class="lab2" x="14" y="112">① 露面：题面与底同</text>
  <text class="lab2" x="14" y="130">　 见"月、天"二字 ✗</text>
  <text class="lab2" x="14" y="152">② 闲字：底里"好"是凑字 ✗</text>
  <text class="lab2" x="14" y="174">③ 不成词：底不是现成语 ✗</text>
  <text class="lab2" x="14" y="200">谜目也不清：打五字什么？</text>
