<svg viewBox="0 0 760 232" role="img" aria-label="燕尾格把末字左右劈开成两字的变换示意" xmlns="http://www.w3.org/2000/svg" width="760" height="232"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="232"/>
  <text class="labk" x="20" y="24">变换示意：末一字沿虚线劈开，读出来多一个字</text>
  <rect class="cell-g" x="20" y="44" width="128" height="44" stroke="#9a9a9a"/>
  <text class="lab" x="32" y="71">谜面「久旱」</text>
  <path class="arrow" d="M152 66 h26"/><path class="arrow" d="M172 60 l8 6 l-8 6"/>
  <text class="lab2" x="196" y="42">工序前（两字底）</text>
  <rect class="cell" x="196" y="50" width="44" height="44" stroke="#1c1c1c"/>
  <rect class="hl" x="246" y="50" width="44" height="44" stroke="#1c1c1c"/>
  <text class="num" x="218" y="81" text-anchor="middle">长</text>
  <text class="num" x="261" y="81" text-anchor="middle">氵</text>
  <text class="num" x="283" y="81" text-anchor="middle">少</text>
  <path class="st-thin" d="M268 52 v40"/>
  <text class="lab2" x="196" y="112">沙 ＝ 氵 ＋ 少（虚线即劈口）</text>
  <path class="arrow" d="M296 76 h32"/><path class="arrow" d="M322 70 l8 6 l-8 6"/>
  <rect class="cell" x="340" y="50" width="44" height="44" stroke="#1c1c1c"/>
  <rect class="cell" x="390" y="50" width="44" height="44" stroke="#1c1c1c"/>
  <rect class="cell" x="440" y="50" width="44" height="44" stroke="#1c1c1c"/>
  <text class="num" x="362" y="81" text-anchor="middle">长</text>
  <text class="num" x="412" y="81" text-anchor="middle">水</text>
  <text class="num" x="462" y="81" text-anchor="middle">少</text>
  <text class="lab2" x="340" y="132">工序后（三字读法）</text>
  <text class="lab" x="510" y="82">长期水少 ＝ 久旱 ✓</text>
  <text class="lab2" x="510" y="112">前字一律不动；</text>
  <text class="lab2" x="510" y="132">只能劈末一字。</text>
  <text class="lab2" x="20" y="160">挑底的三条经验：</text>
  <text class="lab2" x="20" y="182">① 末字要是左右结构（沙、湖、明、张一类），上下结构的不算劈成两字；</text>
  <text class="lab2" x="20" y="202">② 劈出的两半都得是能独立成字的部件；</text>
  <text class="lab2" x="20" y="222">③ 连读三字要成话，"长水少"说得出口，"水长少"就说不通。</text>
</svg>