<svg viewBox="0 0 760 176" role="img" aria-label="每天二十分钟的四段切分" xmlns="http://www.w3.org/2000/svg" width="760" height="176"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="176"/>
  <text class="labk" x="20" y="24">每天的 20 分钟这样切：读 5、做 8、改 5、记 2</text>
  <rect class="hl" x="20" y="44" width="120" height="46" stroke="#1c1c1c"/>
  <text class="lab" x="30" y="66">① 读旧谜</text>
  <text class="lab2" x="30" y="84">5 分钟</text>
  <rect class="cell-g" x="146" y="44" width="192" height="46" stroke="#9a9a9a"/>
  <text class="lab" x="156" y="66">② 做新题</text>
  <text class="lab2" x="156" y="84">8 分钟</text>
  <rect class="f-g2" x="344" y="44" width="120" height="46" stroke="#9a9a9a"/>
  <text class="lab" x="354" y="66">③ 订正</text>
  <text class="lab2" x="354" y="84">5 分钟</text>
  <rect class="f-g4" x="470" y="44" width="48" height="46" stroke="#9a9a9a"/>
  <path class="guide" d="M518 66 h12"/>
  <text class="lab2" x="534" y="66">④ 记毛病 2 分钟</text>
  <text class="lab2" x="20" y="112">① 只读题面与谜目，先在心里报出门类与手法，不许看底。</text>
  <text class="lab2" x="20" y="132">② 想满 3 分钟没有进展就翻底。翻底不算输，翻完不写原因才算输。</text>
  <text class="lab2" x="20" y="152">③ 把这条谜的类别、手法、变形一并抄进小册；④ 用两个字记下毛病，攒成自己的病谜表。</text>
</svg>