<svg viewBox="0 0 760 214" role="img" aria-label="以秦岭为例的选底到造面过程" xmlns="http://www.w3.org/2000/svg" width="760" height="214"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="214"/>
  <text class="labk" x="20" y="24">实例分解：先验"能不能拆"，再写题面</text>
  <text class="lab2" x="20" y="48">候选底（两字山脉名）</text>
  <rect class="hl" x="200" y="34" width="44" height="44" stroke="#1c1c1c"/>
  <rect class="hl" x="250" y="34" width="44" height="44" stroke="#1c1c1c"/>
  <text class="num" x="222" y="65" text-anchor="middle">秦</text>
  <text class="num" x="272" y="65" text-anchor="middle">岭</text>
  <path class="arrow" d="M300 56 h24"/><path class="arrow" d="M318 50 l8 6 l-8 6"/>
  <text class="lab2" x="332" y="46">拆开看部件：</text>
  <text class="num" x="332" y="72">秦 ＝ 春之上 ＋ 秋之禾</text>
  <text class="num" x="530" y="72">岭 ＝ 山 ＋ 令</text>
  <text class="lab2" x="20" y="108">① 部件都是常见字 → 可拆 ✓　　② 拆法各只有一条路 → 唯一 ✓</text>
  <text class="lab2" x="20" y="130">③ 题面须交代：取哪一半、放在哪一边、以及"有"这个抱合动作</text>
  <rect class="cell-g" x="20" y="140" width="300" height="48" stroke="#9a9a9a"/>
  <text class="lab" x="32" y="170">题面：春秋各半，山旁有令</text>
  <path class="arrow" d="M326 164 h26"/><path class="arrow" d="M346 158 l8 6 l-8 6"/>
  <rect class="cell-g" x="358" y="140" width="360" height="48" stroke="#9a9a9a"/>
  <text class="lab2" x="370" y="160">春、秋各半＝取部件；山旁＝定位置</text>
  <text class="lab2" x="370" y="180">有＝抱合；令＝补件：八字全有职务</text>
  <text class="lab2" x="20" y="208">自查结果：无闲字、无重字、底是现成专名——三条都过，这条谜才可以发出去。</text>
</svg>