<svg viewBox="0 0 760 250" role="img" aria-label="位字去掉单人旁剩立字、地字去掉土旁剩也字的损法示意" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="26" class="labk">损法最好验：原字减去部件，剩下的就是答案</text>

  <rect x="30" y="46" width="150" height="70" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="68" y="96" class="kai" text-anchor="middle" style="font-size:40px">亻</text>
  <text x="128" y="96" class="kai" text-anchor="middle" style="font-size:40px">立</text>
  <line x1="105" y1="46" x2="105" y2="116" class="st-thin"/>
  <text x="105" y="136" class="lab2" text-anchor="middle">原字：位</text>
  <rect x="36" y="52" width="66" height="58" class="hlc" opacity=".65"/>
  <line x1="40" y1="56" x2="98" y2="106" class="st-red" stroke-width="2"/>
  <line x1="98" y1="56" x2="40" y2="106" class="st-red" stroke-width="2"/>
  <text x="69" y="158" class="lab2" text-anchor="middle">"人不在"＝删这块</text>
  <line x1="186" y1="81" x2="228" y2="81" class="arrow"/><path d="M222 76 l8 5 -8 5" class="arrow"/>
  <rect x="236" y="52" width="64" height="64" class="hl" stroke="#2f7d42" stroke-width="1.6"/>
  <text x="268" y="98" class="kai stroke-in" text-anchor="middle" style="font-size:38px">立</text>
  <text x="236" y="140" class="labk">＝ 立（答案）</text>

  <line x1="18" y1="176" x2="742" y2="176" class="st-thin"/>
  <rect x="30" y="186" width="150" height="52" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="68" y="222" class="kai" text-anchor="middle" style="font-size:32px">土</text>
  <text x="128" y="222" class="kai" text-anchor="middle" style="font-size:32px">也</text>
  <line x1="105" y1="186" x2="105" y2="238" class="st-thin"/>
  <rect x="36" y="190" width="66" height="44" class="hlc" opacity=".65"/>
  <text x="105" y="180" class="lab2" text-anchor="middle">原字：地</text>
  <line x1="186" y1="212" x2="228" y2="212" class="arrow"/><path d="M222 207 l8 5 -8 5" class="arrow"/>
  <rect x="236" y="184" width="56" height="56" class="hl" stroke="#2f7d42" stroke-width="1.6"/>
  <text x="264" y="224" class="kai stroke-in" text-anchor="middle" style="font-size:34px">也</text>
  <text x="310" y="216" class="labk">＝ 也（答案）</text>
  <text x="440" y="216" class="lab">两条都是"减零件"：位－亻＝立，地－土＝也。</text>
</svg>