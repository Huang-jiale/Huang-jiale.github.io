<svg viewBox="0 0 760 268" role="img" aria-label="三字谜底逐字倒序的格子变换示意" xmlns="http://www.w3.org/2000/svg" width="760" height="268"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="268"/>
  <text class="labk" x="20" y="24">变换示意：三字全反转，1 与 3 互换、2 留在原位</text>
  <rect class="cell-g" x="20" y="46" width="176" height="44" stroke="#9a9a9a"/>
  <text class="lab" x="32" y="73">谜面「教师示范」</text>
  <text class="lab2" x="222" y="40">工序前（纸上写的底）</text>
  <rect class="hl" x="222" y="50" width="46" height="46" stroke="#1c1c1c"/>
  <rect class="cell-g" x="274" y="50" width="46" height="46" stroke="#1c1c1c"/>
  <rect class="hl" x="326" y="50" width="46" height="46" stroke="#1c1c1c"/>
  <text class="num" x="245" y="81" text-anchor="middle">仿</text>
  <text class="num" x="297" y="81" text-anchor="middle">生</text>
  <text class="num" x="349" y="81" text-anchor="middle">学</text>
  <text class="cand" x="226" y="64">1</text>
  <text class="cand" x="278" y="64">2</text>
  <text class="cand" x="330" y="64">3</text>
  <path class="arrow" d="M245 100 v26 h104 v22"/><path class="arrow" d="M343 142 l6 6 l6 -6"/>
  <path class="arrow" d="M349 100 v26 h-104 v22"/><path class="arrow" d="M240 142 l6 6 l6 -6"/>
  <path class="st-thin" d="M297 100 v44"/><path class="st-thin" d="M291 138 l6 6 l6 -6"/>
  <text class="lab2" x="404" y="112">两端互换（黄色那两处）</text>
  <text class="lab2" x="404" y="132">中间一字不动（虚线）</text>
  <text class="lab2" x="404" y="152">四字底同理：1234 → 4321</text>
  <rect class="cell-g" x="222" y="168" width="46" height="46" stroke="#1c1c1c"/>
  <rect class="cell-g" x="274" y="168" width="46" height="46" stroke="#1c1c1c"/>
  <rect class="cell-g" x="326" y="168" width="46" height="46" stroke="#1c1c1c"/>
  <text class="num" x="245" y="199" text-anchor="middle">学</text>
  <text class="num" x="297" y="199" text-anchor="middle">生</text>
  <text class="num" x="349" y="199" text-anchor="middle">仿</text>
  <text class="lab2" x="222" y="228">工序后的读法</text>
  <text class="lab" x="330" y="228">学生仿 → 教师做、学生照着学 ✓</text>
  <text class="lab2" x="20" y="256">常见误读：只把末字提到前面（那是"移字一族"的做法，见第 08 课），这一族必须整串反过来。</text>
</svg>