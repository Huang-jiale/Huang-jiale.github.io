<svg viewBox="0 0 760 178" role="img" aria-label="出谜五步流程" xmlns="http://www.w3.org/2000/svg" width="760" height="178"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="178"/>
  <text class="labk" x="20" y="24">出谜动线：从底出发，最后必须回到面</text>
  <rect class="cell-g" x="20" y="40" width="118" height="44" stroke="#1c1c1c"/>
  <text class="lab" x="30" y="67">① 挑一个底</text>
  <path class="arrow" d="M140 62 h16"/><path class="arrow" d="M150 56 l8 6 l-8 6"/>
  <rect class="cell-g" x="160" y="40" width="118" height="44" stroke="#1c1c1c"/>
  <text class="lab" x="170" y="67">② 试它能变</text>
  <path class="arrow" d="M280 62 h16"/><path class="arrow" d="M290 56 l8 6 l-8 6"/>
  <rect class="cell-g" x="300" y="40" width="118" height="44" stroke="#1c1c1c"/>
  <text class="lab" x="310" y="67">③ 起草题面</text>
  <path class="arrow" d="M420 62 h16"/><path class="arrow" d="M430 56 l8 6 l-8 6"/>
  <rect class="cell-g" x="440" y="40" width="118" height="44" stroke="#1c1c1c"/>
  <text class="lab" x="450" y="67">④ 三关倒查</text>
  <path class="arrow" d="M560 62 h16"/><path class="arrow" d="M570 56 l8 6 l-8 6"/>
  <rect class="hl" x="580" y="40" width="118" height="44" stroke="#1c1c1c"/>
  <text class="lab" x="590" y="67">⑤ 找人试猜</text>
  <text class="lab2" x="24" y="100">熟词、现成词优先</text>
  <text class="lab2" x="164" y="100">能拆？能会？能倒？</text>
  <text class="lab2" x="304" y="100">宁短勿长，字字有用</text>
  <text class="lab2" x="444" y="100">形、扣、卫生各查一遍</text>
  <text class="lab2" x="584" y="100">3 人 3 分钟内中即成立</text>
  <text class="lab2" x="20" y="134">第 ① 步先查底：把选好的底拿去检索一遍，若前人已有名谜用它作底，就换一个——这一层功夫叫"避撞底"。</text>
  <text class="lab2" x="20" y="158">第 ⑤ 步别省：自己出的谜自己永远觉得"显然"，只有别人能告诉你它到底通不通。</text>
</svg>