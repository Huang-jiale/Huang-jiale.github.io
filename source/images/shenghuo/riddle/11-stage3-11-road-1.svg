<svg viewBox="0 0 760 212" role="img" aria-label="六样东西的分工地图" xmlns="http://www.w3.org/2000/svg" width="760" height="212"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="212"/>
  <text class="labk" x="20" y="24">六样东西的分工：一样是心法，五样是手法</text>
  <rect class="hl" x="20" y="40" width="140" height="48" stroke="#1c1c1c"/>
  <text class="lab" x="32" y="62">别解</text>
  <text class="lab2" x="32" y="80">心法：话两样说</text>
  <rect class="cell-g" x="180" y="40" width="104" height="48" stroke="#9a9a9a"/>
  <text class="lab" x="192" y="62">离合</text>
  <text class="lab2" x="192" y="80">拆字族</text>
  <rect class="cell-g" x="296" y="40" width="104" height="48" stroke="#9a9a9a"/>
  <text class="lab" x="308" y="62">会意</text>
  <text class="lab2" x="308" y="80">词义族</text>
  <rect class="cell-g" x="412" y="40" width="104" height="48" stroke="#9a9a9a"/>
  <text class="lab" x="424" y="62">象形</text>
  <text class="lab2" x="424" y="80">字形族</text>
  <rect class="cell-g" x="528" y="40" width="104" height="48" stroke="#9a9a9a"/>
  <text class="lab" x="540" y="62">谐音</text>
  <text class="lab2" x="540" y="80">字音族</text>
  <rect class="hlb" x="644" y="40" width="104" height="48" stroke="#0f6ab5"/>
  <text class="lab" x="652" y="62">「谜格」</text>
  <text class="lab2" x="656" y="80">变形族</text>
  <text class="lab2" x="188" y="112">部件重装</text>
  <text class="lab2" x="304" y="112">意义拐弯</text>
  <text class="lab2" x="420" y="112">字形如画</text>
  <text class="lab2" x="536" y="112">同音相代</text>
  <text class="lab2" x="652" y="112">底要先变</text>
  <text class="lab" x="20" y="148">判据一：直解就能猜中的谜，多半没有别解，是病谜。</text>
  <text class="lab" x="20" y="174">判据二：猜中之后的每一步都要能讲清楚，讲不清下次还会栽在同一条上。</text>
  <text class="lab2" x="20" y="200">「谜格」单独占两课，是因为它不改变扣合、只改变底的读法；扣合这件事仍旧归前面四样手法去做。</text>
</svg>