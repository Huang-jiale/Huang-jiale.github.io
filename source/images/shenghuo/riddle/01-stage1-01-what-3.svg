<svg viewBox="0 0 760 300" role="img" aria-label="半推半就去掉部件合并成掠字的拆字图" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="26" class="labk">"半推半就" → "掠"：每个字各留一半，再拼</text>

  <text x="100" y="56" class="lab2" text-anchor="middle">推（左右两半）</text>
  <rect x="30" y="66" width="140" height="76" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <rect x="31" y="67" width="69" height="74" class="hlb"/>
  <line x1="100" y1="66" x2="100" y2="142" class="st-thin"/>
  <text x="65" y="118" class="kai stroke-in" text-anchor="middle" style="font-size:34px">扌</text>
  <text x="135" y="118" class="kai f-g4" text-anchor="middle" style="font-size:34px">隹</text>
  <text x="100" y="164" class="lab2" text-anchor="middle">留蓝的，扔灰的</text>

  <text x="280" y="56" class="lab2" text-anchor="middle">就（左右两半）</text>
  <rect x="210" y="66" width="140" height="76" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <rect x="211" y="67" width="69" height="74" class="hlb"/>
  <line x1="280" y1="66" x2="280" y2="142" class="st-thin"/>
  <text x="245" y="118" class="kai stroke-in" text-anchor="middle" style="font-size:34px">京</text>
  <text x="315" y="118" class="kai f-g4" text-anchor="middle" style="font-size:34px">尤</text>
  <text x="280" y="164" class="lab2" text-anchor="middle">同样只留一半</text>

  <line x1="360" y1="104" x2="470" y2="104" class="arrow"/><path d="M464 99 l8 5 -8 5" class="arrow"/>
  <text x="415" y="92" class="lab2" text-anchor="middle">合并</text>

  <rect x="478" y="66" width="140" height="76" class="hl" stroke="#2f7d42" stroke-width="1.6"/>
  <text x="513" y="118" class="kai" text-anchor="middle" style="font-size:34px">扌</text>
  <text x="583" y="118" class="kai" text-anchor="middle" style="font-size:34px">京</text>
  <text x="548" y="56" class="lab2" text-anchor="middle">拼成的新字</text>
  <text x="660" y="112" class="labk">＝ 掠</text>
  <text x="548" y="164" class="lab2" text-anchor="middle">绿框＝谜底的字形</text>

  <text x="18" y="206" class="labk">如果换成谜语会怎么写？</text>
  <rect x="20" y="218" width="720" height="60" class="cell-g" stroke="#9a9a9a"/>
  <text x="40" y="242" class="lab">谜语（物谜）＝把东西的样子讲给你听："有时像面圆镜，有时像把镰刀"——说的是月亮本身。</text>
  <text x="40" y="266" class="lab">灯谜＝把字拆开再拼，或者把一个词读成另一个意思，全程讲规则，不讲样子。这就是两者的分界线。</text>
</svg>