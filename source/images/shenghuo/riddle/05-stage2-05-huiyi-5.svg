<svg viewBox="0 0 760 210" role="img" aria-label="桃园结义典故扣上拜兄弟三个字的示意" xmlns="http://www.w3.org/2000/svg" width="760" height="210"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="210" class="bg-paper"/>
  <text x="18" y="26" class="labk">用典谜的读法：先讲故事讲了什么，再把故事换成三个字的日常说法</text>

  <rect x="30" y="44" width="260" height="110" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="160" y="70" class="labk" text-anchor="middle">谜面给的是故事</text>
  <text x="160" y="96" class="lab2" text-anchor="middle">桃园结义（三国开篇）</text>
  <text x="160" y="118" class="lab2" text-anchor="middle">刘、关、张三人结为兄弟</text>
  <text x="160" y="140" class="lab2" text-anchor="middle">情节要素：结拜＋异姓兄弟</text>

  <line x1="296" y1="98" x2="346" y2="98" class="arrow"/><path d="M340 93 l8 5 -8 5" class="arrow"/>
  <text x="321" y="86" class="lab2" text-anchor="middle">换说法</text>

  <g>
    <rect x="356" y="72" width="56" height="56" class="hl" stroke="#2f7d42" stroke-width="1.5"/>
    <rect x="414" y="72" width="56" height="56" class="hl" stroke="#2f7d42" stroke-width="1.5"/>
    <rect x="472" y="72" width="56" height="56" class="hl" stroke="#2f7d42" stroke-width="1.5"/>
    <text x="384" y="110" class="kai" text-anchor="middle" style="font-size:30px">拜</text>
    <text x="442" y="110" class="kai" text-anchor="middle" style="font-size:30px">兄</text>
    <text x="500" y="110" class="kai stroke-in" text-anchor="middle" style="font-size:30px">弟</text>
  </g>
  <text x="356" y="160" class="lab2">结拜→拜 ｜ 异姓关系→兄弟</text>
  <text x="560" y="96" class="labk">＝ 拜兄弟</text>
  <text x="560" y="122" class="lab2">三字，合"打三字（常用语）"</text>
  <text x="560" y="144" class="lab2">字形一个没拆，全靠事件换词</text>

  <text x="18" y="186" class="lab">用典谜最怕"僻典"：读者不知道那个故事，就永远猜不出。所以老规矩是——宁可典故浅，不可答案生。</text>
  <text x="18" y="206" class="lab2">查不到出处的典故一律不用，这是底线，也是这门课所有例谜的写法。</text>
</svg>