<svg viewBox="0 0 760 250" role="img" aria-label="火柴分母一角三个答案的平时读法与谜中读法对照" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="26" class="labk">同一批答案：平时是一个词，进了谜里被读成两截话</text>

  <rect x="30" y="40" width="160" height="34" class="cell-g" stroke="#9a9a9a"/>
  <text x="110" y="63" class="labk" text-anchor="middle">答案（长度）</text>
  <rect x="200" y="40" width="260" height="34" class="cell-g" stroke="#9a9a9a"/>
  <text x="330" y="63" class="labk" text-anchor="middle">平时怎么读（词典义）</text>
  <rect x="470" y="40" width="270" height="34" class="cell-g" stroke="#9a9a9a"/>
  <text x="605" y="63" class="labk" text-anchor="middle">谜里怎么读（换挡之后）</text>

  <rect x="30" y="76" width="160" height="46" class="cell" stroke="#1c1c1c" stroke-width="1.2"/>
  <text x="110" y="106" class="kai" text-anchor="middle" style="font-size:24px">火柴</text>
  <rect x="200" y="76" width="260" height="46" class="cell" stroke="#1c1c1c" stroke-width="1.2"/>
  <text x="330" y="105" class="lab2" text-anchor="middle">一种擦一下就着的取火工具</text>
  <rect x="470" y="76" width="270" height="46" class="hl" stroke="#2f7d42" stroke-width="1.3"/>
  <text x="605" y="105" class="lab2" text-anchor="middle">火 与 柴（木）两样东西并列</text>

  <rect x="30" y="124" width="160" height="46" class="cell" stroke="#1c1c1c" stroke-width="1.2"/>
  <text x="110" y="154" class="kai" text-anchor="middle" style="font-size:24px">分母</text>
  <rect x="200" y="124" width="260" height="46" class="cell" stroke="#1c1c1c" stroke-width="1.2"/>
  <text x="330" y="153" class="lab2" text-anchor="middle">分数线下面那个数</text>
  <rect x="470" y="124" width="270" height="46" class="hl" stroke="#2f7d42" stroke-width="1.3"/>
  <text x="605" y="153" class="lab2" text-anchor="middle">与母分别（告别）</text>

  <rect x="30" y="172" width="160" height="46" class="cell" stroke="#1c1c1c" stroke-width="1.2"/>
  <text x="110" y="202" class="kai" text-anchor="middle" style="font-size:24px">一角</text>
  <rect x="200" y="172" width="260" height="46" class="cell" stroke="#1c1c1c" stroke-width="1.2"/>
  <text x="330" y="201" class="lab2" text-anchor="middle">钱币单位，等于十分</text>
  <rect x="470" y="172" width="270" height="46" class="hl" stroke="#2f7d42" stroke-width="1.3"/>
  <text x="605" y="201" class="lab2" text-anchor="middle">"十分"换算过来的那一角</text>
  <text x="18" y="240" class="lab">三行的共同点：答案本身没变，变的是"读法"；而允许你怎么读，是谜目说了算。</text>
</svg>