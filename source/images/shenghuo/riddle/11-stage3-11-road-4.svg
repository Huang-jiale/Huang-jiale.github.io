<svg viewBox="0 0 760 200" role="img" aria-label="交卷前的六站体检" xmlns="http://www.w3.org/2000/svg" width="760" height="200"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="200"/>
  <text class="labk" x="20" y="24">交卷之前过六站：任何一站不过，谜就不许发出去</text>
  <rect class="cell-g" x="20" y="40" width="112" height="46" stroke="#9a9a9a"/>
  <rect class="cell-g" x="142" y="40" width="112" height="46" stroke="#9a9a9a"/>
  <rect class="cell-g" x="264" y="40" width="112" height="46" stroke="#9a9a9a"/>
  <rect class="cell-g" x="386" y="40" width="112" height="46" stroke="#9a9a9a"/>
  <rect class="hl" x="508" y="40" width="112" height="46" stroke="#1c1c1c"/>
  <rect class="hl" x="630" y="40" width="112" height="46" stroke="#1c1c1c"/>
  <text class="lab" x="32" y="66">① 形状</text>
  <text class="lab" x="154" y="66">② 扣合</text>
  <text class="lab" x="276" y="66">③ 卫生</text>
  <text class="lab" x="398" y="66">④ 唯一</text>
  <text class="lab" x="520" y="66">⑤ 现成</text>
  <text class="lab" x="642" y="66">⑥ 公共</text>
  <text class="lab2" x="28" y="112">底对得上目</text>
  <text class="lab2" x="150" y="112">逐字有来源</text>
  <text class="lab2" x="272" y="112">面底无重字</text>
  <text class="lab2" x="394" y="112">想不出第二条</text>
  <text class="lab2" x="516" y="112">底是现成词</text>
  <text class="lab2" x="638" y="112">典在公共档</text>
  <text class="lab" x="20" y="146">前三站查自己：字数、扣合、重字，纸上一分钟就能过完。</text>
  <text class="lab" x="20" y="170">后两站查读者：这个词到底存在吗，这个典他认得吗，第二条路堵住了没有。</text>
  <text class="lab2" x="20" y="192">中间那一站要找人：把谜给没参与创作的人试猜，三分钟不中就得改面，别改答案。</text>
</svg>