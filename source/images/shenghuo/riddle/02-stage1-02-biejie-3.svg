<svg viewBox="0 0 760 300" role="img" aria-label="千里相逢合成重字、一斗米合成料字的部件图" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="26" class="labk">同一类换挡：词不管意思了，只看它包含的那几个字</text>

  <text x="120" y="56" class="lab2" text-anchor="middle">千（在上）</text>
  <rect x="60" y="64" width="120" height="64" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="120" y="108" class="kai" text-anchor="middle" style="font-size:40px">千</text>
  <text x="120" y="152" class="lab2" text-anchor="middle">里（在下）</text>
  <rect x="60" y="160" width="120" height="64" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="120" y="204" class="kai" text-anchor="middle" style="font-size:40px">里</text>
  <line x1="186" y1="144" x2="250" y2="144" class="arrow"/><path d="M244 139 l8 5 -8 5" class="arrow"/>
  <text x="218" y="132" class="lab2" text-anchor="middle">叠</text>
  <rect x="258" y="112" width="88" height="88" class="hl" stroke="#2f7d42" stroke-width="1.6"/>
  <text x="302" y="166" class="kai stroke-in" text-anchor="middle" style="font-size:44px">重</text>
  <text x="302" y="220" class="lab2" text-anchor="middle">千的头一撇与里的横相接</text>
  <text x="302" y="56" class="labk" text-anchor="middle">千里相逢 → 重</text>

  <line x1="370" y1="44" x2="370" y2="284" class="st-thin"/>

  <text x="520" y="56" class="labk" text-anchor="middle">一斗米 → 料</text>
  <text x="470" y="90" class="lab2" text-anchor="middle">米</text>
  <rect x="440" y="98" width="70" height="70" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="475" y="146" class="kai" text-anchor="middle" style="font-size:40px">米</text>
  <text x="545" y="90" class="lab2" text-anchor="middle">斗（量器）</text>
  <rect x="520" y="98" width="70" height="70" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="555" y="146" class="kai" text-anchor="middle" style="font-size:40px">斗</text>
  <text x="497" y="196" class="lab2" text-anchor="middle">左右并列，合成新字</text>
  <line x1="596" y1="133" x2="626" y2="133" class="arrow"/><path d="M620 128 l8 5 -8 5" class="arrow"/>
  <rect x="634" y="98" width="78" height="70" class="hl" stroke="#2f7d42" stroke-width="1.6"/>
  <text x="673" y="148" class="kai stroke-in" text-anchor="middle" style="font-size:40px">料</text>
  <text x="600" y="236" class="lab2" text-anchor="middle">换挡点：斗 从"量词"读回"量米的器具"</text>

  <text x="18" y="270" class="lab">这三条里，"相逢""一斗""九十九"都不是装饰，它们是操作指令：拼、并列、做减法。</text>
  <text x="18" y="292" class="lab2">把动词和数量词当废话跳过，是新手猜不出拆字谜的头号原因。</text>
</svg>