<svg viewBox="0 0 760 214" role="img" aria-label="求凰格：对仗并添加附字的示意" xmlns="http://www.w3.org/2000/svg" width="760" height="214"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="214"/>
  <text class="labk" x="20" y="24">例三（求凰格）：先把底对成仗，再添一个"配对"的字</text>
  <text class="lab2" x="20" y="68">题面（两字）</text>
  <rect class="cell" x="130" y="42" width="40" height="40" stroke="#1c1c1c"/>
  <rect class="cell" x="174" y="42" width="40" height="40" stroke="#1c1c1c"/>
  <text class="num" x="150" y="69" text-anchor="middle">方</text>
  <text class="num" x="194" y="69" text-anchor="middle">针</text>
  <text class="lab2" x="20" y="148">谜底（三字）</text>
  <rect class="hlc" x="130" y="122" width="40" height="40" stroke="#c0392b"/>
  <rect class="cell" x="174" y="122" width="40" height="40" stroke="#1c1c1c"/>
  <rect class="cell" x="218" y="122" width="40" height="40" stroke="#1c1c1c"/>
  <text class="num" x="150" y="149" text-anchor="middle">对</text>
  <text class="num" x="194" y="149" text-anchor="middle">角</text>
  <text class="num" x="238" y="149" text-anchor="middle">线</text>
  <path class="st-blue" d="M194 122 v-16 h-44 v-12"/>
  <path class="arrow-r" d="M145 96 l5 -7 l5 7"/>
  <path class="st-blue" d="M238 122 v-28 h-44 v-6"/>
  <path class="arrow-r" d="M189 90 l5 -7 l5 7"/>
  <text class="lab2" x="300" y="60">方 ↔ 角：方位对形状，虚字对虚字</text>
  <text class="lab2" x="300" y="82">针 ↔ 线：针线本来就是一双</text>
  <text class="lab2" x="300" y="140">红框的"对"是附加字，不参与扣面</text>
  <text class="lab2" x="300" y="162">附加字只能用对、双、偶、配、联、齐、匹一类</text>
  <text class="lab2" x="20" y="192">读法核对：去掉"对"，余下"角线"与"方针"逐字相对；字数一对二、位置在前在后，都要照这一族的规矩写清。</text>
</svg>