<svg viewBox="0 0 760 210" role="img" aria-label="不劳而获与坐享其成两段同义对扣的对照图" xmlns="http://www.w3.org/2000/svg" width="760" height="210"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="210" class="bg-paper"/>
  <text x="18" y="26" class="labk">正扣的核对方式：把两边各切成两段，一段顶一段</text>

  <rect x="40" y="46" width="120" height="50" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="100" y="78" class="kai" text-anchor="middle" style="font-size:24px">不 劳</text>
  <rect x="180" y="46" width="150" height="50" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="255" y="78" class="kai" text-anchor="middle" style="font-size:24px">而 获</text>
  <text x="100" y="116" class="lab2" text-anchor="middle">不出力</text>
  <text x="255" y="116" class="lab2" text-anchor="middle">却拿到成果</text>

  <line x1="100" y1="124" x2="100" y2="146" class="arrow"/><path d="M95 140 l5 8 5 -8" class="arrow"/>
  <line x1="255" y1="124" x2="255" y2="146" class="arrow"/><path d="M250 140 l5 8 5 -8" class="arrow"/>

  <rect x="40" y="152" width="120" height="50" class="hl" stroke="#2f7d42" stroke-width="1.5"/>
  <text x="100" y="184" class="kai stroke-in" text-anchor="middle" style="font-size:24px">坐</text>
  <rect x="180" y="152" width="150" height="50" class="hl" stroke="#2f7d42" stroke-width="1.5"/>
  <text x="255" y="184" class="kai" text-anchor="middle" style="font-size:24px">享 其 成</text>

  <text x="380" y="70" class="labk">核对三问</text>
  <text x="380" y="96" class="lab">① 段数对不对？（两段对两段）</text>
  <text x="380" y="120" class="lab">② 顺序对不对？（先"不出力"后"拿成果"）</text>
  <text x="380" y="144" class="lab">③ 有没有多余的词？（面底都不许有闲字）</text>
  <text x="380" y="176" class="lab2">三问全过，正扣才算成立；只要有一段是"差不多"，就要怀疑答案。</text>
</svg>