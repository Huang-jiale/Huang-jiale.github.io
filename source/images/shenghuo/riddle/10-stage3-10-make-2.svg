<svg viewBox="0 0 760 226" role="img" aria-label="底面相犯：同一个字出现在面与底两侧的示意" xmlns="http://www.w3.org/2000/svg" width="760" height="226"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="226"/>
  <text class="labk" x="20" y="24">逐字对表：同一个字两边都出现，就是犯面</text>
  <text class="lab2" x="20" y="50">题面（七字）</text>
  <rect class="cell" x="110" y="36" width="40" height="40" stroke="#1c1c1c"/>
  <rect class="cell" x="152" y="36" width="40" height="40" stroke="#1c1c1c"/>
  <rect class="hlc" x="194" y="36" width="40" height="40" stroke="#c0392b"/>
  <rect class="cell" x="236" y="36" width="40" height="40" stroke="#1c1c1c"/>
  <rect class="cell" x="278" y="36" width="40" height="40" stroke="#1c1c1c"/>
  <rect class="cell" x="320" y="36" width="40" height="40" stroke="#1c1c1c"/>
  <rect class="cell" x="362" y="36" width="40" height="40" stroke="#1c1c1c"/>
  <text class="num" x="130" y="63" text-anchor="middle">疑</text>
  <text class="num" x="172" y="63" text-anchor="middle">是</text>
  <text class="num" x="214" y="63" text-anchor="middle">地</text>
  <text class="num" x="256" y="63" text-anchor="middle">上</text>
  <text class="num" x="298" y="63" text-anchor="middle">霜</text>
  <text class="lab2" x="420" y="62">（此句出自李白《静夜思》，只取前五字示形）</text>
  <text class="lab2" x="20" y="126">谜底（四字）</text>
  <rect class="cell" x="110" y="112" width="40" height="40" stroke="#1c1c1c"/>
  <rect class="hlc" x="152" y="112" width="40" height="40" stroke="#c0392b"/>
  <rect class="cell" x="194" y="112" width="40" height="40" stroke="#1c1c1c"/>
  <rect class="cell" x="236" y="112" width="40" height="40" stroke="#1c1c1c"/>
  <text class="num" x="130" y="139" text-anchor="middle">本</text>
  <text class="num" x="172" y="139" text-anchor="middle">月</text>
  <text class="num" x="214" y="139" text-anchor="middle">上</text>
  <text class="num" x="256" y="139" text-anchor="middle">映</text>
  <path class="st-red" d="M256 78 v28"/><path class="st-red" d="M214 152 v-2 h42 v-2"/>
  <text class="lab" x="300" y="140">两处"上"字撞脸 ✗</text>
  <text class="lab2" x="300" y="160">红线：同一个字在两处都露脸</text>
  <text class="lab2" x="20" y="184">自查动作：把底写在题面下面，两行并排，逐字横着比一遍——三秒钟的活，能救掉一半的病谜。</text>
  <text class="lab2" x="20" y="206">带「谜格」的要移一步：先把底按变形规则改写成读法，再拿读法去比题面。</text>
</svg>