<svg viewBox="0 0 760 246" role="img" aria-label="白头格首字换音的变换示意" xmlns="http://www.w3.org/2000/svg" width="760" height="246"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="246"/>
  <text class="labk" x="20" y="24">变换示意：只把 1 号位的字换一只同音的耳朵去听</text>
  <rect class="cell-g" x="20" y="44" width="140" height="44" stroke="#9a9a9a"/>
  <text class="lab" x="32" y="71">谜面「废品」</text>
  <path class="arrow" d="M164 66 h28"/><path class="arrow" d="M186 60 l8 6 l-8 6"/>
  <text class="lab2" x="212" y="42">工序前：纸上写的底</text>
  <rect class="hl" x="212" y="50" width="44" height="44" stroke="#1c1c1c"/>
  <rect class="cell" x="262" y="50" width="44" height="44" stroke="#1c1c1c"/>
  <text class="num" x="234" y="81" text-anchor="middle">吴</text>
  <text class="num" x="284" y="81" text-anchor="middle">用</text>
  <text class="cand" x="216" y="64">1</text>
  <text class="cand" x="266" y="64">2</text>
  <path class="arrow" d="M234 100 v14 h60 v20"/><path class="arrow" d="M288 128 l6 6 l6 -6"/>
  <text class="lab2" x="212" y="140">1 号位换音，2 号位照旧</text>
  <rect class="cell-g" x="212" y="152" width="44" height="44" stroke="#1c1c1c"/>
  <rect class="cell" x="262" y="152" width="44" height="44" stroke="#1c1c1c"/>
  <text class="num" x="234" y="183" text-anchor="middle">无</text>
  <text class="num" x="284" y="183" text-anchor="middle">用</text>
  <text class="lab2" x="318" y="170">工序后的读法</text>
  <text class="lab" x="318" y="188">无用 ＝ 废品 ✓</text>
  <text class="lab2" x="446" y="60">三条纪律：</text>
  <text class="lab2" x="446" y="82">① 底 ≥ 2 字（单字底</text>
  <text class="lab2" x="446" y="102">　 没有"头"可换）</text>
  <text class="lab2" x="446" y="124">② 只换第一个字，</text>
  <text class="lab2" x="446" y="144">　 第二个字动了就跑偏</text>
  <text class="lab2" x="446" y="166">③ 必须同音，不是近音</text>
  <text class="lab2" x="20" y="228">自己玩的时候先把尺子量好：声母韵母是否相同、声调要不要一致，出题前讲清楚，别等猜的人来抬杠。</text>
</svg>