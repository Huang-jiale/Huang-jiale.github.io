<svg viewBox="0 0 760 230" role="img" aria-label="十五天读作半月成胖字、六十天读作两个月成朋字" xmlns="http://www.w3.org/2000/svg" width="760" height="230"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="230" class="bg-paper"/>
  <text x="18" y="26" class="labk">底上换挡：答案字要拆成两个部件来读</text>

  <rect x="30" y="46" width="130" height="52" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="95" y="78" class="labk" text-anchor="middle">十五天</text>
  <text x="95" y="118" class="lab2" text-anchor="middle">＝半个（三十天的）月</text>
  <line x1="164" y1="72" x2="204" y2="72" class="arrow"/><path d="M198 67 l8 5 -8 5" class="arrow"/>
  <rect x="212" y="46" width="120" height="70" class="hl" stroke="#2f7d42" stroke-width="1.6"/>
  <text x="242" y="96" class="kai" text-anchor="middle" style="font-size:40px">月</text>
  <text x="302" y="96" class="kai stroke-in" text-anchor="middle" style="font-size:40px">半</text>
  <text x="272" y="140" class="lab2" text-anchor="middle">读作"半月"，字是胖</text>
  <text x="272" y="176" class="labk" text-anchor="middle">答案：胖</text>

  <line x1="380" y1="40" x2="380" y2="206" class="st-thin"/>

  <rect x="406" y="46" width="130" height="52" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="471" y="78" class="labk" text-anchor="middle">六十天</text>
  <text x="471" y="118" class="lab2" text-anchor="middle">＝两个（三十天的）月</text>
  <line x1="540" y1="72" x2="580" y2="72" class="arrow"/><path d="M574 67 l8 5 -8 5" class="arrow"/>
  <rect x="588" y="46" width="120" height="70" class="hl" stroke="#2f7d42" stroke-width="1.6"/>
  <text x="618" y="96" class="kai" text-anchor="middle" style="font-size:40px">月</text>
  <text x="678" y="96" class="kai" text-anchor="middle" style="font-size:40px">月</text>
  <text x="648" y="140" class="lab2" text-anchor="middle">读作"二月"，字是朋</text>
  <text x="648" y="176" class="labk" text-anchor="middle">答案：朋</text>
  <text x="406" y="206" class="lab2">同一个换算：一个月按三十天算</text>
</svg>