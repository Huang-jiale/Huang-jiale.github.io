<svg viewBox="0 0 760 250" role="img" aria-label="五只蝙蝠环绕团寿字的图案怎么读成五福捧寿" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="26" class="labk">五福捧寿：数五只、借同音、看摆法，三步读出谜底</text>

  <circle cx="200" cy="132" r="46" class="cell" stroke="#1c1c1c" stroke-width="1.4"/>
  <text x="200" y="148" class="kai" text-anchor="middle" style="font-size:44px">寿</text>
  <g transform="translate(200,54)"><path d="M-18 2 q9 -12 18 -3 q9 -9 18 3" class="st"/></g>
  <g transform="translate(276,108)"><path d="M-18 2 q9 -12 18 -3 q9 -9 18 3" class="st"/></g>
  <g transform="translate(124,108)"><path d="M-18 2 q9 -12 18 -3 q9 -9 18 3" class="st"/></g>
  <g transform="translate(152,198)"><path d="M-18 2 q9 -12 18 -3 q9 -9 18 3" class="st"/></g>
  <g transform="translate(248,198)"><path d="M-18 2 q9 -12 18 -3 q9 -9 18 3" class="st"/></g>
  <text x="200" y="232" class="lab2" text-anchor="middle">五只蝠，头朝里（描个轮廓）</text>

  <text x="340" y="72" class="labk">第一步，数出来：五只蝠</text>
  <text x="340" y="96" class="lab2">蝠借同音读成福，得"五福"</text>
  <text x="340" y="140" class="labk">第二步，看摆法：绕寿字</text>
  <text x="340" y="164" class="lab2">一圈头朝里，像托着它，得"捧寿"</text>
  <text x="340" y="204" class="labk">第三步，连读：五福捧寿</text>
  <text x="340" y="228" class="lab2">四字刚好合"打四字（传统吉祥纹样）"</text>
</svg>