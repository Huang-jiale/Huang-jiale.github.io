<svg viewBox="0 0 760 230" role="img" aria-label="谜目管类别、管字数、管词性三项约束的结构图" xmlns="http://www.w3.org/2000/svg" width="760" height="230"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="230" class="bg-paper"/>
  <text x="18" y="26" class="labk">把谜目拆成三个约束来读：缺一件，答案就没法判对错</text>
  <rect x="30" y="46" width="220" height="130" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="140" y="70" class="labk" text-anchor="middle">① 管类别</text>
  <text x="140" y="96" class="lab2" text-anchor="middle">字／词／成语／物品</text>
  <text x="140" y="118" class="lab2" text-anchor="middle">人名／地名／书名</text>
  <text x="140" y="146" class="lab" text-anchor="middle">决定去哪个仓库找</text>
  <rect x="270" y="46" width="220" height="130" class="hl" stroke="#2f7d42" stroke-width="1.3"/>
  <text x="380" y="70" class="labk" text-anchor="middle">② 管字数</text>
  <text x="380" y="96" class="lab2" text-anchor="middle">一字→1 二字→2</text>
  <text x="380" y="118" class="lab2" text-anchor="middle">三字→3 成语→4</text>
  <text x="380" y="146" class="lab" text-anchor="middle">最硬的一条，当场判错</text>
  <rect x="510" y="46" width="220" height="130" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="620" y="70" class="labk" text-anchor="middle">③ 管词性（看括号）</text>
  <text x="620" y="96" class="lab2" text-anchor="middle">称谓／职业／名词</text>
  <text x="620" y="118" class="lab2" text-anchor="middle">日常用品／数学名词</text>
  <text x="620" y="146" class="lab" text-anchor="middle">把候选缩到几十个</text>
  <text x="18" y="204" class="lab">例：谜目写"打二字（数学名词）"，则"分母"可行、"约"不可行（少一字）、"分数单位"不可行。</text>
</svg>