<svg viewBox="0 0 760 200" role="img" aria-label="年年怀里抱条鱼扣成连年有余的两段对应" xmlns="http://www.w3.org/2000/svg" width="760" height="200"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="200" class="bg-paper"/>
  <text x="18" y="26" class="labk">年年怀里抱条鱼 → 连年有余：两段各换一次</text>

  <rect x="40" y="50" width="120" height="44" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="100" y="80" class="kai" text-anchor="middle" style="font-size:22px">年年</text>
  <rect x="200" y="50" width="180" height="44" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="290" y="80" class="kai" text-anchor="middle" style="font-size:22px">怀里抱条鱼</text>

  <line x1="100" y1="98" x2="100" y2="132" class="arrow"/><path d="M95 126 l5 8 5 -8" class="arrow"/>
  <line x1="290" y1="98" x2="290" y2="132" class="arrow"/><path d="M285 126 l5 8 5 -8" class="arrow"/>
  <text x="100" y="118" class="lab2" text-anchor="middle">换词</text>
  <text x="290" y="118" class="lab2" text-anchor="middle">借音：鱼读成余</text>

  <rect x="40" y="138" width="120" height="46" class="hl" stroke="#2f7d42" stroke-width="1.5"/>
  <text x="100" y="170" class="kai stroke-in" text-anchor="middle" style="font-size:22px">连年</text>
  <rect x="200" y="138" width="180" height="46" class="hl" stroke="#2f7d42" stroke-width="1.5"/>
  <text x="290" y="170" class="kai stroke-in" text-anchor="middle" style="font-size:22px">有余</text>

  <text x="420" y="76" class="lab2">谜目写打四字，答案就得是四个字。</text>
  <text x="420" y="104" class="lab2">左边一段是同义换词，右边一段是借音。</text>
  <text x="420" y="140" class="labk">＋ 谜目把范围钉在吉祥话上</text>
  <text x="420" y="166" class="lab2">候选里只有一句四字吉祥话对得上。</text>

  <text x="18" y="196" class="lab2">字形一个没动，只是把"鱼"借了"余"的音——这就是谐音法全部的机关。</text>
</svg>