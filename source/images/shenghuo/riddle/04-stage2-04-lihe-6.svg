<svg viewBox="0 0 760 230" role="img" aria-label="取半规则：左右结构取一边、上下结构取一截、内外结构取一层" xmlns="http://www.w3.org/2000/svg" width="760" height="230"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="230" class="bg-paper"/>
  <text x="18" y="26" class="labk">"半"字怎么算：先认清结构，再取对应的那一块</text>

  <text x="30" y="66" class="labk">左右结构（推）</text>
  <rect x="200" y="42" width="52" height="44" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="226" y="76" class="kai" text-anchor="middle" style="font-size:26px">扌</text>
  <text x="262" y="72" class="lab2">或</text>
  <rect x="290" y="42" width="52" height="44" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="316" y="76" class="kai" text-anchor="middle" style="font-size:26px">隹</text>
  <text x="370" y="72" class="lab">取左得提手旁，取右得"隹"</text>

  <text x="30" y="120" class="labk">上下结构（花）</text>
  <rect x="200" y="96" width="52" height="44" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="226" y="130" class="kai" text-anchor="middle" style="font-size:26px">艹</text>
  <text x="262" y="126" class="lab2">或</text>
  <rect x="290" y="96" width="52" height="44" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="316" y="130" class="kai" text-anchor="middle" style="font-size:26px">化</text>
  <text x="370" y="126" class="lab">取上得草字头，取下得"化"</text>

  <text x="30" y="174" class="labk">内外结构（园）</text>
  <rect x="200" y="150" width="52" height="44" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="226" y="184" class="kai" text-anchor="middle" style="font-size:26px">囗</text>
  <text x="262" y="180" class="lab2">或</text>
  <rect x="290" y="150" width="52" height="44" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="316" y="184" class="kai" text-anchor="middle" style="font-size:26px">元</text>
  <text x="370" y="180" class="lab">取外得围墙，取内得"元"</text>

  <text x="18" y="216" class="lab2">同一句"半 X"，X 是哪种结构，能取的东西就完全不同；取出来还得塞得进谜底那个字，塞不进就是取错了方向。</text>
</svg>