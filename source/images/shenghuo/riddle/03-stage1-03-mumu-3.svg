<svg viewBox="0 0 760 200" role="img" aria-label="一火一木经过柴等于木的同义换词扣上火柴这个复合词" xmlns="http://www.w3.org/2000/svg" width="760" height="200"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="200" class="bg-paper"/>
  <text x="18" y="26" class="labk">复合词的"两截读法"：一火一木 → 火柴</text>

  <rect x="30" y="46" width="150" height="50" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="105" y="78" class="kai" text-anchor="middle" style="font-size:24px">一火一木</text>
  <text x="105" y="116" class="lab2" text-anchor="middle">火一件，木一件</text>

  <line x1="186" y1="71" x2="232" y2="71" class="arrow"/><path d="M226 66 l8 5 -8 5" class="arrow"/>
  <rect x="240" y="46" width="160" height="50" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="320" y="68" class="lab2" text-anchor="middle">同义换词：柴是木薪</text>
  <text x="320" y="88" class="lab2" text-anchor="middle">木 → 柴</text>

  <line x1="406" y1="71" x2="452" y2="71" class="arrow"/><path d="M446 66 l8 5 -8 5" class="arrow"/>
  <rect x="460" y="46" width="60" height="50" class="hl" stroke="#2f7d42" stroke-width="1.5"/>
  <text x="490" y="82" class="kai" text-anchor="middle" style="font-size:30px">火</text>
  <rect x="524" y="46" width="60" height="50" class="hl" stroke="#2f7d42" stroke-width="1.5"/>
  <text x="554" y="82" class="kai stroke-in" text-anchor="middle" style="font-size:30px">柴</text>
  <text x="622" y="78" class="labk">＝ 火柴</text>
  <text x="622" y="102" class="lab2">两字，正好填满范围</text>

  <text x="30" y="150" class="lab">读法要点：一个词进了谜，可以不当"东西的名字"，而当成两样东西并排放的清单。</text>
  <text x="30" y="176" class="lab2">谜目写"日常用品"，就是允许这种读法被收下、同时把别的类别全挡在外面的那道闸门。</text>
</svg>