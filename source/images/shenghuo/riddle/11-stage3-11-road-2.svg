<svg viewBox="0 0 760 236" role="img" aria-label="十二周精进路线的三段安排" xmlns="http://www.w3.org/2000/svg" width="760" height="236"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="236"/>
  <text class="labk" x="20" y="24">十二周一条线：前四周把课读完，后八周只做三件事</text>
  <rect class="hl" x="20" y="40" width="150" height="40" stroke="#1c1c1c"/>
  <text class="lab" x="30" y="65">第 1—4 周</text>
  <text class="lab2" x="186" y="57">把 11 课读完：第 1 周观念与别解，第 2 周法门三课，</text>
  <text class="lab2" x="186" y="75">第 3 周两课变形（要慢），第 4 周流程、出题与自查。</text>
  <rect class="cell-g" x="20" y="94" width="150" height="40" stroke="#9a9a9a"/>
  <text class="lab" x="30" y="119">第 5—8 周</text>
  <text class="lab2" x="186" y="111">每周三次 20 分钟：读三条旧谜、出两条新谜、</text>
  <text class="lab2" x="186" y="129">抄一条好谜入册。抄的时候连"扣合"一起抄。</text>
  <rect class="f-g2" x="20" y="148" width="150" height="40" stroke="#9a9a9a"/>
  <text class="lab" x="30" y="173">第 9—12 周</text>
  <text class="lab2" x="186" y="165">每两周一场限时自测：一次做、一次订正，各占</text>
  <text class="lab2" x="186" y="183">20 分钟；错题只登记毛病名，不抄答案。</text>
  <text class="lab" x="20" y="212">口径统一：每天 20 分钟，一周 140 分钟，四周 560 分钟约 9 小时 20 分钟，十二周合计 1680 分钟＝28 小时。</text>
</svg>