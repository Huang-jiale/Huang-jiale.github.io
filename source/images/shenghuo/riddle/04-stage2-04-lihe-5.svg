<svg viewBox="0 0 760 250" role="img" aria-label="汉字方位词示意：上南下北左东右西与一口吞天成吴字" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="26" class="labk">方位词按字来指，不按地图来指</text>

  <text x="120" y="56" class="lab2" text-anchor="middle">一个方块字的六块地方</text>
  <rect x="60" y="64" width="180" height="130" class="cell" stroke="#1c1c1c" stroke-width="1.4"/>
  <line x1="120" y1="64" x2="120" y2="194" class="st-thin"/>
  <line x1="180" y1="64" x2="180" y2="194" class="st-thin"/>
  <line x1="60" y1="107" x2="240" y2="107" class="st-thin"/>
  <line x1="60" y1="151" x2="240" y2="151" class="st-thin"/>
  <text x="90" y="92" class="lab2">上／头</text>
  <text x="150" y="92" class="lab2">中</text>
  <text x="204" y="92" class="lab2">右</text>
  <text x="90" y="135" class="lab2">左</text>
  <text x="150" y="135" class="lab2">中</text>
  <text x="204" y="135" class="lab2">东?</text>
  <text x="86" y="180" class="lab2">下／脚</text>
  <text x="150" y="180" class="lab2">心</text>
  <text x="204" y="180" class="lab2">旁</text>
  <text x="60" y="216" class="lab2">地图才有"上北下南"，字没有方位坐标</text>

  <line x1="248" y1="128" x2="292" y2="128" class="arrow"/><path d="M286 123 l8 5 -8 5" class="arrow"/>

  <text x="420" y="70" class="labk">一口吞天 → 吴</text>
  <rect x="340" y="82" width="76" height="50" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="378" y="118" class="kai" text-anchor="middle" style="font-size:32px">口</text>
  <text x="430" y="118" class="lab2">在上，盖住</text>
  <rect x="340" y="146" width="76" height="56" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="378" y="188" class="kai" text-anchor="middle" style="font-size:32px">天</text>
  <text x="430" y="176" class="lab2">在下，被吞</text>
  <line x1="424" y1="140" x2="470" y2="140" class="arrow"/><path d="M464 135 l8 5 -8 5" class="arrow"/>
  <rect x="478" y="96" width="72" height="72" class="hl" stroke="#2f7d42" stroke-width="1.6"/>
  <text x="514" y="144" class="kai stroke-in" text-anchor="middle" style="font-size:40px">吴</text>
  <text x="560" y="130" class="labk">＝ 吴</text>
  <text x="560" y="156" class="lab2">旧说"口天吴"，正是这个拆法</text>
  <text x="340" y="228" class="lab">反序对照：口在下、天在上是"吞"字——动词既给了部件，也给了顺序。</text>
</svg>