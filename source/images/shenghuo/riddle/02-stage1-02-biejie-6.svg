<svg viewBox="0 0 760 250" role="img" aria-label="铁公鸡与零存整取两条成语谜的换挡路径图" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="26" class="labk">成语谜的读法：四个字是谜目管的事，换挡路径才是你要找的</text>

  <text x="30" y="58" class="labk">铁公鸡（比喻义 → 字面义）</text>
  <rect x="30" y="68" width="200" height="40" class="cell-g" stroke="#9a9a9a"/>
  <text x="130" y="94" class="lab2" text-anchor="middle">平时读法：吝啬的人</text>
  <line x1="234" y1="88" x2="274" y2="88" class="st-red"/>
  <path d="M268 83 l8 5 -8 5" class="arrow-r" stroke-width="1.6"/>
  <text x="254" y="76" class="lab2" text-anchor="middle">撤</text>
  <rect x="280" y="68" width="200" height="40" class="hlc" stroke="#c0392b" stroke-width="1.2"/>
  <text x="380" y="94" class="lab2" text-anchor="middle">改读：铁皮做的鸡，毛拔不下</text>
  <line x1="380" y1="110" x2="380" y2="134" class="arrow"/><path d="M375 128 l5 8 5 -8" class="arrow"/>
  <rect x="280" y="140" width="200" height="42" class="hl" stroke="#2f7d42" stroke-width="1.5"/>
  <text x="380" y="167" class="kai" text-anchor="middle" style="font-size:24px">一毛不拔</text>
  <text x="30" y="140" class="lab">答案四个字的读法完全按字面，</text>
  <text x="30" y="162" class="lab">弯全在面上——这是"面转底直"。</text>

  <line x1="18" y1="196" x2="742" y2="196" class="st-thin"/>
  <text x="30" y="222" class="labk">零存整取（银行术语 → 日常动作），底也要换两层</text>
  <text x="30" y="244" class="lab2">面：零＝零碎地存，整＝整笔地取 ｜ 底：少＝零头小额，多＝一整笔 ｜ 合起来：零碎存久了凑成一整笔＝积少成多</text>
</svg>