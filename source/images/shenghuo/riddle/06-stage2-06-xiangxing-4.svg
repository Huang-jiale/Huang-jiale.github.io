<svg viewBox="0 0 760 232" role="img" aria-label="三个木品字形堆叠成森字" xmlns="http://www.w3.org/2000/svg" width="760" height="232"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="232" class="bg-paper"/>
  <text x="18" y="26" class="labk">三棵树：数量三加材料木，两条线索一起才只剩一解</text>

  <text x="40" y="70" class="lab2">一个木：四笔</text>
  <text x="40" y="104" class="lab2">三个木：十二笔</text>
  <text x="40" y="138" class="lab2">上一下二，摆成品字</text>
  <text x="40" y="172" class="lab2">只说很多树就滑到会意</text>

  <rect x="330" y="44" width="80" height="66" class="hl" stroke="#2f7d42" stroke-width="1.4"/>
  <text x="370" y="88" class="kai" text-anchor="middle" style="font-size:38px">木</text>
  <rect x="245" y="116" width="80" height="66" class="hl" stroke="#2f7d42" stroke-width="1.4"/>
  <text x="285" y="160" class="kai" text-anchor="middle" style="font-size:38px">木</text>
  <rect x="415" y="116" width="80" height="66" class="hl" stroke="#2f7d42" stroke-width="1.4"/>
  <text x="455" y="160" class="kai" text-anchor="middle" style="font-size:38px">木</text>

  <line x1="500" y1="140" x2="536" y2="140" class="arrow"/><path d="M530 135 l8 5 -8 5" class="arrow"/>

  <rect x="545" y="80" width="120" height="102" class="hl" stroke="#c0392b" stroke-width="1.6"/>
  <text x="605" y="152" class="kai stroke-in" text-anchor="middle" style="font-size:62px">森</text>
  <text x="605" y="176" class="lab2" text-anchor="middle">品字形堆叠</text>

  <text x="18" y="212" class="lab">这类堆叠形的谜，谜面必须同时给出数目和摆法；两者缺一，答案就散成一串。</text>
</svg>