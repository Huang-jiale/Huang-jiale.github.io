<svg viewBox="0 0 760 176" role="img" aria-label="猜谜五步流程" xmlns="http://www.w3.org/2000/svg" width="760" height="176"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="176"/>
  <text class="labk" x="20" y="24">五步动线：只有第 ④ 步在猜，其余四步都在收口</text>
  <rect class="cell-g" x="20" y="42" width="118" height="44" stroke="#1c1c1c"/>
  <text class="lab" x="30" y="69">① 读面三遍</text>
  <path class="arrow" d="M140 64 h16"/><path class="arrow" d="M150 58 l8 6 l-8 6"/>
  <rect class="cell-g" x="160" y="42" width="118" height="44" stroke="#1c1c1c"/>
  <text class="lab" x="170" y="69">② 看谜目</text>
  <path class="arrow" d="M280 64 h16"/><path class="arrow" d="M290 58 l8 6 l-8 6"/>
  <rect class="cell-g" x="300" y="42" width="118" height="44" stroke="#1c1c1c"/>
  <text class="lab" x="310" y="69">③ 认「谜格」</text>
  <path class="arrow" d="M420 64 h16"/><path class="arrow" d="M430 58 l8 6 l-8 6"/>
  <rect class="hl" x="440" y="42" width="118" height="44" stroke="#1c1c1c"/>
  <text class="lab" x="450" y="69">④ 定法门</text>
  <path class="arrow" d="M560 64 h16"/><path class="arrow" d="M570 58 l8 6 l-8 6"/>
  <rect class="cell-g" x="580" y="42" width="118" height="44" stroke="#1c1c1c"/>
  <text class="lab" x="590" y="69">⑤ 回扣验证</text>
  <text class="lab2" x="24" y="102">先取字面本义</text>
  <text class="lab2" x="164" y="102">字数类别卡死</text>
  <text class="lab2" x="304" y="102">先背动作再动手</text>
  <text class="lab2" x="444" y="102">拆？会？形？音？</text>
  <text class="lab2" x="584" y="102">从底倒回面核对</text>
  <text class="lab2" x="20" y="136">新手把八成时间花在第 ④ 步，其余四步全跳过，所以总"差一点"；老手反过来，②③⑤ 才是主力。</text>
  <text class="lab2" x="20" y="160">现场自查：这一步我做完没有？没做完就不要开口报答案。</text>
</svg>