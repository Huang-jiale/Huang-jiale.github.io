<svg viewBox="0 0 760 250" role="img" aria-label="别解统摄离合、会意、象形、谐音四条路的总图" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="26" class="labk">四条路做的是同一件事：把你读谜面的方式换个挡</text>

  <rect x="20" y="60" width="150" height="110" class="hlc" stroke="#c0392b" stroke-width="1.5"/>
  <text x="95" y="92" class="labk" text-anchor="middle">总纲：别解</text>
  <text x="95" y="120" class="lab2" text-anchor="middle">不许照字面直读</text>
  <text x="95" y="146" class="lab2" text-anchor="middle">必有一处换读法</text>

  <path d="M170 115 H212" class="st-thin"/>
  <path d="M212 68 V218" class="st-thin"/>
  <path d="M212 68 H248" class="st-thin"/>
  <path d="M212 118 H248" class="st-thin"/>
  <path d="M212 168 H248" class="st-thin"/>
  <path d="M212 218 H248" class="st-thin"/>

  <rect x="250" y="46" width="490" height="44" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="266" y="74" class="labk">离合：拆形</text>
  <text x="400" y="74" class="lab2">报部件名和操作词，要你拆、删、并 → 出、府、位</text>

  <rect x="250" y="96" width="490" height="44" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="266" y="124" class="labk">会意：换义</text>
  <text x="400" y="124" class="lab2">给一段意思，逐段换成另一句说法 → 谢别会、中</text>

  <rect x="250" y="146" width="490" height="44" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="266" y="174" class="labk">象形：描样子</text>
  <text x="400" y="174" class="lab2">给一幅画面，认回笔画和摆法 → 心、北、坐、森</text>

  <rect x="250" y="196" width="490" height="44" class="hl" stroke="#2f7d42" stroke-width="1.4"/>
  <text x="266" y="224" class="labk">谐音：借读音</text>
  <text x="400" y="224" class="lab2">形和义都堵住了，顺着音跳一步 → 连年有余、五福捧寿</text>
</svg>