<svg viewBox="0 0 760 176" role="img" aria-label="上楼格与下楼格方向相反的对照" xmlns="http://www.w3.org/2000/svg" width="760" height="176"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="176"/>
  <text class="labk" x="20" y="24">方向对照：一个抬尾，一个沉头</text>
  <text class="lab" x="20" y="62">「上楼格」</text>
  <text class="num" x="130" y="62">世</text>
  <text class="num" x="160" y="62">界</text>
  <text class="num" x="190" y="62">观</text>
  <path class="arrow" d="M214 56 h34"/><path class="arrow" d="M242 50 l8 6 l-8 6"/>
  <text class="num" x="262" y="62">观</text>
  <text class="num" x="292" y="62">世</text>
  <text class="num" x="322" y="62">界</text>
  <text class="lab2" x="360" y="62">末一字 → 移到最前</text>
  <text class="lab" x="20" y="106">「下楼格」</text>
  <text class="num" x="130" y="106">一</text>
  <text class="num" x="160" y="106">念</text>
  <text class="num" x="190" y="106">之</text>
  <text class="num" x="220" y="106">差</text>
  <path class="arrow" d="M244 100 h34"/><path class="arrow" d="M272 94 l8 6 l-8 6"/>
  <text class="num" x="292" y="106">念</text>
  <text class="num" x="322" y="106">之</text>
  <text class="num" x="352" y="106">差</text>
  <text class="num" x="382" y="106">一</text>
  <text class="lab2" x="420" y="106">首一字 → 移到最后</text>
  <text class="lab2" x="20" y="146">两行都是"搬一个字"，方向相反；搬完剩下的字保持原有先后，绝不反转。</text>
  <text class="lab2" x="20" y="166">记法：上＝末字上楼，下＝首字下楼。</text>
</svg>