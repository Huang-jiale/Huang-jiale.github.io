<svg viewBox="0 0 760 210" role="img" aria-label="从谜底回扣谜面的三关闭环" xmlns="http://www.w3.org/2000/svg" width="760" height="210"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="210"/>
  <text class="labk" x="20" y="24">反推闭环：底 → 变形 → 回面对字 → 三关打勾</text>
  <rect class="cell-g" x="20" y="44" width="120" height="44" stroke="#9a9a9a"/>
  <text class="lab" x="30" y="71">候选底</text>
  <path class="arrow" d="M142 66 h18"/><path class="arrow" d="M154 60 l8 6 l-8 6"/>
  <rect class="cell-g" x="162" y="44" width="146" height="44" stroke="#9a9a9a"/>
  <text class="lab" x="172" y="71">按格变形（若有）</text>
  <path class="arrow" d="M310 66 h18"/><path class="arrow" d="M322 60 l8 6 l-8 6"/>
  <rect class="cell-g" x="330" y="44" width="146" height="44" stroke="#9a9a9a"/>
  <text class="lab" x="340" y="71">逐字回扣题面</text>
  <path class="st-blue" d="M476 66 h280 v-24 h-736 v-8"/>
  <text class="lab2" x="480" y="46">不通就退回候选底，重开一轮（虚线是回炉的路）</text>
  <rect class="hlb" x="20" y="108" width="230" height="52" stroke="#0f6ab5"/>
  <text class="lab" x="30" y="130">第一关 形状</text>
  <text class="lab2" x="30" y="150">字数、类别、动作齐不齐</text>
  <rect class="hlb" x="262" y="108" width="230" height="52" stroke="#0f6ab5"/>
  <text class="lab" x="272" y="130">第二关 扣合</text>
  <text class="lab2" x="272" y="150">底面两头都不许多字</text>
  <rect class="hlb" x="504" y="108" width="236" height="52" stroke="#0f6ab5"/>
  <text class="lab" x="514" y="130">第三关 卫生</text>
  <text class="lab2" x="514" y="150">不露面，底是现成词</text>
  <text class="lab2" x="20" y="192">三关全绿才报答案；只要有一关含糊，就当自己没猜出来，回去换法门。</text>
</svg>