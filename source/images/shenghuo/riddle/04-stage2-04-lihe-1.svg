<svg viewBox="0 0 760 290" role="img" aria-label="离合法四条路：合、增、损、方位的总览图" xmlns="http://www.w3.org/2000/svg" width="760" height="290"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="290" class="bg-paper"/>
  <text x="18" y="26" class="labk">离合法的四种基本动作：拼、加、减、摆位置</text>

  <rect x="20" y="44" width="355" height="106" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="40" y="68" class="labk">① 合（并成字）</text>
  <text x="40" y="94" class="lab">把两个部件并排或上下放好，得一个新字。</text>
  <text x="40" y="118" class="lab">指令词：有、共、合并、一体、相叠</text>
  <text x="40" y="140" class="lab2">本课文中例：立在人旁 → 位；山上还有山 → 出</text>

  <rect x="385" y="44" width="355" height="106" class="hl" stroke="#2f7d42" stroke-width="1.3"/>
  <text x="405" y="68" class="labk">② 增（添笔画）</text>
  <text x="405" y="94" class="lab">往字上补一笔或一个部件，补多少照面说话。</text>
  <text x="405" y="118" class="lab">指令词：加、添、一点、一横、再来</text>
  <text x="405" y="140" class="lab2">本课文中例：一点一横长一撇到南洋 → 府</text>

  <rect x="20" y="160" width="355" height="106" class="hlc" stroke="#c0392b" stroke-width="1.3"/>
  <text x="40" y="184" class="labk">③ 损（减笔画、去掉部件）</text>
  <text x="40" y="210" class="lab">把一个字的某部分拿掉，剩下的就是答案。</text>
  <text x="40" y="234" class="lab">指令词：去、无、掉、失、少、不有</text>
  <text x="40" y="256" class="lab2">本课文中例：人不在其位 → 立；地无三尺土 → 也</text>

  <rect x="385" y="160" width="355" height="106" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="405" y="184" class="labk">④ 方位（只取某个位置上的部分）</text>
  <text x="405" y="210" class="lab">"X 的头／脚／左／右／中"＝只要那一块。</text>
  <text x="405" y="234" class="lab">指令词：上、下、左、右、中、头、脚、旁</text>
  <text x="405" y="256" class="lab2">例：湖字的水旁丢了＝胡；一口吞天＝吴</text>
</svg>