<svg viewBox="0 0 760 200" role="img" aria-label="例二同一谜底两种读法的对照" xmlns="http://www.w3.org/2000/svg" width="760" height="200"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="200"/>
  <text class="labk" x="20" y="24">例二的分解：同一个底，常解与谜读只差一次换义</text>
  <text class="lab2" x="20" y="70">底（四字）</text>
  <rect class="cell" x="110" y="44" width="40" height="40" stroke="#1c1c1c"/>
  <rect class="cell" x="154" y="44" width="40" height="40" stroke="#1c1c1c"/>
  <rect class="hlc" x="198" y="44" width="40" height="40" stroke="#c0392b"/>
  <rect class="hlc" x="242" y="44" width="40" height="40" stroke="#c0392b"/>
  <text class="num" x="130" y="71" text-anchor="middle">一</text>
  <text class="num" x="174" y="71" text-anchor="middle">无</text>
  <text class="num" x="218" y="71" text-anchor="middle">是</text>
  <text class="num" x="262" y="71" text-anchor="middle">处</text>
  <rect class="cell-g" x="330" y="44" width="410" height="40" stroke="#9a9a9a"/>
  <text class="lab2" x="342" y="69">常解：说一个人没有一点好的地方</text>
  <text class="lab2" x="20" y="124">谜读</text>
  <rect class="hl" x="110" y="104" width="172" height="36" stroke="#1c1c1c"/>
  <text class="lab2" x="120" y="127">一个"是"字也没有</text>
  <text class="lab2" x="330" y="112">"是"＝对、正确；"处"＝处所</text>
  <text class="lab2" x="330" y="132">主语从"人"换成"字"，别解就在这一下</text>
  <text class="lab" x="20" y="164">核对：题面五字与底四字不见重字；底是现成语；换义只发生一次。</text>
  <text class="lab2" x="20" y="188">出题的顺序也一样：先定底，再问哪个字可以换义，最后才写题面。</text>
</svg>