<svg viewBox="0 0 760 260" role="img" aria-label="谜目逐层过滤候选范围的漏斗示意" xmlns="http://www.w3.org/2000/svg" width="760" height="260"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="260" class="bg-paper"/>
  <text x="18" y="26" class="labk">漏斗：谜目每多写一句，候选就掉一大截（以"十分"为例）</text>

  <rect x="20" y="44" width="720" height="40" class="f-g1" stroke="#9a9a9a"/>
  <text x="40" y="70" class="lab">第一层：什么都能当答案 —— 候选几万个，没法猜</text>
  <rect x="80" y="94" width="600" height="40" class="f-g2" stroke="#9a9a9a"/>
  <text x="100" y="120" class="lab">第二层：谜目写"打二字" —— 只剩两字词，几万个变几千个</text>
  <rect x="150" y="144" width="460" height="40" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="170" y="170" class="lab">第三层：再加"（货币单位）"—— 只剩 元、角、分 这一小把</text>
  <rect x="230" y="194" width="300" height="40" class="hl" stroke="#2f7d42" stroke-width="1.5"/>
  <text x="250" y="220" class="lab">第四层：对得上"十分"＝ 一角</text>
  <line x1="380" y1="84" x2="380" y2="90" class="arrow"/>
  <line x1="380" y1="134" x2="380" y2="140" class="arrow"/>
  <line x1="380" y1="184" x2="380" y2="190" class="arrow"/>
  <text x="560" y="220" class="lab2">这一层是题面与谜目合起来做的活</text>
</svg>