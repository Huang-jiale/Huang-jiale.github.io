<svg viewBox="0 0 760 210" role="img" aria-label="百字去掉上面一横得到白字的增损示意" xmlns="http://www.w3.org/2000/svg" width="760" height="210"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="210" class="bg-paper"/>
  <text x="18" y="26" class="labk">九十九 → 白：把数字读成"一百少一"，再在字形上少一</text>
  <text x="90" y="56" class="lab2" text-anchor="middle">百（＝一＋白）</text>
  <rect x="30" y="64" width="120" height="80" class="cell" stroke="#1c1c1c" stroke-width="1.4"/>
  <rect x="31" y="65" width="118" height="26" class="hlc"/>
  <text x="90" y="128" class="kai" text-anchor="middle" style="font-size:44px">百</text>
  <text x="90" y="168" class="lab2" text-anchor="middle">最上面那一横就是"一"</text>
  <line x1="160" y1="104" x2="212" y2="104" class="arrow"/><path d="M206 99 l8 5 -8 5" class="arrow"/>
  <text x="186" y="92" class="lab2" text-anchor="middle">减</text>
  <rect x="220" y="72" width="100" height="64" class="cell-g" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="270" y="112" class="kai f-g4" text-anchor="middle" style="font-size:34px">一</text>
  <text x="270" y="160" class="lab2" text-anchor="middle">被"少一"拿走</text>
  <line x1="326" y1="104" x2="378" y2="104" class="arrow"/><path d="M372 99 l8 5 -8 5" class="arrow"/>
  <rect x="390" y="64" width="90" height="80" class="hl" stroke="#2f7d42" stroke-width="1.6"/>
  <text x="435" y="124" class="kai stroke-in" text-anchor="middle" style="font-size:44px">白</text>
  <text x="435" y="168" class="lab2" text-anchor="middle">剩下的就是答案</text>
  <text x="510" y="94" class="labk">换挡链条有两级</text>
  <text x="500" y="120" class="lab">九十九→一百差一→百缺一横→白</text>
  <text x="510" y="146" class="lab2">链条上每一级都要说得出口，跳级就是硬编。</text>
  <text x="510" y="170" class="lab2">验算：白加一横等于百，百减一等于九十九。</text>
</svg>