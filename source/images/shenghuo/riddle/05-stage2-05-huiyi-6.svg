<svg viewBox="0 0 760 200" role="img" aria-label="糖甜了水所以水煮这个烹饪词被读成水被煮的主语错位示意" xmlns="http://www.w3.org/2000/svg" width="760" height="200"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="200" class="bg-paper"/>
  <text x="18" y="26" class="labk">主语错位：一个词的"谁对谁做了啥"被挪开了半步</text>

  <rect x="30" y="46" width="230" height="90" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="145" y="70" class="lab2" text-anchor="middle">平时读法（词典义）</text>
  <text x="145" y="96" class="labk" text-anchor="middle">水煮＝把东西放在水里煮</text>
  <text x="145" y="122" class="lab2" text-anchor="middle">受事的是食材，水是工具</text>

  <line x1="266" y1="90" x2="316" y2="90" class="st-red"/>
  <path d="M310 85 l8 5 -8 5" class="arrow-r" stroke-width="1.6"/>
  <text x="291" y="78" class="lab2" text-anchor="middle">换挡</text>

  <rect x="326" y="46" width="240" height="90" class="hlc" stroke="#c0392b" stroke-width="1.3"/>
  <text x="446" y="70" class="lab2" text-anchor="middle">谜里的读法</text>
  <text x="446" y="96" class="labk" text-anchor="middle">水煮＝水被煮了</text>
  <text x="446" y="122" class="lab2" text-anchor="middle">受事的成了水，糖是施事者</text>

  <text x="590" y="66" class="labk">谜面证据</text>
  <text x="590" y="90" class="lab2">糖好吃（甜）＝糖进了水</text>
  <text x="590" y="112" class="lab2">"苦了水"＝遭殃的是水</text>
  <text x="590" y="134" class="lab2">→ 水被煮，二字正好</text>

  <text x="18" y="164" class="lab">这类换挡的合法性来自词本身：汉语里"名词＋动词"既能读成"用某物来动"，也能读成"某物被动"，</text>
  <text x="18" y="186" class="lab2">"水煮"、"枪毙"、"刀杀"都有这一身两读。所以它不是硬编，是汉语本来就给的第二个意思。</text>
</svg>