<svg viewBox="0 0 760 228" role="img" aria-label="一钩残月带三星扣成心字：卧钩加三个点" xmlns="http://www.w3.org/2000/svg" width="760" height="228"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="228" class="bg-paper"/>
  <text x="18" y="26" class="labk">一钩残月带三星：月亮读成卧钩，星星读成点</text>

  <rect x="20" y="46" width="175" height="130" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="107" y="72" class="labk" text-anchor="middle">题面给的夜景</text>
  <text x="107" y="102" class="lab2" text-anchor="middle">一弯快没了的月牙</text>
  <text x="107" y="126" class="lab2" text-anchor="middle">旁边挂着三颗星</text>
  <text x="107" y="156" class="lab2" text-anchor="middle">带＝陪着、挨着</text>

  <line x1="200" y1="110" x2="232" y2="110" class="arrow"/><path d="M226 105 l8 5 -8 5" class="arrow"/>

  <rect x="238" y="46" width="272" height="130" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <path d="M300 86 C306 142 350 158 398 140 l10 -14" class="st" stroke-width="5"/>
  <circle cx="284" cy="108" r="7" class="dot"/>
  <circle cx="356" cy="80" r="7" class="dot"/>
  <circle cx="424" cy="92" r="7" class="dot"/>
  <text x="374" y="170" class="lab2" text-anchor="middle">卧钩一道，三点三颗</text>

  <line x1="515" y1="110" x2="547" y2="110" class="arrow"/><path d="M541 105 l8 5 -8 5" class="arrow"/>

  <rect x="552" y="46" width="188" height="130" class="hl" stroke="#2f7d42" stroke-width="1.5"/>
  <text x="646" y="132" class="kai stroke-in" text-anchor="middle" style="font-size:76px">心</text>
  <text x="646" y="162" class="lab2" text-anchor="middle">四笔：卧钩一，点三</text>

  <text x="18" y="204" class="lab">这条谜干净在哪：给了形状（钩）、给了数目（三星）、还给了摆法（带着）。三样凑齐，笔画才不多不少。</text>
</svg>