<svg viewBox="0 0 760 250" role="img" aria-label="徐妃格去掉公共偏旁的字形变换示意" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="250"/>
  <text class="labk" x="20" y="24">变换示意：把每个字共有的那只偏旁削掉，只读"半边"</text>
  <rect class="cell-g" x="20" y="44" width="176" height="44" stroke="#9a9a9a"/>
  <text class="lab" x="32" y="71">谜面「夏到三庚」</text>
  <text class="lab2" x="222" y="40">工序前：同旁双字底</text>
  <rect class="cell-g" x="222" y="48" width="98" height="52" stroke="#1c1c1c"/>
  <text class="num" x="243" y="82" text-anchor="middle">艹</text>
  <text class="num" x="288" y="82" text-anchor="middle">伏</text>
  <rect class="cell-g" x="328" y="48" width="98" height="52" stroke="#1c1c1c"/>
  <text class="num" x="349" y="82" text-anchor="middle">艹</text>
  <text class="num" x="394" y="82" text-anchor="middle">令</text>
  <text class="lab2" x="222" y="116">茯 ＝ 艹 ＋ 伏　　苓 ＝ 艹 ＋ 令</text>
  <path class="arrow-r" d="M243 104 v22"/><path class="arrow-r" d="M236 120 l14 14 m0 -14 l-14 14"/>
  <path class="arrow-r" d="M349 104 v22"/><path class="arrow-r" d="M342 120 l14 14 m0 -14 l-14 14"/>
  <text class="lab2" x="440" y="70">两只草头同时削掉</text>
  <text class="lab2" x="440" y="90">（红叉＝作废，不参与扣面）</text>
  <text class="lab2" x="440" y="112">要求：每个字都得带它，</text>
  <text class="lab2" x="440" y="132">漏一个字就算做错了</text>
  <rect class="cell-g" x="222" y="150" width="46" height="46" stroke="#1c1c1c"/>
  <rect class="cell-g" x="274" y="150" width="46" height="46" stroke="#1c1c1c"/>
  <text class="num" x="245" y="181" text-anchor="middle">伏</text>
  <text class="num" x="297" y="181" text-anchor="middle">令</text>
  <text class="lab2" x="336" y="176">工序后的读法 → 伏令</text>
  <text class="lab" x="480" y="176">入伏的时令 ＝ 题面 ✓</text>
  <text class="lab2" x="20" y="232">这一族最考验"认底"：底写出来（茯苓）与题面毫无关系，非削旁不可；反过来猜的时候，先想"哪两个同旁的字削了旁能解释题面"。</text>
</svg>