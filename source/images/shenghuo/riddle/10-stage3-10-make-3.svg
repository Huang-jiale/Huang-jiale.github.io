<svg viewBox="0 0 760 216" role="img" aria-label="闲字无着落的连线示意" xmlns="http://www.w3.org/2000/svg" width="760" height="216"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="216"/>
  <text class="labk" x="20" y="24">连线检验：给题面每个字找一条落点线，找不到就是闲字</text>
  <text class="lab2" x="20" y="50">题面（九字）</text>
  <rect class="hlc" x="110" y="36" width="36" height="36" stroke="#c0392b"/>
  <rect class="hlc" x="148" y="36" width="36" height="36" stroke="#c0392b"/>
  <rect class="cell" x="186" y="36" width="36" height="36" stroke="#1c1c1c"/>
  <rect class="cell" x="224" y="36" width="36" height="36" stroke="#1c1c1c"/>
  <rect class="cell" x="262" y="36" width="36" height="36" stroke="#1c1c1c"/>
  <rect class="cell" x="300" y="36" width="36" height="36" stroke="#1c1c1c"/>
  <rect class="cell" x="338" y="36" width="36" height="36" stroke="#1c1c1c"/>
  <rect class="cell" x="376" y="36" width="36" height="36" stroke="#1c1c1c"/>
  <rect class="cell" x="414" y="36" width="36" height="36" stroke="#1c1c1c"/>
  <text class="num" x="128" y="61" text-anchor="middle">老</text>
  <text class="num" x="166" y="61" text-anchor="middle">王</text>
  <text class="num" x="204" y="61" text-anchor="middle">一</text>
  <text class="num" x="242" y="61" text-anchor="middle">口</text>
  <text class="num" x="280" y="61" text-anchor="middle">咬</text>
  <text class="num" x="318" y="61" text-anchor="middle">掉</text>
  <text class="num" x="356" y="61" text-anchor="middle">牛</text>
  <text class="num" x="394" y="61" text-anchor="middle">尾</text>
  <text class="num" x="432" y="61" text-anchor="middle">巴</text>
  <text class="lab2" x="470" y="56">两个粉框＝闲字</text>
  <text class="lab2" x="470" y="74">其余七字各有落点</text>
  <text class="lab2" x="20" y="136">谜底</text>
  <rect class="hl" x="110" y="120" width="40" height="40" stroke="#1c1c1c"/>
  <text class="num" x="130" y="147" text-anchor="middle">告</text>
  <path class="st-blue" d="M242 74 v44 h-112 v20"/>
  <path class="st-blue" d="M356 74 v44 h-226 v20"/>
  <text class="lab2" x="420" y="136">「口」→ 底的下半（装配线）</text>
  <text class="lab2" x="420" y="154">「牛」→ 底的上半（去尾后）</text>
  <text class="lab2" x="420" y="172">「咬、掉」→ 减损的指令，有职</text>
  <path class="arrow-r" d="M128 82 v14"/><path class="arrow-r" d="M121 89 l7 7 l7 -7"/>
  <path class="arrow-r" d="M166 82 v14"/><path class="arrow-r" d="M159 89 l7 7 l7 -7"/>
  <text class="lab" x="20" y="188">两个粉框＝两字无落点（老、王），此谜因它们而永远多一个缝。</text>
  <text class="lab2" x="20" y="208">改法：删成「一口咬掉牛尾巴」，七字各有职务，缝就闭上了。</text>
</svg>