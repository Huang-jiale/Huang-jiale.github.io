<svg viewBox="0 0 760 250" role="img" aria-label="从北坐三个字都由人形加摆法构成" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="26" class="labk">同样两个人形，摆法一换就成了三个不同的字</text>

  <rect x="20" y="46" width="230" height="150" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="135" y="118" class="kai" text-anchor="middle" style="font-size:62px">从</text>
  <text x="135" y="150" class="labk" text-anchor="middle">一前一后跟着走</text>
  <text x="135" y="176" class="lab2" text-anchor="middle">两个人同方向，是跟从</text>

  <rect x="265" y="46" width="230" height="150" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="380" y="118" class="kai" text-anchor="middle" style="font-size:62px">北</text>
  <text x="380" y="150" class="labk" text-anchor="middle">背对背站着</text>
  <text x="380" y="176" class="lab2" text-anchor="middle">旧字书：从二人相背</text>

  <rect x="510" y="46" width="230" height="150" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="625" y="118" class="kai" text-anchor="middle" style="font-size:62px">坐</text>
  <text x="625" y="150" class="labk" text-anchor="middle">两人并排在土上</text>
  <text x="625" y="176" class="lab2" text-anchor="middle">上半是两对撇点</text>

  <text x="18" y="222" class="lab">提醒：楷书把古文字的人形写变了样。象形谜认的是"摆法"，不是考古字形，所以画图时只描轮廓。</text>
</svg>