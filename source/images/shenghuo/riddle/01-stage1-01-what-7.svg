<svg viewBox="0 0 760 250" role="img" aria-label="读谜四步流程：定范围、判法门、走扣合、回验证" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="26" class="labk">任何一条谜都按这四步走，一步都不能跳</text>

  <rect x="20" y="50" width="150" height="104" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="95" y="74" class="labk" text-anchor="middle">① 读谜目</text>
  <text x="95" y="98" class="lab2" text-anchor="middle">答案几个字</text>
  <text x="95" y="118" class="lab2" text-anchor="middle">属于哪一类</text>
  <text x="95" y="142" class="lab2" text-anchor="middle">先写下来再动笔</text>

  <rect x="210" y="50" width="150" height="104" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="285" y="74" class="labk" text-anchor="middle">② 判法门</text>
  <text x="285" y="98" class="lab2" text-anchor="middle">在字形上动手？</text>
  <text x="285" y="118" class="lab2" text-anchor="middle">还是在意思上？</text>
  <text x="285" y="142" class="lab2" text-anchor="middle">两条路先选一条</text>

  <rect x="400" y="50" width="150" height="104" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="475" y="74" class="labk" text-anchor="middle">③ 走扣合</text>
  <text x="475" y="98" class="lab2" text-anchor="middle">拆哪些、拼哪些</text>
  <text x="475" y="118" class="lab2" text-anchor="middle">哪个词转了义</text>
  <text x="475" y="142" class="lab2" text-anchor="middle">一步步走到答案</text>

  <rect x="590" y="50" width="150" height="104" class="hl" stroke="#2f7d42" stroke-width="1.4"/>
  <text x="665" y="74" class="labk" text-anchor="middle">④ 倒着验</text>
  <text x="665" y="98" class="lab2" text-anchor="middle">拿答案回到面</text>
  <text x="665" y="118" class="lab2" text-anchor="middle">看有没有闲字</text>
  <text x="665" y="142" class="lab2" text-anchor="middle">看会不会露底</text>

  <line x1="172" y1="102" x2="204" y2="102" class="arrow"/><path d="M198 97 l8 5 -8 5" class="arrow"/>
  <line x1="362" y1="102" x2="394" y2="102" class="arrow"/><path d="M388 97 l8 5 -8 5" class="arrow"/>
  <line x1="552" y1="102" x2="584" y2="102" class="arrow"/><path d="M578 97 l8 5 -8 5" class="arrow"/>

  <rect x="20" y="176" width="720" height="56" class="cell-g" stroke="#9a9a9a"/>
  <text x="36" y="200" class="lab">①②③ 走不通怎么办？回到第 ② 步换一条路重走：拆字走不通就试会意，会意走不通就试拆字。</text>
  <text x="36" y="222" class="lab2">换过两条路还是不通，那就不是你的问题——要么谜面有闲字，要么这条谜的答案根本不止一个。</text>
</svg>