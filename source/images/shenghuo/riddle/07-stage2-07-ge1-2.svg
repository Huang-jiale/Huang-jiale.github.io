<svg viewBox="0 0 760 258" role="img" aria-label="两字谜底前后对调的格子变换示意" xmlns="http://www.w3.org/2000/svg" width="760" height="258"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="258"/>
  <text class="labk" x="20" y="24">变换示意：位置 2 的字挪到前面来</text>
  <rect class="cell-g" x="20" y="46" width="132" height="44" stroke="#9a9a9a"/>
  <text class="lab" x="32" y="73">谜面「今天」</text>
  <path class="arrow" d="M156 68 h30"/><path class="arrow" d="M180 62 l8 6 l-8 6"/>
  <text class="lab2" x="222" y="42">工序前（纸上写的底）</text>
  <rect class="hl" x="222" y="50" width="46" height="46" stroke="#1c1c1c"/>
  <rect class="hl" x="274" y="50" width="46" height="46" stroke="#1c1c1c"/>
  <text class="num" x="245" y="81" text-anchor="middle">日</text>
  <text class="num" x="297" y="81" text-anchor="middle">本</text>
  <text class="cand" x="226" y="64">1</text>
  <text class="cand" x="278" y="64">2</text>
  <text class="lab2" x="222" y="128">小数字＝原来站第几位</text>
  <path class="arrow" d="M245 100 l0 16 l52 0 l0 26"/><path class="arrow" d="M291 136 l6 6 l-6 6"/>
  <path class="arrow" d="M297 100 l0 30 l-52 0 l0 32"/><path class="arrow" d="M240 158 l6 6 l6 -6"/>
  <text class="lab2" x="222" y="148">倒读（2 先念）</text>
  <text class="lab2" x="400" y="76">字数红线：只能 2 字</text>
  <text class="lab2" x="400" y="96">多一字即不归此族</text>
  <text class="lab2" x="400" y="116">少一字（单字底）则无从措手</text>
  <text class="lab2" x="400" y="136">两线交叉＝位置互换</text>
  <rect class="cell-g" x="222" y="162" width="46" height="46" stroke="#1c1c1c"/>
  <rect class="cell-g" x="274" y="162" width="46" height="46" stroke="#1c1c1c"/>
  <text class="num" x="245" y="193" text-anchor="middle">本</text>
  <text class="num" x="297" y="193" text-anchor="middle">日</text>
  <text class="lab2" x="222" y="222">工序后（拿去扣面的读法）</text>
  <text class="lab" x="400" y="196">本日 ＝ 今天 → 与面扣合</text>
  <text class="lab2" x="20" y="248">验证动作：把纸上写的底在嘴里倒念一遍，若能译回题面且没有一字重复，这一族才算用对。</text>
</svg>