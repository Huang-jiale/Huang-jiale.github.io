<svg viewBox="0 0 360 230" role="img" aria-label="用求凰格之后的读法" xmlns="http://www.w3.org/2000/svg" width="360" height="230"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="360" height="230"/>
  <text class="labk" x="14" y="22">✓ 用「求凰格」之后</text>
  <text class="lab2" x="14" y="52">底（三字）</text>
  <rect class="hlc" x="96" y="34" width="34" height="34" stroke="#c0392b"/>
  <rect class="cell" x="134" y="34" width="34" height="34" stroke="#1c1c1c"/>
  <rect class="cell" x="172" y="34" width="34" height="34" stroke="#1c1c1c"/>
  <text class="num" x="113" y="58" text-anchor="middle">对</text>
  <text class="num" x="151" y="58" text-anchor="middle">角</text>
  <text class="num" x="189" y="58" text-anchor="middle">线</text>
  <text class="lab2" x="14" y="100">去附加字"对"，余"角线"</text>
  <text class="lab2" x="14" y="122">"角线"逐字对"方针" ✓</text>
  <text class="lab2" x="14" y="144">底是现成的物理名词 ✓</text>
  <text class="lab2" x="14" y="166">多出的字由这一族交代 ✓</text>
  <text class="lab2" x="14" y="196">这一族只管"底怎么读"，</text>
  <text class="lab2" x="14" y="214">不管"面怎么扣"——两笔分账。</text>
</svg>