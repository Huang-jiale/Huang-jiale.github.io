<svg viewBox="0 0 760 320" role="img" aria-label="露面、闲字、撞底三种毛病的对照示意图" xmlns="http://www.w3.org/2000/svg" width="760" height="320"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="320" class="bg-paper"/>
  <text x="18" y="26" class="labk">三种最常见的毛病：读者一眼看穿，出题人自己往往看不见</text>

  <rect x="20" y="42" width="228" height="242" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="134" y="66" class="labk" text-anchor="middle">① 露面（底面相犯）</text>
  <text x="134" y="88" class="lab2" text-anchor="middle">答案的字原样写在面上</text>
  <rect x="40" y="102" width="188" height="42" class="hlc" stroke="#c0392b" stroke-width="1.2"/>
  <text x="140" y="131" class="kai" text-anchor="middle" style="font-size:20px">明月几时有</text>
  <ellipse cx="100" cy="123" rx="16" ry="17" class="st-red"/>
  <text x="134" y="170" class="lab2" text-anchor="middle">面里那个字与答案撞了</text>
  <text x="134" y="192" class="lab2" text-anchor="middle">不用猜，抄下来就赢了</text>
  <text x="134" y="226" class="lab" text-anchor="middle">这类题当场作废</text>
  <text x="134" y="252" class="lab2" text-anchor="middle">改法：换掉面上那个字</text>

  <rect x="266" y="42" width="228" height="242" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="380" y="66" class="labk" text-anchor="middle">② 闲字（多余的字）</text>
  <text x="380" y="88" class="lab2" text-anchor="middle">删掉它照样推得通</text>
  <rect x="286" y="102" width="188" height="42" class="cell-g" stroke="#9a9a9a"/>
  <text x="330" y="131" class="kai" text-anchor="middle" style="font-size:20px">半推半就</text>
  <text x="428" y="131" class="kai f-g4" text-anchor="middle" style="font-size:20px">新字成</text>
  <line x1="399" y1="124" x2="458" y2="124" class="st-red" stroke-width="2"/>
  <text x="380" y="170" class="lab2" text-anchor="middle">前四字已能推出掠字</text>
  <text x="380" y="192" class="lab2" text-anchor="middle">后三字没有活干＝闲字</text>
  <text x="380" y="226" class="lab" text-anchor="middle">毛病：题面松散</text>
  <text x="380" y="252" class="lab2" text-anchor="middle">改法：让它承担一点约束</text>

  <rect x="512" y="42" width="228" height="242" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="626" y="66" class="labk" text-anchor="middle">③ 撞底（答案重了）</text>
  <text x="626" y="88" class="lab2" text-anchor="middle">两条谜共用一个答案</text>
  <rect x="528" y="100" width="90" height="28" class="cell-g" stroke="#9a9a9a"/>
  <text x="573" y="120" class="lab2" text-anchor="middle">甲的题面</text>
  <rect x="634" y="100" width="90" height="28" class="cell-g" stroke="#9a9a9a"/>
  <text x="679" y="120" class="lab2" text-anchor="middle">乙的题面</text>
  <line x1="573" y1="130" x2="612" y2="152" class="arrow"/><path d="M606 148 l8 5 -8 5" class="arrow"/>
  <line x1="679" y1="130" x2="640" y2="152" class="arrow"/><path d="M646 148 l-6 6 3 -9" class="arrow"/>
  <rect x="576" y="156" width="100" height="34" class="hlc" stroke="#c0392b" stroke-width="1.2"/>
  <text x="626" y="179" class="lab" text-anchor="middle">同一个答案</text>
  <text x="626" y="214" class="lab2" text-anchor="middle">范围没管好，猜哪条都对</text>
  <text x="626" y="240" class="lab" text-anchor="middle">一批谜里答案不许重复</text>
</svg>