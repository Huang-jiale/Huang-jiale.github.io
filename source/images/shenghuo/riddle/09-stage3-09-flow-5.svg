  <rect class="bg-paper" width="360" height="214"/>
  <text class="labk" x="14" y="22">✗ 近似底：意思像，字不对</text>
  <text class="lab2" x="14" y="44">题面「哑巴打电话」</text>
  <rect class="hlc" x="14" y="56" width="150" height="40" stroke="#c0392b"/>
  <text class="num" x="30" y="83">说不出口</text>
  <text class="lab2" x="14" y="118">第一关就倒：谜目要成语，</text>
  <text class="lab2" x="14" y="136">这四字不是现成成语 ✗</text>
  <text class="lab2" x="14" y="160">换成「有口说不出」？</text>
  <text class="lab2" x="14" y="178">五字，仍然不合 ✗</text>
  <text class="lab2" x="14" y="202">"意思到了"不等于"扣住了"。</text>
