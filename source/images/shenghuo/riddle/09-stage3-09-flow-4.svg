<svg viewBox="0 0 760 176" role="img" aria-label="猜一条谜的时间预算分配" xmlns="http://www.w3.org/2000/svg" width="760" height="176"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect class="bg-paper" width="760" height="176"/>
  <text class="labk" x="20" y="22">一条谜的时间预算：90 秒为限，超时先看答案</text>
  <rect class="hlb" x="20" y="36" width="90" height="30"/>
  <rect class="hl" x="110" y="36" width="150" height="30"/>
  <rect class="f-g2" x="260" y="36" width="240" height="30"/>
  <rect class="f-g3" x="500" y="36" width="240" height="30"/>
  <text class="lab2" x="24" y="88">读面＋看谜目 10 秒</text>
  <text class="lab2" x="264" y="88">出候选底（最多三个）30 秒</text>
  <text class="lab2" x="114" y="110">认「谜格」＋定法门 20 秒</text>
  <text class="lab2" x="504" y="110">三关回扣验证 30 秒</text>
  <text class="lab2" x="20" y="140">超过 90 秒就停：记下卡在第几步，再看答案——看答案时只读"扣合"那一段，读完立刻合上自己重走一遍。</text>
  <text class="lab2" x="20" y="162">每天 20 分钟：15 分钟做 5 条、5 分钟复盘卡住的那一步，比一口气做 20 条有用。</text>
</svg>