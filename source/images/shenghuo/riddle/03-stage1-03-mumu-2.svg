<svg viewBox="0 0 760 250" role="img" aria-label="一口咬掉牛尾巴得到告字、七十二小时三个日得到晶字" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .cell{fill:#fff}
.cell-g{fill:#f2efe8}
 .hl{fill:#ffe9a8}
.hlc{fill:#f7d5d5}
.hlb{fill:#d8e9f6}
 .num{font-size:15px;fill:#1c1c1c}
.cand{font-size:9.5px;fill:#777}
 .stroke-in{fill:#c0392b}
.guide{stroke:#d9d4ca;stroke-width:1;stroke-dasharray:5 4;fill:none}
 .kai{font-family:"KaiTi","STKaiti","Kaiti SC","AR PL UKai CN",serif}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="26" class="labk">两条"打一字"：答案长度是 1，中间怎么走完全看字面给的指令</text>

  <text x="90" y="56" class="lab2" text-anchor="middle">牛</text>
  <rect x="40" y="62" width="100" height="86" class="cell" stroke="#1c1c1c" stroke-width="1.3"/>
  <text x="90" y="122" class="kai" text-anchor="middle" style="font-size:46px">牛</text>
  <line x1="90" y1="130" x2="90" y2="152" class="st-red" stroke-width="2.4"/>
  <text x="150" y="172" class="lab2">那一竖出头＝尾巴</text>
  <line x1="146" y1="104" x2="188" y2="104" class="arrow"/><path d="M182 99 l8 5 -8 5" class="arrow"/>
  <text x="167" y="92" class="lab2" text-anchor="middle">咬掉</text>
  <rect x="196" y="80" width="56" height="56" class="hlb" stroke="#0f6ab5" stroke-width="1.3"/>
  <text x="224" y="120" class="kai" text-anchor="middle" style="font-size:34px">口</text>
  <text x="224" y="156" class="lab2" text-anchor="middle">接在下面</text>
  <line x1="258" y1="108" x2="298" y2="108" class="arrow"/><path d="M292 103 l8 5 -8 5" class="arrow"/>
  <rect x="306" y="66" width="72" height="72" class="hl" stroke="#2f7d42" stroke-width="1.6"/>
  <text x="342" y="120" class="kai stroke-in" text-anchor="middle" style="font-size:42px">告</text>
  <text x="342" y="156" class="lab2" text-anchor="middle">竖不出头＋口</text>

  <line x1="410" y1="44" x2="410" y2="228" class="st-thin"/>

  <text x="470" y="56" class="lab2" text-anchor="middle">七十二小时</text>
  <rect x="430" y="62" width="200" height="34" class="cell-g" stroke="#9a9a9a"/>
  <text x="530" y="85" class="lab2" text-anchor="middle">换算：÷24 ＝ 三天</text>
  <line x1="530" y1="98" x2="530" y2="116" class="arrow"/><path d="M525 110 l5 8 5 -8" class="arrow"/>
  <text x="530" y="132" class="lab2" text-anchor="middle">换说法：三日</text>
  <rect x="452" y="140" width="46" height="46" class="cell" stroke="#1c1c1c"/>
  <rect x="500" y="140" width="46" height="46" class="cell" stroke="#1c1c1c"/>
  <rect x="476" y="186" width="46" height="46" class="cell" stroke="#1c1c1c"/>
  <text x="475" y="172" class="kai" text-anchor="middle" style="font-size:26px">日</text>
  <text x="523" y="172" class="kai" text-anchor="middle" style="font-size:26px">日</text>
  <text x="499" y="218" class="kai" text-anchor="middle" style="font-size:26px">日</text>
  <text x="640" y="170" class="labk">品字形三叠</text>
  <text x="640" y="196" class="lab" fill="#c0392b">＝ 晶</text>
  <text x="18" y="242" class="lab">同样是"三天"，如果谜目改成"打二字（时间词）"，答案就成了"三天"本身——范围一换，答案整个换掉。</text>
</svg>