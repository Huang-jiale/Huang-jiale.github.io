<svg viewBox="0 0 760 250" role="img" aria-label="一套八段锦的时间结构条形图，从预备势到八式再到收势约十二分钟" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="24" class="labk">跟口令做一遍的时间分配（约 12 分钟）</text>
  <g>
    <rect x="40" y="100" width="58" height="52" class="f-g3" stroke="#8f8f8f"/>
    <text x="69" y="130" class="lab2" text-anchor="middle">预备势</text>
    <rect x="102" y="100" width="58" height="52" class="f-g2" stroke="#8f8f8f"/>
    <text x="131" y="130" class="lab" text-anchor="middle">一</text>
    <rect x="164" y="100" width="58" height="52" class="f-g2" stroke="#8f8f8f"/>
    <text x="193" y="130" class="lab" text-anchor="middle">二</text>
    <rect x="226" y="100" width="58" height="52" class="f-g2" stroke="#8f8f8f"/>
    <text x="255" y="130" class="lab" text-anchor="middle">三</text>
    <rect x="288" y="100" width="58" height="52" class="f-g2" stroke="#8f8f8f"/>
    <text x="317" y="130" class="lab" text-anchor="middle">四</text>
    <rect x="350" y="100" width="58" height="52" class="f-g3" stroke="#8f8f8f"/>
    <text x="379" y="130" class="lab" text-anchor="middle">五</text>
    <rect x="412" y="100" width="58" height="52" class="f-g3" stroke="#8f8f8f"/>
    <text x="441" y="130" class="lab" text-anchor="middle">六</text>
    <rect x="474" y="100" width="58" height="52" class="f-g3" stroke="#8f8f8f"/>
    <text x="503" y="130" class="lab" text-anchor="middle">七</text>
    <rect x="536" y="100" width="58" height="52" class="f-g3" stroke="#8f8f8f"/>
    <text x="565" y="130" class="lab" text-anchor="middle">八</text>
    <rect x="598" y="100" width="58" height="52" class="f-g3" stroke="#8f8f8f"/>
    <text x="627" y="130" class="lab2" text-anchor="middle">收势</text>
  </g>
  <line class="st" x1="40" y1="160" x2="720" y2="160"/>
  <text x="40" y="182" class="lab2" text-anchor="middle">0 分</text>
  <text x="210" y="182" class="lab2" text-anchor="middle">3 分</text>
  <text x="380" y="182" class="lab2" text-anchor="middle">6 分</text>
  <text x="550" y="182" class="lab2" text-anchor="middle">9 分</text>
  <text x="716" y="182" class="lab2" text-anchor="middle">12 分</text>
  <path class="arrow" d="M40 86 l676 0 m-8 -5 l8 5 l-8 5"/>
  <text x="380" y="66" class="lab2" text-anchor="middle">是不是越到后面越快？不是，全程一个速度</text>
  <text x="18" y="216" class="lab2">深灰格（第五到第八式）更吃腿力和腰，前两周可以只做一半遍数；浅灰格（第一到第四式）是入门期的主课。</text>
</svg>