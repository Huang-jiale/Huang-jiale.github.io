<svg viewBox="0 0 760 210" role="img" aria-label="一次呼吸循环的时间轴：吸气四秒呼气六秒" xmlns="http://www.w3.org/2000/svg" width="760" height="210"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="210" class="bg-paper"/>
  <text x="18" y="24" class="labk">一分钟怎么数：吸 4 秒 → 呼 6 秒 → 6 个循环</text>
  <rect x="40" y="60" width="253" height="44" fill="#dbeaf7" stroke="#8f8f8f"/>
  <text x="166" y="88" class="lab" text-anchor="middle">吸气 4 秒（鼻吸）</text>
  <rect x="293" y="60" width="380" height="44" fill="#e3f1e6" stroke="#8f8f8f"/>
  <text x="483" y="88" class="lab" text-anchor="middle">呼气 6 秒（鼻呼或口呼，慢）</text>
  <text x="40" y="126" class="lab2">0 秒</text>
  <text x="285" y="126" class="lab2">4 秒</text>
  <text x="632" y="126" class="lab2">10 秒 = 1 个循环</text>
  <line class="st" x1="40" y1="104" x2="673" y2="104"/>
  <text x="18" y="158" class="lab2">初学版本（记不住秒数就用这个）：心里默数"1-2-3-4 吸，1-2-3-4-5-6 呼"，做满 6 个循环。</text>
  <text x="18" y="182" class="lab2">如果你数着数着反而乱了，就放弃数数，只做"呼气比吸气长一点点"这一条，这也是合格的调息。</text>
  <text x="18" y="200" class="lab2">警告信号：头晕、手麻、胸闷 → 立刻回到自然呼吸，别硬撑；有哮喘等呼吸系统疾病的人，请先咨询医生再练这类呼吸节律。</text>
</svg>