<svg viewBox="0 0 760 320" role="img" aria-label="强度三旋钮：遍数幅度高度及调整顺序" xmlns="http://www.w3.org/2000/svg" width="760" height="320"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
<rect class="bg-paper" width="760" height="320"/>
<text x="18" y="26" class="labk">三个旋钮：从"最不心疼"的开始拧</text>
<circle class="st" cx="140" cy="110" r="42"/>
<line class="arrow" x1="140" y1="110" x2="118" y2="78"/>
<circle class="joint" cx="140" cy="110" r="4"/>
<circle class="st" cx="380" cy="110" r="42"/>
<line class="arrow" x1="380" y1="110" x2="380" y2="72"/>
<circle class="joint" cx="380" cy="110" r="4"/>
<circle class="st" cx="620" cy="110" r="42"/>
<line class="arrow" x1="620" y1="110" x2="644" y2="80"/>
<circle class="joint" cx="620" cy="110" r="4"/>
<text x="140" y="186" class="labk" text-anchor="middle">旋钮一：遍数</text>
<text x="140" y="210" class="lab2" text-anchor="middle">6 遍改 3 遍</text>
<text x="380" y="186" class="labk" text-anchor="middle">旋钮二：幅度</text>
<text x="380" y="210" class="lab2" text-anchor="middle">俯深改俯浅</text>
<text x="620" y="186" class="labk" text-anchor="middle">旋钮三：高度</text>
<text x="620" y="210" class="lab2" text-anchor="middle">蹲深改蹲高</text>
<text x="18" y="252" class="lab2">减的顺序：先减遍数，再收幅度，最后才动高度（三个马步式最吃高度）</text>
<text x="18" y="280" class="lab2">加的顺序：反向来，一次只加一档，练两遍"刚刚好"再往上走</text>
</svg>