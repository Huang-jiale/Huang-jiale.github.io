<path d="M442,206 L442,242" class="arrow-r"/>
<polyline points="436,234 442,242 448,234" class="arrow-r"/>
<text x="382" y="278" class="lab2">③ 停一瞬再落</text>
<circle cx="566" cy="122" r="10" class="head"/>
<line x1="566" y1="132" x2="566" y2="192" class="body-line"/>
