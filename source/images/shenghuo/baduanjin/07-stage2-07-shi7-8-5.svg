<path d="M540,250 Q566,236 592,250" class="arrow-r"/>
<path d="M528,244 Q566,224 604,244" class="arrow-r"/>
<path d="M516,238 Q566,212 616,238" class="arrow-r"/>
<text x="530" y="278" class="lab2">④ 轻落微颠·呼气</text>
<text x="650" y="90" class="lab2">脚跟离地2到3厘米</text>
<text x="650" y="114" class="lab2">膝微屈不锁死</text>
<text x="650" y="138" class="lab2">落地声音要很轻</text>
<text x="650" y="162" class="lab2">7 次，每次4到5秒</text>
<text x="650" y="186" class="lab2">全程不憋气</text>
<text x="18" y="312" class="lab">颠的不是脚跟砸地，是把震动交给脚掌、膝、腰与头顶</text>
</svg>