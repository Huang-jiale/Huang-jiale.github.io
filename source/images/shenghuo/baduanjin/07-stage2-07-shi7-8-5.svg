<line x1="92" y1="254" x2="120" y2="254" class="body-line"/>
<text x="66" y="278" class="lab2">① 站定·自然呼吸</text>
<circle cx="254" cy="112" r="10" class="head"/>
<line x1="254" y1="122" x2="254" y2="184" class="body-line"/>
<polyline points="254,134 250,172 254,186" class="body-line"/>
