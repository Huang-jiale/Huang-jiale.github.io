<svg viewBox="0 0 760 220" role="img" aria-label="两式的呼吸与动作时间线对照" xmlns="http://www.w3.org/2000/svg" width="760" height="220"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
<rect class="bg-paper" width="760" height="220"/>
<text x="18" y="24" class="labk">一条时间线：蓝=吸气，红=呼气</text>
<line x1="40" y1="112" x2="720" y2="112" class="st-thin"/>
<path d="M60,112 Q90,72 120,112" class="arrow"/>
<path d="M130,112 Q170,152 210,112" class="arrow-r"/>
<path d="M220,112 Q250,72 280,112" class="arrow"/>
<path d="M290,112 Q330,152 370,112" class="arrow-r"/>
<text x="58" y="60" class="lab2">移重心·吸</text>
<text x="126" y="176" class="lab2">俯摆到位·呼</text>
<text x="216" y="60" class="lab2">回正·吸</text>
<text x="286" y="176" class="lab2">对侧俯摆·呼</text>
<text x="420" y="60" class="lab2">上举·吸</text>
<text x="488" y="176" class="lab2">前俯下运·呼</text>
<text x="562" y="60" class="lab2">起身·吸</text>
<text x="630" y="176" class="lab2">落手·呼</text>
<path d="M424,112 Q454,72 484,112" class="arrow"/>
<path d="M492,112 Q532,152 572,112" class="arrow-r"/>
<path d="M580,112 Q610,72 640,112" class="arrow"/>
<path d="M648,112 Q684,152 718,112" class="arrow-r"/>
<line x1="396" y1="40" x2="396" y2="192" class="st-thin"/>
<text x="18" y="208" class="lab">一呼一吸走完半个来回；跟不上就自然呼吸，别憋</text>
</svg>