<svg viewBox="0 0 760 310" role="img" aria-label="第一式起吸落呼示意与八式呼吸配合速查表" xmlns="http://www.w3.org/2000/svg" width="760" height="310"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
<rect class="bg-paper" width="760" height="310"/>
<text x="18" y="26" class="labk">起吸落呼：以两手托天理三焦为例</text>
<circle class="head" cx="180" cy="106" r="16"/>
<line class="body-line" x1="180" y1="122" x2="180" y2="216"/>
<path class="body-line" d="M180 140 l-30 -34 l-8 -30"/>
<path class="body-line" d="M180 140 l30 -34 l8 -30"/>
<line class="body-line" x1="180" y1="216" x2="168" y2="256"/>
<line class="body-line" x1="168" y1="256" x2="166" y2="284"/>
<line class="body-line" x1="180" y1="216" x2="192" y2="256"/>
<line class="body-line" x1="192" y1="256" x2="194" y2="284"/>
<line class="body-line" x1="152" y1="287" x2="176" y2="287"/>
<line class="body-line" x1="184" y1="287" x2="208" y2="287"/>
<path class="arrow" d="M256 190 l0 -80 m-6 10 l6 -10 l6 10"/>
<text x="268" y="140" class="lab">吸</text>
<path class="arrow" d="M100 110 l0 80 m-6 -10 l6 10 l6 -10"/>
<text x="56" y="160" class="lab">呼</text>
<text x="36" y="242" class="lab2">手上托、身上升=吸气</text>
<text x="36" y="262" class="lab2">分手落、身下沉=呼气</text>
<text x="380" y="70" class="lab2">两手托天理三焦：上托吸气，落成呼气</text>
<text x="380" y="98" class="lab2">左右开弓似射雕：开弓吸气，收势呼气</text>
<text x="380" y="126" class="lab2">调理脾胃须单举：上举吸气，回落呼气</text>
<text x="380" y="154" class="lab2">五劳七伤往后瞧：展胸吸气，回正呼气</text>
<text x="380" y="182" class="lab2">摇头摆尾去心火：摆移自然呼吸，起落配一息</text>
<text x="380" y="210" class="lab2">两手攀足固肾腰：俯身呼气，起身吸气</text>
<text x="380" y="238" class="lab2">攒拳怒目增气力：出拳呼气，收拳吸气</text>
<text x="380" y="266" class="lab2">背后七颠百病消：提踵吸气，落踵呼气</text>
<text x="18" y="292" class="lab2">原则只有一条：动作跟着呼吸走，不是呼吸跟着动作赶（以上为常见教学参考配法）</text>
</svg>