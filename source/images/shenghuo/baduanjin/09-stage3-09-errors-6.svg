<svg viewBox="0 0 360 300" role="img" aria-label="两手攀足固肾腰正确侧视图：直背从髋部前折" xmlns="http://www.w3.org/2000/svg" width="360" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
<rect class="bg-paper" width="360" height="300"/>
<text x="14" y="26" class="labk">对：从髋折，背是平的</text>
<circle class="head" cx="244" cy="132" r="13"/>
<line class="st-ok" x1="150" y1="180" x2="232" y2="146"/>
<line class="body-line" x1="150" y1="180" x2="152" y2="230"/>
<line class="body-line" x1="152" y1="230" x2="150" y2="268"/>
<line class="body-line" x1="150" y1="180" x2="166" y2="230"/>
<line class="body-line" x1="166" y1="230" x2="168" y2="268"/>
<line class="body-line" x1="138" y1="271" x2="162" y2="271"/>
<line class="body-line" x1="156" y1="271" x2="180" y2="271"/>
<path class="body-line" d="M232 146 l10 46 l-4 26"/>
<path class="st-blue" d="M186 214 A44 44 0 0 1 152 178"/>
<text x="230" y="64" class="lab2">① 坐臀前折</text>
<text x="230" y="88" class="lab2">② 脊柱长而平</text>
<text x="230" y="112" class="lab2">③ 贴腿后侧下行</text>
<text x="230" y="136" class="lab2">④ 到小腿即止</text>
<text x="230" y="160" class="lab2">⑤ 俯身时呼气</text>
<text x="230" y="184" class="lab2">⑥ 起身分两拍</text>
<text x="14" y="292" class="lab2">膝可微屈，脚跟始终踩实</text>
</svg>