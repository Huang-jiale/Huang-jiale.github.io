<svg viewBox="0 0 360 300" role="img" aria-label="第四式错误：转身带髋、耸肩、转头过猛仰头" xmlns="http://www.w3.org/2000/svg" width="360" height="300"><style> svg{display:block;width:100%;height:auto}
