<svg viewBox="0 0 760 300" role="img" aria-label="六周每次时长的参考爬坡柱状图" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
<rect class="bg-paper" width="760" height="300"/>
<text x="18" y="26" class="labk">六周参考爬坡：每次练多久</text>
<text x="18" y="50" class="lab2">前两周隔日练；第 3 周起可每日；横条高度=单次分钟数</text>
<line x1="40" y1="230" x2="720" y2="230" class="st"/>
<rect x="70" y="150" width="60" height="80" class="f-g3"/>
<rect x="175" y="150" width="60" height="80" class="f-g3"/>
<rect x="280" y="110" width="60" height="120" class="f-g3"/>
<rect x="385" y="110" width="60" height="120" class="f-g3"/>
<rect x="490" y="90" width="60" height="140" class="f-g4"/>
<rect x="595" y="70" width="60" height="160" class="f-g4"/>
<text x="100" y="142" class="lab2" text-anchor="middle">约8分</text>
<text x="205" y="142" class="lab2" text-anchor="middle">约8分</text>
<text x="310" y="102" class="lab2" text-anchor="middle">约12分</text>
<text x="415" y="102" class="lab2" text-anchor="middle">约12分</text>
<text x="520" y="82" class="lab2" text-anchor="middle">约14分</text>
<text x="625" y="62" class="lab2" text-anchor="middle">约16分</text>
<text x="100" y="250" class="lab2" text-anchor="middle">第1周</text>
<text x="205" y="250" class="lab2" text-anchor="middle">第2周</text>
<text x="310" y="250" class="lab2" text-anchor="middle">第3周</text>
<text x="415" y="250" class="lab2" text-anchor="middle">第4周</text>
<text x="520" y="250" class="lab2" text-anchor="middle">第5周</text>
<text x="625" y="250" class="lab2" text-anchor="middle">第6周</text>
<text x="100" y="272" class="lab2" text-anchor="middle">简版隔日</text>
<text x="205" y="272" class="lab2" text-anchor="middle">简版隔日</text>
<text x="310" y="272" class="lab2" text-anchor="middle">标版隔日</text>
<text x="415" y="272" class="lab2" text-anchor="middle">标版每日</text>
<text x="520" y="272" class="lab2" text-anchor="middle">标版+配息</text>
<text x="625" y="272" class="lab2" text-anchor="middle">试一次慢版</text>
</svg>