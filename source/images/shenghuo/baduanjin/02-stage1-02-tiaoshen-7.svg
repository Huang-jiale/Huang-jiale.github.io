<svg viewBox="0 0 760 280" role="img" aria-label="走神回路图：注意力锚点、走神、察觉、带回四格循环" xmlns="http://www.w3.org/2000/svg" width="760" height="280"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="280" class="bg-paper"/>
  <text x="18" y="24" class="labk">"调心"的全部技术含量，就在这四步的循环里</text>
  <rect x="20" y="52" width="164" height="64" class="f-g1" stroke="#8f8f8f"/>
  <text x="102" y="78" class="lab" text-anchor="middle">① 挂上锚点</text>
  <text x="102" y="98" class="lab2" text-anchor="middle">手在动，眼看手</text>
  <rect x="216" y="52" width="164" height="64" class="f-g1" stroke="#8f8f8f"/>
  <text x="298" y="78" class="lab" text-anchor="middle">② 走神</text>
  <text x="298" y="98" class="lab2" text-anchor="middle">必然发生，不是失败</text>
  <rect x="412" y="52" width="164" height="64" class="f-g1" stroke="#8f8f8f"/>
  <text x="494" y="78" class="lab" text-anchor="middle">③ 察觉到</text>
  <text x="494" y="98" class="lab2" text-anchor="middle">"啊，我想到晚饭了"</text>
  <rect x="608" y="52" width="132" height="64" class="f-g1" stroke="#8f8f8f"/>
  <text x="674" y="78" class="lab" text-anchor="middle">④ 带回来</text>
  <text x="674" y="98" class="lab2" text-anchor="middle">不骂自己，继续</text>
  <path class="st" d="M184 84 l32 0 m-7 -4 l7 4 l-7 4"/>
  <path class="st" d="M380 84 l32 0 m-7 -4 l7 4 l-7 4"/>
  <path class="st" d="M576 84 l32 0 m-7 -4 l7 4 l-7 4"/>
  <path class="arrow" d="M674 116 l0 40 l-560 0 l0 -40"/>
  <path class="arrow" d="M102 148 l0 -26 m-5 6 l5 -6 l5 6"/>
  <text x="330" y="146" class="lab2" text-anchor="middle">循环：察觉一次 = 练成一次</text>
  <rect x="20" y="184" width="216" height="52" class="f-white" stroke="#8f8f8f"/>
  <text x="30" y="206" class="labk">锚点 A：数呼吸</text>
  <text x="30" y="226" class="lab2">1 到 6 个数循环，做满一分钟</text>
  <rect x="264" y="184" width="216" height="52" class="f-white" stroke="#8f8f8f"/>
  <text x="274" y="206" class="labk">锚点 B：逐点扫描</text>
  <text x="274" y="226" class="lab2">肩松了吗？膝别内扣</text>
  <rect x="508" y="184" width="232" height="52" class="f-white" stroke="#8f8f8f"/>
  <text x="518" y="206" class="labk">锚点 C：看点 / 听口令</text>
  <text x="518" y="226" class="lab2">眼落在一掌前，耳跟音乐</text>
  <text x="20" y="266" class="lab2">新手建议：第一周只用锚点 C（眼睛看手指尖的方向、耳朵跟口令），最简单也最不容易出偏。</text>
</svg>