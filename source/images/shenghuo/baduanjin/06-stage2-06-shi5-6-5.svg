<polyline points="690,138 696,182 698,226" class="body-line"/>
<text x="628" y="250" class="lab2">④ 吸气起立，呼气落手</text>
<text x="18" y="278" class="lab">全程6遍，每遍约12到14秒；腿后侧紧者可屈膝、手停在小腿</text>
<text x="18" y="304" class="lab2">起身顺序：收腹、挺腰、最后抬头；不许直接仰腰</text>
</svg>