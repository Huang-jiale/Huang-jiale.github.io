<polyline points="281,206 288,214 280,219" class="arrow"/>
<text x="192" y="250" class="lab2">② 呼气前俯，掌沿腰背下运</text>
<circle cx="436" cy="150" r="10" class="head"/>
<line x1="444" y1="152" x2="502" y2="152" class="body-line"/>
<polyline points="502,152 498,190 496,226" class="body-line"/>
<polyline points="502,152 506,190 508,226" class="body-line"/>
<polyline points="446,154 450,198 480,222" class="body-line"/>
<circle cx="480" cy="222" r="4" class="joint"/>
<text x="416" y="250" class="lab2">③ 攀足停 1 到 2 秒，微抬头</text>
<circle cx="690" cy="66" r="10" class="head"/>
<line x1="690" y1="76" x2="690" y2="138" class="body-line"/>
<polyline points="690,86 682,56 688,44" class="body-line"/>
<polyline points="690,86 698,56 692,44" class="body-line"/>
