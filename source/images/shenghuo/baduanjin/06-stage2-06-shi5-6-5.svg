<polyline points="60,140 54,184 52,226" class="body-line"/>
<polyline points="60,140 66,184 68,226" class="body-line"/>
<text x="22" y="250" class="lab2">① 吸气上举</text>
<circle cx="236" cy="118" r="10" class="head"/>
<line x1="244" y1="122" x2="296" y2="140" class="body-line"/>
<polyline points="244,124 240,166 246,200" class="body-line"/>
<polyline points="296,140 292,182 294,226" class="body-line"/>
<polyline points="296,140 300,182 302,226" class="body-line"/>
