<svg viewBox="0 0 760 260" role="img" aria-label="开练前六十秒流程：站好、放松、六次呼吸、挂注意力，四步流水线" xmlns="http://www.w3.org/2000/svg" width="760" height="260"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="260" class="bg-paper"/>
  <text x="18" y="24" class="labk">每次开练前的 60 秒：把三调依次装上</text>
  <rect x="16" y="52" width="168" height="96" class="f-g1" stroke="#8f8f8f"/>
  <text x="100" y="78" class="labk" text-anchor="middle">第 1 步 0–15 秒</text>
  <text x="100" y="100" class="lab" text-anchor="middle">调身：念十检</text>
  <text x="100" y="122" class="lab2" text-anchor="middle">从上到下过一遍</text>
  <rect x="202" y="52" width="168" height="96" class="f-g1" stroke="#8f8f8f"/>
  <text x="286" y="78" class="labk" text-anchor="middle">第 2 步 15–25 秒</text>
  <text x="286" y="100" class="lab" text-anchor="middle">调身：抖手抖脚</text>
  <text x="286" y="122" class="lab2" text-anchor="middle">把僵的地方甩松</text>
  <rect x="388" y="52" width="168" height="96" class="f-g1" stroke="#8f8f8f"/>
  <text x="472" y="78" class="labk" text-anchor="middle">第 3 步 25–55 秒</text>
  <text x="472" y="100" class="lab" text-anchor="middle">调息：6 次慢呼吸</text>
  <text x="472" y="122" class="lab2" text-anchor="middle">吸 4 秒 呼 6 秒</text>
  <rect x="574" y="52" width="168" height="96" class="f-g1" stroke="#8f8f8f"/>
  <text x="658" y="78" class="labk" text-anchor="middle">第 4 步 55–60 秒</text>
  <text x="658" y="100" class="lab" text-anchor="middle">调心：选锚点</text>
  <text x="658" y="122" class="lab2" text-anchor="middle">A、B、C 挑一个</text>
  <path class="st" d="M184 100 l18 0 m-6 -4 l6 4 l-6 4"/>
  <path class="st" d="M370 100 l18 0 m-6 -4 l6 4 l-6 4"/>
  <path class="st" d="M556 100 l18 0 m-6 -4 l6 4 l-6 4"/>
  <line class="st-thin" x1="16" y1="172" x2="742" y2="172"/>
  <text x="16" y="196" class="lab2">合格线很低：第 1 步里至少有 3 个部位"自己动了一下"；第 3 步里没有一次憋气；第 4 步你知道自己选了哪个锚点。</text>
  <text x="16" y="220" class="lab2">三周之后，这 60 秒会变成 20 秒，因为你不用逐个部位检查了——身体自己会归位。</text>
  <text x="16" y="244" class="lab">这三周里请只练这一课的内容，别急着学招式；基础不稳时多学一式，只是把一个错的姿势复制一遍。</text>
</svg>