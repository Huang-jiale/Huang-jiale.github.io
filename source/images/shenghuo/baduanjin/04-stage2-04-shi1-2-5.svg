<svg viewBox="0 0 360 300" role="img" aria-label="第一式正确：肩沉肘直、掌根朝天、脚跟下踩形成上下对拉" xmlns="http://www.w3.org/2000/svg" width="360" height="300"><style> svg{display:block;width:100%;height:auto}
