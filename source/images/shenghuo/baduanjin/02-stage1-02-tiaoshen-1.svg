<svg viewBox="0 0 760 320" role="img" aria-label="三调结构图：调身、调息、调心三个节点互相连接，中心是三调合一" xmlns="http://www.w3.org/2000/svg" width="760" height="320"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="320" class="bg-paper"/>
  <text x="380" y="26" class="labk" text-anchor="middle">三调：同一套动作的三个控制面</text>
  <rect x="284" y="56" width="192" height="60" class="f-g2" stroke="#8f8f8f"/>
  <text x="380" y="82" class="labk" text-anchor="middle">调身 · 姿势</text>
  <text x="380" y="104" class="lab2" text-anchor="middle">头颈肩腰膝脚 摆正</text>
  <rect x="52" y="216" width="192" height="60" class="f-g2" stroke="#8f8f8f"/>
  <text x="148" y="242" class="labk" text-anchor="middle">调息 · 呼吸</text>
  <text x="148" y="264" class="lab2" text-anchor="middle">不憋、不断、呼气略长</text>
  <rect x="516" y="216" width="192" height="60" class="f-g2" stroke="#8f8f8f"/>
  <text x="612" y="242" class="labk" text-anchor="middle">调心 · 注意力</text>
  <text x="612" y="264" class="lab2" text-anchor="middle">知道自己在做第几式</text>
  <line class="st" x1="284" y1="116" x2="196" y2="216"/>
  <line class="st" x1="476" y1="116" x2="564" y2="216"/>
  <line class="st" x1="244" y1="246" x2="516" y2="246"/>
  <circle class="dot" cx="240" cy="170" r="5"/>
  <circle class="dot" cx="520" cy="170" r="5"/>
  <text x="232" y="160" class="lab2" text-anchor="end">身歪→气短</text>
  <text x="528" y="160" class="lab2">用力→气住</text>
  <text x="380" y="176" class="lab" text-anchor="middle">三调合一</text>
  <text x="380" y="196" class="lab2" text-anchor="middle">身正 → 呼吸自然变深</text>
  <text x="380" y="306" class="lab2" text-anchor="middle">三者的顺序建议：先把身摆好，再管呼吸，最后管注意力</text>
</svg>