<svg viewBox="0 0 760 300" role="img" aria-label="三栏红黄绿灯图：绿色今天可以练，黄色需要减量或先问医生，红色今天停" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="24" class="labk">练之前用 10 秒给自己分个灯</text>
  <rect x="16" y="44" width="232" height="36" class="st-ok" stroke="none" fill="#e3f1e6"/>
  <text x="132" y="68" class="labk" text-anchor="middle">绿：今天正常练</text>
  <text x="26" y="104" class="lab2">· 睡醒后、下班后都行</text>
  <text x="26" y="126" class="lab2">· 饭后已过 30 分钟</text>
  <text x="26" y="148" class="lab2">· 身上不发烧、不疼</text>
  <text x="26" y="170" class="lab2">· 昨晚睡眠差不影响</text>
  <text x="26" y="192" class="lab2">· 微热即止，可以天天练</text>
  <rect x="264" y="44" width="232" height="36" fill="#fbf3e2" stroke="none"/>
  <text x="380" y="68" class="labk" text-anchor="middle">黄：减量，先问医生</text>
  <text x="274" y="104" class="lab2">· 医生交代要限制活动量</text>
  <text x="274" y="126" class="lab2">· 膝、腰、颈正在疼</text>
  <text x="274" y="148" class="lab2">· 很久没动、一上岁数</text>
  <text x="274" y="170" class="lab2">· 正在服药或刚出院</text>
  <text x="274" y="192" class="lab2">· 处理：幅度减半、蹲高点</text>
  <rect x="512" y="44" width="232" height="36" fill="#fbe6e3" stroke="none"/>
  <text x="628" y="68" class="labk" text-anchor="middle">红：今天停一停</text>
  <text x="522" y="104" class="lab2">· 发烧、急性疼痛</text>
  <text x="522" y="126" class="lab2">· 伤口未愈合、刚手术</text>
  <text x="522" y="148" class="lab2">· 空腹心慌或吃得太饱</text>
  <text x="522" y="170" class="lab2">· 剧烈运动心跳未平复</text>
  <text x="522" y="192" class="lab2">· 头晕、眼前发黑：立刻停</text>
  <text x="18" y="228" class="lab2">黄灯人群（医生限制活动量、正在服药、刚出院）请先咨询医生，由医生决定练不练、练几遍，再决定蹲多低。</text>
  <text x="18" y="252" class="lab2">红灯情形不要靠"练一练就发汗"去顶。今天停，明天再练，不会因此退步。</text>
  <text x="18" y="282" class="lab">练中任何一个时刻出现胸闷、心口疼、头晕、关节刺痛，就地站定、慢呼吸，不缓解就就医。</text>
</svg>