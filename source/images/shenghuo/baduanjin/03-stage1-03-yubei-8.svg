  <text x="110" y="252" class="lab" text-anchor="middle">① 上提</text>
  <text x="270" y="252" class="lab" text-anchor="middle">② 下按</text>
  <text x="430" y="252" class="lab" text-anchor="middle">③ 叠掌</text>
  <text x="590" y="252" class="lab" text-anchor="middle">④ 并步</text>
  <text x="110" y="272" class="lab2" text-anchor="middle">吸气，臂前抬</text>
  <text x="270" y="272" class="lab2" text-anchor="middle">呼气，掌下按</text>
  <text x="430" y="272" class="lab2" text-anchor="middle">静立 3–5 息</text>
  <text x="590" y="272" class="lab2" text-anchor="middle">先收右脚并拢</text>
  <text x="690" y="112" class="lab2" text-anchor="middle">四步</text>
  <text x="690" y="130" class="lab2" text-anchor="middle">40 秒</text>
  <text x="18" y="292" class="lab2">第 ③ 步两手相叠轻贴小腹前（不少人习惯右手在外），注意力放在腹部的起伏上——这就是古谱说的"气沉丹田"，你可以纯按字面体感来理解。</text>
</svg>