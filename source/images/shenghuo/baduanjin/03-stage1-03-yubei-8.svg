    <line class="body-line" x1="568" y1="98" x2="612" y2="98"/>
    <line class="body-line" x1="568" y1="98" x2="562" y2="132"/><line class="body-line" x1="562" y1="132" x2="560" y2="160"/>
    <line class="body-line" x1="612" y1="98" x2="618" y2="132"/><line class="body-line" x1="618" y1="132" x2="620" y2="160"/>
    <line class="body-line" x1="589" y1="158" x2="588" y2="196"/><line class="body-line" x1="588" y1="196" x2="587" y2="224"/>
