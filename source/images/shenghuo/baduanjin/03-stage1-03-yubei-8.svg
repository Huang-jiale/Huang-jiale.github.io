    <path class="body-line" d="M292 98 l10 32 q-10 22 -22 22"/>
    <line class="body-line" x1="270" y1="158" x2="262" y2="196"/><line class="body-line" x1="262" y1="196" x2="260" y2="224"/>
    <line class="body-line" x1="270" y1="158" x2="278" y2="196"/><line class="body-line" x1="278" y1="196" x2="280" y2="224"/>
