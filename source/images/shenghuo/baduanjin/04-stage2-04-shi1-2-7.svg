<svg viewBox="0 0 760 400" role="img" aria-label="第二式到位图：一手撑掌一手勾手，马步，头转向撑掌侧，配左右对拉箭头与呼吸标注" xmlns="http://www.w3.org/2000/svg" width="760" height="400"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="400" class="bg-paper"/>
  <text x="18" y="24" class="labk">第二式到位图（以左手撑掌为例，画面里人物的左手在你的右边）</text>
  <g>
    <circle class="head" cx="300" cy="118" r="18"/>
    <line class="body-line" x1="300" y1="136" x2="300" y2="248"/>
    <line class="body-line" x1="258" y1="164" x2="342" y2="164"/>
    <path class="body-line" d="M258 164 l-56 -6"/>
    <path class="body-line" d="M342 164 l44 -12 l-24 -18"/>
    <path class="st" d="M198 152 l0 -22 M198 152 l0 22 M198 152 l-14 -6"/>
    <path class="st" d="M364 132 q10 -8 4 -16"/>
    <line class="body-line" x1="300" y1="248" x2="276" y2="288"/>
    <line class="body-line" x1="276" y1="288" x2="272" y2="326"/>
    <line class="body-line" x1="300" y1="248" x2="324" y2="288"/>
    <line class="body-line" x1="324" y1="288" x2="328" y2="326"/>
    <line class="body-line" x1="256" y1="329" x2="280" y2="329"/>
    <line class="body-line" x1="320" y1="329" x2="344" y2="329"/>
    <circle class="joint" cx="258" cy="164" r="4"/><circle class="joint" cx="342" cy="164" r="4"/>
    <circle class="joint" cx="276" cy="288" r="4"/><circle class="joint" cx="324" cy="288" r="4"/>
    <circle class="joint" cx="198" cy="152" r="5"/>
  </g>
  <path class="arrow" d="M172 152 l-40 0 m10 -5 l-10 5 l10 5"/>
  <path class="arrow" d="M382 128 l38 -12 m-12 -1 l12 1 l-5 11"/>
  <path class="arrow" d="M300 342 l0 24 m-5 -8 l5 8 l5 -8"/>
  <path class="arrow" d="M252 92 a40 26 0 0 0 -34 24"/>
  <text x="452" y="66" class="labk">八个体感检查（逐条对）</text>
  <text x="452" y="92" class="lab2">① 撑掌侧：手腕立起，掌指朝天</text>
  <text x="452" y="114" class="lab2">② 掌根向前顶，不是掌心拍出去</text>
  <text x="452" y="136" class="lab2">③ 拉弓侧：勾尖向下，腕放松</text>
  <text x="452" y="158" class="lab2">④ 拉弓的肘不高过肩、不后顶</text>
  <text x="452" y="180" class="lab2">⑤ 头转过去，身子不转</text>
  <text x="452" y="202" class="lab2">⑥ 眼看撑掌指方向的远处一点</text>
  <text x="452" y="224" class="lab2">⑦ 胸口正对前方，肩线平行脚线</text>
  <text x="452" y="246" class="lab2">⑧ 膝尖对准脚尖，重量在脚掌中部</text>
  <rect x="40" y="278" width="200" height="26" class="f-g2" stroke="#8f8f8f"/>
  <text x="140" y="296" class="lab" text-anchor="middle">搭手开步：呼气</text>
  <rect x="240" y="278" width="200" height="26" fill="#e3f1e6" stroke="#8f8f8f"/>
  <text x="340" y="296" class="lab" text-anchor="middle">开弓定势：呼尽后自然</text>
  <rect x="440" y="278" width="280" height="26" fill="#dbeaf7" stroke="#8f8f8f"/>
  <text x="580" y="296" class="lab" text-anchor="middle">收弓起身换边：吸气</text>
  <text x="40" y="330" class="lab2">本式的呼吸走"用力呼气、回收吸气"：下蹲和开弓这两个吃力的环节都放在呼气上，收弓站起来时吸气。</text>
  <text x="40" y="352" class="lab2">如果这个顺序让你别扭，就退回最保守的一条：动作不变、绝不憋气，呼吸自己找节奏。这一点在八段锦里不算错。</text>
  <text x="40" y="374" class="lab2">每边定势 1–3 秒，两侧各 3–4 遍；做完两条大腿发热是正常的，膝盖疼不是。</text>
</svg>