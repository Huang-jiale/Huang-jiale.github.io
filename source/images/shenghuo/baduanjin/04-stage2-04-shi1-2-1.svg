<svg viewBox="0 0 760 340" role="img" aria-label="第一式两手托天理三焦的起势与途中两帧简笔图，标出手的路线与视线" xmlns="http://www.w3.org/2000/svg" width="760" height="340"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="340" class="bg-paper"/>
  <text x="18" y="24" class="labk">第一式起势：两手从腹前交叉，经体前上托</text>
  <g>
    <circle class="head" cx="170" cy="80" r="15"/>
    <line class="body-line" x1="170" y1="96" x2="170" y2="196"/>
    <line class="body-line" x1="142" y1="116" x2="198" y2="116"/>
    <path class="body-line" d="M142 116 l-12 40 q14 22 26 24"/>
    <path class="body-line" d="M198 116 l12 40 q-14 22 -26 24"/>
    <circle class="joint" cx="170" cy="182" r="5"/>
    <line class="body-line" x1="170" y1="196" x2="160" y2="238"/>
    <line class="body-line" x1="160" y1="238" x2="158" y2="272"/>
    <line class="body-line" x1="170" y1="196" x2="180" y2="238"/>
    <line class="body-line" x1="180" y1="238" x2="182" y2="272"/>
    <line class="body-line" x1="146" y1="275" x2="164" y2="275"/>
    <line class="body-line" x1="176" y1="275" x2="194" y2="275"/>
  </g>
  <text x="170" y="308" class="lab" text-anchor="middle">第 1 帧：腹前交叉</text>
  <g>
    <circle class="head" cx="400" cy="80" r="15"/>
    <line class="body-line" x1="400" y1="96" x2="400" y2="196"/>
    <line class="body-line" x1="372" y1="116" x2="428" y2="116"/>
    <path class="body-line" d="M372 116 l-10 34 l28 8"/>
    <path class="body-line" d="M428 116 l10 34 l-28 8"/>
    <circle class="joint" cx="386" cy="158" r="5"/><circle class="joint" cx="414" cy="158" r="5"/>
    <line class="body-line" x1="400" y1="196" x2="390" y2="238"/>
    <line class="body-line" x1="390" y1="238" x2="388" y2="272"/>
    <line class="body-line" x1="400" y1="196" x2="410" y2="238"/>
    <line class="body-line" x1="410" y1="238" x2="412" y2="272"/>
    <line class="body-line" x1="376" y1="275" x2="394" y2="275"/>
    <line class="body-line" x1="406" y1="275" x2="424" y2="275"/>
  </g>
  <text x="400" y="308" class="lab" text-anchor="middle">第 2 帧：翻掌经胸前</text>
  <path class="arrow" d="M230 172 l58 -20 m-12 -1 l12 1 l-2 12"/>
  <path class="arrow" d="M452 148 l0 -36 m-5 8 l5 -8 l5 8"/>
  <text x="520" y="86" class="labk">三句动作口令</text>
  <text x="520" y="110" class="lab2">① 腹前十指交叉，掌心向上</text>
  <text x="520" y="132" class="lab2">② 翻掌经面前缓缓上托</text>
  <text x="520" y="154" class="lab2">③ 上托同时吸气，抬头看手</text>
  <text x="520" y="192" class="labk">两个容易忽略的细节</text>
  <text x="520" y="216" class="lab2">手腕别硬拧，靠身体带手上</text>
  <text x="520" y="238" class="lab2">腿保持直立，但膝不要锁死</text>
  <text x="520" y="260" class="lab2">肩从第 1 帧起就是落的</text>
  <text x="18" y="332" class="lab2">这两帧之间没有停顿：整个过程像"把一盆水从腹前慢慢端到头顶"，速度约 4 秒走完。</text>
</svg>