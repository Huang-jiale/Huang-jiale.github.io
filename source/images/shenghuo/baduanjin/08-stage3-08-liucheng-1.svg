<svg viewBox="0 0 760 340" role="img" aria-label="八式顺序、遍数与秒数的横向分解带与总时长算账" xmlns="http://www.w3.org/2000/svg" width="760" height="340"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
<rect class="bg-paper" width="760" height="340"/>
<text x="18" y="26" class="labk">整套八式：顺序、遍数与秒数</text>
<rect x="14" y="50" width="66" height="76" class="f-g5"/>
<rect x="88" y="50" width="66" height="76" class="f-g3"/>
<rect x="162" y="50" width="66" height="76" class="f-g3"/>
<rect x="236" y="50" width="66" height="76" class="f-g3"/>
<rect x="310" y="50" width="66" height="76" class="f-g3"/>
<rect x="384" y="50" width="66" height="76" class="f-g3"/>
<rect x="458" y="50" width="66" height="76" class="f-g3"/>
<rect x="532" y="50" width="66" height="76" class="f-g3"/>
<rect x="606" y="50" width="66" height="76" class="f-g3"/>
<rect x="680" y="50" width="66" height="76" class="f-g5"/>
<text x="20" y="72" class="lab2">预备势</text>
<text x="20" y="92" class="lab2">调息</text>
<text x="20" y="114" class="lab2">30秒</text>
<text x="94" y="68" class="lab2">两手托天</text>
<text x="94" y="84" class="lab2">理三焦</text>
<text x="94" y="100" class="lab2">6遍</text>
<text x="94" y="116" class="lab2">72秒</text>
<text x="168" y="68" class="lab2">左右开弓</text>
<text x="168" y="84" class="lab2">似射雕</text>
<text x="168" y="100" class="lab2">各3遍</text>
<text x="168" y="116" class="lab2">84秒</text>
<text x="242" y="68" class="lab2">调理脾胃</text>
<text x="242" y="84" class="lab2">须单举</text>
<text x="242" y="100" class="lab2">6遍</text>
<text x="242" y="116" class="lab2">72秒</text>
<text x="316" y="68" class="lab2">五劳七伤</text>
<text x="316" y="84" class="lab2">往后瞧</text>
<text x="316" y="100" class="lab2">6遍</text>
<text x="316" y="116" class="lab2">72秒</text>
<text x="390" y="68" class="lab2">摇头摆尾</text>
<text x="390" y="84" class="lab2">去心火</text>
<text x="390" y="100" class="lab2">各3遍</text>
<text x="390" y="116" class="lab2">84秒</text>
<text x="464" y="68" class="lab2">两手攀足</text>
<text x="464" y="84" class="lab2">固肾腰</text>
<text x="464" y="100" class="lab2">6遍</text>
<text x="464" y="116" class="lab2">84秒</text>
<text x="538" y="68" class="lab2">攒拳怒目</text>
<text x="538" y="84" class="lab2">增气力</text>
<text x="538" y="100" class="lab2">各3遍</text>
<text x="538" y="116" class="lab2">84秒</text>
<text x="612" y="68" class="lab2">背后七颠</text>
<text x="612" y="84" class="lab2">百病消</text>
<text x="612" y="100" class="lab2">7次</text>
<text x="612" y="116" class="lab2">42秒</text>
<text x="686" y="72" class="lab2">收势</text>
<text x="686" y="92" class="lab2">归元</text>
<text x="686" y="114" class="lab2">30秒</text>
<polyline points="81,84 86,88 81,92" class="arrow"/>
<polyline points="155,84 160,88 155,92" class="arrow"/>
<polyline points="229,84 234,88 229,92" class="arrow"/>
<polyline points="303,84 308,88 303,92" class="arrow"/>
<polyline points="377,84 382,88 377,92" class="arrow"/>
<polyline points="451,84 456,88 451,92" class="arrow"/>
<polyline points="525,84 530,88 525,92" class="arrow"/>
<polyline points="599,84 604,88 599,92" class="arrow"/>
<polyline points="673,84 678,88 673,92" class="arrow"/>
<text x="18" y="150" class="lab2">每遍时长按 12 到 14 秒估；第八式每次约 6 秒，提踵与落踵各占一半</text>
<text x="18" y="182" class="labk">算总账（请自己按秒表复核一遍）</text>
<text x="18" y="208" class="lab">八式小计：72+84+72+72+84+84+84+42 = 594 秒</text>
<text x="18" y="232" class="lab">加式间过渡 8 处各 10 秒 = 80 秒</text>
<text x="18" y="256" class="lab">加预备势、收势各 30 秒 = 60 秒</text>
<text x="400" y="208" class="lab">合计 594+80+60 = 734 秒</text>
<text x="400" y="232" class="labk">约 12 分 14 秒</text>
<text x="400" y="256" class="lab2">再留几处深呼吸停顿，就是 12 到 15 分钟</text>
<text x="18" y="302" class="lab2">结论：标准遍数的全套就是 12 分钟上下；时间不够就减遍数（简版约 7 分半），而不是加快每遍</text>
</svg>