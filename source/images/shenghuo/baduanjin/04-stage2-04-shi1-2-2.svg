<svg viewBox="0 0 760 398" role="img" aria-label="两手托天理三焦到位图：掌心朝天站在头顶上方，配合上下对拉箭头与呼吸时间轴" xmlns="http://www.w3.org/2000/svg" width="760" height="398"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="398" class="bg-paper"/>
  <text x="18" y="24" class="labk">第一式到位图：上下对拉 + 一次呼吸的分配</text>
  <g>
    <circle class="head" cx="280" cy="86" r="18"/>
    <line class="body-line" x1="280" y1="104" x2="280" y2="212"/>
    <line class="body-line" x1="240" y1="136" x2="320" y2="136"/>
    <path class="body-line" d="M240 136 l-12 -44 l26 -30"/>
    <path class="body-line" d="M320 136 l12 -44 l-26 -30"/>
    <path class="st" d="M254 62 q26 -12 52 0"/>
    <line class="body-line" x1="280" y1="212" x2="272" y2="258"/>
    <line class="body-line" x1="272" y1="258" x2="270" y2="296"/>
    <line class="body-line" x1="280" y1="212" x2="288" y2="258"/>
    <line class="body-line" x1="288" y1="258" x2="290" y2="296"/>
    <line class="body-line" x1="254" y1="299" x2="276" y2="299"/>
    <line class="body-line" x1="284" y1="299" x2="306" y2="299"/>
    <circle class="joint" cx="240" cy="136" r="4"/><circle class="joint" cx="320" cy="136" r="4"/>
    <circle class="joint" cx="228" cy="92" r="4"/><circle class="joint" cx="332" cy="92" r="4"/>
    <circle class="joint" cx="272" cy="258" r="4"/><circle class="joint" cx="288" cy="258" r="4"/>
  </g>
  <path class="arrow" d="M280 44 l0 -22 m-5 6 l5 -6 l5 6"/>
  <path class="arrow" d="M266 306 l0 20 m-5 -6 l5 6 l5 -6"/>
  <path class="arrow" d="M294 306 l0 20 m-5 -6 l5 6 l5 -6"/>
  <path class="arrow" d="M300 74 l26 -14 m-11 0 l11 0 l-4 10"/>
  <text x="392" y="48" class="lab2">① 掌心朝天，掌根向上顶</text>
  <text x="392" y="78" class="lab2">② 两臂夹耳，肘部伸直</text>
  <text x="392" y="108" class="lab2">③ 眼看手背，颈不使劲后压</text>
  <text x="392" y="138" class="lab2">④ 肩胛向背中部收（夹脊）</text>
  <text x="392" y="168" class="lab2">⑤ 胸不挺出，肋骨别往外支</text>
  <text x="392" y="198" class="lab2">⑥ 脚跟向下踩，与掌对拉</text>
  <text x="392" y="228" class="lab2">⑦ 全程只有一口气：吸→定→呼</text>
  <text x="392" y="258" class="lab2">⑧ 有的版本这里微微提踵，可不提</text>
  <rect x="40" y="330" width="280" height="28" fill="#dbeaf7" stroke="#8f8f8f"/>
  <text x="180" y="350" class="lab" text-anchor="middle">吸气 4 秒：上托</text>
  <rect x="320" y="330" width="120" height="28" class="f-g2" stroke="#8f8f8f"/>
  <text x="380" y="350" class="lab" text-anchor="middle">自然 1–3 秒</text>
  <rect x="440" y="330" width="280" height="28" fill="#e3f1e6" stroke="#8f8f8f"/>
  <text x="580" y="350" class="lab" text-anchor="middle">呼气 5 秒：下落</text>
  <text x="40" y="384" class="lab2">0 秒</text>
  <text x="300" y="384" class="lab2">4 秒</text>
  <text x="420" y="384" class="lab2">6 秒</text>
  <text x="690" y="384" class="lab2">11 秒</text>
</svg>