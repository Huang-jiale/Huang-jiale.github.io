<svg viewBox="0 0 760 300" role="img" aria-label="主观强度0到10标尺分三档：舒适带提高带停止线" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
<rect class="bg-paper" width="760" height="300"/>
<text x="18" y="26" class="labk">主观强度标尺：0 到 10，只量自己</text>
<text x="18" y="58" class="lab2">0 到 3 舒适带：能整句说话，收势后几秒就平</text>
<text x="18" y="82" class="lab2">4 到 6 提高带：微喘，还能说短句</text>
<rect x="40" y="110" width="220" height="36" class="f-g1" stroke="#8f8f8f"/>
<rect x="260" y="110" width="220" height="36" class="f-g3" stroke="#8f8f8f"/>
<rect x="480" y="110" width="220" height="36" fill="#f7d5d5" stroke="#c0392b"/>
<text x="150" y="133" class="lab" text-anchor="middle">舒适带</text>
<text x="370" y="133" class="lab" text-anchor="middle">提高带</text>
<text x="590" y="133" class="lab" text-anchor="middle">停止线以外</text>
<text x="40" y="168" class="lab2" text-anchor="middle">0</text>
<text x="260" y="168" class="lab2" text-anchor="middle">4</text>
<text x="480" y="168" class="lab2" text-anchor="middle">7</text>
<text x="700" y="168" class="lab2" text-anchor="middle">10</text>
<text x="18" y="212" class="lab2">7 以上：说不成句、气短、胸闷头晕刺痛——这一档没有"坚持"二字，只有停</text>
<text x="18" y="240" class="lab2">八段锦日常练用，稳定落在 3 到 6 的轻段即可；初学者先待在最左边</text>
<text x="18" y="268" class="lab2">测法：动作中默念一句式名，再数一次呼吸——句子完整、呼吸不断，才算在带内</text>
</svg>