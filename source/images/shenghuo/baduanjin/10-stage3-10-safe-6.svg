<svg viewBox="0 0 760 320" role="img" aria-label="出现停止信号后的处理流程：停下静坐观察缓解就医或减档" xmlns="http://www.w3.org/2000/svg" width="760" height="320"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
<rect class="bg-paper" width="760" height="320"/>
<text x="18" y="26" class="labk">停止信号出现后，按这个顺序走</text>
<rect x="30" y="70" width="150" height="64" fill="#fbf1e9" stroke="#c0392b"/>
<text x="105" y="96" class="lab2" text-anchor="middle">胸闷心慌、头晕</text>
<text x="105" y="116" class="lab2" text-anchor="middle">刺痛、发麻、恶心</text>
<rect x="230" y="70" width="140" height="64" fill="#fff" stroke="#1c1c1c"/>
<text x="300" y="96" class="lab2" text-anchor="middle">立刻停止</text>
<text x="300" y="116" class="lab2" text-anchor="middle">原地坐下</text>
<rect x="420" y="70" width="140" height="64" fill="#fff" stroke="#1c1c1c"/>
<text x="490" y="96" class="lab2" text-anchor="middle">观察</text>
<text x="490" y="116" class="lab2" text-anchor="middle">5 到 10 分钟</text>
<rect x="605" y="70" width="125" height="64" fill="#f7d5d5" stroke="#c0392b"/>
<text x="667" y="96" class="lab2" text-anchor="middle">未缓解：</text>
<text x="667" y="116" class="lab2" text-anchor="middle">及时就医</text>
<rect x="420" y="196" width="140" height="64" fill="#f0f6f1" stroke="#2f7d42"/>
<text x="490" y="222" class="lab2" text-anchor="middle">缓解了：</text>
<text x="490" y="242" class="lab2" text-anchor="middle">今天到此为止</text>
<rect x="230" y="196" width="140" height="64" fill="#fff" stroke="#1c1c1c"/>
<text x="300" y="222" class="lab2" text-anchor="middle">下次整体</text>
<text x="300" y="242" class="lab2" text-anchor="middle">降一档再练</text>
<path class="arrow" d="M184 102 l40 0 m-9 -5 l9 5 l-9 5"/>
<path class="arrow" d="M374 102 l40 0 m-9 -5 l9 5 l-9 5"/>
<path class="arrow" d="M564 102 l36 0 m-9 -5 l9 5 l-9 5"/>
<path class="arrow" d="M490 138 l0 54 m-5 -8 l5 8 l5 -8"/>
<path class="arrow" d="M416 228 l-40 0 m9 -5 l-9 5 l9 5"/>
<text x="18" y="296" class="lab2">流程可以贴在心里：信号不是考验意志力，是身体在替你做决定</text>
</svg>