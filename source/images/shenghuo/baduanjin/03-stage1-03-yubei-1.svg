<svg viewBox="0 0 760 320" role="img" aria-label="预备势五步连环简笔图：并步、开步、抬臂、环抱、屈膝" xmlns="http://www.w3.org/2000/svg" width="760" height="320"><style> svg{display:block;width:100%;height:auto}
