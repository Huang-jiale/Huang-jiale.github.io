  <line class="st-thin" x1="16" y1="216" x2="744" y2="216"/>
  <text x="90" y="246" class="lab" text-anchor="middle">① 并步</text>
  <text x="90" y="266" class="lab2" text-anchor="middle">手垂体侧</text>
  <text x="232" y="246" class="lab" text-anchor="middle">② 开步</text>
  <text x="232" y="266" class="lab2" text-anchor="middle">与肩同宽</text>
  <text x="374" y="246" class="lab" text-anchor="middle">③ 抬臂</text>
  <text x="374" y="266" class="lab2" text-anchor="middle">自体侧前抬</text>
  <text x="516" y="246" class="lab" text-anchor="middle">④ 环抱</text>
  <text x="516" y="266" class="lab2" text-anchor="middle">如抱一球</text>
  <text x="658" y="246" class="lab" text-anchor="middle">⑤ 屈膝</text>
  <text x="658" y="266" class="lab2" text-anchor="middle">如坐高凳</text>
  <text x="18" y="302" class="lab2">顺序按 ①→⑤ 走，全程不憋气；口令上常见"先出左脚、收脚时先收右脚"，这只是习惯规定，做不到也不必重来。</text>
</svg>