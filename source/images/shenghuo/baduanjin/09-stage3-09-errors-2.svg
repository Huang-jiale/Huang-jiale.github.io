<svg viewBox="0 0 760 320" role="img" aria-label="耸肩错误与沉肩正确的正面比较图，以托天定势为例" xmlns="http://www.w3.org/2000/svg" width="760" height="320"><style> svg{display:block;width:100%;height:auto}
