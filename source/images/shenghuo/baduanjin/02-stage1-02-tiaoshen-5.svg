<svg viewBox="0 0 760 300" role="img" aria-label="胸式呼吸与腹式呼吸的曲线对比，横轴为秒" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="24" class="labk">同样 12 秒：左边是平时的胸式，右边是调息要练的腹式</text>
  <line class="st" x1="40" y1="220" x2="360" y2="220"/>
  <line class="st-thin" x1="40" y1="120" x2="360" y2="120"/>
  <path class="st-bad" d="M40 200 q13 -70 26 0 q13 70 26 0 q13 -70 26 0 q13 70 26 0 q13 -70 26 0 q13 70 26 0 q13 -70 26 0 q13 70 26 0 q13 -70 26 0 q13 70 26 0" stroke-width="2"/>
  <text x="40" y="56" class="lab">✗ 胸式：一个循环约 2.4 秒</text>
  <text x="40" y="76" class="lab2">起伏全在胸口，肩膀跟着动</text>
  <text x="40" y="96" class="lab2">用力时容易停住（憋）</text>
  <text x="44" y="240" class="lab2">0 秒</text>
  <text x="330" y="240" class="lab2">12 秒</text>
  <line class="st" x1="400" y1="220" x2="720" y2="220"/>
  <line class="st-thin" x1="400" y1="120" x2="720" y2="120"/>
  <path class="st-ok" d="M400 220 q60 -100 120 0 q40 80 80 0 q60 -100 120 0" stroke-width="2"/>
  <path class="arrow" d="M460 168 l0 -22 m-5 6 l5 -6 l5 6"/>
  <text x="462" y="132" class="lab2">吸：腹轻鼓</text>
  <path class="arrow" d="M640 168 l0 22 m-5 -6 l5 6 l5 -6"/>
  <text x="642" y="204" class="lab2">呼：腹收回</text>
  <text x="400" y="56" class="lab">✓ 腹式：吸约 4 秒 + 呼约 6 秒</text>
  <text x="400" y="76" class="lab2">胸口不动，小腹一起一伏</text>
  <text x="400" y="96" class="lab2">一个循环约 10 秒，一分钟 6 次</text>
  <text x="404" y="240" class="lab2">0 秒</text>
  <text x="690" y="240" class="lab2">12 秒</text>
  <text x="18" y="282" class="lab2">别误会：不是"越深越好"。刻意深吸猛呼会造成过度换气，头会晕。要的是慢和匀，深度是自然跟着来的。</text>
</svg>