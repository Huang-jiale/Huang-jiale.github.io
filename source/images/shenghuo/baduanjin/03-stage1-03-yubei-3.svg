<svg viewBox="0 0 760 250" role="img" aria-label="脚掌三点承重的示意图，三点各承担约三分之一" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="24" class="labk">一只脚的"三点承重"：重量这样分才算平</text>
  <ellipse class="f-g1" cx="200" cy="130" rx="72" ry="98" stroke="#8f8f8f"/>
  <circle class="joint" cx="168" cy="66" r="9"/>
  <circle class="joint" cx="234" cy="80" r="9"/>
  <circle class="joint" cx="200" cy="212" r="9"/>
  <path class="st" d="M168 66 l66 14 l32 132" stroke-dasharray="4 3"/>
  <text x="316" y="60" class="lab">① 前掌内侧（大脚趾根后）</text>
  <text x="316" y="80" class="lab2">约三分之一，别把它顶出去</text>
  <text x="316" y="112" class="lab">② 前掌外侧（小脚趾根后）</text>
  <text x="316" y="132" class="lab2">约三分之一，很多人这里空的</text>
  <text x="316" y="164" class="lab">③ 脚跟正中</text>
  <text x="316" y="184" class="lab2">约三分之一，不是全部重量</text>
  <text x="18" y="238" class="lab2">检查法：重心前后缓缓移，找到"三点同时压得实、脚跟不用力、脚趾不抠地"的那一格，那就是预备势的重量分布。</text>
</svg>