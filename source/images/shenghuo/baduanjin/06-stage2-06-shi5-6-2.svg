<svg viewBox="0 0 760 330" role="img" aria-label="第五式躯干划弧的三个位置与错误方向对比" xmlns="http://www.w3.org/2000/svg" width="760" height="330"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
<rect class="bg-paper" width="760" height="330"/>
<text x="18" y="26" class="labk">三个位置看一遍：中立、向一侧俯摆、回中立</text>
<line x1="50" y1="288" x2="400" y2="288" class="st-thin"/>
<polyline points="100,286 100,208 178,208 178,286" class="st-thin"/>
<circle cx="150" cy="208" r="4" class="joint"/>
<line x1="150" y1="208" x2="150" y2="132" class="body-line"/>
<circle cx="150" cy="118" r="12" class="head"/>
<text x="134" y="262" class="lab2">中立位</text>
<line x1="150" y1="208" x2="110" y2="168" class="st-bad"/>
<circle cx="102" cy="158" r="12" class="head"/>
<polyline points="150,208 170,196 196,206" class="arrow-r"/>
<text x="70" y="128" class="lab2">向这侧前下方俯</text>
<line x1="150" y1="208" x2="196" y2="172" class="st-ok"/>
<circle cx="206" cy="164" r="12" class="head"/>
<polyline points="150,208 128,200 106,214" class="arrow"/>
<text x="222" y="150" class="lab2">回正，再向另一侧</text>
<path d="M98,146 Q150,104 210,150" class="arrow"/>
<polyline points="201,142 210,150 200,155" class="arrow"/>
<text x="104" y="96" class="lab2">头走的弧（从低到高）</text>
<text x="430" y="52" class="labk">三条最容易丢的要点</text>
<text x="430" y="80" class="lab">① 弧要连：俯下去再起来不许断</text>
<text x="430" y="104" class="lab">② 腰为主：动的是脊柱不是脖子</text>
<text x="430" y="128" class="lab">③ 脚不动：两脚像钉在地上</text>
<text x="430" y="160" class="lab2">呼吸：俯摆时呼气，起回时吸气</text>
<text x="430" y="184" class="lab2">次数：左右各3遍；累了就地起身歇</text>
<text x="430" y="208" class="lab2">时长：每遍6到8秒，宁慢不抢</text>
<text x="430" y="232" class="lab2">幅度：手指离膝越近，腰越安全</text>
<text x="430" y="270" class="lab">起身慢：先直立停两秒再走下一步</text>
</svg>