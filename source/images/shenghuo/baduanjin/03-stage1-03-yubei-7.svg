<svg viewBox="0 0 760 230" role="img" aria-label="预备势一分钟时间轴：站好、六次慢呼吸、进入第一式" xmlns="http://www.w3.org/2000/svg" width="760" height="230"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="230" class="bg-paper"/>
  <text x="18" y="24" class="labk">预备势 80 秒的分配（自己练就照这个数走）</text>
  <rect x="40" y="54" width="113" height="40" class="f-g2" stroke="#8f8f8f"/>
  <text x="96" y="80" class="lab" text-anchor="middle">五步站好 20 秒</text>
  <rect x="153" y="54" width="452" height="40" fill="#dbeaf7" stroke="#8f8f8f"/>
  <text x="379" y="80" class="lab" text-anchor="middle">6 次慢呼吸（吸 4 秒 + 呼 6 秒）= 60 秒</text>
  <rect x="605" y="54" width="115" height="40" fill="#e3f1e6" stroke="#8f8f8f"/>
  <text x="662" y="80" class="lab2" text-anchor="middle">起势 1 秒</text>
  <line class="st" x1="40" y1="94" x2="720" y2="94"/>
  <text x="40" y="116" class="lab2">0 秒</text>
  <text x="150" y="116" class="lab2">20 秒</text>
  <text x="580" y="116" class="lab2">80 秒</text>
  <text x="712" y="116" class="lab2">81 秒</text>
  <text x="18" y="148" class="lab2">第 1–2 次呼吸：只做一件事——把肩膀放下来。呼吸浅、快都无所谓，别管它。</text>
  <text x="18" y="170" class="lab2">第 3–4 次：开始注意"呼比吸长"。此时你会发现手心的抱球开始有重量感，这是正常的。</text>
  <text x="18" y="192" class="lab2">第 5–6 次：什么都不改，只是数着做完。做完这 6 次，你就可以开始两手托天理三焦了。</text>
  <text x="18" y="214" class="lab">时间不够时的最低版本：站好之后做 3 次慢呼吸（约 30 秒）再起式，仍然算有预备势。</text>
</svg>