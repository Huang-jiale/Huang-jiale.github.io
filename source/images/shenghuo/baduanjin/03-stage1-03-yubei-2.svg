<svg viewBox="0 0 760 300" role="img" aria-label="俯视双脚位置图：与肩同宽、脚尖向前、膝尖对准第二脚趾" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="24" class="labk">从上往下看你的两只脚（这是最常歪的三个地方）</text>
  <line class="st-thin" x1="380" y1="44" x2="380" y2="278"/>
  <ellipse class="f-g1" cx="300" cy="160" rx="30" ry="70" stroke="#8f8f8f"/>
  <ellipse class="f-g1" cx="460" cy="160" rx="30" ry="70" stroke="#8f8f8f"/>
  <text x="300" y="82" class="lab2" text-anchor="middle">左脚尖</text>
  <text x="460" y="82" class="lab2" text-anchor="middle">右脚尖</text>
  <path class="arrow" d="M300 62 l0 -22 m-5 6 l5 -6 l5 6"/>
  <path class="arrow" d="M460 62 l0 -22 m-5 6 l5 -6 l5 6"/>
  <line class="st" x1="330" y1="256" x2="430" y2="256"/>
  <path class="st" d="M330 250 l0 12 M430 250 l0 12"/>
  <text x="380" y="240" class="lab2" text-anchor="middle">内侧距离约与肩同宽</text>
  <text x="380" y="276" class="lab2" text-anchor="middle">多数人 20–30 厘米</text>
  <text x="560" y="80" class="labk">✓ 三个要点</text>
  <text x="560" y="102" class="lab2">脚尖正对前方，平行</text>
  <text x="560" y="122" class="lab2">膝尖对准第二脚趾</text>
  <text x="560" y="142" class="lab2">重心铺满整个脚掌</text>
  <text x="560" y="162" class="lab2">脚心微微含空，不抓地</text>
  <text x="20" y="80" class="labk">✗ 三个偏差</text>
  <text x="20" y="102" class="lab2">外八字：膝会内扣</text>
  <text x="20" y="122" class="lab2">内八字：髋被拧住</text>
  <text x="20" y="142" class="lab2">压脚跟：腰先受力</text>
  <text x="20" y="162" class="lab2">脚趾用力抠地：小腿紧</text>
  <text x="20" y="200" class="lab2">自检：把鞋脱了站在硬地上，让人从正上方拍一张脚的照片，</text>
  <text x="20" y="220" class="lab2">和这张图对比——九成人会发现自己的脚尖是往外撇的。</text>
</svg>