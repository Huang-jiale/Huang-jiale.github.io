<svg viewBox="0 0 760 280" role="img" aria-label="式间过渡三步骤：落掌站稳呼吸再起下一式" xmlns="http://www.w3.org/2000/svg" width="760" height="280"><style> svg{display:block;width:100%;height:auto}
