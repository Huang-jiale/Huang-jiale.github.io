 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="360" height="300" class="bg-paper"/>
  <text x="14" y="22" class="labk">✗ 三个典型错法</text>
  <circle class="head" cx="176" cy="86" r="16"/>
  <line class="body-line" x1="176" y1="102" x2="182" y2="196"/>
  <line class="body-line" x1="150" y1="120" x2="212" y2="112"/>
  <path class="body-line" d="M150 120 l-14 -34 l-2 26"/>
  <path class="body-line" d="M212 112 l16 -32 l0 26"/>
  <line class="body-line" x1="182" y1="196" x2="172" y2="240"/>
