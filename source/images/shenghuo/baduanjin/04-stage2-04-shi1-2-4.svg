  <text x="14" y="150" class="lab2">① 耸肩：肩快到耳朵</text>
  <text x="14" y="172" class="lab2">② 肘弯曲，掌在额前</text>
  <text x="14" y="194" class="lab2">③ 腰向后仰代偿</text>
  <text x="252" y="120" class="lab2">肩没落</text>
