<svg viewBox="0 0 760 250" role="img" aria-label="八段锦八个动作按固定顺序排列的两行流程图" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="24" class="labk">八个动作段，顺序是固定的：从托天开始，到七颠结束</text>
  <g>
    <rect x="16" y="42" width="168" height="72" class="f-g1" stroke="#8f8f8f"/>
    <text x="24" y="60" class="lab2">①</text>
    <text x="100" y="82" class="lab" text-anchor="middle">两手托天理三焦</text>
    <text x="100" y="102" class="lab2" text-anchor="middle">双手上托，全身拔长</text>
    <rect x="202" y="42" width="168" height="72" class="f-g1" stroke="#8f8f8f"/>
    <text x="210" y="60" class="lab2">②</text>
    <text x="286" y="82" class="lab" text-anchor="middle">左右开弓似射雕</text>
    <text x="286" y="102" class="lab2" text-anchor="middle">马步，一撑一拉向左右</text>
    <rect x="388" y="42" width="168" height="72" class="f-g1" stroke="#8f8f8f"/>
    <text x="396" y="60" class="lab2">③</text>
    <text x="472" y="82" class="lab" text-anchor="middle">调理脾胃须单举</text>
    <text x="472" y="102" class="lab2" text-anchor="middle">一手托一手按，上下拉</text>
    <rect x="574" y="42" width="168" height="72" class="f-g1" stroke="#8f8f8f"/>
    <text x="582" y="60" class="lab2">④</text>
    <text x="658" y="82" class="lab" text-anchor="middle">五劳七伤往后瞧</text>
    <text x="658" y="102" class="lab2" text-anchor="middle">头颈向后转，身不转</text>
  </g>
  <path class="st" d="M184 78 l18 0 m-6 -4 l6 4 l-6 4" />
  <path class="st" d="M370 78 l18 0 m-6 -4 l6 4 l-6 4" />
  <path class="st" d="M658 114 l0 12 m-4 -6 l4 6 l4 -6" />
  <g>
    <rect x="16" y="132" width="168" height="72" class="f-g1" stroke="#8f8f8f"/>
    <text x="24" y="150" class="lab2">⑤</text>
    <text x="100" y="172" class="lab" text-anchor="middle">摇头摆尾去心火</text>
    <text x="100" y="192" class="lab2" text-anchor="middle">马步，腰胯向前左右摆</text>
    <rect x="202" y="132" width="168" height="72" class="f-g1" stroke="#8f8f8f"/>
    <text x="210" y="150" class="lab2">⑥</text>
    <text x="286" y="172" class="lab" text-anchor="middle">两手攀足固肾腰</text>
    <text x="286" y="192" class="lab2" text-anchor="middle">从髋前折，手向下找脚</text>
    <rect x="388" y="132" width="168" height="72" class="f-g1" stroke="#8f8f8f"/>
    <text x="396" y="150" class="lab2">⑦</text>
    <text x="472" y="172" class="lab" text-anchor="middle">攒拳怒目增气力</text>
    <text x="472" y="192" class="lab2" text-anchor="middle">马步出拳，同时瞪眼</text>
    <rect x="574" y="132" width="168" height="72" class="f-g1" stroke="#8f8f8f"/>
    <text x="582" y="150" class="lab2">⑧</text>
    <text x="658" y="172" class="lab" text-anchor="middle">背后七颠百病消</text>
    <text x="658" y="192" class="lab2" text-anchor="middle">提脚跟，轻轻震落</text>
  </g>
  <path class="st" d="M184 168 l18 0 m-6 -4 l6 4 l-6 4" />
  <path class="st" d="M370 168 l18 0 m-6 -4 l6 4 l-6 4" />
  <path class="st" d="M556 168 l18 0 m-6 -4 l6 4 l-6 4" />
  <text x="18" y="228" class="lab2">注意第五到第八式的顺序：摆尾 → 攀足 → 攒拳 → 七颠。背熟这八个名字，是这套课的第一道门槛。</text>
</svg>