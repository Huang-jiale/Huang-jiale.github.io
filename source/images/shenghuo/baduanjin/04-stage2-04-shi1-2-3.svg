<svg viewBox="0 0 760 290" role="img" aria-label="第一式三个手掌朝向的细节图：交叉掌、托掌、按掌" xmlns="http://www.w3.org/2000/svg" width="760" height="290"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="290" class="bg-paper"/>
  <text x="18" y="24" class="labk">手掌朝向细节：三个位置，三种掌心方向（做错这式多半错在这里）</text>
  <g>
    <path class="body-line" d="M78 138 q42 -22 84 0"/>
    <line class="body-line" x1="90" y1="132" x2="90" y2="112"/>
    <line class="body-line" x1="106" y1="126" x2="106" y2="104"/>
    <line class="body-line" x1="122" y1="124" x2="122" y2="102"/>
    <line class="body-line" x1="138" y1="126" x2="138" y2="104"/>
    <line class="body-line" x1="152" y1="132" x2="160" y2="118"/>
    <path class="arrow" d="M120 158 l0 26 m-5 -8 l5 8 l5 -8"/>
  </g>
  <text x="120" y="216" class="lab" text-anchor="middle">A 交叉掌</text>
  <text x="120" y="236" class="lab2" text-anchor="middle">掌心向上，在小腹前</text>
  <text x="120" y="256" class="lab2" text-anchor="middle">十指松松交叉</text>
  <g>
    <path class="body-line" d="M340 100 q42 22 84 0"/>
    <line class="body-line" x1="352" y1="106" x2="352" y2="128"/>
    <line class="body-line" x1="368" y1="112" x2="368" y2="136"/>
    <line class="body-line" x1="384" y1="114" x2="384" y2="138"/>
    <line class="body-line" x1="400" y1="112" x2="400" y2="136"/>
    <line class="body-line" x1="414" y1="106" x2="422" y2="92"/>
    <path class="arrow" d="M382 78 l0 -26 m-5 6 l5 -6 l5 6"/>
  </g>
  <text x="382" y="216" class="lab" text-anchor="middle">B 托掌（到位）</text>
  <text x="382" y="236" class="lab2" text-anchor="middle">掌心朝天，掌根上顶</text>
  <text x="382" y="256" class="lab2" text-anchor="middle">掌指斜向后上方</text>
  <g>
    <path class="body-line" d="M580 132 q42 22 84 0"/>
    <line class="body-line" x1="592" y1="138" x2="592" y2="160"/>
    <line class="body-line" x1="608" y1="144" x2="608" y2="168"/>
    <line class="body-line" x1="624" y1="146" x2="624" y2="170"/>
    <line class="body-line" x1="640" y1="144" x2="640" y2="168"/>
    <line class="body-line" x1="654" y1="138" x2="662" y2="124"/>
    <path class="arrow" d="M622 108 l0 -26 m-5 6 l5 -6 l5 6"/>
    <text x="622" y="92" class="lab2" text-anchor="middle">下落时掌心转下</text>
  </g>
  <text x="622" y="216" class="lab" text-anchor="middle">C 按掌（下落）</text>
  <text x="622" y="236" class="lab2" text-anchor="middle">掌心向下，缓缓按落</text>
  <text x="622" y="256" class="lab2" text-anchor="middle">指尖最后落地</text>
  <text x="18" y="284" class="lab2">A→B 的转换只发生在手腕：手指不重新交叉，靠翻掌完成。B→C 是松开的瞬间，掌心自然转向下。</text>
</svg>