<svg viewBox="0 0 760 320" role="img" aria-label="五劳七伤往后瞧俯视图：肩线不动只转头" xmlns="http://www.w3.org/2000/svg" width="760" height="320"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
<rect class="bg-paper" width="760" height="320"/>
<text x="18" y="26" class="labk">五劳七伤往后瞧：俯视（头顶往脚下看）</text>
<line class="st" x1="240" y1="160" x2="420" y2="160"/>
<path class="st-thin" d="M262 198 Q330 224 398 198"/>
<circle class="head" cx="330" cy="160" r="18"/>
<line class="st-thin" x1="330" y1="142" x2="330" y2="96"/>
<line class="st" x1="343" y1="173" x2="371" y2="201"/>
<path class="arrow" d="M336 92 A70 70 0 0 1 374 196 m-10 -2 l10 2 l-3 10"/>
<text x="344" y="96" class="lab2">面朝原方向</text>
<text x="386" y="214" class="lab2">头转看身后</text>
<text x="250" y="240" class="lab2">两肩连线：纹丝不动</text>
<text x="470" y="80" class="labk">要领与错法</text>
<text x="470" y="108" class="lab2">脚跟为锚，视线往</text>
<text x="470" y="132" class="lab2">后够到脚后跟；</text>
<text x="470" y="156" class="lab2">极限处停 1 到 2 秒，</text>
<text x="470" y="180" class="lab2">不额外憋气。</text>
<text x="470" y="212" class="lab2">常见错：肩跟着转、</text>
<text x="470" y="236" class="lab2">脚跟离地，转身</text>
<text x="470" y="260" class="lab2">代替了转头。</text>
<text x="18" y="300" class="lab2">检验：请人从背后看，转头全程两肩端点不前后移动；拉伸感应在后颈两侧，不在腰</text>
</svg>