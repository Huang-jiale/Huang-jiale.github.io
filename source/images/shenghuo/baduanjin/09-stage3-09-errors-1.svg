<text x="430" y="82" class="lab2">① 头颈：下巴不前探，转头不转身</text>
<text x="430" y="116" class="lab2">② 肩：肩胛松着下沉，不端着</text>
<text x="430" y="150" class="lab2">③ 肘腕：肘有坠意，腕松不僵</text>
<text x="430" y="184" class="lab2">④ 胸背：胸口微含，不挺不凹</text>
<text x="430" y="218" class="lab2">⑤ 腰：不塌不撅，保持立身中正</text>
<text x="430" y="252" class="lab2">⑥ 胯膝：膝尖对着第二脚趾</text>
<text x="430" y="286" class="lab2">⑦ 小腿脚掌：脚趾抓地，跟不先离</text>
<text x="36" y="314" class="lab2">扫描顺序本身就是方法：一次只看一处</text>
</svg>