<text x="44" y="156" class="lab">吸</text>
<text x="250" y="60" class="lab2">扶椅背缓提脚跟</text>
<text x="250" y="84" class="lab2">提踵吸落踵呼</text>
<text x="250" y="108" class="lab2">落踵轻颤不砸地</text>
<text x="250" y="132" class="lab2">7 次可减为 4 次</text>
