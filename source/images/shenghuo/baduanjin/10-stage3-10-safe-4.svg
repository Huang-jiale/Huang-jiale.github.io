 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
<rect class="bg-paper" width="360" height="280"/>
<text x="14" y="22" class="labk">背后七颠百病消：扶稳版</text>
<circle class="head" cx="120" cy="90" r="13"/>
<line class="body-line" x1="120" y1="103" x2="120" y2="170"/>
<path class="body-line" d="M120 125 l85 -7"/>
<line class="body-line" x1="120" y1="170" x2="114" y2="205"/>
<line class="body-line" x1="114" y1="205" x2="112" y2="230"/>
