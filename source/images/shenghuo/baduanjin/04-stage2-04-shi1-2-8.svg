<svg viewBox="0 0 760 250" role="img" aria-label="第二式两个手型放大图：八字掌撑掌与勾手，标出拇指张开与勾尖向下" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="24" class="labk">两个手型放大：撑掌（八字掌）与勾手——手型错了，这一式就白做</text>
  <g>
    <path class="body-line" d="M110 150 q-16 -30 0 -58 q16 -26 44 -22"/>
    <line class="body-line" x1="154" y1="70" x2="154" y2="30"/>
    <line class="body-line" x1="140" y1="68" x2="136" y2="26"/>
    <line class="body-line" x1="126" y1="70" x2="118" y2="32"/>
    <line class="body-line" x1="112" y1="76" x2="100" y2="46"/>
    <line class="body-line" x1="150" y1="104" x2="188" y2="86"/>
    <circle class="joint" cx="152" cy="146" r="5"/>
    <path class="arrow" d="M200 120 l34 0 m-8 -5 l8 5 l-8 5"/>
  </g>
  <text x="200" y="140" class="lab2">掌根向前顶</text>
  <text x="140" y="192" class="lab" text-anchor="middle">撑掌 = 八字掌</text>
  <text x="140" y="212" class="lab2" text-anchor="middle">四指并拢、拇指张开</text>
  <text x="140" y="232" class="lab2" text-anchor="middle">掌指向上、腕立起</text>
  <g>
    <line class="body-line" x1="500" y1="84" x2="500" y2="120"/>
    <path class="body-line" d="M482 94 q-12 24 2 44"/>
    <path class="body-line" d="M518 94 q12 24 -2 44"/>
    <line class="body-line" x1="488" y1="138" x2="486" y2="158"/>
    <line class="body-line" x1="500" y1="140" x2="500" y2="162"/>
    <line class="body-line" x1="512" y1="138" x2="514" y2="158"/>
    <path class="st-bad" d="M480 154 q8 18 20 20 q12 -2 20 -20"/>
    <line class="body-line" x1="518" y1="110" x2="540" y2="100"/>
    <circle class="joint" cx="500" cy="180" r="5"/>
    <path class="arrow" d="M520 170 l22 8 m-11 0 l11 0 l-7 8"/>
  </g>
  <text x="576" y="180" class="lab2">屈拢成勾，勾尖向下</text>
  <text x="500" y="212" class="lab" text-anchor="middle">勾手</text>
  <text x="500" y="232" class="lab2" text-anchor="middle">第一指间关节屈拢</text>
  <text x="268" y="192" class="lab2">✗ 错：撑掌塌腕，掌指斜后</text>
  <text x="268" y="212" class="lab2">✗ 错：勾手攥拳，腕上翘</text>
  <text x="268" y="232" class="lab2">✓ 立腕、勾尖向下，靠腕</text>
  <text x="280" y="88" class="lab2">撑掌侧的劲：向侧前顶</text>
  <text x="280" y="112" class="lab2">勾手侧的劲：向侧后拉</text>
  <text x="280" y="136" class="lab2">两股劲在脊背相遇</text>
</svg>