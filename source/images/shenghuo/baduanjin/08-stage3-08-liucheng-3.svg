<svg viewBox="0 0 760 260" role="img" aria-label="匀速呼吸曲线与忽快忽慢憋气曲线的对比" xmlns="http://www.w3.org/2000/svg" width="760" height="260"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
<rect class="bg-paper" width="760" height="260"/>
<text x="18" y="26" class="labk">把呼吸画成一条线：匀与抢</text>
<line x1="18" y1="98" x2="742" y2="98" class="st-thin"/>
<path d="M40,98 Q70,66 100,98 T160,98 T220,98 T280,98 T340,98 T400,98 T460,98 T520,98 T580,98 T640,98 T700,98" class="arrow"/>
<text x="56" y="60" class="lab2">吸</text>
<text x="116" y="124" class="lab2">呼</text>
<text x="236" y="60" class="lab2">吸</text>
<text x="296" y="124" class="lab2">呼</text>
<text x="476" y="60" class="lab2">吸</text>
<text x="536" y="124" class="lab2">呼</text>
<text x="18" y="150" class="lab">上：每遍约 12 秒，一吸一呼各占一半，波形等宽等高</text>
<line x1="18" y1="196" x2="742" y2="196" class="st-thin"/>
<path d="M40,196 Q58,168 76,196 L112,196 Q150,224 188,196 Q204,172 220,196 Q240,166 260,196 L300,196 Q340,226 380,196 Q400,170 420,196 T480,196 Q520,228 560,196 L600,196 Q640,164 680,196" class="arrow-r"/>
<text x="86" y="176" class="lab2">吸太快</text>
<text x="262" y="246" class="lab2">中途憋住（一段直线）</text>
<text x="486" y="176" class="lab2">呼气拖太长</text>
<text x="606" y="176" class="lab2">又抢一口</text>
</svg>