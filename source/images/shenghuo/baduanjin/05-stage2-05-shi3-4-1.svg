<svg viewBox="0 0 760 376" role="img" aria-label="第三式起势两帧：两手在腹前准备、一手开始上托一手下按" xmlns="http://www.w3.org/2000/svg" width="760" height="376"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
  <rect width="760" height="376" class="bg-paper"/>
  <text x="18" y="24" class="labk">第三式起势：先叠掌腹前，再一手托一手按</text>
  <g>
    <circle class="head" cx="160" cy="80" r="15"/>
    <line class="body-line" x1="160" y1="96" x2="160" y2="196"/>
    <line class="body-line" x1="132" y1="116" x2="188" y2="116"/>
    <path class="body-line" d="M132 116 l-8 34 q14 18 30 16"/>
    <path class="body-line" d="M188 116 l8 34 q-14 18 -30 16"/>
    <ellipse class="f-g2" cx="160" cy="170" rx="14" ry="7" stroke="#1c1c1c"/>
    <circle class="joint" cx="160" cy="170" r="5"/>
    <line class="body-line" x1="160" y1="196" x2="152" y2="238"/>
    <line class="body-line" x1="152" y1="238" x2="150" y2="270"/>
    <line class="body-line" x1="160" y1="196" x2="168" y2="238"/>
    <line class="body-line" x1="168" y1="238" x2="170" y2="270"/>
    <line class="body-line" x1="138" y1="273" x2="156" y2="273"/>
    <line class="body-line" x1="164" y1="273" x2="182" y2="273"/>
  </g>
  <text x="160" y="304" class="lab" text-anchor="middle">第 1 帧：腹前准备</text>
  <g>
    <circle class="head" cx="400" cy="80" r="15"/>
    <line class="body-line" x1="400" y1="96" x2="400" y2="196"/>
    <line class="body-line" x1="372" y1="116" x2="428" y2="116"/>
    <path class="body-line" d="M372 116 l-10 32 l-6 24"/>
    <path class="body-line" d="M428 116 l10 -22 l2 -22"/>
    <circle class="joint" cx="356" cy="176" r="5"/>
    <circle class="joint" cx="440" cy="70" r="5"/>
    <line class="body-line" x1="400" y1="196" x2="392" y2="238"/>
    <line class="body-line" x1="392" y1="238" x2="390" y2="270"/>
    <line class="body-line" x1="400" y1="196" x2="408" y2="238"/>
    <line class="body-line" x1="408" y1="238" x2="410" y2="270"/>
    <line class="body-line" x1="378" y1="273" x2="396" y2="273"/>
    <line class="body-line" x1="404" y1="273" x2="422" y2="273"/>
    <path class="arrow" d="M452 62 l0 -26 m-5 6 l5 -6 l5 6"/>
    <path class="arrow" d="M346 186 l0 26 m-5 -6 l5 6 l5 -6"/>
  </g>
  <text x="400" y="304" class="lab" text-anchor="middle">第 2 帧：一托一按开始分</text>
  <path class="arrow" d="M222 170 l54 0 m-8 -5 l8 5 l-8 5"/>
  <text x="530" y="72" class="labk">四句动作口令</text>
  <text x="530" y="96" class="lab2">① 两手在腹前分手（吸气）</text>
  <text x="530" y="118" class="lab2">② 一手经面前向上托</text>
  <text x="530" y="140" class="lab2">③ 另一手同时向下按</text>
  <text x="530" y="162" class="lab2">④ 上下分到底，定势 1–3 秒</text>
  <text x="530" y="200" class="labk">换边的方法</text>
  <text x="530" y="224" class="lab2">两臂屈肘收回腹前，两手在</text>
  <text x="530" y="246" class="lab2">腹前一上一下"错掌"交接，</text>
  <text x="530" y="268" class="lab2">再托起另一侧（呼气）。</text>
  <text x="18" y="326" class="lab2">两个红点是本式的"高度标尺"：下面的红点是下按手的最终位置（胯旁），</text>
  <text x="18" y="348" class="lab2">上面的红点是上托手的最终位置（头侧上方）。两点之间的距离，就是你身体被拉长的长度。</text>
</svg>