<svg viewBox="0 0 760 320" role="img" aria-label="冲拳到位时拳心朝向的两种版本对比" xmlns="http://www.w3.org/2000/svg" width="760" height="320"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}
 .body-line{fill:none;stroke:#1c1c1c;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
 .joint{fill:#c0392b}
.head{fill:#fff;stroke:#1c1c1c;stroke-width:2}
 .arrow{fill:none;stroke:#0f6ab5;stroke-width:1.6}
 .arrow-r{fill:none;stroke:#c0392b;stroke-width:1.6}</style>
<rect class="bg-paper" width="760" height="320"/>
<text x="18" y="26" class="labk">冲拳到位时，拳心朝哪儿？两种版本都对</text>
<line x1="120" y1="184" x2="204" y2="158" class="body-line"/>
<rect x="204" y="134" width="46" height="34" rx="9" fill="#fff" stroke="#1c1c1c" stroke-width="2"/>
<circle cx="248" cy="142" r="3" fill="#1c1c1c"/>
<circle cx="250" cy="152" r="3" fill="#1c1c1c"/>
<circle cx="248" cy="162" r="3" fill="#1c1c1c"/>
<path d="M214,134 L226,128" class="st"/>
<text x="150" y="120" class="lab2">拳眼朝上：拇指侧在上方</text>
<text x="110" y="236" class="lab">版本甲：立拳</text>
<line x1="420" y1="184" x2="504" y2="158" class="body-line"/>
<rect x="504" y="134" width="46" height="34" rx="9" fill="#fff" stroke="#1c1c1c" stroke-width="2"/>
<circle cx="514" cy="166" r="3" fill="#1c1c1c"/>
<circle cx="526" cy="168" r="3" fill="#1c1c1c"/>
<circle cx="538" cy="166" r="3" fill="#1c1c1c"/>
<path d="M510,152 L522,160" class="st"/>
<text x="450" y="120" class="lab2">拳心朝下：指节排在下方</text>
<text x="410" y="236" class="lab">版本乙：俯拳</text>
<path d="M258,146 A22 22 0 0 1 262,170" class="arrow"/>
<polyline points="256,164 262,170 253,173" class="arrow"/>
<text x="280" y="176" class="lab2">前臂慢慢旋</text>
<path d="M558,146 A22 22 0 0 1 562,170" class="arrow"/>
<polyline points="556,164 562,170 553,173" class="arrow"/>
<text x="580" y="176" class="lab2">收拳时旋回来</text>
<text x="18" y="272" class="lab">共同三点：出拳慢、肩不耸、最后才握紧</text>
<text x="18" y="300" class="lab2">手腕一直不舒服就停手：改成站姿慢推掌两周，请先咨询医生再决定是否继续冲拳</text>
</svg>