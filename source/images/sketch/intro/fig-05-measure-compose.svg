<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200"><title>测量与构图辅助示意</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.lab{font-size:13px;fill:#333}.lab2{font-size:11.5px;fill:#777}.stroke{fill:none;stroke:#1a1a1a;stroke-width:1.4}.thin{fill:none;stroke:#888;stroke-width:.9;stroke-dasharray:4 3}.fill-g{fill:#cfcfcf}</style><rect width="100%" height="100%" fill="#fff"/>
  <text x="16" y="24" class="lab">① 铅笔测量法：手臂伸直，用拇指在笔杆上滑到被量物的高度，再搬到纸上比对</text>
  <g>
    <rect x="28" y="58" width="46" height="106" class="fill-g" stroke="#333" stroke-width="1.2"/>
    <ellipse cx="51" cy="58" rx="23" ry="7" fill="#eaeaea" stroke="#333" stroke-width="1.2"/>
    <line x1="120" y1="40" x2="235" y2="175" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
    <line x1="120" y1="40" x2="132" y2="30" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
    <path d="M150 96 q-14 -6 -8 12 q8 -4 8 -12" fill="none" stroke="#333" stroke-width="1.2"/>
    <line x1="120" y1="58" x2="235" y2="58" class="thin"/>
    <line x1="120" y1="164" x2="235" y2="164" class="thin"/>
    <text x="248" y="118" class="lab2">物体高 = 笔上这段长度</text>
    <text x="248" y="140" class="lab2">再量宽：宽 ≈ 高的 0.7 → 比例就出来了</text>
  </g>
  <text x="410" y="24" class="lab">② 九宫格定位：起形时轻轻分三栏，标出左右上下限</text>
  <g>
    <rect x="470" y="42" width="220" height="140" class="stroke"/>
    <line x1="543" y1="42" x2="543" y2="182" class="thin"/>
    <line x1="616" y1="42" x2="616" y2="182" class="thin"/>
    <line x1="470" y1="89" x2="690" y2="89" class="thin"/>
    <line x1="470" y1="135" x2="690" y2="135" class="thin"/>
    <ellipse cx="580" cy="120" rx="66" ry="52" class="stroke" stroke-width="1.6"/>
    <text x="474" y="200" class="lab2">主体偏中上，四周留「呼吸」；下边留出投影位置</text>
  </g>
</svg>
