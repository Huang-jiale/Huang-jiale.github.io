<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180"><title>圆柱与圆锥的椭圆示意</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.lab{font-size:13px;fill:#333}.lab2{font-size:11.5px;fill:#777}.stroke{fill:none;stroke:#1a1a1a;stroke-width:1.4}.thin{fill:none;stroke:#888;stroke-width:.9;stroke-dasharray:4 3}.fill-g{fill:#cfcfcf}</style><rect width="100%" height="100%" fill="#fff"/>
  <text x="30" y="24" class="lab">圆柱：顶椭开口向上，底椭下方露出、上方被挡</text>
  <g>
    <ellipse cx="90" cy="58" rx="46" ry="14" class="stroke" stroke-width="1.6"/>
    <line x1="44" y1="58" x2="44" y2="140" class="stroke" stroke-width="1.6"/>
    <line x1="136" y1="58" x2="136" y2="140" class="stroke" stroke-width="1.6"/>
    <path d="M44 140 A46 14 0 0 0 136 140" class="stroke" stroke-width="1.6"/>
    <path d="M44 140 A46 14 0 0 1 136 140" class="thin"/>
    <path d="M118 66 q14 40 -4 68 q-20 10 -30 -6 q10 12 24 4" fill="#c9c9c9" stroke="none"/>
    <text x="30" y="170" class="lab2">暗部在右侧（光从左上来）；被挡的半段只画辅助虚线</text>
  </g>
  <text x="400" y="24" class="lab">正方体＋圆柱组合：用「外接 / 内切」关系找比例</text>
  <g>
    <path d="M430 70 L500 50 L570 72 L500 92 Z" class="stroke" stroke-width="1.6"/>
    <path d="M430 70 L430 150 L500 172 L500 92" class="stroke" stroke-width="1.6"/>
    <path d="M570 72 L570 150 L500 172" class="stroke" stroke-width="1.6"/>
    <ellipse cx="660" cy="80" rx="40" ry="12" class="stroke" stroke-width="1.6"/>
    <line x1="620" y1="80" x2="620" y2="160" class="stroke" stroke-width="1.6"/>
    <line x1="700" y1="80" x2="700" y2="160" class="stroke" stroke-width="1.6"/>
    <path d="M620 160 A40 12 0 0 0 700 160" class="stroke" stroke-width="1.6"/>
    <path d="M620 160 A40 12 0 0 1 700 160" class="thin"/>
    <line x1="596" y1="80" x2="596" y2="160" class="thin"/>
    <line x1="724" y1="80" x2="724" y2="160" class="thin"/>
    <text x="596" y="176" class="lab2">圆柱高 = 方体高</text>
  </g>
</svg>
