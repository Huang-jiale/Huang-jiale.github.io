<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250"><title>一点透视与两点透视示意</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.lab{font-size:13px;fill:#333}.lab2{font-size:11.5px;fill:#777}.stroke{fill:none;stroke:#1a1a1a;stroke-width:1.4}.thin{fill:none;stroke:#888;stroke-width:.9;stroke-dasharray:4 3}.fill-g{fill:#cfcfcf}</style><rect width="100%" height="100%" fill="#fff"/>
  <text x="16" y="22" class="lab">一点透视（平行透视）：正对着你，只有一组线跑到消失点</text>
  <g>
    <line x1="20" y1="180" x2="330" y2="180" class="thin"/>
    <circle cx="290" cy="120" r="3.5" fill="#c0392b"/>
    <text x="300" y="115" class="lab2" fill="#c0392b">消失点 VP</text>
    <line x1="140" y1="120" x2="290" y2="120" stroke="#888" stroke-width=".9" stroke-dasharray="3 3"/>
    <line x1="140" y1="200" x2="290" y2="120" stroke="#888" stroke-width=".9" stroke-dasharray="3 3"/>
    <rect x="60" y="120" width="80" height="80" class="stroke" stroke-width="1.6"/>
    <path d="M140 120 L185 90 L185 170 L140 200" class="stroke" stroke-width="1.6"/>
    <path d="M60 120 L105 90 L185 90" class="stroke" stroke-width="1.6"/>
    <path d="M60 200 L105 172 L185 170" class="stroke" stroke-width="1.6"/>
    <text x="62" y="230" class="lab2">正面保持水平/垂直，进深的三条边全部朝 VP 收</text>
  </g>
  <text x="400" y="22" class="lab">两点透视（成角透视）：左右两组线各去一个消失点</text>
  <g>
    <line x1="380" y1="150" x2="750" y2="150" class="thin"/>
    <circle cx="398" cy="150" r="3.5" fill="#c0392b"/>
    <circle cx="740" cy="150" r="3.5" fill="#c0392b"/>
    <path d="M560 90 L470 118 L470 196 L560 220 L640 190 L640 116 Z" class="stroke" stroke-width="1.6"/>
    <line x1="560" y1="90" x2="560" y2="220" class="stroke"/>
    <line x1="470" y1="118" x2="398" y2="150" stroke="#888" stroke-width=".8" stroke-dasharray="3 3"/>
    <line x1="470" y1="196" x2="398" y2="150" stroke="#888" stroke-width=".8" stroke-dasharray="3 3"/>
    <line x1="640" y1="116" x2="740" y2="150" stroke="#888" stroke-width=".8" stroke-dasharray="3 3"/>
    <line x1="640" y1="190" x2="740" y2="150" stroke="#888" stroke-width=".8" stroke-dasharray="3 3"/>
    <text x="452" y="238" class="lab2">竖线永远垂直；两组横线各自往左右收</text>
  </g>
</svg>
