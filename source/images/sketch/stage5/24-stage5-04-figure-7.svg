<svg viewBox="0 0 760 300" role="img" aria-label="三种常见比例错误对照" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="24" class="labk">三种"一眼假"：症状 → 原因 → 改法</text>
  <line x1="185" y1="50" x2="185" y2="150" class="st-thin"/>
  <line x1="370" y1="50" x2="370" y2="150" class="st-thin"/>
  <line x1="555" y1="50" x2="555" y2="150" class="st-thin"/>
  <circle cx="95" cy="76" r="20" class="st-bad"/>
  <line x1="95" y1="96" x2="95" y2="104" class="st"/>
  <line x1="72" y1="104" x2="118" y2="104" class="st"/>
  <line x1="95" y1="104" x2="95" y2="124" class="st"/>
  <line x1="84" y1="124" x2="106" y2="124" class="st"/>
  <path d="M72 104 L68 122 L66 130" class="st"/>
  <path d="M118 104 L122 122 L124 130" class="st"/>
  <path d="M88 124 L84 154" class="st"/>
  <path d="M102 124 L106 154" class="st"/>
  <line x1="56" y1="56" x2="134" y2="56" class="st-thin"/>
  <line x1="56" y1="154" x2="134" y2="154" class="st-thin"/>
  <text x="95" y="180" class="labk" text-anchor="middle">✗ 头太大</text>
  <text x="95" y="200" class="lab2" text-anchor="middle">全身只有 5 格</text>
  <text x="95" y="218" class="lab2" text-anchor="middle">原因：先画头再"长"身体</text>
  <text x="95" y="236" class="lab2" text-anchor="middle">改：先切 8 格再放头</text>
  <circle cx="275" cy="63" r="9" class="st"/>
  <line x1="266" y1="78" x2="284" y2="78" class="st-bad"/>
  <line x1="275" y1="78" x2="275" y2="112" class="st"/>
  <line x1="268" y1="112" x2="284" y2="112" class="st"/>
  <path d="M266 78 L260 96 L258 114" class="st"/>
  <path d="M284 78 L290 96 L292 114" class="st"/>
  <path d="M270 112 L268 134 L267 154" class="st"/>
  <path d="M281 112 L283 134 L284 154" class="st"/>
  <text x="275" y="180" class="labk" text-anchor="middle">✗ 肩太窄</text>
  <text x="275" y="200" class="lab2" text-anchor="middle">肩宽只有 0.8 格</text>
  <text x="275" y="218" class="lab2" text-anchor="middle">原因：怕画成壮汉</text>
  <text x="275" y="236" class="lab2" text-anchor="middle">改：肩端＝2 头，先卡这条</text>
  <circle cx="465" cy="63" r="9" class="st"/>
  <line x1="447" y1="78" x2="483" y2="78" class="st"/>
  <line x1="465" y1="78" x2="465" y2="96" class="st"/>
  <line x1="454" y1="96" x2="476" y2="96" class="st-red"/>
  <text x="480" y="93" class="lab2">你把一半画在这</text>
  <path d="M447 78 L441 92 L439 100" class="st"/>
  <path d="M483 78 L489 92 L491 100" class="st"/>
  <path d="M458 96 L456 126 L455 154" class="st"/>
  <path d="M472 96 L474 126 L475 154" class="st"/>
  <line x1="430" y1="105" x2="502" y2="105" class="st-ok"/>
  <text x="465" y="180" class="labk" text-anchor="middle">✗ 腿太短</text>
  <text x="465" y="200" class="lab2" text-anchor="middle">半身处画到了腰</text>
  <text x="465" y="218" class="lab2" text-anchor="middle">原因：把腰当身体的中点</text>
  <text x="465" y="236" class="lab2" text-anchor="middle">改：绿线才是中点（3.75 格）</text>
  <circle cx="645" cy="63" r="9" class="st"/>
  <line x1="627" y1="78" x2="663" y2="78" class="st-ok"/>
  <line x1="645" y1="78" x2="643" y2="105" class="st"/>
  <line x1="632" y1="105" x2="658" y2="102" class="st-ok"/>
  <path d="M627 78 L620 92 L618 106" class="st"/>
  <path d="M663 78 L669 92 L670 104" class="st"/>
  <path d="M636 104 L634 130 L632 154" class="st"/>
  <path d="M655 103 L657 130 L658 154" class="st"/>
  <line x1="610" y1="130" x2="680" y2="130" class="st-thin"/>
  <text x="645" y="180" class="labk" text-anchor="middle">✓ 三块都不平行</text>
  <text x="645" y="200" class="lab2" text-anchor="middle">肩线、髋线反向倾</text>
  <text x="639" y="218" class="lab2" text-anchor="middle">一半在耻骨，膝在中点</text>
  <text x="645" y="236" class="lab2" text-anchor="middle">人就站住了</text>
</svg>