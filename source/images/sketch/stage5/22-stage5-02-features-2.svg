<svg viewBox="0 0 760 280" role="img" aria-label="眉毛的三段走向与三点定位法" xmlns="http://www.w3.org/2000/svg" width="760" height="280"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="280" class="bg-paper"/>
  <text x="18" y="24" class="labk">三点定位：从鼻翼拉三条线，眉的三个点就落在这三条线上</text>
  <circle cx="150" cy="120" r="66" class="st"/>
  <path d="M100 176 L96 214 Q150 232 204 214 L204 172" class="st"/>
  <path d="M104 106 q22 -10 44 -2" class="st"/>
  <path d="M156 104 q22 -8 44 4" class="st"/>
  <path d="M136 122 q14 -8 28 0 q-14 7 -28 0" class="st"/>
  <path d="M172 122 q14 -8 28 0 q-14 7 -28 0" class="st"/>
  <path d="M150 128 L144 158 q8 6 16 0" class="st"/>
  <circle cx="144" cy="158" r="3" class="dot"/>
  <line x1="144" y1="158" x2="104" y2="100" class="st-red"/>
  <line x1="144" y1="158" x2="178" y2="96" class="st-red"/>
  <line x1="144" y1="158" x2="206" y2="106" class="st-red"/>
  <text x="40" y="72" class="lab2">眉头：鼻翼—内眼角延长线</text>
  <text x="228" y="76" class="lab2">眉峰：鼻翼—瞳孔外缘延长线</text>
  <text x="228" y="130" class="lab2">眉尾：鼻翼—外眼角延长线，且不低于眉头</text>
  <text x="400" y="60" class="lab">眉的三段（放大看）</text>
  <path d="M400 110 q30 -22 70 -14 q34 8 60 26" class="st"/>
  <path d="M400 110 q34 -8 68 -2 q28 6 62 26" class="st-thin"/>
  <path d="M404 104 l6 -10 M416 100 l6 -11 M428 98 l6 -11 M440 98 l5 -11" class="st-thin"/>
  <path d="M470 96 l5 -12 M484 98 l4 -12 M498 102 l3 -12" class="st"/>
  <path d="M520 108 l3 -10 M532 112 l2 -9 M544 116 l2 -8" class="st-thin"/>
  <text x="398" y="146" class="lab2">① 眉头：毛朝上、稀、边缘虚</text>
  <text x="398" y="166" class="lab2">② 眉腰：最厚最实、颜色最重</text>
  <text x="398" y="186" class="lab2">③ 眉尾：毛朝下、收细、又变虚</text>
  <text x="398" y="222" class="labk">眉下缘不是实线！</text>
  <text x="398" y="242" class="lab2">它是"毛长到哪里"的错觉。用硬边描一圈，</text>
  <text x="398" y="260" class="lab2">眉就变成贴纸，脸立刻显假。</text>
</svg>