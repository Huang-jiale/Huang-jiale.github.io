<svg viewBox="0 0 760 300" role="img" aria-label="手的尺寸与脸长的关系" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="24" class="labk">手有多大：手长＝脸长，掌与指一比一</text>
  <path d="M145 250 L235 250 L245 152 L135 152 Z" class="st"/>
  <rect x="136" y="60" width="26" height="94" rx="10" class="st"/>
  <rect x="163" y="52" width="26" height="102" rx="10" class="st"/>
  <rect x="190" y="62" width="26" height="92" rx="10" class="st"/>
  <rect x="216" y="88" width="24" height="66" rx="10" class="st"/>
  <line x1="136" y1="82" x2="162" y2="82" class="st-thin"/>
  <line x1="136" y1="112" x2="162" y2="112" class="st-thin"/>
  <line x1="163" y1="76" x2="189" y2="76" class="st-thin"/>
  <line x1="163" y1="108" x2="189" y2="108" class="st-thin"/>
  <line x1="190" y1="84" x2="216" y2="84" class="st-thin"/>
  <line x1="190" y1="114" x2="216" y2="114" class="st-thin"/>
  <line x1="216" y1="106" x2="240" y2="106" class="st-thin"/>
  <line x1="216" y1="130" x2="240" y2="130" class="st-thin"/>
  <path d="M136 148 Q188 136 240 160" class="st-red"/>
  <rect x="125" y="180" width="18" height="40" rx="8" class="st" transform="rotate(-35 134 200)"/>
  <rect x="100" y="158" width="16" height="34" rx="7" class="st" transform="rotate(-35 108 175)"/>
  <path d="M150 250 L150 286 M230 250 L230 286" class="st"/>
  <line x1="270" y1="52" x2="270" y2="250" class="st-red"/>
  <path d="M264 52 L276 52 M264 250 L276 250" class="st-red"/>
  <text x="280" y="155" class="lab2">手长</text>
  <rect x="316" y="52" width="76" height="198" rx="30" class="st"/>
  <text x="354" y="272" class="lab2" text-anchor="middle">脸：发际到下巴</text>
  <line x1="404" y1="52" x2="404" y2="250" class="st-red"/>
  <path d="M398 52 L410 52 M398 250 L410 250" class="st-red"/>
  <text x="414" y="155" class="lab2">脸长</text>
  <text x="450" y="72" class="labk">四条必背尺寸</text>
  <text x="450" y="100" class="lab2">① 手长＝脸长（发际到下巴）</text>
  <text x="450" y="122" class="lab2">② 掌长＝中指长，一比一</text>
  <text x="450" y="144" class="lab2">③ 掌宽≈脸宽，约为手长一半</text>
  <text x="450" y="166" class="lab2">④ 中指最长，小指最短</text>
  <text x="450" y="200" class="labk">指节三段</text>
  <text x="450" y="228" class="lab2">近节 1 ∶ 中节 0.7 ∶ 末节 0.55</text>
  <text x="450" y="250" class="lab2">所以指节线是斜的、拱的</text>
  <text x="450" y="278" class="lab2">红拱线＝指根连线，别画成水平</text>
</svg>