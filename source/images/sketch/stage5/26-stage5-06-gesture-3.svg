  <text x="100" y="312" class="labk" text-anchor="middle">① 30 秒</text>
  <text x="100" y="330" class="lab2" text-anchor="middle">一线＋三块＋垂线</text>
  <text x="280" y="312" class="labk" text-anchor="middle">② 2 分钟</text>
  <text x="280" y="330" class="lab2" text-anchor="middle">加刻度、四肢、大三角</text>
  <text x="452" y="312" class="labk" text-anchor="middle">③ 10 分钟</text>
  <text x="452" y="330" class="lab2" text-anchor="middle">加轮廓、手脚、衣纹、一组暗部</text>
  <text x="560" y="72" class="labk">三档的共同点</text>
  <text x="560" y="98" class="lab2">第一笔都是红线，</text>
  <text x="560" y="120" class="lab2">顺序永远不许多。</text>
  <text x="560" y="158" class="labk">30 秒档不许做</text>
  <text x="560" y="184" class="lab2">不许画脸、画手指、</text>
  <text x="560" y="206" class="lab2">画衣纹、上调子。</text>
