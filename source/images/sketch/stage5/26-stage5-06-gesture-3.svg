<svg viewBox="0 0 760 340" role="img" aria-label="同一个姿势在 30 秒、2 分钟、10 分钟三档里的样子" xmlns="http://www.w3.org/2000/svg" width="760" height="340"><style> svg{display:block;width:100%;height:auto}
