<svg viewBox="0 0 760 300" role="img" aria-label="同一颗头在零度、三十度、四分之三、正侧四种朝向下的十字线" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="24" class="labk">同一个模型四种朝向：看中线位移与眼睛宽度递减</text>

  <circle cx="100" cy="112" r="42" class="st"/>
  <line x1="100" y1="70" x2="100" y2="154" class="st-blue"/>
  <path d="M58 112 q42 8 84 0" class="st-red"/>
  <path d="M76 142 L75 174 Q100 186 125 174 L124 142" class="st"/>
  <text x="58" y="200" class="lab">0° 正面</text>
  <text x="58" y="218" class="lab2">中线居中，两眼等宽</text>

  <circle cx="280" cy="112" r="42" class="st"/>
  <path d="M262 72 Q258 112 264 152" class="st-blue"/>
  <path d="M238 110 q42 10 84 -2" class="st-red"/>
  <path d="M242 140 L242 172 Q272 186 310 170 L310 142" class="st"/>
  <circle cx="313" cy="120" r="4" class="dot"/>
  <text x="236" y="200" class="lab">30°</text>
  <text x="236" y="218" class="lab2">中线偏左，远侧眼略窄</text>

  <circle cx="460" cy="112" r="42" class="st"/>
  <path d="M434 78 Q428 112 436 148" class="st-blue"/>
  <path d="M419 108 q42 12 82 -6" class="st-red"/>
  <path d="M424 134 L424 168 Q450 182 490 164 L492 138" class="st"/>
  <path d="M436 106 l-7 13 q7 5 14 0" class="st"/>
  <circle cx="498" cy="118" r="4" class="dot"/>
  <text x="412" y="200" class="lab">四分之三（约 60°）</text>
  <text x="412" y="218" class="lab2">中线接近轮廓，远侧眼剩一半</text>

  <circle cx="640" cy="112" r="42" class="st"/>
  <path d="M602 100 l-18 13 l18 7" class="st"/>
  <path d="M602 122 L598 154 Q626 176 666 160 L668 130" class="st"/>
  <path d="M600 96 q40 10 80 2" class="st-red"/>
  <circle cx="648" cy="122" r="4" class="dot"/>
  <text x="600" y="200" class="lab">正侧 90°</text>
  <text x="600" y="218" class="lab2">正面平面消失，只剩一条横弧</text>

  <text x="18" y="252" class="lab2">检验口诀：近侧眼宽度基本不变，远侧眼按 1 → 0.75 → 0.5 → 0 递减；</text>
  <text x="18" y="272" class="lab2">红点＝耳。超过 45° 近侧耳就该消失，只剩远侧那一只；两耳都画出来是典型错误。</text>
</svg>