  <text x="100" y="318" class="labk" text-anchor="middle">① 站：稳</text>
  <text x="262" y="318" class="labk" text-anchor="middle">② 弯腰：也稳</text>
  <text x="450" y="318" class="labk" text-anchor="middle">③ 坐着：两块面</text>
  <text x="640" y="318" class="labk" text-anchor="middle">④ 出界：浮着</text>
  <text x="100" y="338" class="lab2" text-anchor="middle">重量全在一条腿</text>
  <text x="262" y="338" class="lab2" text-anchor="middle">上身往前，腿往后</text>
  <text x="450" y="338" class="lab2" text-anchor="middle">坐骨＋脚，落任一即可</text>
  <text x="640" y="338" class="lab2" text-anchor="middle">垂线在脚尖之外</text>
