 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="24" class="labk">同一套刻度，两种骨架</text>
  <rect x="159" y="44" width="22" height="30" class="st"/>
  <rect x="165" y="74" width="10" height="8" class="st"/>
  <path d="M140 82 L200 82 L190 142 L150 142 Z" class="st"/>
  <path d="M150 146 L190 146 L194 186 L146 186 Z" class="st"/>
  <path d="M154 186 L150 252" class="st"/>
  <path d="M188 186 L192 252" class="st"/>
  <line x1="134" y1="82" x2="206" y2="82" class="st-red"/>
  <line x1="144" y1="186" x2="196" y2="186" class="st-red"/>
  <line x1="146" y1="142" x2="194" y2="142" class="st-thin"/>
  <text x="170" y="276" class="labk" text-anchor="middle">男：上宽下窄</text>
  <rect x="379" y="44" width="22" height="30" class="st"/>
  <rect x="385" y="74" width="8" height="8" class="st"/>
  <path d="M366 84 L414 84 L406 138 L374 138 Z" class="st"/>
  <path d="M374 142 L406 142 L422 190 L358 190 Z" class="st"/>
  <path d="M368 190 L366 252" class="st"/>
