  <line x1="362" y1="84" x2="418" y2="84" class="st-red"/>
  <line x1="356" y1="190" x2="424" y2="190" class="st-red"/>
  <line x1="370" y1="138" x2="410" y2="138" class="st-thin"/>
  <text x="390" y="276" class="labk" text-anchor="middle">女：腰高、盆宽</text>
  <text x="500" y="60" class="labk">六处不同，能量化</text>
  <text x="500" y="86" class="lab2">① 肩：男 2.0 头，女 1.6 头</text>
  <text x="500" y="106" class="lab2">② 胸：男倒三角，女圆润收窄</text>
  <text x="500" y="126" class="lab2">③ 腰：女腰位高半格，且更细</text>
  <text x="500" y="146" class="lab2">④ 盆：女髋宽大于肩宽</text>
  <text x="500" y="166" class="lab2">⑤ 颈：男粗方，女细圆且长</text>
  <text x="500" y="186" class="lab2">⑥ 同头高：女约 7 头，男 7.5 头</text>
</svg>