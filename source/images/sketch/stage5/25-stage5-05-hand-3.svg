<svg viewBox="0 0 760 300" role="img" aria-label="张开、握拳、半握三种手的姿态" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="24" class="labk">三种姿态，三种部件数</text>
  <path d="M84 210 L136 210 L142 132 L78 132 Z" class="st"/>
  <rect x="80" y="70" width="15" height="64" rx="7" class="st" transform="rotate(-14 87 102)"/>
  <rect x="98" y="60" width="15" height="74" rx="7" class="st"/>
  <rect x="116" y="66" width="15" height="68" rx="7" class="st" transform="rotate(10 123 100)"/>
  <rect x="133" y="84" width="14" height="50" rx="7" class="st" transform="rotate(22 140 109)"/>
  <rect x="64" y="140" width="17" height="46" rx="8" class="st" transform="rotate(-52 72 163)"/>
  <rect x="292" y="120" width="60" height="72" rx="12" class="st"/>
  <rect x="288" y="94" width="66" height="28" rx="10" class="st"/>
  <line x1="304" y1="94" x2="304" y2="122" class="st-thin"/>
  <line x1="320" y1="94" x2="320" y2="122" class="st-thin"/>
  <line x1="336" y1="94" x2="336" y2="122" class="st-thin"/>
  <path d="M292 166 q28 14 58 2" class="st"/>
  <path d="M296 178 q26 12 52 2" class="st"/>
  <path d="M300 192 L300 214 M346 192 L346 214" class="st"/>
  <path d="M504 210 L556 210 L562 132 L498 132 Z" class="st"/>
  <rect x="496" y="96" width="68" height="44" rx="16" class="st"/>
  <path d="M502 112 q26 -9 56 -2" class="st-thin"/>
  <path d="M502 126 q26 -9 56 -2" class="st-thin"/>
  <rect x="492" y="110" width="16" height="38" rx="8" class="st" transform="rotate(-26 500 129)"/>
  <text x="110" y="252" class="labk" text-anchor="middle">① 张开</text>
  <text x="110" y="272" class="lab2" text-anchor="middle">五指分开，指根成拱</text>
  <text x="320" y="252" class="labk" text-anchor="middle">② 握拳</text>
  <text x="320" y="272" class="lab2" text-anchor="middle">掌＋一节指带＝两组</text>
  <text x="530" y="252" class="labk" text-anchor="middle">③ 半握（拿东西）</text>
  <text x="530" y="272" class="lab2" text-anchor="middle">手指绕成一个圆柱</text>
  <text x="640" y="72" class="labk">先判组</text>
  <text x="640" y="98" class="lab2">张开：五根</text>
  <text x="640" y="118" class="lab2">握拳：两组</text>
  <text x="640" y="138" class="lab2">半握：三段弧</text>
  <text x="640" y="172" class="lab2">四指一起动，</text>
  <text x="640" y="192" class="lab2">拇指单独对掌。</text>
</svg>