  <text x="440" y="310" class="labk" text-anchor="middle">② 体块人（1 分钟）</text>
  <text x="440" y="328" class="lab2" text-anchor="middle">三块加四根圆柱，块有朝向</text>
  <text x="560" y="72" class="labk">火柴人四问</text>
  <text x="560" y="98" class="lab2">头占了几格？</text>
  <text x="560" y="118" class="lab2">肩宽够 2 头吗？</text>
  <text x="560" y="138" class="lab2">一半在耻骨吗？</text>
  <text x="560" y="158" class="lab2">膝在腿中点吗？</text>
  <text x="560" y="192" class="labk">体块人三问</text>
  <text x="560" y="218" class="lab2">胸块朝哪边？</text>
  <text x="560" y="238" class="lab2">盆块朝哪边？</text>
  <text x="560" y="258" class="lab2">两块的夹角看得见吗？</text>
</svg>