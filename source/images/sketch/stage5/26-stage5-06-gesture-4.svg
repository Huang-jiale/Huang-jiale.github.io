  <text x="556" y="288" class="lab2" text-anchor="middle">先给全身，再往里塞细节</text>
  <text x="620" y="110" class="lab2">脸只有三笔：</text>
  <text x="620" y="132" class="lab2">中线＋两条轮廓</text>
  <text x="620" y="154" class="lab2">（第 21 课）</text>
  <text x="620" y="192" class="lab2">手只在 10 分钟</text>
  <text x="620" y="214" class="lab2">档出现</text>
</svg>