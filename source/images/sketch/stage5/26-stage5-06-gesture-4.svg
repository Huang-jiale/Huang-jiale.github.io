  <path d="M150 210 L140 244 M150 210 L162 244" class="st"/>
  <text x="150" y="268" class="labk" text-anchor="middle">✕ 局部先行</text>
  <text x="150" y="288" class="lab2" text-anchor="middle">头占满纸，身子没地方放</text>
  <path d="M560 62 Q536 110 548 158 Q560 214 540 268" class="st-red"/>
  <circle cx="560" cy="74" r="12" class="st f-g1"/>
