  <rect x="542" y="128" width="26" height="20" rx="5" class="st f-g2" transform="rotate(9 555 138)"/>
  <path d="M550 148 L544 200 L540 268" class="st"/>
  <path d="M562 148 L574 198 L580 266" class="st"/>
