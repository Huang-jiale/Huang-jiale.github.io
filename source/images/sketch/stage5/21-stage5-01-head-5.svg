<svg viewBox="0 0 760 270" role="img" aria-label="平视仰视俯视时眉弓线与鼻底线弧度的变化" xmlns="http://www.w3.org/2000/svg" width="760" height="270"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="270" class="bg-paper"/>
  <text x="18" y="24" class="labk">同一条眉弓线：平视微弯、仰视上拱、俯视下弯</text>

  <ellipse cx="110" cy="112" rx="52" ry="60" class="st"/>
  <path d="M58 114 Q110 122 162 114" class="st-red"/>
  <path d="M62 142 Q110 152 158 142" class="st-blue"/>
  <text x="66" y="200" class="lab">平视</text>
  <text x="52" y="220" class="lab2">鼓出量≈线宽的 1/10</text>

  <ellipse cx="340" cy="112" rx="52" ry="60" class="st"/>
  <path d="M288 120 Q340 96 392 120" class="st-red"/>
  <path d="M292 148 Q340 126 388 148" class="st-blue"/>
  <path d="M316 162 q24 14 48 0 l-6 16 q-18 6 -36 0" class="st-thin"/>
  <text x="286" y="200" class="lab">仰视（向上拱 ∩）</text>
  <text x="286" y="220" class="lab2">看得见鼻底与下颌底，颈前移</text>

  <ellipse cx="580" cy="112" rx="52" ry="60" class="st"/>
  <path d="M528 98 Q580 126 632 98" class="st-red"/>
  <path d="M532 126 Q580 154 628 126" class="st-blue"/>
  <path d="M540 60 Q580 40 620 60" class="st-thin"/>
  <text x="524" y="200" class="lab">俯视（向下弯 ⌣）</text>
  <text x="524" y="220" class="lab2">头顶变大，鼻底消失，下颌缩短</text>
  <text x="18" y="250" class="lab2">把球当西瓜，横线是绕瓜的一圈绳子：绳子前端的高低，由你从哪个高度看它决定。</text>
</svg>