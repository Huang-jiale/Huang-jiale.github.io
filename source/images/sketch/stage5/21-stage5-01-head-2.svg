<svg viewBox="0 0 760 320" role="img" aria-label="头部三等分与眼位在中线的比例图" xmlns="http://www.w3.org/2000/svg" width="760" height="320"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="320" class="bg-paper"/>
  <text x="18" y="26" class="lab">头部三等分与眼位在中线</text>
  <ellipse cx="200" cy="170" rx="86" ry="118" class="st"/>
  <path d="M168 258 Q200 272 232 258" class="st-thin"/>
  <line x1="114" y1="52" x2="330" y2="52" class="st-thin"/>
  <line x1="114" y1="111" x2="330" y2="111" class="st-red"/>
  <line x1="114" y1="170" x2="330" y2="170" class="st-blue"/>
  <line x1="114" y1="152" x2="330" y2="152" class="st-red"/>
  <line x1="114" y1="229" x2="330" y2="229" class="st-red"/>
  <line x1="114" y1="288" x2="330" y2="288" class="st-thin"/>
  <path d="M152 172 q14 -9 28 0 q-14 6 -28 0" class="st"/>
  <path d="M220 172 q14 -9 28 0 q-14 6 -28 0" class="st"/>
  <path d="M190 208 l-8 18 q10 6 20 0" class="st"/>
