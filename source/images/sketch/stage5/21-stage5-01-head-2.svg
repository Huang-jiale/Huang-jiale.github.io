  <text x="336" y="140" class="labk">眉弓线（≈48）</text>
  <text x="336" y="178" class="labk">眼睛中心＝整头的正中间（52~55）</text>
  <text x="336" y="225" class="lab2">鼻底（74）</text>
  <text x="336" y="284" class="lab2">下巴底（100）</text>
  <text x="336" y="302" class="lab2">口裂在鼻底→下巴的上 1/3 处（约 83）</text>
  <line x1="470" y1="152" x2="470" y2="229" class="st-ok"/>
  <line x1="452" y1="152" x2="566" y2="152" class="st-thin"/>
  <line x1="452" y1="229" x2="566" y2="229" class="st-thin"/>
  <ellipse cx="518" cy="190" rx="17" ry="33" class="st"/>
  <path d="M512 178 q9 -5 13 5 q-2 15 -13 19" class="st-thin"/>
  <text x="560" y="140" class="labk">耳长＝眉弓→鼻底</text>
  <text x="560" y="252" class="lab2">上沿对齐眉弓、下沿对齐鼻底，</text>
  <text x="560" y="270" class="lab2">耳朵永远挂在中间那一段里。</text>
