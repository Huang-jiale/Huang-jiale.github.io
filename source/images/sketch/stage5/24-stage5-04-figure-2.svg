 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="420" class="bg-paper"/>
  <text x="18" y="24" class="labk">成人 7.5 头：把身高切成八格（男）</text>
