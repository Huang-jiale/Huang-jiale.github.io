  <line x1="234" y1="70" x2="296" y2="70" class="st-thin"/>
  <text x="302" y="74" class="lab">头：全身唯一的尺子</text>
  <line x1="262" y1="104" x2="296" y2="104" class="st-thin"/>
  <text x="302" y="108" class="lab">① 肩线：宽 2 格</text>
  <text x="302" y="126" class="lab2">　上半身的分量全看它</text>
  <line x1="248" y1="136" x2="296" y2="136" class="st-thin"/>
  <text x="302" y="140" class="lab">② 乳线：2 格</text>
  <line x1="244" y1="180" x2="296" y2="180" class="st-thin"/>
  <text x="302" y="184" class="lab">③ 腰与脐：3 格</text>
  <text x="302" y="202" class="lab2">　肘尖落在这条线上</text>
  <line x1="276" y1="213" x2="296" y2="213" class="st-red"/>
  <text x="302" y="217" class="lab">④ 耻骨：3.75 格＝身高一半</text>
  <text x="302" y="235" class="lab2">　腕也在这条线上，腿从它往下算</text>
  <line x1="252" y1="290" x2="296" y2="290" class="st-thin"/>
  <text x="302" y="294" class="lab">⑤ 膝：5.5 格＝腿的中点</text>
  <text x="302" y="312" class="lab2">　耻骨到地面正好两格</text>
  <line x1="240" y1="372" x2="296" y2="372" class="st-thin"/>
  <text x="302" y="376" class="lab">⑥ 踝：7.25 格</text>
  <text x="302" y="394" class="lab2">　最后 0.25 格是脚，别把脚画没</text>
  <text x="546" y="72" class="labk">落笔先画这四条横线</text>
  <text x="546" y="98" class="lab2">肩线 · 乳线 · 腰 · 耻骨</text>
  <text x="546" y="156" class="labk">三个最常错的刻度</text>
  <text x="546" y="182" class="lab2">一半记在腰上 → 腿短</text>
  <text x="546" y="202" class="lab2">膝低于 5.5 格 → 腿短</text>
  <text x="546" y="222" class="lab2">肩窄于 1.85 格 → 瘦弱</text>
  <text x="546" y="258" class="labk">比例不是审美</text>
  <text x="18" y="412" class="lab2">量法：先用铅笔"掐"出头的高度（第 04 课），再往下切 8 格；宁可先画成一个"格子人"，也不要一开始就描轮廓。</text>
</svg>