<svg viewBox="0 0 760 250" role="img" aria-label="球加方块组成的砖块头三步推导" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="24" class="labk">砖块头三步：球 → 切出侧面 → 挂上下颌方块</text>

  <circle cx="90" cy="128" r="50" class="st"/>
  <text x="44" y="206" class="lab">① 一个球＝颅腔</text>
  <text x="44" y="226" class="lab2">直径＝头宽，先不管颌</text>

  <circle cx="300" cy="128" r="50" class="st"/>
  <line x1="330" y1="86" x2="330" y2="170" class="st"/>
  <path d="M330 86 A50 50 0 0 1 330 170" class="st-thin"/>
  <text x="342" y="80" class="lab2">切掉约 1/5 宽＝侧面</text>
  <text x="256" y="206" class="lab">② 球上切一条竖直弦</text>
  <text x="256" y="226" class="lab2">左边剩下的平面＝放五官的正面</text>

  <circle cx="545" cy="106" r="46" class="st"/>
  <line x1="573" y1="70" x2="573" y2="142" class="st"/>
  <path d="M573 70 A46 46 0 0 1 573 142 Z" class="f-g2 st-thin"/>
  <path d="M512 142 L510 176 Q546 190 582 176 L582 138" class="st"/>
  <path d="M512 142 Q546 160 582 138" class="st-thin"/>
  <text x="600" y="100" class="lab2">侧面</text>
  <text x="466" y="212" class="lab">③ 下面挂一块方楔子＝颌面</text>
  <text x="466" y="232" class="lab2">两条竖边＋一个略平的颏底</text>
</svg>