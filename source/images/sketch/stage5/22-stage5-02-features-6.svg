<svg viewBox="0 0 760 300" role="img" aria-label="嘴的圆柱体块、三块面与写实画法" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="24" class="labk">嘴＝圆柱上的一圈：上唇朝下（暗）、下唇朝上（亮）、缝最暗</text>
  <path d="M60 70 q60 -22 120 0 l0 120 q-60 22 -120 0 Z" class="st"/>
  <path d="M60 70 q60 22 120 0" class="st-thin"/>
  <path d="M60 130 q60 22 120 0" class="st-red"/>
  <path d="M60 130 q60 -20 120 0" class="st-thin"/>
  <path d="M60 130 q30 12 60 12 q30 0 60 -12" class="f-g3 st-thin"/>
  <text x="44" y="220" class="lab2">圆柱＝颌骨；红线＝唇缝所在的转折</text>
  <text x="44" y="240" class="lab2">上唇是"朝下的面"，所以它天生比下唇暗</text>

  <path d="M280 108 q22 -16 40 -6 q10 6 20 0 q18 -10 40 6" class="st"/>
  <path d="M280 108 q40 18 100 0" class="st"/>
  <path d="M280 108 q40 -14 100 0" class="st-thin"/>
  <path d="M286 112 q34 26 88 0 q-40 34 -88 0" class="f-g1 st"/>
  <path d="M320 96 l0 -18 M340 96 l0 -18" class="st-thin"/>
  <text x="264" y="170" class="lab">② 三块面</text>
  <text x="264" y="190" class="lab2">上唇中灰／缝最暗</text>
  <text x="264" y="210" class="lab2">下唇最亮、中间留白</text>
  <text x="264" y="230" class="lab2">竖虚线＝两条人中嵴</text>
  <text x="264" y="250" class="lab2">唇弓中间最实、两头虚</text>

  <path d="M470 104 q26 -14 46 -4 q8 4 16 0 q22 -12 48 4" class="st"/>
  <path d="M470 104 q46 20 110 0" class="st"/>
  <path d="M478 110 q38 24 94 0 q-40 30 -94 0" class="st"/>
  <path d="M470 104 q-10 6 -12 14" class="st-thin"/>
  <path d="M580 104 q10 6 12 14" class="st-thin"/>
  <ellipse cx="464" cy="122" rx="8" ry="6" class="f-g4 st-thin"/>
  <ellipse cx="578" cy="122" rx="8" ry="6" class="f-g4 st-thin"/>
  <text x="452" y="164" class="lab">嘴角＝口角窝</text>
  <text x="452" y="184" class="lab2">是小窝，不是线头</text>
  <text x="452" y="204" class="lab2">唇缘外那圈要有厚度暗边</text>
  <text x="604" y="80" class="labk">嘴的四个数字</text>
  <text x="604" y="104" class="lab2">宽≈1.5 眼</text>
  <text x="604" y="124" class="lab2">嘴角在瞳孔垂线略内</text>
  <text x="604" y="144" class="lab2">口裂高＝鼻底→下巴的 1/3</text>
  <text x="604" y="164" class="lab2">上唇高≈下唇的 0.8 倍</text>
  <text x="604" y="184" class="lab2">唇缝略呈外高内低的弧</text>
  <text x="604" y="216" class="lab2">下唇下面那条亮面</text>
  <text x="604" y="236" class="lab2">（颏唇沟之上）不能省</text>
</svg>