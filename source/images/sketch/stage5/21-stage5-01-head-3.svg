  <text x="102" y="110" class="lab2">①</text>
  <text x="158" y="110" class="lab2">②</text>
  <text x="214" y="110" class="lab2">③</text>
  <text x="270" y="110" class="lab2">④</text>
  <text x="326" y="110" class="lab2">⑤</text>
