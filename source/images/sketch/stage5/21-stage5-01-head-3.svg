 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="24" class="labk">脸宽＝5 只眼：一格＝一只眼的宽度</text>
  <rect x="80" y="56" width="56" height="34" class="f-g1"/>
  <rect x="136" y="56" width="56" height="34" class="f-white"/>
