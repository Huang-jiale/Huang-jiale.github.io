<svg viewBox="0 0 760 250" role="img" aria-label="正面脸宽五眼与五官横向定位" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
