  <text x="420" y="66" class="lab">四把横向尺（单位＝一只眼）</text>
  <text x="420" y="92" class="lab2">两眼之间＝1 眼（③ 那一格）</text>
  <text x="420" y="114" class="lab2">鼻翼宽＝1 眼，正对两内眼角的垂线</text>
  <text x="420" y="136" class="lab2">嘴宽≈1.5 眼（嘴角在瞳孔垂线略靠内）</text>
  <text x="420" y="158" class="lab2">颏宽≈1.6 眼</text>
  <text x="420" y="180" class="lab2">眼宽≈头高的 15%（头高 100 → 眼宽 15）</text>
  <text x="420" y="212" class="lab2">红点＝瞳孔。虚线是从瞳孔、内眼角垂下来的"对齐线"。</text>
