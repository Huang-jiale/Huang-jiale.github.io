<svg viewBox="0 0 760 330" role="img" aria-label="对立式平衡的肩线髋线倾角与扭转角度" xmlns="http://www.w3.org/2000/svg" width="760" height="330"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="330" class="bg-paper"/>
  <text x="18" y="24" class="labk">两条斜线一个夹角：动感的三个数字</text>
  <line x1="40" y1="286" x2="360" y2="286" class="st"/>
  <circle cx="150" cy="76" r="14" class="st f-g1"/>
  <path d="M150 90 L146 106" class="st"/>
  <rect x="112" y="106" width="76" height="46" rx="8" class="st f-g1"/>
  <rect x="118" y="158" width="64" height="30" rx="7" class="st f-g2"/>
  <path d="M112 112 L188 126" class="st-blue"/>
  <path d="M118 182 L182 166" class="st-blue"/>
  <path d="M150 92 Q146 140 152 186" class="st-red"/>
  <path d="M132 188 L128 238 L126 286" class="st"/>
  <path d="M168 188 L172 238 L176 286" class="st"/>
  <path d="M118 112 L104 152 L108 184" class="st"/>
  <path d="M182 126 L196 158 L190 188" class="st"/>
  <text x="150" y="308" class="labk" text-anchor="middle">正面：对立式平衡</text>
  <text x="204" y="124" class="lab2">肩线降 8–12°</text>
  <text x="196" y="176" class="lab2">髋线反升 6–10°</text>
  <path d="M380 150 L500 150" class="st"/>
  <path d="M402 178 L478 134" class="st-blue"/>
  <path d="M470 150 Q474 142 468 138" class="st-red"/>
  <text x="486" y="146" class="lab2">夹角</text>
  <text x="486" y="164" class="lab2">0–45°</text>
  <text x="380" y="142" class="lab2">肩轴</text>
  <text x="366" y="192" class="lab2">髋轴</text>
  <text x="440" y="230" class="labk" text-anchor="middle">俯视：扭转</text>
  <text x="440" y="252" class="lab2" text-anchor="middle">肩与盆各转各的</text>
  <text x="560" y="72" class="labk">记三个数</text>
  <text x="560" y="98" class="lab2">放松站立：8°／6°／10°</text>
  <text x="560" y="120" class="lab2">走路：12°／10°／20°</text>
  <text x="560" y="142" class="lab2">转身取物：15°／12°／40°</text>
  <text x="560" y="180" class="labk">两个都为 0 时</text>
  <text x="560" y="206" class="lab2">人是死的（军姿、</text>
  <text x="560" y="228" class="lab2">证件照、三头娃娃）。</text>
  <text x="560" y="266" class="labk">先画斜线再画块</text>
  <text x="560" y="292" class="lab2">肩线、髋线各一笔。</text>
</svg>