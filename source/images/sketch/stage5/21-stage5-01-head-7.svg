<svg viewBox="0 0 760 280" role="img" aria-label="砖块头的三块面与明暗分布" xmlns="http://www.w3.org/2000/svg" width="760" height="280"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="280" class="bg-paper"/>
  <text x="18" y="24" class="labk">光从左上来：正面亮 → 明暗交界 → 侧面暗 → 颌底最暗</text>
  <circle cx="150" cy="122" r="60" class="st"/>
  <path d="M166 64 A60 60 0 0 1 166 180 Z" class="f-g2 st-thin"/>
  <line x1="188" y1="72" x2="188" y2="172" class="st-thin"/>
  <path d="M188 72 A60 60 0 0 1 188 172 Z" class="f-g4 st-thin"/>
  <path d="M166 64 Q180 122 166 180" class="st-red"/>
  <path d="M104 168 L100 222 Q150 244 200 222 L200 166" class="st"/>
  <path d="M100 222 Q150 244 200 222 Q150 232 100 222 Z" class="f-g5 st-thin"/>
  <path d="M166 64 Q180 122 166 180" class="st-thin"/>
  <text x="96" y="46" class="lab2">光源</text>
  <line x1="120" y1="40" x2="150" y2="66" class="st-blue"/>
  <text x="238" y="86" class="lab2">红实线＝明暗交界线（它绕球走，不是一条直边）</text>
  <text x="238" y="106" class="lab2">浅灰＝侧面平面，深灰＝平面转向后面的部分</text>
  <text x="238" y="126" class="lab2">最黑的一条＝下颌底面（永远最暗，它把"头"和"颈"分开）</text>
  <text x="238" y="152" class="lab">五个台阶（对照第 03 课九格）</text>
  <rect x="238" y="166" width="52" height="26" class="f-white st-thin"/>
  <rect x="294" y="166" width="52" height="26" class="f-g1 st-thin"/>
  <rect x="350" y="166" width="52" height="26" class="f-g2 st-thin"/>
  <rect x="406" y="166" width="52" height="26" class="f-g3 st-thin"/>
  <rect x="462" y="166" width="52" height="26" class="f-g5 st-thin"/>
  <text x="240" y="212" class="lab2">亮面</text>
  <text x="296" y="212" class="lab2">灰面</text>
  <text x="352" y="212" class="lab2">交界</text>
  <text x="408" y="212" class="lab2">暗面</text>
  <text x="464" y="212" class="lab2">底面/投影</text>
  <text x="235.4" y="248" class="lab2">先只画这五块，不许出现第六种深浅。脸"平"不是因为暗部不够黑，而是因为五块被画成了一整片灰。</text>
</svg>