<svg viewBox="0 0 760 200" role="img" aria-label="眯眼看图的效果对比" xmlns="http://www.w3.org/2000/svg" width="760" height="200"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="200" class="bg-paper"/>
  <text x="18" y="24" class="labk">同一个球：睁眼看（左）会被细节骗，眯眼看（右）只剩三块</text>
  <circle cx="130" cy="110" r="62" fill="#f2f2f2" stroke="#1c1c1c"/>
  <path d="M150 60 a62 62 0 0 1 8 100 q-30 -14 -22 -50 q4 -26 14 -50" fill="#8f8f8f"/>
  <path d="M104 66 a20 14 0 0 1 26 4" fill="#fff" opacity=".9"/>
  <g class="st-thin"><line x1="92" y1="120" x2="120" y2="146"/><line x1="100" y1="112" x2="128" y2="138"/><line x1="86" y1="132" x2="112" y2="156"/></g>
  <text x="60" y="192" class="lab2">睁眼：看见纹理、边缘、小亮点 → 手想描细节</text>
  <circle cx="470" cy="110" r="62" fill="#e8e8e8"/>
  <path d="M490 60 a62 62 0 0 1 6 98 q-26 -12 -20 -46 q4 -24 14 -52" fill="#5f5f5f"/>
  <text x="392" y="192" class="lab2">眯眼：只剩 亮 / 明暗交界 / 暗 三块 → 手知道该铺哪</text>
  <text x="560" y="110" class="lab">眯眼时问自己三个问题：</text>
  <text x="560" y="130" class="lab2">① 最黑的一块在哪、有多大？</text>
  <text x="560" y="148" class="lab2">② 亮面与暗面的面积比是多少？</text>
  <text x="560" y="166" class="lab2">③ 有没有哪两块其实一样灰？</text>
</svg>