<svg viewBox="0 0 760 200" role="img" aria-label="交叉排线夹角" xmlns="http://www.w3.org/2000/svg" width="760" height="200"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="200" class="bg-paper"/>
  <text x="18" y="24" class="labk">第二层夹角：20°~40° ✓ ／ 90° ✗</text>
  <g class="st-ok">
    <line x1="40" y1="170" x2="120" y2="60"/><line x1="62" y1="172" x2="142" y2="62"/><line x1="84" y1="174" x2="164" y2="64"/>
    <line x1="106" y1="176" x2="186" y2="66"/><line x1="128" y1="178" x2="208" y2="68"/>
    <line x1="36" y1="140" x2="200" y2="86" stroke-width="1"/><line x1="40" y1="164" x2="206" y2="110" stroke-width="1"/>
    <line x1="52" y1="176" x2="212" y2="130" stroke-width="1"/>
  </g>
  <text x="60" y="192" class="lab2">✓ 仍读作"一个方向的暗部"，深了但透气</text>
  <g class="st-bad">
    <line x1="420" y1="60" x2="420" y2="170"/><line x1="446" y1="60" x2="446" y2="170"/><line x1="472" y1="60" x2="472" y2="170"/>
    <line x1="498" y1="60" x2="498" y2="170"/><line x1="524" y1="60" x2="524" y2="170"/><line x1="550" y1="60" x2="550" y2="170"/>
    <line x1="410" y1="76" x2="562" y2="76"/><line x1="410" y1="100" x2="562" y2="100"/><line x1="410" y1="124" x2="562" y2="124"/>
    <line x1="410" y1="148" x2="562" y2="148"/>
  </g>
  <text x="416" y="192" class="lab2">✗ 井字格 → 像编织袋，暗部"闷"且抢戏</text>
  <text x="600" y="90" class="lab">补救办法：</text>
  <text x="600" y="110" class="lab2">已经画成网格了？用可塑橡皮</text>
  <text x="600" y="128" class="lab2">整体粘淡一遍，再单层重铺。</text>
</svg>