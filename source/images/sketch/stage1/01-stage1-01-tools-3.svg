<svg viewBox="0 0 760 260" role="img" aria-label="三级发力支点" xmlns="http://www.w3.org/2000/svg" width="760" height="260"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="260" class="bg-paper"/>
  <text x="18" y="24" class="labk">三个支点 = 三种线长</text>

  <text x="18" y="62" class="lab">① 手指支点</text>
  <text x="18" y="82" class="lab2">线长 1~3cm · 细节、五官、边缘卡点</text>
  <line x1="230" y1="76" x2="290" y2="76" class="st"/>
  <circle cx="300" cy="76" r="4" class="dot"/>

  <text x="18" y="132" class="lab">② 手腕支点</text>
  <text x="18" y="152" class="lab2">线长 5~12cm · 排线、短轮廓</text>
  <path d="M230 150 A70 70 0 0 1 296 108" class="st"/>
  <circle cx="300" cy="152" r="4" class="dot"/>

  <text x="18" y="206" class="lab">③ 手肘/肩支点</text>
  <text x="18" y="226" class="lab2">线长 15~35cm · 起形长直线、铺大调子、画大弧</text>
  <path d="M230 232 A150 150 0 0 1 372 150" class="st"/>
  <circle cx="378" cy="236" r="4" class="dot"/>
  <text x="392" y="240" class="lab2">← 转轴在肩上，手臂当半径</text>
</svg>