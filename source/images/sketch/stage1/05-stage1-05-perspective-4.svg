<svg viewBox="0 0 760 210" role="img" aria-label="视锥与近大远小的正确幅度" xmlns="http://www.w3.org/2000/svg" width="760" height="210"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="210" class="bg-paper"/>
  <text x="18" y="24" class="labk">60° 视锥：锥内可信，锥外变形</text>
  <path d="M60 170 L250 60 M60 170 L250 170 M60 170 L250 280" class="st-thin"/>
  <path d="M60 170 L250 96 A86 86 0 0 1 250 170 Z" fill="#f2f2f2" stroke="none"/>
  <circle cx="60" cy="170" r="7" class="st" fill="#fff"/>
  <text x="30" y="196" class="lab2">眼睛</text>
  <text x="150" y="120" class="lab2">清晰区</text>
  <g class="st">
    <rect x="330" y="120" width="40" height="60" fill="#dcdcdc"/>
    <rect x="410" y="110" width="32" height="48" fill="#dcdcdc"/>
    <rect x="480" y="102" width="26" height="38" fill="#dcdcdc"/>
    <rect x="540" y="96" width="20" height="30" fill="#dcdcdc"/>
    <rect x="590" y="92" width="15" height="22" fill="#dcdcdc"/>
  </g>
  <g class="st-thin"><line x1="330" y1="180" x2="605" y2="114"/></g>
  <text x="330" y="200" class="lab2">一排同样高的柱子：高度按等比递减，顶部连线是一条平滑的斜线（不是折线）</text>
  <text x="330" y="60" class="lab">✓ 顶边连成一条直线 → 收拢速率一致</text>
  <text x="330" y="78" class="lab2">✗ 若连线出现折角，说明某一格画得太高/太矮</text>
</svg>