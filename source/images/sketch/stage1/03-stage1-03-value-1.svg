<svg viewBox="0 0 760 260" role="img" aria-label="九格阶梯的正确与错误分布" xmlns="http://www.w3.org/2000/svg" width="760" height="260"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="260" class="bg-paper"/>
  <text x="18" y="24" class="labk">✓ 均匀分布：相邻两格之间的差，肉眼等量</text>
  <g stroke="#1c1c1c" stroke-width="1">
    <rect x="18"  y="36" width="76" height="56" class="f-white"/>
    <rect x="94"  y="36" width="76" height="56" fill="#ececec"/>
    <rect x="170" y="36" width="76" height="56" fill="#d5d5d5"/>
    <rect x="246" y="36" width="76" height="56" fill="#b8b8b8"/>
    <rect x="322" y="36" width="76" height="56" fill="#979797"/>
    <rect x="398" y="36" width="76" height="56" fill="#747474"/>
    <rect x="474" y="36" width="76" height="56" fill="#4f4f4f"/>
    <rect x="550" y="36" width="76" height="56" fill="#303030"/>
    <rect x="626" y="36" width="76" height="56" fill="#171717"/>
  </g>
  <g class="lab2"><text x="44" y="112" class="lab2">1</text><text x="120" y="112" class="lab2">2</text><text x="196" y="112" class="lab2">3</text><text x="272" y="112" class="lab2">4</text><text x="348" y="112" class="lab2">5</text><text x="424" y="112" class="lab2">6</text><text x="500" y="112" class="lab2">7</text><text x="576" y="112" class="lab2">8</text><text x="652" y="112" class="lab2">9</text></g>

  <text x="18" y="150" class="labk">✗ 初学者的典型分布：挤在亮端，暗端空着</text>
  <g stroke="#1c1c1c" stroke-width="1">
    <rect x="18"  y="162" width="76" height="56" class="f-white"/>
    <rect x="94"  y="162" width="76" height="56" fill="#fafafa"/>
    <rect x="170" y="162" width="76" height="56" fill="#f2f2f2"/>
    <rect x="246" y="162" width="76" height="56" fill="#eaeaea"/>
    <rect x="322" y="162" width="76" height="56" fill="#e0e0e0"/>
    <rect x="398" y="162" width="76" height="56" fill="#d2d2d2"/>
    <rect x="474" y="162" width="76" height="56" fill="#c0c0c0"/>
    <rect x="550" y="162" width="76" height="56" fill="#a8a8a8"/>
    <rect x="626" y="162" width="76" height="56" fill="#8f8f8f"/>
  </g>
  <text x="18" y="240" class="lab2">全部落在 1~5 度，最黑只到 5 → 画面"灰、闷、没有体积"。解法不是"画细一点"，是把 7、8、9 三格真的画出来。</text>
</svg>