<svg viewBox="0 0 760 250" role="img" aria-label="握笔位置与摆动画弧的关系" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="24" class="labk">握点离笔尖越远，同一手腕动作画出的线越长</text>

  <text x="18" y="58" class="lab">握近（3cm）</text>
  <line x1="120" y1="150" x2="230" y2="70" class="st" stroke-width="5"/>
  <circle cx="230" cy="70" r="5" class="dot"/>
  <text x="238" y="66" class="lab2">握点</text>
  <path d="M96 176 A46 46 0 0 1 152 132" class="st-blue"/>
  <text x="96" y="200" class="lab2">笔尖活动半径 ≈ 4cm</text>
  <text x="96" y="220" class="lab2">画 20cm 长线必须挪手腕 → 中途抖动、接头明显</text>

  <text x="420" y="58" class="lab">握远（15cm）</text>
  <line x1="470" y1="200" x2="690" y2="60" class="st" stroke-width="5"/>
  <circle cx="690" cy="60" r="5" class="dot"/>
  <text x="640" y="52" class="lab2">握点</text>
  <path d="M420 190 A190 190 0 0 1 560 96" class="st-blue"/>
  <text x="420" y="222" class="lab2">笔尖活动半径 ≈ 15cm</text>
  <text x="420" y="240" class="lab2">一次摆臂就能甩出 20cm 长线，中间不需要停</text>
</svg>