<svg viewBox="0 0 760 250" role="img" aria-label="同时对比：相同明度的方块" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="24" class="labk">下面两个中心方块明度完全相同（都是 #8f8f8f）</text>
  <rect x="40" y="44" width="300" height="150" fill="#ffffff" stroke="#ddd9d2"/>
  <rect x="150" y="94" width="80" height="50" fill="#8f8f8f"/>
  <text x="118" y="216" class="lab2">在白底上 → 显得深（像 6 度）</text>

  <rect x="400" y="44" width="300" height="150" fill="#1c1c1c"/>
  <rect x="510" y="94" width="80" height="50" fill="#8f8f8f"/>
  <text x="478" y="216" class="lab2">在黑底上 → 显得浅（像 3 度）</text>

  <text x="18" y="242" class="lab">推论：想让人物脸"亮起来"，不一定要把脸画浅，把背景压深同样有效——而且效果更好。</text>
</svg>