<svg viewBox="0 0 760 300" role="img" aria-label="视平线高低决定能看见哪个面" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="24" class="labk">同一个立方体，机位高 / 平 / 低，看见的面完全不同</text>

  <text x="18" y="66" class="lab">俯视：HL 在物体上方 → 看见顶面</text>
  <line x1="18" y1="76" x2="230" y2="76" class="st-blue"/>
  <text x="236" y="80" class="lab2">HL</text>
  <path d="M70 100 L140 84 L200 104 L130 122 Z" class="st" fill="#dcdcdc"/>
  <path d="M70 100 L70 176 L130 196 L130 122 Z" class="st" fill="#bfbfbf"/>
  <path d="M200 104 L200 178 L130 196 L130 122 Z" class="st" fill="#8f8f8f"/>

  <text x="268" y="66" class="lab">平视：HL 穿过物体 → 顶面看不见</text>
  <line x1="268" y1="140" x2="480" y2="140" class="st-blue"/>
  <text x="484" y="144" class="lab2">HL</text>
  <path d="M320 140 L320 216 L380 236 L380 158 Z" class="st" fill="#bfbfbf"/>
  <path d="M450 142 L450 218 L380 236 L380 158 Z" class="st" fill="#8f8f8f"/>
  <path d="M320 140 L380 158 L450 142" class="st-thin"/>
  <text x="330" y="132" class="lab2">顶面退化成一条边</text>

  <text x="518" y="66" class="lab">仰视：HL 在下方 → 看见底面</text>
  <path d="M580 200 L640 182 L700 200 L640 218 Z" class="st-thin" fill="none"/>
  <path d="M580 124 L640 106 L700 124 L700 200 L640 218 L580 200 Z" class="st" fill="#bfbfbf"/>
  <path d="M580 200 L640 218 L700 200" class="st" fill="none"/>
  <path d="M580 200 L640 182 L700 200" class="st-red"/>
  <line x1="518" y1="210" x2="730" y2="210" class="st-blue"/>
  <text x="700" y="204" class="lab2">HL</text>
  <text x="524" y="248" class="lab2">红线 = 底面，仰视时它是唯一新增的可见面</text>

  <text x="18" y="286" class="lab">实操：起形前先在纸上轻轻画一条 HL，并写下"我是站着看还是坐着看"。整幅画不许换机位。</text>
</svg>