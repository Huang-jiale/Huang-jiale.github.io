<svg viewBox="0 0 760 210" role="img" aria-label="起收笔的力度曲线" xmlns="http://www.w3.org/2000/svg" width="760" height="210"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="210" class="bg-paper"/>
  <text x="18" y="24" class="labk">一根合格线的力度分布：两头是零，中间最重</text>
  <line x1="40" y1="150" x2="360" y2="150" class="st-thin"/>
  <path d="M40 150 C120 148 180 96 200 96 C240 96 300 146 360 150" class="st-ok" stroke-width="2.4"/>
  <text x="52" y="176" class="lab2">起笔（空中就开始动）</text>
  <text x="168" y="80" class="lab2">中段：正常压力</text>
  <text x="286" y="176" class="lab2">收笔（甩出去，不停）</text>

  <line x1="400" y1="150" x2="720" y2="150" class="st-thin"/>
  <path d="M400 152 q6 -22 16 -22 q10 0 12 20 L690 150 q8 -18 16 -18 q10 0 12 20" class="st-bad" stroke-width="2.4"/>
  <circle cx="416" cy="128" r="6" class="dot"/>
  <circle cx="704" cy="130" r="6" class="dot"/>
  <text x="404" y="180" class="lab2">✗ 两头驻点（笔先落地再动、末尾停住）→ 排线成"铁轨"</text>
</svg>