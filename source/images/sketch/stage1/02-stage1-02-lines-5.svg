<svg viewBox="0 0 760 230" role="img" aria-label="渐变条的三种失败形态" xmlns="http://www.w3.org/2000/svg" width="760" height="230"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="230" class="bg-paper"/>
  <text x="18" y="24" class="labk">三种渐变条：只有第一种能用</text>

  <text x="18" y="56" class="lab">✓ 均匀过渡</text>
  <defs><linearGradient id="gA" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#cfcfcf"/><stop offset=".7" stop-color="#6f6f6f"/><stop offset="1" stop-color="#1c1c1c"/></linearGradient></defs>
  <rect x="18" y="66" width="330" height="34" fill="url(#gA)" stroke="#1c1c1c"/>
  <text x="18" y="120" class="lab2">疏密连续变化，中段没有断层</text>

  <text x="400" y="56" class="lab">✗ 两头快中间断</text>
  <rect x="400" y="66" width="330" height="34" class="f-white" stroke="#1c1c1c"/>
  <rect x="400" y="66" width="70" height="34" class="f-g2"/>
  <rect x="520" y="66" width="60" height="34" class="f-g3"/>
  <rect x="640" y="66" width="90" height="34" class="f-g5"/>
  <text x="400" y="120" class="lab2">前 1/4 就把灰用完了 → 后面只能靠压</text>

  <text x="18" y="156" class="lab">✗ 中段突然跳黑</text>
  <rect x="18" y="166" width="330" height="34" class="f-g1" stroke="#1c1c1c"/>
  <rect x="170" y="166" width="46" height="34" class="f-g5"/>
  <text x="18" y="220" class="lab2">某几根线角度变了或用力了 → 出现"疤"</text>

  <text x="400" y="156" class="lab">✗ 整体偏灰，压不下去</text>
  <rect x="400" y="166" width="330" height="34" class="f-g3" stroke="#1c1c1c"/>
  <text x="400" y="220" class="lab2">只敢用 2B 或只敢轻压 → 换 4B/6B，靠密度</text>
</svg>