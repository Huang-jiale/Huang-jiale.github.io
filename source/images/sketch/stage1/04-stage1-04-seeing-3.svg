<svg viewBox="0 0 760 240" role="img" aria-label="延长线与竖直对齐" xmlns="http://www.w3.org/2000/svg" width="760" height="240"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="240" class="bg-paper"/>
  <text x="18" y="24" class="labk">用延长线把三个部分锁在一起</text>
  <ellipse cx="120" cy="70" rx="56" ry="15" class="st" fill="#fff"/>
  <path d="M64 70 v96 a56 15 0 0 0 112 0 v-96" class="st" fill="none"/>
  <path d="M176 92 q34 6 34 30 q0 24 -32 26" class="st" fill="none"/>
  <line x1="64" y1="70" x2="216" y2="150" class="st-red"/>
  <circle cx="64" cy="70" r="4" class="dot"/><circle cx="176" cy="118" r="4" class="dot"/>
  <text x="222" y="150" class="lab2">杯口左端 → 把手下沿：连一条延长线</text>
  <line x1="120" y1="40" x2="120" y2="210" class="st-blue"/>
  <text x="128" y="200" class="lab2">中轴（竖直）：左右是否对称，只看这条线</text>
  <line x1="40" y1="166" x2="240" y2="166" class="st-thin"/>
  <text x="40" y="182" class="lab2">水平线：把手顶端比杯口低多少？（不是齐平！）</text>

  <text x="420" y="60" class="lab">✗ 不比较时的典型结果：</text>
  <ellipse cx="470" cy="120" rx="40" ry="10" class="st-bad" fill="none"/>
  <path d="M430 120 v60 a40 10 0 0 0 80 0 v-60" class="st-bad" fill="none"/>
  <path d="M510 108 q26 4 26 22 q0 18 -24 20" class="st-bad" fill="none"/>
  <text x="420" y="204" class="lab2">把手太大、和杯口齐平 → 符号杯</text>
  <text x="600" y="120" class="lab">✓ 比较后：</text>
  <ellipse cx="640" cy="130" rx="40" ry="10" class="st-ok" fill="none"/>
  <path d="M600 130 v50 a40 10 0 0 0 80 0 v-50" class="st-ok" fill="none"/>
  <path d="M680 140 q14 3 14 13 q0 11 -13 12" class="st-ok" fill="none"/>
  <text x="600" y="204" class="lab2">把手小、偏低 → 像实物</text>
</svg>