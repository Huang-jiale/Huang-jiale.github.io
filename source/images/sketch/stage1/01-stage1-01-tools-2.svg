<svg viewBox="0 0 760 200" role="img" aria-label="笔杆角度与接触面的关系" xmlns="http://www.w3.org/2000/svg" width="760" height="200"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="200" class="bg-paper"/>
  <text x="18" y="24" class="labk">角度陡 → 笔尖戳纸（细、硬）；角度平 → 笔芯侧磨纸（宽、松）</text>
  <line x1="60" y1="160" x2="700" y2="160" class="st"/>
  <line x1="140" y1="160" x2="230" y2="52" class="st" stroke-width="6"/>
  <path d="M170 160 A42 42 0 0 0 186 132" class="st-red"/>
  <text x="196" y="126" class="lab2">60°~70°（写字角）</text>
  <text x="110" y="184" class="lab2">接触面 = 一个点</text>
  <line x1="420" y1="160" x2="640" y2="106" class="st" stroke-width="6"/>
  <path d="M470 160 A52 52 0 0 0 466 143" class="st-ok"/>
  <text x="486" y="130" class="lab2">15°~30°（铺调子角）</text>
  <text x="392" y="184" class="lab2">接触面 = 一条 2~4mm 的侧磨带</text>
</svg>