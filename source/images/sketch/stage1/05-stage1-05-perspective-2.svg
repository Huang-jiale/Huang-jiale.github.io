<svg viewBox="0 0 760 320" role="img" aria-label="一点透视与两点透视" xmlns="http://www.w3.org/2000/svg" width="760" height="320"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="320" class="bg-paper"/>
  <line x1="18" y1="150" x2="360" y2="150" class="st-thin"/>
  <text x="18" y="34" class="labk">一点透视：面正对</text>
  <text x="18" y="140" class="lab2">正面：完全水平 + 完全垂直</text>
  <rect x="60" y="120" width="100" height="100" class="st" fill="#dcdcdc"/>
  <circle cx="300" cy="150" r="4.5" class="dot"/>
  <text x="306" y="144" class="lab2">VP</text>
  <line x1="160" y1="120" x2="300" y2="150" class="st-red"/>
  <line x1="160" y1="220" x2="300" y2="150" class="st-red"/>
  <line x1="60" y1="120" x2="300" y2="150" class="st-thin"/>
  <line x1="60" y1="220" x2="300" y2="150" class="st-thin"/>
  <path d="M160 120 L212 130 L212 206 L160 220" class="st" fill="#8f8f8f"/>
  <path d="M60 120 L112 130 L212 130" class="st" fill="none"/>
  <text x="60" y="256" class="lab2">只有 3 条"进深边"收向 VP，其余全是水平/垂直</text>
  <text x="60" y="276" class="lab2">用途：画走廊、桌面、正面摆放的盒子</text>

  <line x1="396" y1="150" x2="742" y2="150" class="st-thin"/>
  <text x="396" y="34" class="labk">两点透视：角正对</text>
  <circle cx="410" cy="150" r="4.5" class="dot"/><circle cx="736" cy="150" r="4.5" class="dot"/>
  <text x="414" y="140" class="lab2">VP1</text><text x="712" y="140" class="lab2">VP2</text>
  <path d="M520 100 L570 88 L640 104 L640 214 L570 232 L520 218 Z" class="st" fill="#dcdcdc"/>
  <path d="M570 88 L570 232" class="st" fill="none"/>
  <path d="M520 100 L570 88 L640 104" class="st" fill="#bfbfbf"/>
  <line x1="520" y1="100" x2="410" y2="150" class="st-red"/>
  <line x1="520" y1="218" x2="410" y2="150" class="st-red"/>
  <line x1="640" y1="104" x2="736" y2="150" class="st-red"/>
  <line x1="640" y1="214" x2="736" y2="150" class="st-red"/>
  <text x="470" y="266" class="lab2">两组横线各自收拢；6 条竖线全部保持垂直、互相平行</text>
  <text x="470" y="286" class="lab2">用途：绝大多数静物、建筑、场景——比一点透视常用</text>
</svg>