<svg viewBox="0 0 760 230" role="img" aria-label="作画姿势俯视示意" xmlns="http://www.w3.org/2000/svg" width="760" height="230"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="230" class="bg-paper"/>
  <text x="18" y="24" class="labk">俯视：画板立起 20°~30°，眼睛到画面约 60~80cm，非惯用手垫纸压板</text>
  <rect x="250" y="40" width="230" height="150" rx="4" class="st" fill="#fff"/>
  <rect x="272" y="58" width="186" height="114" class="st-thin" fill="none"/>
  <text x="296" y="120" class="lab2">画纸（8k）</text>
  <line x1="250" y1="190" x2="180" y2="215" class="st" stroke-width="4"/>
  <text x="120" y="208" class="lab2">板子后倾</text>
  <circle cx="120" cy="120" r="22" class="st"/>
  <text x="96" y="160" class="lab2">头</text>
  <path d="M142 128 Q200 140 268 130" class="st-blue"/>
  <text x="150" y="112" class="lab2">视线：斜着看画面，能同时看到实物与纸</text>
  <path d="M480 150 q40 18 70 6" class="st"/>
  <text x="492" y="180" class="lab2">右手（画）</text>
  <path d="M480 90 q46 -14 78 -6" class="st-thin"/>
  <text x="486" y="72" class="lab2">左手（垫一张废纸压住画纸，防止手掌蹭花调子）</text>
</svg>