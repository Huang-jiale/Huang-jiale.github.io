  <path d="M60 70 L100 44 L190 44 L150 70 Z" class="f-none st"/>
  <path d="M150 70 L190 44 L190 154 L150 180 Z" class="f-none st"/>
  <g class="st">
    <line x1="70" y1="74" x2="70" y2="176"/><line x1="82" y1="74" x2="82" y2="176"/><line x1="94" y1="74" x2="94" y2="176"/><line x1="106" y1="74" x2="106" y2="176"/><line x1="118" y1="74" x2="118" y2="176"/><line x1="130" y1="74" x2="130" y2="176"/><line x1="142" y1="74" x2="142" y2="176"/>
  </g>
  <g class="st-thin">
    <line x1="66" y1="66" x2="96" y2="48"/><line x1="80" y1="66" x2="110" y2="48"/><line x1="94" y1="66" x2="124" y2="48"/><line x1="108" y1="66" x2="138" y2="48"/><line x1="122" y1="66" x2="152" y2="48"/><line x1="136" y1="66" x2="166" y2="48"/>
  </g>
