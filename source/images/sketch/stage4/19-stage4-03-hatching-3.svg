  </g>
  <text x="66" y="200" class="lab2">正面→竖线</text><text x="150" y="200" class="lab2">右面→斜线</text><text x="222" y="58" class="lab2">顶面→反斜线</text>
  <text x="300" y="120" class="labk">疏密即曲率</text>
  <path d="M300 190 C300 120 340 70 430 66 C520 62 560 96 560 96" class="st"/>
  <g class="st-thin">
    <line x1="304" y1="188" x2="312" y2="188"/><line x1="312" y1="164" x2="322" y2="163"/><line x1="318" y1="142" x2="330" y2="140"/><line x1="326" y1="122" x2="340" y2="120"/><line x1="336" y1="104" x2="352" y2="102"/><line x1="350" y1="88" x2="368" y2="87"/><line x1="368" y1="76" x2="388" y2="75"/>
  </g>
  <g class="st">
    <line x1="392" y1="72" x2="404" y2="71"/><line x1="412" y1="70" x2="424" y2="70"/><line x1="432" y1="69" x2="444" y2="70"/><line x1="452" y1="71" x2="464" y2="73"/><line x1="472" y1="75" x2="484" y2="78"/><line x1="492" y1="80" x2="504" y2="84"/><line x1="512" y1="86" x2="524" y2="90"/><line x1="532" y1="92" x2="544" y2="97"/>
