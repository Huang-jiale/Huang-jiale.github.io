<svg viewBox="0 0 760 250" role="img" aria-label="头四肢水果都是椭球母形" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="26" class="labk">三类母形：卵形（头）· 长椭球（四肢躯干）· 近球（果实）</text>
  <ellipse cx="120" cy="120" rx="58" ry="74" class="st"/>
  <line x1="120" y1="46" x2="120" y2="194" class="st-blue"/>
  <path d="M100 176 L120 208 L140 176" class="st-red"/>
  <text x="70" y="232" class="lab2">头：卵形椭球，下方切出脸与下巴</text>
  <ellipse cx="360" cy="120" rx="88" ry="30" transform="rotate(-28 360 120)" class="st"/>
  <line x1="288" y1="158" x2="432" y2="82" class="st-blue"/>
  <text x="300" y="232" class="lab2">四肢/躯干：长椭球，轴=骨头的方向</text>
  <ellipse cx="590" cy="118" rx="56" ry="60" class="st"/>
  <path d="M590 58 q10 -18 22 -20" class="st-red"/>
  <line x1="534" y1="118" x2="646" y2="118" class="st-thin"/>
  <line x1="590" y1="58" x2="590" y2="178" class="st-thin"/>
  <text x="546" y="232" class="lab2">果实：近球但略扁，不是正圆</text>
</svg>