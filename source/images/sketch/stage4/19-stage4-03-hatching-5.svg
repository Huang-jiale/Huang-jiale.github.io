  <g class="st-bad">
    <line x1="430" y1="150" x2="452" y2="98"/><line x1="458" y1="150" x2="480" y2="98"/><line x1="486" y1="150" x2="508" y2="98"/><line x1="514" y1="150" x2="536" y2="98"/><line x1="542" y1="150" x2="564" y2="98"/><line x1="570" y1="150" x2="592" y2="98"/><line x1="598" y1="150" x2="620" y2="98"/><line x1="626" y1="150" x2="648" y2="98"/>
    <line x1="430" y1="98" x2="452" y2="150"/><line x1="458" y1="98" x2="480" y2="150"/><line x1="486" y1="98" x2="508" y2="150"/><line x1="514" y1="98" x2="536" y2="150"/><line x1="542" y1="98" x2="564" y2="150"/><line x1="570" y1="98" x2="592" y2="150"/><line x1="598" y1="98" x2="620" y2="150"/><line x1="626" y1="98" x2="648" y2="150"/>
  </g>
  <text x="430" y="176" class="lab2">✗ 两个方向铺满、不分面 → 像织毛衣，平的</text>
  <text x="18" y="206" class="lab">补救：已经织成毛衣了？用可塑橡皮整体粘淡，退回"一个面一组方向"重来。</text>
</svg>