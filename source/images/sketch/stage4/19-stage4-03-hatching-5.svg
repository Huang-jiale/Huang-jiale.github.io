    <path d="M80 98 Q77 122 84 147"/>
    <path d="M96 99 Q95 122 100 146"/>
    <path d="M116 100 Q116 122 120 146"/>
    <path d="M138 101 Q139 122 142 146"/>
    <path d="M160 102 Q162 122 164 145"/>
    <path d="M182 103 Q185 122 186 144"/>
    <path d="M204 104 Q208 121 208 143"/>
    <path d="M226 104 Q231 121 230 142"/>
    <path d="M248 104 Q253 121 251 141"/>
    <path d="M268 104 Q274 121 271 141"/>
    <path d="M284 104 Q291 120 286 140"/>
  </g>
  <text x="70" y="176" class="lab2">✓ 中间疏、两头（转开处）密，线绕着转</text>
  <line x1="420" y1="96" x2="662" y2="104" class="st"/>
  <line x1="420" y1="150" x2="662" y2="140" class="st"/>
