 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="220" class="bg-paper"/>
  <text x="18" y="24" class="labk">一段手臂（长椭球）：✓ 线绕柱转、两头收密 ／ ✗ 满手井字交叉 = 织毛衣</text>
  <line x1="58" y1="96" x2="300" y2="104" class="st"/>
  <line x1="58" y1="150" x2="300" y2="140" class="st"/>
