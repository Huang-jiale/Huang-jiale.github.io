<svg viewBox="0 0 760 270" role="img" aria-label="旋转盒子上近大远小与竖线垂直" xmlns="http://www.w3.org/2000/svg" width="760" height="270"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="270" class="bg-paper"/>
  <text x="18" y="26" class="labk">旋转盒子：近端面大、远端面小，但所有竖线依然竖直且平行</text>
  <path d="M70 70 L210 96 L210 196 L70 170 Z" class="st"/>
  <path d="M70 70 L250 44 L390 70 L210 96 Z" class="f-g1 st"/>
  <path d="M210 96 L390 70 L390 170 L210 196 Z" class="st"/>
  <path d="M250 44 L250 144 L390 170" class="st-thin"/>
  <path d="M250 144 L70 170" class="st-thin"/>
  <line x1="70" y1="70" x2="70" y2="170" class="st-red"/>
  <line x1="210" y1="96" x2="210" y2="196" class="st-red"/>
  <line x1="390" y1="70" x2="390" y2="170" class="st-red"/>
  <line x1="250" y1="44" x2="250" y2="144" class="st-red"/>
  <circle cx="470" cy="120" r="4" class="dot"/>
  <text x="486" y="124" class="lab">消失点方向</text>
  <line x1="210" y1="96" x2="700" y2="120" class="st-blue"/>
  <line x1="210" y1="196" x2="700" y2="120" class="st-blue"/>
  <text x="486" y="150" class="lab2">远端两条水平边朝消失点收拢</text>
  <text x="486" y="168" class="lab2">于是远端面看起来更小</text>
  <text x="70" y="250" class="lab2">四条红竖线：相互平行、都垂直纸边——旋转不改变"重力方向"</text>
</svg>