<svg viewBox="0 0 760 220" role="img" aria-label="修圆顺序从大到小削角" xmlns="http://www.w3.org/2000/svg" width="760" height="220"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="220" class="bg-paper"/>
  <text x="18" y="26" class="labk">修圆顺序：切面方块 → 先削大角 → 再修小角 → 交界线抹过渡</text>
  <path d="M70 60 L170 60 L170 160 L70 160 Z" class="st"/>
  <line x1="120" y1="60" x2="120" y2="160" class="st-thin"/>
  <line x1="70" y1="110" x2="170" y2="110" class="st-thin"/>
  <text x="70" y="188" class="lab2">① 方块(大面)</text>
  <line x1="196" y1="110" x2="228" y2="110" class="st-blue"/>
  <path d="M228 110 l-12 -6 M228 110 l-12 6" class="st-blue"/>
  <path d="M248 66 L312 60 L322 122 L300 160 L256 158 L246 108 Z" class="st"/>
  <text x="244" y="188" class="lab2">② 削掉大角</text>
  <line x1="336" y1="110" x2="368" y2="110" class="st-blue"/>
  <path d="M368 110 l-12 -6 M368 110 l-12 6" class="st-blue"/>
  <path d="M392 60 C448 56 462 96 460 122 C458 158 424 168 396 160 C368 152 366 70 392 60 Z" class="st"/>
  <text x="386" y="188" class="lab2">③ 再修小角，见圆润</text>
  <line x1="474" y1="110" x2="506" y2="110" class="st-blue"/>
  <path d="M506 110 l-12 -6 M506 110 l-12 6" class="st-blue"/>
  <ellipse cx="592" cy="110" rx="66" ry="56" class="st"/>
  <path d="M560 66 C600 92 600 128 566 154" class="f-none st-thin"/>
  <g class="st-thin"><line x1="536" y1="76" x2="560" y2="70"/><line x1="540" y1="92" x2="566" y2="86"/><line x1="544" y1="108" x2="572" y2="104"/></g>
  <text x="540" y="188" class="lab2">④ 交界线抹过渡→连续调子</text>
</svg>