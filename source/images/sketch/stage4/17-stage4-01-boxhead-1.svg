<svg viewBox="0 0 760 300" role="img" aria-label="盒子到头部先框方盒再切出脸型" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="26" class="labk">盒子 → 头：颅腔是方盒，脸是盒子的正面，下巴是盒子下沿切出的楔形</text>
  <path d="M60 70 L190 70 L190 210 L60 210 Z" class="st"/>
  <path d="M60 70 L100 44 L230 44 L190 70 Z" class="f-g2"/>
  <path d="M190 70 L230 44 L230 184 L190 210 Z" class="f-g3"/>
  <path d="M100 44 L100 184 L230 184" class="st-thin"/>
  <path d="M100 184 L60 210" class="st-thin"/>
  <line x1="125" y1="70" x2="125" y2="210" class="st-blue"/>
  <line x1="60" y1="118" x2="190" y2="118" class="st-blue"/>
  <line x1="60" y1="166" x2="190" y2="166" class="st-blue"/>
  <text x="20" y="122" class="lab2">发际</text><text x="20" y="170" class="lab2">鼻底</text>
  <text x="70" y="285" class="lab">① 方盒 + 三等分（发际 / 鼻底 / 下巴）</text>
  <path d="M430 70 L560 70 L560 210 L430 210 Z" class="st-thin"/>
  <path d="M430 96 C430 74 560 74 560 96 L560 150 C560 200 520 232 495 232 C470 232 430 200 430 150 Z" class="st-ok" stroke-width="1.8"/>
  <path d="M468 188 L495 232 L522 188" class="st-red"/>
  <line x1="495" y1="78" x2="495" y2="228" class="st-blue"/>
  <text x="600" y="112" class="lab">② 沿盒子切出：</text>
  <text x="600" y="132" class="lab2">顶部磨圆（颅盖）</text>
  <text x="600" y="150" class="lab2">两侧削直（颧弓）</text>
  <text x="600" y="168" class="lab2">底部切楔（下巴）</text>
  <text x="401.7" y="285" class="lab">切掉的角用红笔标出——头从来不是圆的，是"被切过的方盒"</text>
</svg>