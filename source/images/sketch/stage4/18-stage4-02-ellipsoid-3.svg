<svg viewBox="0 0 760 260" role="img" aria-label="椭球的截面圆越靠近两极越扁" xmlns="http://www.w3.org/2000/svg" width="760" height="260"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="278" class="bg-paper"/>
  <text x="18" y="26" class="labk">竖直椭球被水平面切三刀：赤道最圆最大，两极又扁又小</text>
  <ellipse cx="160" cy="140" rx="76" ry="106" class="st"/>
  <ellipse cx="160" cy="70" rx="42" ry="9" class="st-blue"/>
  <ellipse cx="160" cy="140" rx="76" ry="17" class="st-blue"/>
  <ellipse cx="160" cy="205" rx="50" ry="11" class="st-blue"/>
  <line x1="160" y1="34" x2="160" y2="246" class="st-thin"/>
  <circle cx="160" cy="34" r="4" class="dot"/><circle cx="160" cy="246" r="4" class="dot"/>
  <text x="248" y="74" class="lab2">近极：小、扁</text>
  <text x="248" y="144" class="lab2">赤道：最大、最圆</text>
  <text x="248" y="209" class="lab2">另一端：又开始收</text>
  <text x="20" y="252" class="lab">极点处切面缩成一个点；两极连线=轴</text>

  <text x="430" y="26" class="labk">用一圈圈截面椭圆判断朝向</text>
  <ellipse cx="560" cy="150" rx="120" ry="52" transform="rotate(-20 560 150)" class="st"/>
  <ellipse cx="560" cy="150" rx="80" ry="60" transform="rotate(-20 560 150)" class="st-thin"/>
  <ellipse cx="560" cy="150" rx="40" ry="62" transform="rotate(-20 560 150)" class="st-thin"/>
  <line x1="472" y1="182" x2="648" y2="118" class="st-blue"/>
  <text x="470" y="230" class="lab2">看截面椭圆的扁的方向：它往哪压扁</text>
  <text x="470" y="248" class="lab2">= 那个圆面就朝哪侧倾 = 形体往哪转</text>
</svg>