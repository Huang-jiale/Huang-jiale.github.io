<svg viewBox="0 0 760 250" role="img" aria-label="同一个形上的卡点与松点" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="24" class="labk">卡点=转折最强处（实、粗）；松点=背光/远处（虚、断）</text>
  <circle cx="150" cy="130" r="72" class="st"/>
  <path d="M102 76 C70 104 68 168 108 196" class="st-thin"/>
  <path d="M108 196 C160 214 214 190 222 132" class="st" stroke-width="1" stroke="#bdbdbd"/>
  <path d="M102 76 C140 52 200 60 222 132" class="st" stroke-width="3.2"/>
  <line x1="196" y1="96" x2="212" y2="86" class="st-ok" stroke-width="3.4"/>
  <text x="222" y="82" class="lab2">卡点（受光转折，压实用粗）</text>
  <text x="40" y="150" class="lab2">松点</text>
  <text x="44" y="176" class="lab2">（渐虚）</text>
  <text x="150" y="230" class="lab2">球：左上转折实，底部转远即松</text>
  <path d="M430 80 L540 80 L540 190 L430 190 Z" class="st" stroke-width="2.6"/>
  <path d="M430 80 L470 56 L580 56 L540 80 Z" class="st-thin"/>
  <path d="M540 80 L580 56 L580 166 L540 190 Z" class="st" stroke-width="1" stroke="#bdbdbd"/>
  <line x1="540" y1="80" x2="540" y2="190" class="st-red" stroke-width="2.4"/>
  <text x="430" y="216" class="lab2">近棱(红)=卡 · 顶面远边=松</text>
  <text x="596" y="120" class="lab2">同一条边，</text>
  <text x="596" y="138" class="lab2">卡住还是松开</text>
  <text x="596" y="156" class="lab2">决定它靠不靠前</text>
</svg>