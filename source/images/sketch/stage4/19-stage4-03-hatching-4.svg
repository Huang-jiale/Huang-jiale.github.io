<svg viewBox="0 0 760 250" role="img" aria-label="用排线密度定位明暗交界线，交叉层数控制灰度" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="24" class="labk">左：亮→密(交界线)→暗(留反光)；右：靠加层数变深，不是靠压</text>
  <circle cx="130" cy="135" r="72" class="st"/>
  <g class="st-thin">
    <path d="M92 76 Q112 135 98 194"/>
    <path d="M108 66 Q130 135 114 200"/>
  </g>
  <g class="st">
    <path d="M132 60 Q156 135 140 206"/>
    <path d="M144 62 Q166 134 152 202"/>
    <path d="M156 66 Q176 132 164 196"/>
    <path d="M168 72 Q186 132 176 190"/>
  </g>
  <g class="st-thin">
    <path d="M182 86 Q196 132 188 176"/>
    <path d="M194 100 Q204 134 196 168"/>
  </g>
  <line x1="150" y1="62" x2="176" y2="205" class="st-red"/>
  <text x="230" y="90" class="lab2">亮部：线疏（留纸白）</text>
  <text x="230" y="118" class="lab2">明暗交界线：线最密最重</text>
  <text x="230" y="146" class="lab2">暗部+反光：稍放开，别闷死</text>
  <text x="196" y="228" class="lab2">红线只是标记，画时靠密度不靠描边</text>
  <g>
    <rect x="430" y="60" width="90" height="90" class="f-white st"/>
    <g class="st"><line x1="436" y1="146" x2="472" y2="64"/><line x1="452" y1="148" x2="488" y2="66"/><line x1="468" y1="150" x2="504" y2="68"/><line x1="484" y1="150" x2="516" y2="72"/></g>
    <text x="440" y="168" class="lab2">1 层 · 约50%</text>
    <rect x="545" y="60" width="90" height="90" class="f-white st"/>
    <g class="st"><line x1="551" y1="146" x2="587" y2="64"/><line x1="567" y1="148" x2="603" y2="66"/><line x1="583" y1="150" x2="619" y2="68"/><line x1="599" y1="150" x2="631" y2="72"/></g>
    <g class="st"><line x1="547" y1="86" x2="631" y2="110"/><line x1="547" y1="116" x2="631" y2="140"/><line x1="551" y1="64" x2="620" y2="84"/></g>
    <text x="555" y="168" class="lab2">2 层 · 约70%</text>
    <rect x="660" y="60" width="86" height="90" class="f-white st"/>
    <g class="st"><line x1="666" y1="146" x2="702" y2="64"/><line x1="682" y1="148" x2="718" y2="66"/><line x1="698" y1="150" x2="734" y2="68"/><line x1="712" y1="150" x2="742" y2="72"/></g>
    <g class="st"><line x1="662" y1="86" x2="742" y2="110"/><line x1="662" y1="116" x2="742" y2="140"/></g>
    <g class="st"><line x1="662" y1="64" x2="690" y2="150"/><line x1="686" y1="60" x2="714" y2="146"/><line x1="710" y1="60" x2="740" y2="146"/></g>
    <text x="666" y="168" class="lab2">3 层 · 约90%</text>
  </g>
  <text x="430" y="206" class="lab">每加一层，夹角控制在 20°~40°，</text>
  <text x="430" y="224" class="lab2">最后一层永远比前一层轻——深而透气，不是死黑</text>
</svg>