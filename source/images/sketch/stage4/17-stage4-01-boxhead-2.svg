<svg viewBox="0 0 760 300" role="img" aria-label="盒子到手和到杯子" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="26" class="labk">盒子 → 手：手掌是一块"扁盒"，五指向外是"小方盒的串"</text>
  <path d="M60 70 L150 70 L150 165 L60 165 Z" class="st"/>
  <path d="M60 70 L74 60 L164 60 L150 70 Z" class="f-g2"/>
  <path d="M150 70 L164 60 L164 155 L150 165 Z" class="f-g3"/>
  <text x="72" y="120" class="lab2">掌：扁盒</text>
  <path d="M64 66 L64 34 L76 34 L76 66 Z" class="st"/>
  <path d="M82 66 L82 28 L94 28 L94 66 Z" class="st"/>
  <path d="M100 66 L100 26 L112 26 L112 66 Z" class="st"/>
  <path d="M118 66 L118 32 L130 32 L130 66 Z" class="st"/>
  <path d="M150 96 L188 84 L198 100 L160 116 Z" class="st"/>
  <path d="M64 50 L76 50 M82 46 L94 46 M100 46 L112 46 M118 50 L130 50" class="st-blue"/>
  <text x="40" y="192" class="lab2">拇指：斜插出来的小盒</text>
  <text x="40" y="285" class="lab">每根手指拆成 2~3 节小方盒，节与节之间有转折</text>
  <text x="380" y="26" class="labk">盒子 → 杯子：先定方圆盒，圆柱只是"削"出来的</text>
  <path d="M410 60 L540 60 L540 210 L410 210 Z" class="st-thin"/>
  <path d="M410 60 L440 42 L570 42 L540 60 Z" class="st-thin"/>
  <path d="M540 60 L570 42 L570 192 L540 210 Z" class="st-thin"/>
  <ellipse cx="475" cy="60" rx="65" ry="18" class="st"/>
  <line x1="410" y1="60" x2="410" y2="200" class="st"/>
  <line x1="540" y1="60" x2="540" y2="200" class="st"/>
  <ellipse cx="475" cy="200" rx="65" ry="18" class="st"/>
  <path d="M410 200 A65 18 0 0 0 540 200" class="st-thin"/>
  <path d="M540 118 C575 118 575 168 540 168" class="st"/>
  <text x="360" y="245" class="lab2">杯身 = 圆柱；圆柱 = 方盒左右削圆；口与底 = 同一椭圆的上下两刀</text>
  <text x="360" y="285" class="lab">先有方盒定高度/宽度/中轴，再在里面套圆柱，就不会画成歪把子</text>
</svg>