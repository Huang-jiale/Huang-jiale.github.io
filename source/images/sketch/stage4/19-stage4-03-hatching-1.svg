<svg viewBox="0 0 760 250" role="img" aria-label="圆柱包着画的排线与死平行对比" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="24" class="labk">圆柱：✓ 线绕着柱身转（边缘渐直） ／ ✗ 全程死平行</text>
  <ellipse cx="150" cy="58" rx="55" ry="14" class="st"/>
  <line x1="95" y1="58" x2="95" y2="188" class="st"/>
  <line x1="205" y1="58" x2="205" y2="188" class="st"/>
  <path d="M95 188 A55 14 0 0 0 205 188" class="st"/>
  <path d="M95 188 A55 14 0 0 1 205 188" class="st-thin"/>
  <g class="st-ok">
    <line x1="100" y1="66" x2="98" y2="184"/>
    <line x1="112" y1="63" x2="108" y2="186"/>
    <line x1="126" y1="61" x2="122" y2="188"/>
    <line x1="142" y1="60" x2="140" y2="189"/>
    <line x1="158" y1="60" x2="160" y2="189"/>
    <line x1="174" y1="61" x2="178" y2="188"/>
    <line x1="188" y1="63" x2="194" y2="185"/>
    <line x1="199" y1="66" x2="204" y2="182"/>
  </g>
  <text x="112" y="216" class="lab2">✓ 中间斜、边缘直，读出"绕"</text>
  <ellipse cx="520" cy="58" rx="55" ry="14" class="st"/>
  <line x1="465" y1="58" x2="465" y2="188" class="st"/>
  <line x1="575" y1="58" x2="575" y2="188" class="st"/>
  <path d="M465 188 A55 14 0 0 0 575 188" class="st"/>
  <path d="M465 188 A55 14 0 0 1 575 188" class="st-thin"/>
  <g class="st-bad">
    <line x1="470" y1="64" x2="500" y2="186"/>
    <line x1="485" y1="60" x2="515" y2="188"/>
    <line x1="500" y1="58" x2="530" y2="189"/>
    <line x1="515" y1="58" x2="545" y2="189"/>
    <line x1="530" y1="58" x2="560" y2="189"/>
    <line x1="545" y1="60" x2="572" y2="186"/>
  </g>
  <text x="486" y="216" class="lab2">✗ 全同角度 → 像贴了张壁纸</text>
  <text x="300" y="128" class="lab">同一根轴</text>
</svg>