<svg viewBox="0 0 760 250" role="img" aria-label="球面包着画与死平行对比" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="24" class="labk">球：✓ 线沿球面弯着绕 ／ ✗ 直斜线硬铺</text>
  <circle cx="150" cy="130" r="72" class="st"/>
  <g class="st-ok">
    <path d="M104 76 Q120 130 106 184"/>
    <path d="M120 66 Q140 130 124 194"/>
    <path d="M140 60 Q162 130 146 200"/>
    <path d="M164 60 Q184 132 170 198"/>
    <path d="M186 66 Q206 132 190 190"/>
    <path d="M204 80 Q216 132 202 178"/>
  </g>
  <text x="104" y="224" class="lab2">✓ 绕着转，球"鼓"出来了</text>
  <circle cx="520" cy="130" r="72" class="st"/>
  <g class="st-bad">
    <line x1="470" y1="80" x2="560" y2="180"/>
    <line x1="482" y1="72" x2="576" y2="166"/>
    <line x1="460" y1="96" x2="540" y2="176"/>
    <line x1="494" y1="64" x2="588" y2="152"/>
    <line x1="452" y1="112" x2="520" y2="176"/>
    <line x1="508" y1="60" x2="596" y2="140"/>
  </g>
  <text x="480" y="224" class="lab2">✗ 像贴在球上的胶带，平的</text>
</svg>