<svg viewBox="0 0 760 260" role="img" aria-label="圆锥的母线与交界线" xmlns="http://www.w3.org/2000/svg" width="760" height="260"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="260" class="bg-paper"/>
  <text x="18" y="24" class="labk">圆锥：先定轴，再定底椭圆，最后连母线</text>
  <line x1="180" y1="52" x2="180" y2="200" class="st-blue"/>
  <text x="186" y="60" class="lab2">轴（垂直）</text>
  <ellipse cx="180" cy="200" rx="96" ry="26" class="st" fill="#f2f2f2"/>
  <path d="M84 200 A96 26 0 0 1 276 200" class="st-thin" fill="none"/>
  <g class="st"><path d="M84 200 L180 52 L276 200" fill="none"/></g>
  <g class="st-thin"><path d="M110 176 L180 52 M150 222 L180 52 M212 222 L180 52 M252 178 L180 52" fill="none"/></g>
  <text x="300" y="80" class="lab">母线：顶点 ↔ 底椭圆上的点</text>
  <text x="300" y="100" class="lab2">两侧轮廓 = 最外两条母线</text>
  <text x="300" y="118" class="lab2">虚线母线用来检查底面透视是否一致</text>
  <path d="M232 190 L180 52" class="st-red" stroke-width="5" opacity=".5"/>
  <text x="300" y="152" class="labk">明暗交界线（红）</text>
  <text x="300" y="172" class="lab2">从底弧出发斜向顶点，</text>
  <text x="300" y="190" class="lab2">偏向背光侧，且略微弯</text>
  <text x="300" y="224" class="lab">✗ 底椭圆画太圆 → 机位过高，锥体会"倒"</text>
</svg>