<svg viewBox="0 0 760 230" role="img" aria-label="包着画的弧形排线" xmlns="http://www.w3.org/2000/svg" width="760" height="230"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="230" class="bg-paper"/>
  <text x="18" y="24" class="labk">✓ 弧形包着排 vs ✗ 一组平行斜线贴上去</text>
  <circle cx="170" cy="120" r="86" class="st" fill="#f2f2f2"/>
  <g class="st-thin" stroke-dasharray="0">
    <path d="M100 60 A110 110 0 0 1 240 120" fill="none"/>
    <path d="M92 82 A110 110 0 0 1 246 140" fill="none"/>
    <path d="M88 104 A110 110 0 0 1 244 162" fill="none"/>
    <path d="M92 126 A110 110 0 0 1 232 182" fill="none"/>
    <path d="M104 148 A110 110 0 0 1 212 194" fill="none"/>
  </g>
  <text x="60" y="222" class="lab2">线随形走：每条弧都"绕"着球心</text>

  <circle cx="520" cy="120" r="86" class="st-bad" fill="#f2f2f2"/>
  <g class="st-bad">
    <line x1="517" y1="36" x2="604" y2="115"/><line x1="482" y1="46" x2="598" y2="150"/>
    <line x1="458" y1="65" x2="582" y2="176"/><line x1="442" y1="91" x2="558" y2="194"/>
    <line x1="436" y1="125" x2="524" y2="204"/>
  </g>
  <text x="440" y="222" class="lab2">平行斜线 = 一张贴在球上的纸片</text>
</svg>