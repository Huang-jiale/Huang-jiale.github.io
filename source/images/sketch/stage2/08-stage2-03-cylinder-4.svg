<svg viewBox="0 0 760 250" role="img" aria-label="正方体三面硬转折与圆柱渐变带的对比" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="24" class="labk">同一束光：方体给"台阶"，柱面给"坡"</text>
  <line x1="380" y1="40" x2="380" y2="230" class="st-thin"/>

  <text x="20" y="52" class="lab">正方体：三个台阶</text>
  <path d="M150 106 L206 94 L262 110 L206 124 Z" class="st f-g1"/>
  <path d="M150 106 L150 202 L206 218 L206 124 Z" class="st f-g3"/>
  <path d="M206 124 L206 218 L262 204 L262 110 Z" class="st f-g5"/>
  <line x1="206" y1="124" x2="206" y2="218" class="st"/>
  <path d="M120 224 L172 236 L286 230 L262 204 Z" class="st f-g4"/>
  <text x="272" y="140" class="labk">亮 / 灰 / 暗</text>
  <text x="272" y="158" class="lab2">三档，档与档之间</text>
  <text x="272" y="174" class="lab2">是一条棱，零过渡</text>

  <text x="404" y="52" class="lab">圆柱：一条渐变带</text>
  <rect x="520" y="104" width="18" height="110" class="f-g1"/>
  <rect x="538" y="104" width="18" height="110" class="f-g2"/>
  <rect x="556" y="104" width="18" height="110" class="f-g3"/>
  <rect x="574" y="104" width="18" height="110" class="f-g4"/>
  <rect x="592" y="104" width="18" height="110" class="f-g5"/>
  <rect x="610" y="104" width="18" height="110" class="f-g4"/>
  <line x1="520" y1="104" x2="520" y2="214" class="st"/>
  <line x1="628" y1="104" x2="628" y2="214" class="st"/>
  <ellipse cx="574" cy="104" rx="54" ry="15" class="st f-white"/>
  <path d="M520 214 A54 15 0 0 0 628 214" class="st f-g5"/>
  <path d="M520 214 A54 15 0 0 1 628 214" class="st-thin"/>
  <path d="M462 224 L500 240 L686 236 L660 218 Z" class="st f-g4"/>
  <line x1="601" y1="104" x2="601" y2="214" class="st-red" stroke-width="7" opacity=".45"/>
  <text x="404" y="130" class="lab2">明度沿水平方向</text>
  <text x="404" y="146" class="lab2">连续爬升再回落</text>
  <text x="642" y="122" class="labk">最深带</text>
  <text x="642" y="138" class="lab2">只占可见宽度 1/5</text>
</svg>