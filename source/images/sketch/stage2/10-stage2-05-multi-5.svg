<svg viewBox="0 0 760 288" role="img" aria-label="先圈整组大形再切分" xmlns="http://www.w3.org/2000/svg" width="760" height="288"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="288" class="bg-paper"/>
  <text x="18" y="24" class="labk">两步走：先圈住整组，再切两刀</text>

  <text x="24" y="52" class="lab">① 一条线圈住整组</text>
  <line x1="24" y1="200" x2="330" y2="200" class="st-thin"/>
  <path d="M56 200 L86 214 L160 216 L240 212 L312 206 L318 200 Z" class="st f-g4"/>
  <circle cx="86" cy="166" r="34" class="st f-g1"/>
  <path d="M132 132 L152 116 L216 116 L196 132 Z" class="st f-g1"/>
  <path d="M132 132 L196 132 L196 200 L132 200 Z" class="st f-g2"/>
  <path d="M196 132 L216 116 L216 184 L196 200 Z" class="st f-g4"/>
  <rect x="250" y="126" width="50" height="74" class="st f-g2"/>
  <ellipse cx="275" cy="126" rx="25" ry="8" class="st f-white"/>
  <path d="M250 200 A25 8 0 0 0 300 200" class="st f-g4"/>
  <path d="M250 200 A25 8 0 0 1 300 200" class="st-thin"/>
  <path d="M44 182 L46 144 L66 120 L104 108 L150 106 L206 106 L250 110 L296 116 L326 146 L328 196 L320 224 L240 228 L120 228 L48 222 Z" class="st-ok"/>
  <text x="24" y="250" class="lab2">只问一句：这坨形状宽 : 高 ≈ 28 : 12，对吗？</text>

  <text x="404" y="52" class="lab">② 两刀切分组</text>
  <line x1="404" y1="200" x2="710" y2="200" class="st-thin"/>
  <circle cx="466" cy="166" r="34" class="st-thin"/>
  <rect x="512" y="132" width="84" height="68" class="st-thin"/>
  <rect x="630" y="126" width="50" height="74" class="st-thin"/>
  <path d="M424 182 L426 144 L446 120 L484 108 L530 106 L586 106 L630 110 L676 116 L706 146 L708 196 L700 224 L620 228 L500 228 L428 222 Z" class="st"/>
  <line x1="424" y1="200" x2="708" y2="200" class="st-red"/>
  <line x1="498" y1="106" x2="498" y2="200" class="st-red"/>
  <text x="412" y="122" class="lab2">配物</text>
  <text x="560" y="122" class="lab2">主体 + 次体</text>
  <text x="520" y="220" class="lab2">投影＝一整块最暗</text>
  <text x="404" y="250" class="lab2">两刀之后，才允许画具体的圆和方</text>

  <text x="18" y="278" class="lab2">切分线只是脑子里的辅助线，画在纸上也要能擦掉；它的唯一作用是逼你先决定"哪一块最黑、哪一块最白"。</text>
</svg>