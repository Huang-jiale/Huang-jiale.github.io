<svg viewBox="0 0 760 300" role="img" aria-label="构图的四个判据" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="24" class="labk">构图四判据：✓ 正确 / ✗ 太大 / ✗ 太小 / ✗ 偏且贴底</text>

  <g class="st-thin"><rect x="18" y="46" width="150" height="196" fill="none"/>
  <line x1="68" y1="46" x2="68" y2="242"/><line x1="118" y1="46" x2="118" y2="242"/>
  <line x1="18" y1="111" x2="168" y2="111"/><line x1="18" y1="176" x2="168" y2="176"/></g>
  <path d="M93 118 L35 100 L97 88 L151 106 Z" class="st" fill="#f2f2f2"/>
  <path d="M93 118 L35 100 L35 204 L93 222 Z" class="st" fill="#dcdcdc"/>
  <path d="M93 118 L151 106 L151 210 L93 222 Z" class="st" fill="#8f8f8f"/>
  <text x="18" y="262" class="lab2">✓ 主体占宽 1/2–2/3</text>
  <text x="18" y="280" class="lab2">上留白 &lt; 下留白</text>

  <g class="st-bad"><rect x="202" y="46" width="150" height="196" fill="none"/>
  <path d="M277 90 L212 70 L280 56 L344 76 Z" fill="none"/>
  <path d="M277 90 L212 70 L212 206 L277 226 Z" fill="none"/>
  <path d="M277 90 L344 76 L344 212 L277 226 Z" fill="none"/></g>
  <text x="202" y="262" class="lab2">✗ 撑满四边</text>
  <text x="202" y="280" class="lab2">画面胀、没有呼吸</text>

  <g class="st-thin"><rect x="386" y="46" width="150" height="196" fill="none"/></g>
  <g class="st-bad"><path d="M461 150 L430 140 L464 133 L492 143 Z" fill="none"/>
  <path d="M461 150 L430 140 L430 190 L461 200 Z" fill="none"/>
  <path d="M461 150 L492 143 L492 194 L461 200 Z" fill="none"/></g>
  <text x="386" y="262" class="lab2">✗ 物体太小</text>
  <text x="386" y="280" class="lab2">细节无处可画</text>

  <g class="st-thin"><rect x="570" y="46" width="150" height="196" fill="none"/></g>
  <g class="st-bad"><path d="M610 168 L578 156 L613 146 L644 158 Z" fill="none"/>
  <path d="M610 168 L578 156 L578 220 L610 232 Z" fill="none"/>
  <path d="M610 168 L644 158 L644 226 L610 232 Z" fill="none"/></g>
  <line x1="570" y1="203" x2="720" y2="203" class="st-red"/>
  <text x="570" y="262" class="lab2">✗ 偏左且贴底边</text>
  <text x="570" y="280" class="lab2">红线 = 最低点应在此</text>
</svg>