<svg viewBox="0 0 760 250" role="img" aria-label="圆柱的明暗分布" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="24" class="labk">光从左上方来 → 柱面明度只沿水平方向变化</text>
  <g class="st-blue"><line x1="40" y1="46" x2="120" y2="86"/><line x1="80" y1="38" x2="160" y2="78"/></g>
  <text x="18" y="42" class="lab2">光线</text>
  <rect x="150" y="70" width="120" height="140" fill="#f2f2f2"/>
  <rect x="150" y="70" width="34" height="140" fill="#dcdcdc"/>
  <rect x="184" y="70" width="30" height="140" fill="#9a9a9a"/>
  <rect x="214" y="70" width="26" height="140" fill="#5a5a5a"/>
  <rect x="240" y="70" width="30" height="140" fill="#8f8f8f"/>
  <rect x="270" y="70" width="14" height="140" fill="#4f4f4f"/>
  <path d="M240 70 L240 210" class="st-red" stroke-width="6" opacity=".5"/>
  <text x="298" y="86" class="labk">明暗交界线</text>
  <text x="298" y="106" class="lab2">一条竖直的带，与轴平行</text>
  <text x="298" y="124" class="lab2">上下一样深（柱面不竖着弯）</text>
  <ellipse cx="210" cy="70" rx="60" ry="17" class="st" fill="#fff"/>
  <path d="M150 210 A60 17 0 0 0 270 210" class="st" fill="#8f8f8f"/>
  <path d="M150 210 A60 17 0 0 1 270 210" class="st-thin" fill="none"/>
  <text x="298" y="160" class="lab">顶面：整片平涂一个灰</text>
  <text x="298" y="180" class="lab2">顶面是平面，明度不变化，只比灰面浅一档</text>
  <text x="150" y="240" class="lab2">✗ 常见错误：在柱子上下两端各压一道黑 → 变成"灯笼"</text>
</svg>