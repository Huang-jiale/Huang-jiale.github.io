<svg viewBox="0 0 760 280" role="img" aria-label="等大比较法：以短边为单位量全场" xmlns="http://www.w3.org/2000/svg" width="760" height="280"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="280" class="bg-paper"/>
  <text x="18" y="24" class="labk">选一个"单位"（通常是最短的可见边），然后全场都用它量</text>

  <g class="st"><path d="M60 96 L140 76 L200 96 L200 196 L140 216 L60 196 Z" fill="#f2f2f2"/>
  <path d="M140 76 L140 216 M60 96 L140 76 M140 216 L60 196" fill="none"/></g>
  <line x1="60" y1="96" x2="60" y2="196" class="st-red" stroke-width="3"/>
  <text x="14" y="150" class="lab">单位 u</text>

  <g class="st"><path d="M280 130 A52 52 0 1 1 281 130" fill="#f2f2f2"/></g>
  <line x1="280" y1="78" x2="280" y2="182" class="st-blue"/>
  <text x="340" y="120" class="lab2">球 = 1.0 u</text>

  <g class="st"><path d="M470 108 L520 96 L520 186 L470 198 Z" fill="#f2f2f2"/>
  <ellipse cx="495" cy="102" rx="25" ry="7"/></g>
  <line x1="440" y1="96" x2="440" y2="198" class="st-blue"/>
  <text x="430" y="222" class="lab2">圆柱高 = 1.6 u</text>
  <text x="528" y="150" class="lab2">宽 = 0.8 u</text>

  <g class="st-thin"><rect x="644" y="68" width="104" height="152" fill="none"/>
  <line x1="644" y1="80" x2="748" y2="80"/></g>
  <text x="650" y="60" class="lab">换算表</text>
  <text x="652" y="98" class="lab2">棱</text>
  <text x="652" y="122" class="lab2">球</text>
  <text x="652" y="146" class="lab2">柱高</text>
  <text x="652" y="170" class="lab2">柱宽</text>
  <text x="652" y="194" class="lab2">间距</text>
  <text x="652" y="214" class="lab2">总宽</text>
  <text x="722.4" y="98" class="lab2" text-anchor="end">1.0 u</text>
  <text x="722.4" y="122" class="lab2" text-anchor="end">1.0 u</text>
  <text x="722.4" y="146" class="lab2" text-anchor="end">1.6 u</text>
  <text x="722.4" y="170" class="lab2" text-anchor="end">0.8 u</text>
  <text x="722.4" y="194" class="lab2" text-anchor="end">0.5 u</text>
  <text x="722.4" y="214" class="lab2" text-anchor="end">4.2 u</text>
  <text x="26" y="248" class="lab">动作要领：手臂完全伸直、肘关节锁死、闭一只眼、笔尖与拇指做标记。</text>
  <text x="26" y="268" class="lab2">球的直径与立方体的棱等长；屈肘会让笔"变近"，读数系统性偏小。</text>
</svg>