<svg viewBox="0 0 760 250" role="img" aria-label="先方后圆的切圆法" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="24" class="labk">正方形 → 八边形 → 圆：四步</text>

  <text x="40" y="56" class="lab">① 定正方形（边长=直径）</text>
  <rect x="40" y="70" width="120" height="120" class="st" fill="none"/>
  <g class="dot"><circle cx="100" cy="70" r="3.5"/><circle cx="100" cy="190" r="3.5"/>
  <circle cx="40" cy="130" r="3.5"/><circle cx="160" cy="130" r="3.5"/></g>
  <text x="44" y="212" class="lab2">四个切点是"锚"</text>

  <text x="230" y="56" class="lab">② 切四角（约 1/4 边长）</text>
  <path d="M252 70 L328 70 L350 92 L350 168 L328 190 L252 190 L230 168 L230 92 Z" class="st" fill="none"/>
  <text x="232" y="212" class="lab2">八边形，宁少切不多切</text>

  <text x="420" y="56" class="lab">③ 连八段短弧</text>
  <circle cx="480" cy="130" r="60" class="st" fill="none"/>
  <g class="dot"><circle cx="480" cy="70" r="3.5"/><circle cx="480" cy="190" r="3.5"/>
  <circle cx="420" cy="130" r="3.5"/><circle cx="540" cy="130" r="3.5"/></g>
  <g class="st-thin"><line x1="437" y1="87" x2="424" y2="100"/><line x1="523" y1="87" x2="536" y2="100"/></g>
  <text x="424" y="212" class="lab2">弧过切点，压住中点</text>

  <text x="600" y="56" class="lab">④ 转纸修圆</text>
  <circle cx="660" cy="130" r="60" class="st-ok" fill="#f2f2f2"/>
  <text x="604" y="212" class="lab2">每次转 30°，检查对称</text>
</svg>