<svg viewBox="0 0 760 262" role="img" aria-label="遮挡、近大远小与近实远虚" xmlns="http://www.w3.org/2000/svg" width="760" height="262"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="262" class="bg-paper"/>
  <text x="18" y="24" class="labk">① 遮挡关系要"咬住" ② 近大远小 ③ 近实远虚</text>

  <g class="st-thin"><line x1="30" y1="196" x2="330" y2="196"/></g>
  <path d="M60 120 L120 104 L120 176 L60 192 Z" class="st" fill="#bfbfbf"/>
  <circle cx="150" cy="150" r="34" class="st" fill="#8f8f8f"/>
  <path d="M116 150 A34 34 0 0 1 150 116" class="st-thin" fill="none"/>
  <text x="60" y="222" class="lab">✓ 球在前：球的轮廓完整，立方体被它"咬断"</text>
  <text x="60" y="240" class="lab2">✗ 错误：把被挡的边画穿过去 → 前后消失</text>
  <path d="M116 150 L150 116" class="st-bad"/>

  <g class="st"><rect x="390" y="150" width="56" height="56" fill="#dcdcdc"/>
  <rect x="470" y="140" width="42" height="42" fill="#dcdcdc"/>
  <rect x="530" y="132" width="30" height="30" fill="#dcdcdc"/>
  <rect x="576" y="126" width="20" height="20" fill="#dcdcdc"/></g>
  <g class="st-thin"><line x1="390" y1="150" x2="596" y2="126"/></g>
  <text x="390" y="228" class="lab2">② 等大的物体排开：顶边连线必须是平滑斜线</text>
  <text x="390" y="246" class="lab2">若连线出现折角，说明某一段画大了/画小了</text>

  <g class="st"><rect x="650" y="120" width="60" height="60" fill="#dcdcdc"/></g>
  <g class="st-thin" stroke-dasharray="0" opacity=".45"><rect x="700" y="96" width="40" height="40" fill="#eaeaea"/></g>
  <text x="628" y="60" class="lab2">③ 远处：对比降一档、</text>
  <text x="628" y="78" class="lab2">边缘断开、细节取消</text>
</svg>