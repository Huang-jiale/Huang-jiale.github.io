<svg viewBox="0 0 760 250" role="img" aria-label="同一张立方体画的五个阶段" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="24" class="labk">同一张画在五个阶段的样子（从左到右推进）</text>

  <text x="26" y="56" class="lab">① 构图</text>
  <g class="st-thin"><rect x="26" y="66" width="110" height="130" fill="none"/>
  <line x1="26" y1="176" x2="136" y2="176"/></g>
  <g class="dot"><circle cx="81" cy="80" r="3"/><circle cx="81" cy="186" r="3"/></g>
  <text x="28" y="214" class="lab2">4 个定位点</text>

  <text x="176" y="56" class="lab">② 取形</text>
  <g class="st"><path d="M176 96 L216 86 L252 98 L252 166 L216 178 L176 168 Z" fill="none"/>
  <path d="M216 86 L216 178" fill="none"/></g>
  <g class="st-thin"><path d="M176 96 L216 168 L252 98" fill="none"/></g>
  <text x="178" y="214" class="lab2">线框 + 透视校验</text>

  <text x="292" y="56" class="lab">③ 铺大调子</text>
  <path d="M292 96 L332 86 L368 98 L368 166 L332 178 L292 168 Z" class="st" fill="#f2f2f2"/>
  <path d="M332 86 L332 178" class="st" fill="none"/>
  <path d="M332 86 L368 98 L368 166 L332 178 Z" fill="#8f8f8f" stroke="none"/>
  <path d="M368 166 L392 176 L360 186 L332 178 Z" fill="#4f4f4f" stroke="none"/>
  <text x="294" y="214" class="lab2">只有三档 + 投影</text>

  <text x="418" y="56" class="lab">④ 深入刻画</text>
  <path d="M418 96 L458 86 L494 98 L494 166 L458 178 L418 168 Z" class="st" fill="#f2f2f2"/>
  <path d="M458 86 L458 178" class="st" fill="none"/>
  <path d="M458 86 L494 98 L494 166 L458 178 Z" fill="#5a5a5a" stroke="none"/>
  <path d="M418 96 L458 86 L458 178 L418 168 Z" fill="#dcdcdc" stroke="none"/>
  <path d="M494 166 L518 176 L486 186 L458 178 Z" fill="#303030" stroke="none"/>
  <text x="420" y="214" class="lab2">交界线、反光、边缘</text>

  <text x="548" y="56" class="lab">⑤ 统一调整</text>
  <path d="M548 96 L588 86 L624 98 L624 166 L588 178 L548 168 Z" class="st" fill="#f2f2f2"/>
  <path d="M588 86 L588 178" class="st" fill="none"/>
  <path d="M588 86 L624 98 L624 166 L588 178 Z" fill="#4f4f4f" stroke="none"/>
  <path d="M548 96 L588 86 L588 178 L548 168 Z" fill="#cfcfcf" stroke="none"/>
  <path d="M624 166 L648 176 L616 186 L588 178 Z" fill="#2a2a2a" stroke="none"/>
  <g class="st-thin"><path d="M548 168 L588 178 L624 166" fill="none"/></g>
  <text x="550" y="214" class="lab2">远看：该虚的虚下去了</text>
</svg>