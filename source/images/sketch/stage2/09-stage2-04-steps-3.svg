<svg viewBox="0 0 760 300" role="img" aria-label="五步中的自我评价曲线与实际画面质量曲线" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="24" class="labk">两条曲线的错位：你觉得最糟的那一刻，画面其实正好</text>
  <g class="st-thin"><line x1="90" y1="50" x2="90" y2="220"/><line x1="240" y1="50" x2="240" y2="220"/>
  <line x1="390" y1="50" x2="390" y2="220"/><line x1="545" y1="50" x2="545" y2="220"/><line x1="700" y1="50" x2="700" y2="220"/>
  <line x1="90" y1="220" x2="700" y2="220"/></g>
  <text x="66" y="60" class="lab2">好</text>
  <text x="60" y="216" class="lab2">糟</text>

  <polyline points="90,196 240,168 390,120 545,86 700,62" class="st-ok"/>
  <g class="dot"><circle cx="90" cy="196" r="3"/><circle cx="240" cy="168" r="3"/><circle cx="390" cy="120" r="3"/>
  <circle cx="545" cy="86" r="3"/><circle cx="700" cy="62" r="3"/></g>
  <text x="560" y="52" class="labk" fill="#2f7d42">— 画面实际完成度</text>

  <polyline points="90,112 240,150 390,206 545,164 700,78" class="st-bad"/>
  <text x="516" y="128" class="lab2" fill="#c0392b">-- 你的自我感觉</text>

  <text x="72" y="242" class="lab">① 构图</text>
  <text x="216" y="242" class="lab">② 起形</text>
  <text x="360" y="242" class="lab">③ 铺大调子</text>
  <text x="520" y="242" class="lab">④ 深入</text>
  <text x="676" y="242" class="lab">⑤ 调整</text>

  <text x="18" y="262" class="lab2">崩点就在 ③：全纸黑灰、没有层次，是"最想撕纸"的时刻。</text>
  <text x="18" y="278" class="lab2">此时唯一正确的动作是——退后 3 米看一眼，然后继续往 ④ 走。</text>
  <text x="18" y="294" class="lab2">红线在 ④ 才回升：好看来不及出现在 ③，只能出现在关系整理完之后。</text>
</svg>