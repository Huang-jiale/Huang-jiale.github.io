<svg viewBox="0 0 760 300" role="img" aria-label="明暗交界线的成因与位置" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="24" class="labk">左：交界线从哪来 右：位置决定鼓与瘪</text>

  <circle cx="150" cy="160" r="96" class="st" fill="#f2f2f2"/>
  <g class="st-blue"><line x1="30" y1="60" x2="110" y2="98"/><line x1="60" y1="42" x2="140" y2="80"/>
  <line x1="96" y1="30" x2="176" y2="68"/></g>
  <text x="24" y="52" class="lab2">光线</text>
  <text x="24" y="70" class="lab2">45°</text>
  <path d="M214 92 A96 96 0 0 1 176 250" class="st-red" stroke-width="10" opacity=".55"/>
  <line x1="256" y1="116" x2="222" y2="112" class="st-thin"/>
  <text x="262" y="120" class="labk">明暗交界线</text>
  <text x="262" y="140" class="lab2">是一条有宽度的"带"</text>
  <text x="262" y="158" class="lab2">最重处约 8–9 度</text>
  <circle cx="96" cy="106" r="12" fill="#fff" stroke="none"/>
  <text x="30" y="270" class="lab2">高光不在最亮那一格的中心，而在受光最正面</text>

  <text x="420" y="60" class="lab">✓ 交界线离轮廓有距离 → 鼓</text>
  <circle cx="470" cy="130" r="52" class="st" fill="#f2f2f2"/>
  <path d="M498 86 A52 52 0 0 1 498 174" class="st-red" stroke-width="8" opacity=".5"/>
  <text x="420" y="204" class="lab2">灰面带宽、过渡长，体积感强</text>

  <text x="610" y="60" class="lab">✗ 贴到轮廓 → 瘪</text>
  <circle cx="660" cy="130" r="52" class="st" fill="#f2f2f2"/>
  <path d="M700 92 A52 52 0 0 1 700 168" class="st-bad" stroke-width="6"/>
  <text x="610" y="204" class="lab2">黑边贴轮廓 → 变圆片</text>

  <text x="420" y="252" class="labk">检验方法：把手掌竖在球与交界线之间</text>
  <text x="420" y="274" class="lab2">如果手掌能完全落在亮部里，说明交界线画得太靠外（太贴轮廓）</text>
</svg>