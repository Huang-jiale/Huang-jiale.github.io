<svg viewBox="0 0 760 268" role="img" aria-label="三种光源高度对应的投影长度" xmlns="http://www.w3.org/2000/svg" width="760" height="268"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="268" class="bg-paper"/>
  <text x="18" y="24" class="labk">同一只 20cm 方体 · 三种光源高度 · 侧视投影（深色楔形 = 投影）</text>

  <g class="st-blue"><line x1="24" y1="70" x2="60" y2="164"/><line x1="44" y1="62" x2="80" y2="156"/></g>
  <rect x="40" y="164" width="36" height="36" class="st f-g3"/>
  <path d="M76 164 L76 200 L89 200 Z" class="st f-g5"/>
  <line x1="40" y1="200" x2="250" y2="200" class="st-thin"/>
  <line x1="76" y1="164" x2="89" y2="200" class="st-red"/>
  <text x="24" y="222" class="labk">θ = 70°（顶光）</text>
  <text x="24" y="240" class="lab2">L = 20 ÷ tan70° ≈ 7cm ＝ 0.37h</text>
  <text x="24" y="258" class="lab2">投影缩在脚下，桌面留白最多</text>

  <g class="st-blue"><line x1="268" y1="72" x2="326" y2="164"/><line x1="290" y1="66" x2="348" y2="158"/></g>
  <rect x="306" y="164" width="36" height="36" class="st f-g3"/>
  <path d="M342 164 L342 200 L378 200 Z" class="st f-g5"/>
  <line x1="306" y1="200" x2="500" y2="200" class="st-thin"/>
  <line x1="342" y1="164" x2="378" y2="200" class="st-red"/>
  <text x="286" y="222" class="labk">θ = 45°（标准光位）</text>
  <text x="286" y="240" class="lab2">L = 20 ÷ tan45° = 20cm ＝ 1.0h</text>
  <text x="286" y="258" class="lab2">与物体等大，最好组织画面</text>

  <g class="st-blue"><line x1="516" y1="118" x2="580" y2="164"/><line x1="528" y1="106" x2="592" y2="152"/></g>
  <rect x="576" y="164" width="36" height="36" class="st f-g3"/>
  <path d="M612 164 L612 200 L689 200 Z" class="st f-g5"/>
  <line x1="576" y1="200" x2="744" y2="200" class="st-thin"/>
  <line x1="612" y1="164" x2="689" y2="200" class="st-red"/>
  <text x="520" y="222" class="labk">θ = 25°（低角度侧光）</text>
  <text x="520" y="240" class="lab2">L = 20 ÷ tan25° ≈ 43cm ＝ 2.1h</text>
  <text x="520" y="258" class="lab2">投影成主角，须整体提浅</text>
</svg>