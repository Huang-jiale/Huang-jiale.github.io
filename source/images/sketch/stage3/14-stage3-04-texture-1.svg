<svg viewBox="0 0 760 230" role="img" aria-label="五种材质的高光形状对比" xmlns="http://www.w3.org/2000/svg" width="760" height="230"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="230" class="bg-paper"/>
  <text x="18" y="26" class="labk">同一束左上方的光：五种材质的高光长什么样</text>
  <circle cx="80" cy="100" r="42" class="st f-g4"/>
  <rect x="40" y="88" width="80" height="10" class="f-white"/>
  <rect x="40" y="98" width="80" height="14" class="f-g5"/>
  <rect x="62" y="58" width="9" height="28" class="f-white"/>
  <text x="42" y="168" class="lab">金属（抛光）</text>
  <text x="26" y="186" class="lab2">硬边亮带 + 突变暗带</text>
  <text x="26" y="204" class="lab2">几乎没有中间灰</text>
  <circle cx="220" cy="100" r="42" class="st f-g3"/>
  <ellipse cx="205" cy="82" rx="14" ry="9" class="f-white"/>
  <ellipse cx="228" cy="76" rx="5" ry="3" class="f-white"/>
  <text x="188" y="168" class="lab">釉陶 / 白瓷</text>
  <text x="166" y="186" class="lab2">小而硬，形状跟着曲面走</text>
  <text x="166" y="204" class="lab2">位置精确在肩上，不许乱挪</text>
  <circle cx="360" cy="100" r="42" class="st f-white"/>
  <path d="M324 79 Q318 100 324 121" class="st" stroke-width="5"/>
  <path d="M396 79 Q402 100 396 121" class="st" stroke-width="5"/>
  <path d="M336 66 Q360 56 384 66" class="st" stroke-width="3"/>
  <text x="330" y="168" class="lab">玻璃</text>
  <text x="306" y="186" class="lab2">亮的中间、黑的两侧边缘</text>
  <text x="306" y="204" class="lab2">高光是边缘上的白色断点</text>
  <circle cx="500" cy="100" r="42" class="st f-g2"/>
  <ellipse cx="486" cy="82" rx="20" ry="14" class="f-g1"/>
  <circle cx="480" cy="78" r="4" class="f-white"/>
  <text x="474" y="168" class="lab">苹果 / 梨</text>
  <text x="446" y="186" class="lab2">大而糊的一片 + 一个次级点</text>
  <text x="446" y="204" class="lab2">蜡质层：亮部边缘也要糊</text>
  <circle cx="640" cy="100" r="42" class="st f-g2"/>
  <path d="M602 90 Q640 58 678 90 Q640 104 602 90 Z" class="f-g1"/>
  <path d="M612 118 L668 112 M614 132 L666 126" class="st-thin"/>
  <text x="620" y="168" class="lab">粗布</text>
  <text x="596" y="186" class="lab2">没有高光，只有受光的顶面</text>
  <text x="596" y="204" class="lab2">纹理靠排线方向，不靠点</text>
</svg>