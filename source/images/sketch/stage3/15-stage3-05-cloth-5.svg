<svg viewBox="0 0 760 250" role="img" aria-label="三种接触方式的剖面与明暗" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="26" class="labk">侧视剖面：最黑的那一条到底在哪</text>
  <line x1="30" y1="180" x2="250" y2="180" class="st"/>
  <rect x="100" y="110" width="70" height="66" class="st f-none"/>
  <path d="M100 176 C92 170 86 176 78 178" class="st"/>
  <path d="M170 176 C180 168 188 176 198 178" class="st"/>
  <rect x="170" y="172" width="26" height="8" class="f-g5"/>
  <rect x="76" y="172" width="22" height="8" class="f-g4"/>
  <text x="40" y="212" class="lab">① 重压：最黑在物体外侧 3~6mm</text>
  <text x="40" y="230" class="lab2">贴着物体的那条边反而亮（受物体反光）</text>
  <line x1="290" y1="180" x2="510" y2="180" class="st"/>
  <rect x="356" y="126" width="70" height="50" class="st-thin f-none"/>
  <path d="M340 132 L368 118 L424 118 L444 132 L436 152 L420 176 L360 176 L346 150 Z" class="st"/>
  <rect x="346" y="164" width="14" height="12" class="f-g5"/>
  <rect x="424" y="164" width="14" height="12" class="f-g5"/>
  <text x="300" y="212" class="lab">② 轻搭：黑在两个转角，中间留反光</text>
  <text x="300" y="230" class="lab2">布面 3~4 级，转角 8 级，宽 20~30mm 缓变</text>
  <line x1="550" y1="180" x2="740" y2="180" class="st"/>
  <path d="M600 180 L640 132 L690 140 L700 176" class="st"/>
  <rect x="636" y="172" width="58" height="8" class="f-g5"/>
  <text x="556" y="212" class="lab">③ 悬空：翘边下硬黑一条 2~4mm</text>
  <text x="556" y="230" class="lab2">黑带外侧直接跳到 5~6 级</text>
</svg>