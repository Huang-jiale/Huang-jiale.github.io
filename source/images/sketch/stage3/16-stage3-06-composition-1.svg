<svg viewBox="0 0 760 300" role="img" aria-label="三角形、S 形与一字形构图" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="26" class="labk">三种构图：块面位置 + 视线走向（蓝线）</text>
  <rect x="20" y="46" width="220" height="160" class="st f-white"/>
  <line x1="93" y1="46" x2="93" y2="206" class="st-thin"/>
  <line x1="167" y1="46" x2="167" y2="206" class="st-thin"/>
  <line x1="20" y1="99" x2="240" y2="99" class="st-thin"/>
  <line x1="20" y1="153" x2="240" y2="153" class="st-thin"/>
  <circle cx="86" cy="150" r="30" class="st f-g3"/>
  <circle cx="162" cy="164" r="22" class="st f-g1"/>
  <circle cx="124" cy="98" r="17" class="st f-g2"/>
  <path d="M86 150 L162 164 L124 98 Z" class="st-blue"/>
  <text x="24" y="228" class="lab">三角形（3~5 件，最稳）</text>
  <text x="24" y="246" class="lab2">最高点落在上 1/3 线附近，底边不水平</text>
  <text x="24" y="264" class="lab2">上留白 ≈ 下留白 × 1.8</text>
  <rect x="270" y="46" width="220" height="160" class="st f-white"/>
  <circle cx="306" cy="176" r="24" class="st f-g2"/>
  <circle cx="360" cy="140" r="18" class="st f-g1"/>
  <circle cx="412" cy="104" r="21" class="st f-g3"/>
  <circle cx="452" cy="168" r="14" class="st f-g4"/>
  <path d="M292 196 C326 150 344 190 376 150 C400 120 424 152 458 120" class="st-blue"/>
  <text x="274" y="228" class="lab">S 形（4 件以上 + 布）</text>
  <text x="274" y="246" class="lab2">中段只放布，不放物体</text>
  <text x="274" y="264" class="lab2">第二个弯正好压在视觉中心上</text>
  <rect x="520" y="46" width="220" height="160" class="st f-white"/>
  <circle cx="562" cy="152" r="20" class="st f-g2"/>
  <circle cx="624" cy="146" r="28" class="st f-g5"/>
  <circle cx="688" cy="154" r="17" class="st f-g1"/>
  <line x1="536" y1="188" x2="712" y2="188" class="st-blue"/>
  <text x="524" y="228" class="lab">一字形（3~4 件并排）</text>
  <text x="524" y="246" class="lab2">最容易"平"：只有中间那件给 9 级</text>
  <text x="524" y="264" class="lab2">两侧压到 6 级、边缘画虚</text>
  <text x="18" y="292" class="lab2">蓝线 = 视线的走法。好构图的标志是：视线走完一圈后，会自己回到主体上，而不是被弹到画外。</text>
</svg>