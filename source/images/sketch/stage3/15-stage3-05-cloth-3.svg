  <text x="30" y="236" class="lab">⑤ 张力：两点之间最亮最平</text>
  <text x="30" y="254" class="lab2">带子上几乎没有褶，褶只在两端之外</text>
  <rect x="270" y="42" width="230" height="170" class="st-thin f-none"/>
