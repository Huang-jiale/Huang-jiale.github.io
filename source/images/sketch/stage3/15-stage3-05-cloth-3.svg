 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="280" class="bg-paper"/>
  <text x="18" y="26" class="labk">后三种：张力 / 袋状 / 堆叠</text>
  <rect x="20" y="42" width="230" height="170" class="st-thin f-none"/>
  <circle cx="52" cy="70" r="3" class="dot"/>
  <circle cx="220" cy="104" r="3" class="dot"/>
