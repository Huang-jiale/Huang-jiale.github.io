  <path d="M304 92 C340 156 430 156 466 92 L470 80 C434 148 336 148 300 80 Z" class="f-g4"/>
  <text x="280" y="236" class="lab">⑥ 袋状：兜内整片压暗</text>
  <text x="280" y="254" class="lab2">7~8 级成块，不许在兜里画小褶</text>
  <rect x="520" y="42" width="220" height="170" class="st-thin f-none"/>
  <line x1="524" y1="196" x2="736" y2="196" class="st"/>
  <path d="M548 96 C560 88 596 88 606 96" class="st"/>
  <path d="M540 122 C556 112 604 112 620 122" class="st"/>
  <path d="M532 148 C552 136 616 136 636 148" class="st"/>
  <path d="M526 172 C550 158 626 158 652 172" class="st"/>
  <path d="M522 190 C548 176 634 176 664 190" class="st"/>
  <path d="M540 126 C556 116 604 116 620 126 L616 132 C600 124 558 124 544 132 Z" class="f-g5"/>
  <path d="M532 152 C552 140 616 140 636 152 L632 158 C614 148 554 148 536 158 Z" class="f-g5"/>
  <text x="530" y="236" class="lab">⑦ 堆叠：一圈圈同心弧</text>
  <text x="524" y="254" class="lab2">每圈只画上缘亮、下缘一条暗，越靠下越扁</text>
