<svg viewBox="0 0 760 290" role="img" aria-label="剖面椭圆的正确与错误画法" xmlns="http://www.w3.org/2000/svg" width="760" height="290"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="290" class="bg-paper"/>
  <text x="18" y="26" class="labk">剖面三刀：对（左）与三种典型错法（右）</text>
  <line x1="380" y1="40" x2="380" y2="270" class="st-thin"/>
  <line x1="170" y1="58" x2="170" y2="240" class="st-blue"/>
  <line x1="100" y1="58" x2="100" y2="216" class="st-ok"/>
  <line x1="240" y1="58" x2="240" y2="216" class="st-ok"/>
  <ellipse cx="170" cy="58" rx="70" ry="12" class="st-ok"/>
  <ellipse cx="170" cy="140" rx="70" ry="18" class="st-ok"/>
  <ellipse cx="170" cy="216" rx="70" ry="25" class="st-ok"/>
  <line x1="100" y1="58" x2="240" y2="58" class="st-red"/>
  <line x1="100" y1="216" x2="240" y2="216" class="st-red"/>
  <text x="40" y="264" class="labk">对</text>
  <text x="66" y="264" class="lab2">口 12 → 肚 18 → 底 25：离视平线越远越圆</text>
  <text x="252" y="86" class="lab2">长轴水平、垂直于中轴</text>
  <line x1="560" y1="52" x2="572" y2="240" class="st-red"/>
  <line x1="490" y1="58" x2="490" y2="216" class="st-bad"/>
  <line x1="630" y1="58" x2="630" y2="216" class="st-bad"/>
  <ellipse cx="560" cy="58" rx="70" ry="12" class="st-bad"/>
  <ellipse cx="560" cy="140" rx="70" ry="12" class="st-bad" transform="rotate(-11 560 140)"/>
  <line x1="490" y1="216" x2="630" y2="216" class="st-bad"/>
  <text x="406" y="264" class="labk">错</text>
  <text x="432" y="264" class="lab2">① 三个椭圆一样扁 ② 中间椭圆斜了 ③ 底画成直线 ④ 轴歪</text>
  <text x="642" y="120" class="lab2">← 轴一歪，两侧</text>
  <text x="642" y="138" class="lab2">宽度就不对称</text>
</svg>