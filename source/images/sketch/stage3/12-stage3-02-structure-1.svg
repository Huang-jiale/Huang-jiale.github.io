<svg viewBox="0 0 760 320" role="img" aria-label="罐子的结构素描：五种线与四种轻重" xmlns="http://www.w3.org/2000/svg" width="760" height="320"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="320" class="bg-paper"/>
  <text x="18" y="26" class="labk">一只罐子的结构素描：五种线，四种轻重</text>
  <line x1="250" y1="30" x2="250" y2="272" class="st-blue"/>
  <ellipse cx="250" cy="64" rx="40" ry="10" class="st"/>
  <path d="M210 64 A40 10 0 0 1 290 64" class="st-thin"/>
  <ellipse cx="250" cy="68" rx="31" ry="7" class="st-thin"/>
  <path d="M210 64 C194 80 178 106 174 140 C169 178 182 212 206 234" class="st"/>
  <path d="M290 64 C306 80 322 106 326 140 C331 178 318 212 294 234" class="st" stroke-width="0.9"/>
  <path d="M206 234 A44 12 0 0 0 294 234" class="st"/>
  <path d="M206 234 A44 12 0 0 1 294 234" class="st-thin"/>
  <path d="M186 96 C206 88 294 88 314 96" class="st" stroke-width="2.4"/>
  <ellipse cx="250" cy="106" rx="68" ry="15" class="st-thin"/>
  <ellipse cx="250" cy="140" rx="76" ry="16" class="st-thin"/>
  <ellipse cx="250" cy="196" rx="73" ry="17" class="st-thin"/>
  <line x1="120" y1="246" x2="430" y2="246" class="st-red"/>
  <circle cx="206" cy="240" r="3" class="dot"/>
  <circle cx="294" cy="240" r="3" class="dot"/>
  <text x="440" y="66" class="lab">① 外轮廓：4B，最重（近边重、远边轻）</text>
  <text x="440" y="100" class="lab">② 交界线（颈与肩）：2B，次重</text>
  <text x="440" y="134" class="lab">③ 剖面椭圆：2B，前半重后半轻</text>
  <text x="440" y="168" class="lab">④ 中轴：HB 最轻，一条到底不断</text>
  <text x="440" y="202" class="lab">⑤ 隐藏线（内壁、背面）：HB 轻断线</text>
  <text x="440" y="248" class="lab">⑥ 基线：只在两个红点处压最黑</text>
  <text x="18" y="300" class="lab2">纸上没有蓝线红点：颜色只是图例。真实画面上 ④⑤ 是"几乎看不见的轻线"，⑥ 是"一小块很重的点"。</text>
</svg>