<svg viewBox="0 0 760 250" role="img" aria-label="方硬切线轮廓与柔软描边轮廓对比" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="26" class="labk">同一颗苹果：左「方」右「软」</text>
  <line x1="380" y1="40" x2="380" y2="236" class="st-thin"/>
  <polygon points="258,125 248,161 219,187 194,195 166,195 141,187 112,161 102,125 112,89 141,63 160,72 180,80 200,72 219,63 248,89" class="st-ok"/>
  <circle cx="258" cy="125" r="3" class="dot"/>
  <circle cx="102" cy="125" r="3" class="dot"/>
  <circle cx="180" cy="80" r="3" class="dot"/>
  <text x="40" y="222" class="labk">对</text>
  <text x="70" y="222" class="lab2">14 段直线，段段有依据，最大宽在两个红点</text>
  <path d="M638 125 C636 156 614 184 580 195 C550 205 514 194 496 170 C480 148 480 114 494 90 C508 66 540 52 568 58 C594 63 618 82 630 104 C635 113 638 118 638 125 Z" class="st-bad"/>
  <path d="M634 130 C630 160 606 188 574 198 C546 206 516 198 500 178" class="st-bad"/>
  <text x="500" y="44" class="lab2">← 同一条边描了两遍</text>
  <text x="418" y="222" class="labk">错</text>
  <text x="448" y="222" class="lab2">一根弧描到底：抖、软、没有体</text>
</svg>