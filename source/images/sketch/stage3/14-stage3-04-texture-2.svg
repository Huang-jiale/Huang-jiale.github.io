<svg viewBox="0 0 760 300" role="img" aria-label="材质在跨度与过渡带两个维度上的分布" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="26" class="labk">一张图记住六种材质：横轴过渡带宽度，纵轴明暗跨度</text>
  <line x1="90" y1="250" x2="700" y2="250" class="st"/>
  <line x1="90" y1="250" x2="90" y2="55" class="st"/>
  <text x="86" y="272" class="lab2">0mm</text>
  <text x="186" y="272" class="lab2">5</text>
  <text x="286" y="272" class="lab2">10</text>
  <text x="486" y="272" class="lab2">20</text>
  <text x="646" y="272" class="lab2">28mm</text>
  <text x="100" y="290" class="lab2">亮→暗用几毫米完成（过渡带越窄，材质越"硬"）</text>
  <text x="30" y="70" class="lab2">跨度大</text>
  <text x="30" y="240" class="lab2">跨度小</text>
  <path d="M100 70 C200 100 380 160 660 236" class="st-blue"/>
  <circle cx="100" cy="66" r="5" class="dot"/>
  <text x="112" y="62" class="lab">玻璃</text>
  <circle cx="130" cy="86" r="5" class="dot"/>
  <text x="142" y="82" class="lab">抛光金属</text>
  <circle cx="210" cy="120" r="5" class="dot"/>
  <text x="222" y="116" class="lab">釉陶 / 白瓷</text>
  <circle cx="290" cy="158" r="5" class="dot"/>
  <text x="302" y="154" class="lab">苹果 / 梨（蜡质）</text>
  <circle cx="490" cy="200" r="5" class="dot"/>
  <text x="502" y="196" class="lab">粗陶 / 土豆 / 木头</text>
  <circle cx="650" cy="234" r="5" class="dot"/>
  <text x="530" y="228" class="lab">棉麻布</text>
  <text x="430" y="252" class="lab2">六种材质几乎排在一条线上：越硬的材质跨度越大、过渡越快</text>
</svg>