<svg viewBox="0 0 760 240" role="img" aria-label="线重三级与前后关系" xmlns="http://www.w3.org/2000/svg" width="760" height="240"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="240" class="bg-paper"/>
  <text x="18" y="26" class="labk">一支 2B 的三种力度：轻重就是你的第二支橡皮</text>
  <line x1="60" y1="76" x2="230" y2="76" class="st" stroke-width="3.2"/>
  <text x="60" y="98" class="lab">重：外轮廓、朝向你的边</text>
  <line x1="60" y1="132" x2="230" y2="132" class="st" stroke-width="1.7"/>
  <text x="60" y="154" class="lab">中：剖面椭圆前半、交界线</text>
  <line x1="60" y1="188" x2="230" y2="188" class="st" stroke-width="0.7"/>
  <text x="248" y="192" class="lab2">轻：中轴、背面、辅助线</text>
  <ellipse cx="520" cy="62" rx="46" ry="12" class="st" stroke-width="2.2"/>
  <path d="M474 62 C456 96 448 136 452 176 C455 206 468 224 482 236" class="st" stroke-width="3.2"/>
  <path d="M566 62 C584 96 592 136 588 176 C585 206 572 224 558 236" class="st" stroke-width="0.9"/>
  <path d="M482 236 A38 11 0 0 0 558 236" class="st" stroke-width="2.6"/>
  <path d="M482 236 A38 11 0 0 1 558 236" class="st-thin"/>
  <text x="606" y="120" class="lab">近边重、远边轻</text>
  <text x="606" y="140" class="lab2">不调子也能分出前后</text>
  <text x="606" y="160" class="lab2">背面用轻断线</text>
  <text x="18" y="228" class="lab2">自测：把画上下颠倒看。正确时应有一侧明显"退到后面"；错的样子是四条边一样重，像铁丝圈。</text>
</svg>