<svg viewBox="0 0 760 300" role="img" aria-label="格子花纹随形透视压缩的正确与错误" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="26" class="labk">同一块格子布：花纹挤不挤，一眼定生死</text>
  <line x1="380" y1="40" x2="380" y2="286" class="st-thin"/>
  <path d="M110 74 L110 222 M114 74 L114 222 M126 74 L126 222 M145 74 L145 222 M170 74 L170 222 M180 74 L180 222 M190 74 L190 222 M215 74 L215 222 M234 74 L234 222 M246 74 L246 222 M250 74 L250 222" class="st-ok"/>
  <ellipse cx="180" cy="74" rx="70" ry="14" class="st-ok"/>
  <ellipse cx="180" cy="112" rx="70" ry="15" class="st-thin"/>
  <ellipse cx="180" cy="150" rx="70" ry="17" class="st-thin"/>
  <ellipse cx="180" cy="186" rx="70" ry="19" class="st-thin"/>
  <ellipse cx="180" cy="222" rx="70" ry="20" class="st-ok"/>
  <text x="36" y="266" class="labk">对</text>
  <text x="60" y="266" class="lab2">中心格宽最大，两侧挤到中心的约 1/4</text>
  <text x="60" y="284" class="lab2">横线越靠下越圆（离视平线越远）；暗部格子只留两条</text>
  <path d="M440 74 L440 222 M468 74 L468 222 M496 74 L496 222 M524 74 L524 222 M552 74 L552 222 M580 74 L580 222 M608 74 L608 222 M636 74 L636 222" class="st-bad"/>
  <ellipse cx="538" cy="74" rx="98" ry="14" class="st-bad"/>
  <line x1="440" y1="112" x2="636" y2="112" class="st-thin"/>
  <line x1="440" y1="150" x2="636" y2="150" class="st-thin"/>
  <line x1="440" y1="186" x2="636" y2="186" class="st-thin"/>
  <ellipse cx="538" cy="222" rx="98" ry="14" class="st-bad"/>
  <text x="400" y="266" class="labk">错</text>
  <text x="424" y="266" class="lab2">等间距 + 等宽 + 横线是直的 = 平面图案，体块立刻消失</text>
  <text x="650" y="150" class="lab2">← 每一格</text>
  <text x="650" y="168" class="lab2">一样宽</text>
</svg>