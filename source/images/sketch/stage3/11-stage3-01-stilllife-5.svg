<svg viewBox="0 0 760 150" role="img" aria-label="九十分钟作业的时间分配条" xmlns="http://www.w3.org/2000/svg" width="760" height="150"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="150" class="bg-paper"/>
  <text x="18" y="24" class="labk">90 分钟一张：前 15 分钟定形，最后 10 分钟才许碰细节</text>
  <rect x="30" y="52" width="62" height="34" class="st f-g1"/>
  <rect x="92" y="52" width="54" height="34" class="st f-g2"/>
  <rect x="146" y="52" width="233" height="34" class="st f-g3"/>
  <rect x="379" y="52" width="194" height="34" class="st f-g4"/>
  <rect x="573" y="52" width="78" height="34" class="st f-g5"/>
  <rect x="651" y="52" width="78" height="34" class="st-red f-none"/>
  <text x="30" y="104" class="lab2">0</text>
  <text x="88" y="104" class="lab2">8</text>
  <text x="140" y="104" class="lab2">15</text>
  <text x="371" y="104" class="lab2">45</text>
  <text x="565" y="104" class="lab2">70</text>
  <text x="643" y="104" class="lab2">80</text>
  <text x="712" y="104" class="lab2">90 分</text>
  <text x="30" y="130" class="lab2">① 构图取形 → ② 结构线 → ③ 铺大调子 → ④ 深化交界线与投影 → ⑤ 高光与反光 →</text>
  <text x="470" y="146" class="lab2">⑥ 果蒂 / 罐口厚度 / 斑点（红框，只许 10 分钟）</text>
</svg>