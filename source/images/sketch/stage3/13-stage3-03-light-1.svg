<svg viewBox="0 0 760 260" role="img" aria-label="光源的高度角与方位角定义" xmlns="http://www.w3.org/2000/svg" width="760" height="260"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="260" class="bg-paper"/>
  <text x="18" y="24" class="labk">两个参数：侧视看高度角 α，俯视看方位角 β</text>
  <text x="40" y="52" class="lab">侧视</text>
  <line x1="40" y1="210" x2="360" y2="210" class="st"/>
  <rect x="180" y="150" width="60" height="60" class="st f-none"/>
  <circle cx="150" cy="60" r="9" class="st-red"/>
  <path d="M142 56 L158 56 M150 48 L150 64 M145 51 L155 61 M155 51 L145 61" class="st-red"/>
  <line x1="158" y1="68" x2="300" y2="210" class="st-red"/>
  <rect x="240" y="205" width="60" height="5" class="f-g4"/>
  <path d="M270 210 A30 30 0 0 1 279 189" class="st"/>
  <text x="240" y="196" class="lab">α</text>
  <text x="248" y="238" class="lab2">影长 = 高 ÷ tan α</text>
  <text x="40" y="252" class="lab2">α 变小 → 影子变长、暗部面积变大、交界线往下走</text>
  <line x1="380" y1="40" x2="380" y2="250" class="st-thin"/>
  <text x="470" y="52" class="lab">俯视（你坐在桌前）</text>
  <rect x="530" y="120" width="60" height="60" class="st f-none"/>
  <line x1="560" y1="230" x2="560" y2="80" class="st-thin"/>
  <circle cx="560" cy="238" r="8" class="st"/>
  <text x="578" y="242" class="lab2">你</text>
  <line x1="470" y1="60" x2="546" y2="140" class="st-red"/>
  <path d="M536 128 L548 142 L534 144" class="st-red"/>
  <path d="M560 100 A40 40 0 0 0 534 88" class="st-ok"/>
  <text x="500" y="96" class="lab">β</text>
  <text x="400" y="196" class="lab2">β=0 顺光（交界线被藏住）</text>
  <text x="400" y="214" class="lab2">β=30~45 偏左（教科书光位）</text>
  <text x="400" y="232" class="lab2">β=90 正侧光（一半全黑）</text>
  <text x="620" y="112" class="lab">推荐区</text>
  <text x="620" y="130" class="lab2">α 40~50°</text>
  <text x="620" y="148" class="lab2">β 偏左 30~45°</text>
</svg>