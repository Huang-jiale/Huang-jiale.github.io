<svg viewBox="0 0 760 250" role="img" aria-label="不同高度角下投影长度的变化" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="26" class="labk">物高不变，α 从 70° 降到 15°：影长从 0.4 倍涨到 3.7 倍</text>
  <line x1="30" y1="190" x2="730" y2="190" class="st"/>
  <rect x="60" y="160" width="30" height="30" class="st f-none"/>
  <line x1="75" y1="60" x2="90" y2="160" class="st-red"/>
  <rect x="90" y="186" width="11" height="4" class="f-g4"/>
  <text x="52" y="212" class="lab2">70°</text>
  <text x="40" y="230" class="lab2">0.4 倍</text>
  <rect x="190" y="160" width="30" height="30" class="st f-none"/>
  <line x1="175" y1="90" x2="220" y2="160" class="st-red"/>
  <rect x="220" y="186" width="30" height="4" class="f-g4"/>
  <text x="186" y="212" class="lab2">45°</text>
  <text x="176" y="230" class="lab2">1.0 倍</text>
  <rect x="320" y="160" width="30" height="30" class="st f-none"/>
  <line x1="300" y1="110" x2="350" y2="160" class="st-red"/>
  <rect x="350" y="186" width="52" height="4" class="f-g4"/>
  <text x="320" y="212" class="lab2">30°</text>
  <text x="308" y="230" class="lab2">1.7 倍</text>
  <rect x="450" y="160" width="30" height="30" class="st f-none"/>
  <line x1="436" y1="126" x2="480" y2="160" class="st-red"/>
  <rect x="480" y="186" width="82" height="4" class="f-g4"/>
  <text x="452" y="212" class="lab2">20°</text>
  <text x="440" y="230" class="lab2">2.8 倍</text>
  <rect x="580" y="160" width="30" height="30" class="st f-none"/>
  <line x1="571" y1="140" x2="610" y2="160" class="st-red"/>
  <rect x="610" y="186" width="112" height="4" class="f-g4"/>
  <text x="584" y="212" class="lab2">15°</text>
  <text x="572" y="230" class="lab2">3.7 倍</text>
  <text x="60" y="60" class="lab2">灯高</text>
  <text x="300" y="110" class="lab2">光线</text>
</svg>