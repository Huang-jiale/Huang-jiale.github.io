<svg viewBox="0 0 760 300" role="img" aria-label="陶罐的五段解剖与剖面椭圆" xmlns="http://www.w3.org/2000/svg" width="760" height="300"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="300" class="bg-paper"/>
  <text x="18" y="26" class="labk">罐子的五段解剖：口 / 颈 / 肩 / 肚 / 底</text>
  <line x1="280" y1="34" x2="280" y2="258" class="st-blue"/>
  <text x="288" y="42" class="lab2">中轴</text>
  <ellipse cx="280" cy="58" rx="42" ry="11" class="st f-none"/>
  <ellipse cx="280" cy="62" rx="33" ry="8" class="st-thin"/>
  <path d="M238 58 C222 74 206 100 202 134 C197 172 210 206 234 228" class="st"/>
  <path d="M322 58 C338 74 354 100 358 134 C363 172 350 206 326 228" class="st"/>
  <path d="M234 228 A46 12 0 0 0 326 228" class="st"/>
  <path d="M234 228 A46 12 0 0 1 326 228" class="st-thin"/>
  <ellipse cx="280" cy="100" rx="70" ry="14" class="st-thin"/>
  <ellipse cx="280" cy="134" rx="78" ry="16" class="st-thin"/>
  <ellipse cx="280" cy="190" rx="75" ry="15" class="st-thin"/>
  <line x1="322" y1="58" x2="404" y2="52" class="st-thin"/>
  <line x1="336" y1="86" x2="404" y2="94" class="st-thin"/>
  <line x1="356" y1="112" x2="404" y2="130" class="st-thin"/>
  <line x1="358" y1="134" x2="404" y2="166" class="st-thin"/>
  <line x1="330" y1="222" x2="404" y2="202" class="st-thin"/>
  <text x="410" y="56" class="lab">① 口沿：外椭圆 + 内壁椭圆，厚 2~3mm</text>
  <text x="410" y="98" class="lab">② 颈：最窄处 = 肚径的 0.5~0.6</text>
  <text x="410" y="134" class="lab">③ 肩：转折最急，交界线在这里拐弯</text>
  <text x="410" y="170" class="lab">④ 肚：最大直径，决定罐子的"体重"</text>
  <text x="410" y="206" class="lab">⑤ 底：看不见的椭圆，必须画出来</text>
  <text x="18" y="282" class="lab2">自检：三个剖面椭圆的宽窄比应接近 0.90 : 1.00 : 0.96，长轴一律垂直于中轴；离视平线越近越扁（所以罐口比罐底扁）。</text>
</svg>