<svg viewBox="0 0 760 270" role="img" aria-label="主光、反射光与明度阶梯" xmlns="http://www.w3.org/2000/svg" width="760" height="270"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="270" class="bg-paper"/>
  <text x="18" y="24" class="labk">一盏灯 + 一块布：三束光的路径与对应的明度阶梯</text>
  <circle cx="90" cy="60" r="9" class="st-red"/>
  <line x1="99" y1="66" x2="250" y2="140" class="st-red"/>
  <path d="M240 132 L252 142 L238 146" class="st-red"/>
  <text x="60" y="42" class="lab">主光</text>
  <circle cx="290" cy="170" r="52" class="st f-none"/>
  <path d="M324 132 Q330 178 300 216" class="st-blue"/>
  <text x="336" y="150" class="lab2">交界带</text>
  <line x1="150" y1="222" x2="470" y2="222" class="st"/>
  <path d="M290 222 A52 12 0 0 0 394 222" class="f-g5"/>
  <line x1="394" y1="222" x2="470" y2="222" class="st" stroke-width="4"/>
  <line x1="200" y1="222" x2="280" y2="196" class="st-thin"/>
  <path d="M272 202 L282 195 L282 205" class="st-thin"/>
  <text x="150" y="246" class="lab2">桌面反射光：把暗部下方弹亮一级</text>
  <text x="396" y="246" class="lab2">闭塞：接触缝最黑（9 级）</text>
  <rect x="520" y="60" width="34" height="26" class="st f-white"/>
  <rect x="554" y="60" width="34" height="26" class="st f-g1"/>
  <rect x="588" y="60" width="34" height="26" class="st f-g2"/>
  <rect x="622" y="60" width="34" height="26" class="st f-g3"/>
  <rect x="656" y="60" width="34" height="26" class="st f-g4"/>
  <text x="520" y="104" class="lab">1 2 3 4 5</text>
  <text x="520" y="128" class="lab2">亮部 2 · 灰面 3~4 · 交界 7~8</text>
  <text x="520" y="146" class="lab2">反光 4~5 · 投影近 8~9 · 投影远 6</text>
  <text x="520" y="164" class="lab2">背景 3~4 · 闭塞 9</text>
  <text x="520" y="200" class="labk">✗ 两盏灯</text>
  <line x1="520" y1="222" x2="700" y2="222" class="st"/>
  <circle cx="560" cy="196" r="14" class="st-bad"/>
  <rect x="574" y="212" width="26" height="8" class="f-g4"/>
  <rect x="524" y="212" width="22" height="8" class="f-g3"/>
  <text x="606" y="196" class="lab2">← 两条投影、交界线断两截</text>
  <text x="606" y="214" class="lab2">解法：关顶灯，只留一盏</text>
</svg>