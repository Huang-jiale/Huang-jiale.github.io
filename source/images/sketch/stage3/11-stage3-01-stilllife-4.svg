<svg viewBox="0 0 760 270" role="img" aria-label="石膏、陶罐、苹果的明度剖面对比" xmlns="http://www.w3.org/2000/svg" width="760" height="270"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="270" class="bg-paper"/>
  <text x="18" y="26" class="labk">从亮部走到暗部：三种材质的明度剖面</text>
  <line x1="60" y1="225" x2="700" y2="225" class="st-thin"/>
  <text x="60" y="248" class="lab2">亮部（受光）</text>
  <text x="612" y="248" class="lab2">暗部（背光）</text>
  <text x="18" y="60" class="lab2">浅</text>
  <text x="18" y="215" class="lab2">深</text>
  <path d="M60 52 L300 52 L340 200 L700 200" class="st"/>
  <text x="356" y="196" class="lab">石膏球：过渡带 2~3mm</text>
  <path d="M60 118 L250 126 L420 176 L560 206 L700 210" class="st-blue"/>
  <text x="60" y="106" class="lab">陶罐：亮部本身就暗（5 级），过渡带 15~20mm</text>
  <path d="M60 74 L280 108 L400 168 L520 196 L640 186 L700 190" class="st-red"/>
  <text x="470" y="172" class="lab">苹果：过渡带 8mm + 暗部一条反光带</text>
</svg>