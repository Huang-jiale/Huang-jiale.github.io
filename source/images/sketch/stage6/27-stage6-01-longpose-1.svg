<svg viewBox="0 0 760 320" role="img" aria-label="长期作业时间分配：建议比例与新手实际比例对比" xmlns="http://www.w3.org/2000/svg" width="760" height="320"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="320" class="bg-paper"/>
  <text x="18" y="26" class="labk">一张 8 小时作业（480 分钟）的四种花法</text>

  <text x="18" y="62" class="lab">建议分配</text>
  <g stroke="#1c1c1c" stroke-width="1">
    <rect x="90"  y="46" width="66"  height="34" class="f-g1"/>
    <rect x="156" y="46" width="132" height="34" class="f-g2"/>
    <rect x="288" y="46" width="297" height="34" class="f-g4"/>
    <rect x="585" y="46" width="165" height="34" class="f-g3"/>
  </g>
  <text x="96"  y="66" class="lab2">10%</text>
  <text x="164" y="66" class="lab2">20% 铺大关系</text>
  <text x="300" y="66" class="lab2">45% 深入</text>
  <text x="594" y="66" class="lab2">25% 调整</text>
  <g class="lab2">
    <text class="lab2" x="90"  y="96">起形 48 分</text>
    <text class="lab2" x="180" y="96">96 分</text>
    <text class="lab2" x="330" y="96">216 分＝三遍分层</text>
    <text class="lab2" x="596" y="96">120 分，含隔天 30 分</text>
  </g>

  <text x="18" y="140" class="lab">新手实际</text>
  <g stroke="#c0392b" stroke-width="1.3" fill="none">
    <rect x="90"  y="124" width="33"  height="34"/>
    <rect x="123" y="124" width="66"  height="34"/>
    <rect x="189" y="124" width="528" height="34"/>
    <rect x="717" y="124" width="33"  height="34"/>
  </g>
  <rect x="123" y="124" width="66" height="34" class="f-g2"/>
  <rect x="189" y="124" width="528" height="34" class="f-g5"/>
  <text x="200" y="146" class="lab2">80% 花在"抠一个角"</text>
  <text x="600" y="146" class="lab2">5% 收尾</text>

  <text x="18" y="200" class="labk">把"调整"那 120 分钟拆成三次，才是这张画的技术核心</text>
  <g stroke="#1c1c1c" stroke-width="1">
    <rect x="18"  y="214" width="230" height="58" class="f-white"/>
    <rect x="265" y="214" width="230" height="58" class="f-white"/>
    <rect x="512" y="214" width="238" height="58" class="f-white"/>
  </g>
  <text x="30"  y="238" class="lab">每 8~12 分钟一小次</text>
  <text x="30"  y="258" class="lab2">退远 + 眯眼，只改 1~2 处</text>
  <text x="277" y="238" class="lab">第 4 小时一次中等</text>
  <text x="277" y="258" class="lab2">拍照缩图，只补关系不加工</text>
  <text x="524" y="238" class="lab">收工前 90 分钟一次大</text>
  <text x="524" y="258" class="lab2">只做减法，隔天再复检 30 分钟</text>
  <text x="18" y="300" class="lab">两条长条唯一的区别就是最右边那一段。画面"不完"，九成不是画得不够，</text>
</svg>