<svg viewBox="0 0 760 250" role="img" aria-label="默写循环的五个步骤与计时" xmlns="http://www.w3.org/2000/svg" width="760" height="250"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="250" class="bg-paper"/>
  <text x="18" y="26" class="labk">一轮 12 分钟，做满 4 轮；每一轮都必须有"盖住"这个动作</text>
  <g stroke="#1c1c1c" stroke-width="1">
    <rect x="18"  y="48" width="132" height="62" class="f-white"/>
    <rect x="168" y="48" width="132" height="62" class="f-white"/>
    <rect x="318" y="48" width="132" height="62" class="f-white"/>
    <rect x="468" y="48" width="132" height="62" class="f-white"/>
    <rect x="618" y="48" width="132" height="62" class="f-white"/>
  </g>
  <text x="28"  y="72" class="lab">① 看 3 分钟</text>
  <text x="28"  y="92" class="lab2">边看边说出结构：</text>
  <text x="178" y="72" class="lab">② 盖住</text>
  <text x="178" y="92" class="lab2">一张纸压死，</text>
  <text x="328" y="72" class="lab">③ 画 4 分钟</text>
  <text x="328" y="92" class="lab2">按五步法走（09 课），</text>
  <text x="478" y="72" class="lab">④ 比对 2 分钟</text>
  <text x="478" y="92" class="lab2">并排放，只标 3 个错</text>
  <text x="628" y="72" class="lab">⑤ 补 3 分钟</text>
  <text x="628" y="92" class="lab2">只补那 3 个错，</text>
  <g fill="#1c1c1c">
    <polygon points="152,74 152,86 165,80"/>
    <polygon points="302,74 302,86 315,80"/>
    <polygon points="452,74 452,86 465,80"/>
    <polygon points="602,74 602,86 615,80"/>
  </g>
  <text x="28" y="126" class="lab2">"先形后调再关系"</text>
  <text x="178" y="126" class="lab2">不许偷偷掀开看</text>
  <text x="328" y="126" class="lab2">画不出就先画能画的部分</text>
  <text x="478" y="126" class="lab2">写在纸边，不写在画上</text>
  <text x="628" y="126" class="lab2">补完再进下一轮</text>

  <text x="18" y="164" class="labk">"只标 3 个错"为什么是硬规定</text>
  <g stroke="#1c1c1c" stroke-width="1">
    <rect x="18" y="176" width="356" height="56" class="f-g1"/>
    <rect x="386" y="176" width="364" height="56" class="f-g3"/>
  </g>
  <text x="30" y="200" class="lab">标 10 个错 → 下一轮一个也改不了</text>
  <text x="30" y="220" class="lab2">注意力被摊平，等于把原画重画一遍</text>
  <text x="398" y="200" class="lab">标 3 个错 → 三个都是"结构性"的</text>
  <text x="398" y="220" class="lab2">下一轮开始前，把这三句念一遍再动笔</text>
</svg>