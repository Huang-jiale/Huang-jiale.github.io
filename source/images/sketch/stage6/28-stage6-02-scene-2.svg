<svg viewBox="0 0 760 258" role="img" aria-label="有大气透视与无大气透视的对比" xmlns="http://www.w3.org/2000/svg" width="760" height="258"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="258" class="bg-paper"/>
  <text x="18" y="26" class="labk">同一处四层山：唯一区别是明度阶梯</text>

  <rect x="20" y="42" width="340" height="150" class="f-white" stroke="#1c1c1c"/>
  <path d="M20 132 L90 84 L150 128 L210 78 L280 130 L360 92 L360 150 L20 150 Z" fill="#4f4f4f"/>
  <path d="M20 158 L110 118 L200 156 L300 116 L360 152 L360 176 L20 176 Z" fill="#303030"/>
  <g stroke="#1c1c1c" stroke-width="1.6">
    <line x1="60" y1="192" x2="60" y2="150"/><line x1="120" y1="192" x2="120" y2="146"/><line x1="250" y1="192" x2="250" y2="150"/>
  </g>
  <text x="28" y="210" class="lab">✗ 四层一样黑</text>
  <text x="28" y="228" class="lab2">空间被压扁，四层像剪纸贴在一起；</text>
  <text x="28" y="244" class="lab2">没有一处最黑，眼睛无处可停。</text>

  <rect x="400" y="42" width="340" height="150" class="f-white" stroke="#1c1c1c"/>
  <path d="M400 128 L470 88 L530 126 L590 84 L660 128 L740 96 L740 150 L400 150 Z" fill="#ececec"/>
  <path d="M400 142 L480 106 L560 142 L640 104 L740 140 L740 158 L400 158 Z" fill="#cfcfcf"/>
  <path d="M400 158 L500 128 L600 158 L700 126 L740 152 L740 170 L400 170 Z" fill="#8f8f8f"/>
  <path d="M400 180 L520 156 L640 182 L740 160 L740 192 L400 192 Z" fill="#4f4f4f"/>
  <g stroke="#1c1c1c" stroke-width="2">
    <line x1="440" y1="192" x2="440" y2="150"/><line x1="470" y1="192" x2="470" y2="146"/>
  </g>
  <rect x="400" y="192" width="340" height="0" class="f-g5"/>
  <text x="408" y="210" class="lab">✓ 越远越浅、越远越糊</text>
  <text x="408" y="228" class="lab2">四层明度排成阶梯：1→3→5→8 度，</text>
  <text x="408" y="244" class="lab2">空间自己就出来了，不用画"细节"。</text>
</svg>