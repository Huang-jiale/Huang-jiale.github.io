<svg viewBox="0 0 760 344" role="img" aria-label="风景的近中远三层：明度、边缘、细节三递减" xmlns="http://www.w3.org/2000/svg" width="760" height="344"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="344" class="bg-paper"/>
  <text x="18" y="26" class="labk">三层同时递减：明度、边缘、细节密度</text>

  <rect x="30" y="44" width="430" height="272" class="f-white" stroke="#1c1c1c"/>
  <rect x="30" y="44" width="430" height="90" class="f-g1"/>
  <path d="M30 118 Q90 84 150 108 T270 96 T400 112 L460 130 L460 134 L30 134 Z" fill="#ececec"/>
  <g class="st-thin">
    <line x1="70" y1="126" x2="70" y2="114"/><line x1="120" y1="126" x2="120" y2="112"/>
    <line x1="200" y1="126" x2="200" y2="116"/><line x1="330" y1="126" x2="330" y2="114"/>
  </g>
  <text x="40" y="66" class="lab2">远景：只允许剪影</text>

  <rect x="30" y="134" width="430" height="86" class="f-g2"/>
  <g stroke="#1c1c1c" stroke-width="0.8">
    <rect x="60"  y="168" width="52" height="52" fill="#bfbfbf"/>
    <polygon points="56,168 116,168 86,148" fill="#8f8f8f"/>
    <rect x="150" y="158" width="40" height="62" fill="#bfbfbf"/>
    <polygon points="146,158 194,158 170,140" fill="#8f8f8f"/>
    <rect x="240" y="176" width="70" height="44" fill="#bfbfbf"/>
    <polygon points="236,176 314,176 275,158" fill="#8f8f8f"/>
  </g>
  <text x="330" y="160" class="lab2">中景：只画大窗大结构</text>
  <text x="330" y="178" class="lab2">瓦当、砖缝、花纹不算数</text>

  <rect x="30" y="220" width="430" height="96" class="f-g4"/>
  <g stroke="#1c1c1c" stroke-width="1.6">
    <line x1="30" y1="252" x2="460" y2="238"/>
    <line x1="30" y1="268" x2="460" y2="254"/>
    <line x1="60" y1="234" x2="60" y2="316"/><line x1="110" y1="232" x2="110" y2="316"/>
    <line x1="160" y1="230" x2="160" y2="316"/><line x1="210" y1="228" x2="210" y2="316"/>
  </g>
  <path d="M300 316 C296 284 292 268 300 250 L330 246 C338 266 336 292 334 316 Z" class="f-g5"/>
  <circle cx="316" cy="240" r="26" class="f-g5"/>
  <g stroke="#1c1c1c" stroke-width="1">
    <line x1="360" y1="300" x2="400" y2="276"/><line x1="372" y1="310" x2="414" y2="286"/>
    <line x1="386" y1="316" x2="428" y2="294"/>
  </g>
  <text x="40" y="306" class="lab2 f-white">近景：可以实到砖缝、枝条、石子</text>

  <text x="490" y="70" class="labk">远景</text>
  <text x="490" y="92" class="lab2">明度 1~2 度（最黑不超过 3）</text>
  <text x="490" y="110" class="lab2">边缘：几乎没有，靠留白成形</text>
  <text x="490" y="128" class="lab2">笔号：2B 单层，或画完用纸笔擦</text>

  <text x="490" y="166" class="labk">中景</text>
  <text x="490" y="188" class="lab2">明度 3~5 度</text>
  <text x="490" y="206" class="lab2">边缘：半实，转处才卡点</text>
  <text x="490" y="224" class="lab2">笔号：2B 起形 + 4B 铺</text>

  <text x="490" y="262" class="labk">近景</text>
  <text x="490" y="284" class="lab2">明度 6~9 度，全画最黑在这</text>
  <text x="490" y="302" class="lab2">边缘：最实、最肯定</text>
  <text x="490" y="320" class="lab2">笔号：4B 铺底 + 6B／8B 压黑</text>
  <path d="M740 60 L740 316" class="st-blue"/>
  <polygon points="734,304 746,304 740,322" fill="#0f6ab5"/>
  <text x="654" y="44" class="lab2">细节密度递增</text>
</svg>