<svg viewBox="0 0 760 336" role="img" aria-label="三视图与任意角度旋转练习示意" xmlns="http://www.w3.org/2000/svg" width="760" height="336"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="336" class="bg-paper"/>
  <text x="18" y="26" class="labk">左：一个杯子的三视图　右：同一个"球＋方"转到不同角度</text>

  <text x="40" y="60" class="lab">主视</text>
  <rect x="40" y="68" width="80" height="96" class="f-g2" stroke="#1c1c1c"/>
  <ellipse cx="80" cy="68" rx="40" ry="12" class="f-g1" stroke="#1c1c1c"/>
  <path d="M120 92 a20 24 0 0 1 0 46" class="st"/>
  <text x="140" y="60" class="lab">侧视</text>
  <rect x="140" y="68" width="80" height="96" class="f-g2" stroke="#1c1c1c"/>
  <ellipse cx="180" cy="68" rx="40" ry="12" class="f-g1" stroke="#1c1c1c"/>
  <line x1="180" y1="56" x2="180" y2="176" class="st-thin"/>
  <text x="160" y="200" class="lab2">把手转到背面＝只画虚线</text>
  <text x="40" y="216" class="lab">俯视</text>
  <circle cx="88" cy="262" r="42" class="f-g1" stroke="#1c1c1c"/>
  <circle cx="88" cy="262" r="30" class="f-none" stroke="#9a9a9a"/>
  <path d="M130 250 a18 12 0 0 1 0 24" class="st"/>
  <line x1="46" y1="262" x2="130" y2="262" class="st-thin"/>
  <line x1="88" y1="220" x2="88" y2="304" class="st-thin"/>
  <text x="150" y="234" class="lab2">三视图的规则：</text>
  <text x="150" y="252" class="lab2">① 长对正、高平齐、宽相等</text>
  <text x="150" y="270" class="lab2">② 看不见的结构画虚线</text>
  <text x="150" y="288" class="lab2">③ 三个方向都用同一根中线</text>
  <text x="150" y="306" class="lab2">④ 椭圆必须随视平线高低变扁</text>

  <text x="360" y="60" class="labk">球＋方（Loomis）转到四个角度</text>
  <g stroke="#1c1c1c" stroke-width="1.2" fill="none">
    <circle cx="392" cy="128" r="34"/>
    <path d="M392 94 L392 162 M358 128 a34 12 0 0 0 68 0"/>
    <circle cx="486" cy="128" r="34"/>
    <path d="M470 96 a30 34 0 0 0 0 64 M508 100 L508 156"/>
    <circle cx="580" cy="128" r="34"/>
    <path d="M556 100 a26 34 0 0 0 0 56 M600 104 a22 34 0 0 1 0 48"/>
    <circle cx="668" cy="128" r="34"/>
    <path d="M634 128 a34 12 0 0 0 68 0 M668 94 a10 34 0 0 0 0 68"/>
  </g>
  <circle cx="516" cy="128" r="3" class="dot"/>
  <circle cx="606" cy="128" r="3" class="dot"/>
  <circle cx="668" cy="128" r="3" class="dot"/>
  <g class="lab2">
    <text class="lab2" x="370" y="182">0° 正面</text>
    <text class="lab2" x="458" y="182">30° 微侧</text>
    <text class="lab2" x="552" y="182">60° 大半侧</text>
    <text class="lab2" x="638" y="182">90° 全侧</text>
  </g>
  <text x="360" y="214" class="lab">读三件事，任何角度都能自己搭：</text>
  <text x="360" y="234" class="lab2">① 中线弧度越大＝转得越多（正面是直线，全侧是弧）</text>
  <text x="360" y="252" class="lab2">② 远侧那条边越来越短，近侧那条边几乎不变</text>
  <text x="360" y="270" class="lab2">③ 耳朵从"看不见"到"落在中线后 1/3"——红点是耳位</text>
  <text x="360" y="288" class="lab2">④ 下颌是一个楔形，不是脸的"底边"（第 21、22 课）</text>
  <text x="18" y="328" class="lab">练习配方：一个杯子／一个苹果／自己的头，各画三视图 → 再各画 5 个角度（每角度 3 分钟，不许看对象）。</text>
</svg>