<svg viewBox="0 0 760 276" role="img" aria-label="画过了的三种典型：描边、反光翻、配角抢戏" xmlns="http://www.w3.org/2000/svg" width="760" height="276"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="276" class="bg-paper"/>
  <text x="18" y="26" class="labk">"画过了"只有三种长相，认清了每种都能救</text>

  <rect x="20" y="44" width="220" height="140" class="f-white" stroke="#ddd9d2"/>
  <rect x="70" y="70" width="120" height="88" class="f-g2"/>
  <g stroke="#1c1c1c" stroke-width="6">
    <line x1="66" y1="70" x2="194" y2="70"/>
    <line x1="66" y1="158" x2="194" y2="158"/>
    <line x1="66" y1="70" x2="66" y2="158"/>
    <line x1="194" y1="70" x2="194" y2="158"/>
  </g>
  <text x="30" y="206" class="lab">① 描边（最常见）</text>
  <text x="30" y="226" class="lab2">怕形跑，沿边补一圈黑 → 物体变成贴纸，</text>
  <text x="30" y="244" class="lab2">空气没了。边是"面的结束"，不是一根线。</text>

  <rect x="270" y="44" width="220" height="140" class="f-white" stroke="#ddd9d2"/>
  <circle cx="380" cy="114" r="56" class="f-g5"/>
  <path d="M330 148 a56 42 0 0 0 96 -10 l0 12 a56 46 0 0 1 -96 8 Z" fill="#d5d5d5"/>
  <text x="280" y="206" class="lab">② 反光翻</text>
  <text x="280" y="226" class="lab2">暗部那条反光亮到了灰面的明度，</text>
  <text x="280" y="244" class="lab2">体积消失——球像被自己内部点亮。</text>
  <text x="280" y="262" class="lab2">反光永远要暗于灰面。</text>

  <rect x="520" y="44" width="220" height="140" class="f-white" stroke="#ddd9d2"/>
  <rect x="536" y="78" width="72" height="98" class="f-g3"/>
  <g stroke="#1c1c1c" stroke-width="1">
    <line x1="644" y1="86" x2="726" y2="86"/><line x1="644" y1="96" x2="726" y2="96"/>
    <line x1="644" y1="106" x2="726" y2="106"/><line x1="644" y1="116" x2="726" y2="116"/>
    <line x1="644" y1="126" x2="726" y2="126"/><line x1="644" y1="136" x2="726" y2="136"/>
    <line x1="644" y1="146" x2="726" y2="146"/><line x1="644" y1="156" x2="726" y2="156"/>
    <line x1="650" y1="80" x2="650" y2="162"/><line x1="664" y1="80" x2="664" y2="162"/>
    <line x1="678" y1="80" x2="678" y2="162"/><line x1="692" y1="80" x2="692" y2="162"/>
    <line x1="706" y1="80" x2="706" y2="162"/><line x1="720" y1="80" x2="720" y2="162"/>
  </g>
  <text x="548" y="130" class="lab2">主体</text>
  <text x="652" y="74" class="lab2">小道具</text>
  <circle cx="686" cy="122" r="4" class="dot"/>
  <text x="530" y="206" class="lab">③ 配角抢戏</text>
  <text x="530" y="226" class="lab2">眼睛永远去看"密度最高、</text>
  <text x="530" y="244" class="lab2">对比最强"处——就是那个红点。</text>
  <text x="530" y="262" class="lab2">小道具最多 6 分黑，边缘也要松。</text>
</svg>