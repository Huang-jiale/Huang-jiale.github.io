<svg viewBox="0 0 760 320" role="img" aria-label="自我批改的六步流程与四把尺子" xmlns="http://www.w3.org/2000/svg" width="760" height="320"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="320" class="bg-paper"/>
  <text x="18" y="24" class="labk">批改流程：每一张画完都走一遍，全程不超过 12 分钟</text>
  <g stroke="#1c1c1c" stroke-width="1">
    <rect x="18"  y="44" width="130" height="52" class="f-g1"/>
    <rect x="168" y="44" width="130" height="52" class="f-g2"/>
    <rect x="318" y="44" width="130" height="52" class="f-g3"/>
    <rect x="468" y="44" width="130" height="52" class="f-g3"/>
    <rect x="618" y="44" width="130" height="52" class="f-white"/>
  </g>
  <text x="26"  y="66" class="lab">① 编号归档</text>
  <text x="26"  y="84" class="lab2">日期-题材-时长</text>
  <text x="176" y="66" class="lab">② 三看</text>
  <text x="176" y="84" class="lab2">缩图·反色·退 3 米</text>
  <text x="326" y="66" class="lab">③ 打分卡</text>
  <text x="326" y="84" class="lab2">10 项 0/1/2 分</text>
  <text x="476" y="66" class="lab">④ 一句结论</text>
  <text x="476" y="84" class="lab2">写在画的背面</text>
  <text x="626" y="66" class="lab">⑤ 24 小时后</text>
  <text x="626" y="84" class="lab2">只许改 5 处</text>
  <g fill="#1c1c1c">
    <polygon points="150,64 150,76 164,70"/>
    <polygon points="300,64 300,76 314,70"/>
    <polygon points="450,64 450,76 464,70"/>
    <polygon points="600,64 600,76 614,70"/>
  </g>
  <path d="M683 96 L683 116 L83 116 L83 98" class="st-blue"/>
  <polygon points="77,108 89,108 83,92" fill="#0f6ab5"/>
  <text x="240" y="134" class="lab2">闭环：结论里的这一条，必须是下一张画的唯一题目</text>

  <text x="18" y="166" class="labk">四把尺子（第 ② 步的细节）</text>
  <g stroke="#1c1c1c" stroke-width="1">
    <rect x="18"  y="180" width="170" height="96" class="f-white"/>
    <rect x="204" y="180" width="170" height="96" class="f-white"/>
    <rect x="390" y="180" width="170" height="96" class="f-white"/>
    <rect x="576" y="180" width="172" height="96" class="f-white"/>
  </g>
  <text x="28"  y="202" class="lab">缩图（手机）</text>
  <text x="28"  y="224" class="lab2">看得到：大关系、主次</text>
  <text x="28"  y="242" class="lab2">看不到：细节真假</text>
  <text x="28"  y="264" class="lab2">判据：3 秒内说出中心</text>
  <text x="214" y="202" class="lab">反色（手机／镜子）</text>
  <text x="214" y="224" class="lab2">看得到：明度错误、</text>
  <text x="214" y="242" class="lab2">过黑的地方</text>
  <text x="214" y="264" class="lab2">判据：最黑在主体上</text>
  <text x="400" y="202" class="lab">退 3 米＋眯眼</text>
  <text x="400" y="224" class="lab2">看得到：画面是否"塌"</text>
  <text x="400" y="242" class="lab2">边缘是否抢戏</text>
  <text x="400" y="264" class="lab2">判据：三大档还在</text>
  <text x="586" y="202" class="lab">24 小时后再看</text>
  <text x="586" y="224" class="lab2">看得到：判断力恢复后</text>
  <text x="586" y="242" class="lab2">真正的毛病</text>
  <text x="586" y="264" class="lab2">规则：只许改 5 处</text>
</svg>