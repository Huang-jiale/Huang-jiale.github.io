<svg viewBox="0 0 760 330" role="img" aria-label="自学水平成长曲线与六个平台期" xmlns="http://www.w3.org/2000/svg" width="760" height="330"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="330" class="bg-paper"/>
  <text x="18" y="24" class="labk">水平是阶梯型上升的：平台期＝眼睛跑在手前面</text>
  <line x1="60" y1="270" x2="740" y2="270" class="st"/>
  <line x1="60" y1="270" x2="60"  y2="52" class="st"/>
  <text x="66" y="66" class="lab2">水平</text>
  <text x="722" y="288" class="lab2">时间</text>
  <g class="lab2">
    <text class="lab2" x="70"  y="288">第 1 月</text>
    <text class="lab2" x="220" y="288">3 月</text>
    <text class="lab2" x="380" y="288">6 月</text>
    <text class="lab2" x="530" y="288">12 月</text>
    <text class="lab2" x="670" y="288">24 月</text>
  </g>
  <path d="M60 262 L110 214 L200 208 L250 172 L340 166 L392 136 L480 132 L528 108 L620 104 L690 78 L738 72" class="st"/>
  <g class="dot">
    <circle cx="200" cy="208" r="4"/>
    <circle cx="340" cy="166" r="4"/>
    <circle cx="480" cy="132" r="4"/>
    <circle cx="620" cy="104" r="4"/>
    <circle cx="110" cy="214" r="4"/>
    <circle cx="250" cy="172" r="4"/>
  </g>
  <g class="lab2">
    <text class="lab2" x="76"  y="238">① 形不准</text>
    <text class="lab2" x="150" y="252">第 1~2 月最常见</text>
    <text class="lab2" x="258" y="200">② 画面灰、脏</text>
    <text class="lab2" x="258" y="216">第 3~5 月</text>
    <text class="lab2" x="398" y="160">③ 不敢画人物</text>
    <text class="lab2" x="398" y="176">第 5~8 月</text>
    <text class="lab2" x="536" y="124">④ 画得慢、离不开照片</text>
    <text class="lab2" x="536" y="140">第 8~14 月</text>
    <text class="lab2" x="626" y="96">⑤ 没有风格</text>
    <text class="lab2" x="684" y="120">⑥ 画不下去</text>
  </g>
  <text x="18" y="306" class="lab2">两条规律：① 平台期平均 6~10 周，靠"重复画同一类东西"熬不过去，只能靠针对性练习；</text>
  <text x="18" y="322" class="lab2">② 突破往往发生在一次限时短作业或一轮默写之后，不是在一次 20 小时的苦战之后。</text>
</svg>