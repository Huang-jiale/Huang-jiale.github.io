<svg viewBox="0 0 760 408" role="img" aria-label="六阶段依赖图与三条贯穿能力" xmlns="http://www.w3.org/2000/svg" width="760" height="408"><style> svg{display:block;width:100%;height:auto}
 .lab2{font-size:11.5px;fill:#777}
 .labk{font-size:13.5px;fill:#000;font-weight:600}
 .st{fill:none;stroke:#1c1c1c;stroke-width:1.5}
 .st-thin{fill:none;stroke:#9a9a9a;stroke-width:.9;stroke-dasharray:4 3}
 .st-red{fill:none;stroke:#c0392b;stroke-width:1.3}
 .st-blue{fill:none;stroke:#0f6ab5;stroke-width:1.3;stroke-dasharray:6 3}
 .st-ok{fill:none;stroke:#2f7d42;stroke-width:1.6}
 .st-bad{fill:none;stroke:#c0392b;stroke-width:1.6}
 .f-g1{fill:#f2f2f2}
.f-g2{fill:#dcdcdc}
.f-g3{fill:#bfbfbf}
.f-g4{fill:#8f8f8f}
.f-g5{fill:#4f4f4f}
 .f-white{fill:#fff}
.f-none{fill:none}
 .dot{fill:#c0392b}
 .bg-paper{fill:#fff}
 text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1c1c1c}</style>
  <rect width="760" height="408" class="bg-paper"/>
  <text x="18" y="24" class="labk">三条贯穿能力（一直在长）＋ 六个阶段（一层压一层）</text>

  <g stroke="#1c1c1c" stroke-width="1">
    <rect x="24"  y="40" width="230" height="26" class="f-g1"/>
    <rect x="262" y="40" width="230" height="26" class="f-g2"/>
    <rect x="500" y="40" width="236" height="26" class="f-g3"/>
  </g>
  <text x="34"  y="58" class="lab">观察：眯眼 · 比较 · 负形 · 测量</text>
  <text x="272" y="58" class="lab">手感：线条 · 排线 · 控明 · 边缘</text>
  <text x="510" y="58" class="lab">思维：体块 · 结构 · 光影推理</text>

  <g stroke="#1c1c1c" stroke-width="1">
    <rect x="24"  y="92"  width="210" height="80" class="f-white"/>
    <rect x="258" y="92"  width="210" height="80" class="f-white"/>
    <rect x="492" y="92"  width="244" height="80" class="f-white"/>
    <rect x="24"  y="212" width="210" height="80" class="f-white"/>
    <rect x="258" y="212" width="210" height="80" class="f-white"/>
    <rect x="492" y="212" width="244" height="80" class="f-g2"/>
  </g>
  <text x="34"  y="116" class="labk">阶段一 01–05</text>
  <text x="34"  y="136" class="lab2">工具·线条·九格·观察·透视</text>
  <text x="34"  y="156" class="lab2">毕业：一笔画 20cm 不抖，</text>
  <text x="34" y="168" class="lab2">九格无跳档</text>
  <text x="268" y="116" class="labk">阶段二 06–10</text>
  <text x="268" y="136" class="lab2">几何体：三大面五调子</text>
  <text x="268" y="156" class="lab2">毕业：球体有体积、</text>
  <text x="268" y="170" class="lab2">多物体投影关系正确</text>
  <text x="502" y="116" class="labk">阶段三 11–16</text>
  <text x="502" y="136" class="lab2">静物·结构·光·质感·衬布·构图</text>
  <text x="502" y="156" class="lab2">毕业：三种材质闭上形也认得出，</text>
  <text x="502" y="170" class="lab2">画面有唯一视觉中心</text>
  <text x="34"  y="236" class="labk">阶段四 17–20</text>
  <text x="34"  y="256" class="lab2">方盒概括·椭球切面·包着画</text>
  <text x="34"  y="276" class="lab2">毕业：任意物体能拆成体块</text>
  <text x="268" y="236" class="labk">阶段五 21–26</text>
  <text x="268" y="256" class="lab2">头部·五官·头骨·人体·手脚·动态</text>
  <text x="268" y="276" class="lab2">毕业：3 分钟动态能抓线</text>
  <text x="502" y="236" class="labk">阶段六 27–30</text>
  <text x="502" y="256" class="lab2">长期作业·场景·默写创作·路线</text>
  <text x="502" y="276" class="lab2">毕业：能独立画完并批改</text>
  <g fill="#1c1c1c">
    <polygon points="238,126 238,140 254,133"/>
    <polygon points="472,126 472,140 488,133"/>
    <polygon points="238,246 238,260 254,253"/>
    <polygon points="472,246 472,260 488,253"/>
  </g>
  <path d="M614 172 L614 192 L129 192 L129 208" class="st-blue"/>
  <polygon points="123,200 135,200 129,214" fill="#0f6ab5"/>
  <text x="252" y="188" class="lab2">阶段四是分水岭：不学结构，人物与创作全是抄表面</text>

  <path d="M560 292 L560 344 L14 344 L14 132 L22 132" class="st-red"/>
  <polygon points="18,126 18,138 30,132" fill="#c0392b"/>
  <text x="300" y="362" class="lab2">回炉箭头永远开着：</text>
  <text x="300" y="379" class="lab2">画面灰 → 第 03、09 课；形不准 → 第 04、06、12 课；</text>
  <text x="300" y="396" class="lab2">人物崩 → 第 17、21 课；一张画不完 → 第 27 课</text>
</svg>